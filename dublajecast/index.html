<style>
/* ── RESET & BASE ──────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#17131F;color:#F2F0FA;font-size:14.5px;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:0}
button{cursor:pointer;font-family:inherit}
button:active{transform:scale(0.96)}
input,select,textarea{font-family:inherit;color:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#A78BFA!important;box-shadow:0 0 0 2px rgba(167,139,250,0.2),0 0 16px rgba(167,139,250,0.15)!important}

/* ── DESIGN TOKENS ─────────────────────────────────────────── */
:root{
  /* ── Tema "Soft Violet" (rediseño estilo dashboard moderno) ── */
  --bg-primary:#17131F;
  --bg-secondary:#1E1830;
  --bg-card:#251E3A;
  --bg-card-hover:#2C2444;
  --bg-elevated:#282041;
  --bg-input:#151020;
  --border-subtle:rgba(167,139,250,0.08);
  --border-default:rgba(167,139,250,0.18);
  --border-strong:rgba(167,139,250,0.35);
  --text-primary:#F2F0FA;
  --text-secondary:#A9A1C4;
  --text-muted:#6E6690;
  --accent-cyan:#A78BFA;
  --accent-blue:#818CF8;
  --accent-magenta:#E879F9;
  --accent-pink:#F472B6;
  --accent-indigo:#818CF8;
  --accent-violet:#C4B5FD;
  --accent-emerald:#34D399;
  --accent-amber:#FBBF24;
  --accent-rose:#FB7185;
  --accent-sky:#A78BFA;
  --accent-teal:#2DD4BF;
  --accent-orange:#FB923C;
  --accent-wine:#C4B5FD;
  --accent-silver:#B4ACD0;
  --shadow-sm:0 2px 10px rgba(10,6,20,0.5);
  --shadow-md:0 8px 28px rgba(10,6,20,0.55);
  --shadow-lg:0 16px 52px rgba(10,6,20,0.6);
  --shadow-glow:0 0 34px rgba(139,92,246,0.20);
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-xl:24px;
  --neon-cyan:0 0 10px rgba(139,92,246,0.55),0 0 25px rgba(139,92,246,0.28),0 0 50px rgba(139,92,246,0.14);
  --neon-blue:0 0 10px rgba(129,140,248,0.55),0 0 25px rgba(129,140,248,0.28),0 0 50px rgba(129,140,248,0.14);
  --neon-magenta:0 0 10px rgba(232,121,249,0.5),0 0 25px rgba(232,121,249,0.25),0 0 50px rgba(232,121,249,0.12);
}

/* ── LIGHT THEME (CLASSIC) ─────────────────────────────────── */
[data-theme="light"]{
  --bg-primary:#eef1f8;
  --bg-secondary:#f7f9fd;
  --bg-card:#ffffff;
  --bg-card-hover:#f2f5fc;
  --bg-elevated:#f5f7fb;
  --bg-input:#f0f3fa;
  --border-subtle:rgba(30,80,160,0.07);
  --border-default:rgba(30,80,160,0.16);
  --border-strong:rgba(30,80,160,0.32);
  --text-primary:#16213e;
  --text-secondary:#3d5278;
  --text-muted:#7a8fb3;
  --accent-cyan:#7C3AED;
  --accent-blue:#8B5CF6;
  --accent-magenta:#9b2c7e;
  --accent-pink:#c9184a;
  --accent-indigo:#3a5fcc;
  --accent-violet:#7b2d8b;
  --accent-emerald:#2d8653;
  --accent-amber:#b8860b;
  --accent-rose:#c1121f;
  --accent-sky:#7C3AED;
  --accent-teal:#2a9d8f;
  --accent-orange:#c96a1a;
  --accent-wine:#7b2d8b;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.07);
  --shadow-md:0 6px 24px rgba(0,0,0,0.1);
  --shadow-lg:0 12px 48px rgba(0,0,0,0.14);
  --shadow-glow:0 0 20px rgba(124,58,237,0.1);
  --neon-cyan:0 2px 8px rgba(124,58,237,0.25);
  --neon-blue:0 2px 8px rgba(139,92,246,0.25);
  --neon-magenta:0 2px 8px rgba(155,44,126,0.25);
}
[data-theme="light"] body{background:var(--bg-primary)!important;color:var(--text-primary)!important}
[data-theme="light"] body::after{display:none!important}
[data-theme="light"] .glass-nav{background:rgba(247,249,253,0.98)!important;border-right:1px solid rgba(30,80,160,0.09)!important}
[data-theme="light"] .glass-topbar{background:rgba(247,249,253,0.98)!important;border-bottom:1px solid rgba(30,80,160,0.08)!important}
[data-theme="light"] .glass-card{background:rgba(255,255,255,0.97)!important;border-color:rgba(30,80,160,0.1)!important}
[data-theme="light"] .dc-card{border-color:rgba(30,80,160,0.07)!important}
[data-theme="light"] .dc-card:hover{border-color:rgba(124,58,237,0.22)!important;box-shadow:var(--shadow-md),0 0 16px rgba(124,58,237,0.06)!important;transform:translateY(-2px)}
[data-theme="light"] .dc-row:hover{background:rgba(124,58,237,0.04)!important;box-shadow:inset 3px 0 0 rgba(124,58,237,0.35)!important}
[data-theme="light"] .dc-nav:hover{background:rgba(124,58,237,0.07)!important;color:#7C3AED!important;text-shadow:none!important}
[data-theme="light"] .dc-nav-active{background:linear-gradient(90deg,rgba(124,58,237,0.1) 0%,rgba(124,58,237,0.03) 100%)!important;color:#7C3AED!important;text-shadow:none!important;box-shadow:inset 3px 0 0 #7C3AED!important;border-right:1px solid rgba(124,58,237,0.1)!important}
[data-theme="light"] .stat-card{border-color:rgba(30,80,160,0.08)!important;background:var(--bg-card)!important}
[data-theme="light"] .stat-card::before{background:linear-gradient(135deg,rgba(124,58,237,0.03) 0%,transparent 60%)!important}
[data-theme="light"] .hero-banner{background:linear-gradient(135deg,#dce7f8 0%,#e4edf8 50%,#d8e5f5 100%)!important;border-color:rgba(124,58,237,0.14)!important}
[data-theme="light"] .hero-banner::before{background:radial-gradient(ellipse,rgba(124,58,237,0.06) 0%,transparent 60%)!important}
[data-theme="light"] ::-webkit-scrollbar-track{background:rgba(124,58,237,0.03)!important}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.18)!important}
[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:rgba(124,58,237,0.32)!important}
[data-theme="light"] input[type="checkbox"]{border-color:rgba(124,58,237,0.28)!important;background:#f0f4fa!important}
[data-theme="light"] input[type="checkbox"]:checked{background:linear-gradient(135deg,#6D28D9,#8B5CF6)!important;border-color:#7C3AED!important;box-shadow:0 0 5px rgba(124,58,237,0.35)!important}
[data-theme="light"] input:focus,[data-theme="light"] select:focus,[data-theme="light"] textarea:focus{border-color:#7C3AED!important;box-shadow:0 0 0 2px rgba(124,58,237,0.14),0 0 8px rgba(124,58,237,0.08)!important}
/* Nav text: override hardcoded white/cyan inline colors */
[data-theme="light"] .dc-nav{color:var(--text-secondary)!important}
[data-theme="light"] .dc-nav span{color:var(--text-secondary)!important}
[data-theme="light"] .dc-nav-active{color:var(--accent-cyan)!important}
[data-theme="light"] .dc-nav-active span{color:var(--accent-cyan)!important}
/* Topbar bottom glow line: soften for light */
[data-theme="light"] .glass-topbar>div:first-child{background:linear-gradient(90deg,transparent,rgba(124,58,237,0.18),transparent)!important}
/* Dashboard hero grid lines: lighter tint */
[data-theme="light"] .hero-banner{color:var(--text-primary)!important}

/* ── GLASSMORPHISM UTILITIES ───────────────────────────────── */
.glass{backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5)}
.glass-card{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(5,12,24,0.85)!important;border:1px solid rgba(167,139,250,0.12)!important}
.glass-nav{backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);background:rgba(4,7,15,0.95)!important}
.glass-topbar{backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);background:rgba(4,7,15,0.92)!important}

/* ── COMPONENT CLASSES ─────────────────────────────────────── */
.dc-card{
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);
  transition:border-color 300ms cubic-bezier(0.4,0,0.2,1),box-shadow 300ms cubic-bezier(0.4,0,0.2,1),transform 300ms cubic-bezier(0.34,1.56,0.64,1);
  position:relative;overflow:hidden;
}
.dc-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(167,139,250,0.025) 0%,transparent 60%);pointer-events:none;z-index:0}
.dc-card:hover{border-color:rgba(167,139,250,0.35);box-shadow:var(--shadow-md),0 0 28px rgba(167,139,250,0.1);transform:translateY(-2px)}
.dc-card>*{position:relative;z-index:1}
.dc-row{transition:background 200ms cubic-bezier(0.4,0,0.2,1)}.dc-row:hover{background:rgba(167,139,250,0.05)!important;box-shadow:inset 3px 0 0 rgba(167,139,250,0.5)}
.dc-btn{transition:all 250ms cubic-bezier(0.4,0,0.2,1)}
.dc-subtle:hover,.dc-subtle:focus-visible{opacity:1!important;color:var(--accent-emerald)!important;border-color:rgba(52,211,153,0.45)!important;background:rgba(52,211,153,0.08)!important}
.dc-btn:hover{filter:brightness(1.18);transform:translateY(-1px)}
.dc-btn:active{transform:scale(0.96)!important}
.dc-nav{transition:all 220ms cubic-bezier(0.4,0,0.2,1)}
.dc-nav:hover{background:rgba(167,139,250,0.08)!important;color:#A78BFA!important;text-shadow:0 0 10px rgba(167,139,250,0.6)!important}
.dc-view{animation:dcIn 400ms cubic-bezier(0.34,1.2,0.64,1) both}
.dc-modal{animation:dcModalIn 300ms cubic-bezier(0.34,1.3,0.64,1) both}

/* ── NAV ACTIVE STATE ──────────────────────────────────────── */
.dc-nav-active{
  background:linear-gradient(90deg,rgba(167,139,250,0.12) 0%,rgba(167,139,250,0.03) 100%)!important;
  color:#A78BFA!important;
  text-shadow:0 0 10px rgba(167,139,250,0.6)!important;
  box-shadow:inset 3px 0 0 #A78BFA,0 0 20px rgba(167,139,250,0.08)!important;
  border-right:1px solid rgba(167,139,250,0.1)!important;
}

/* ── LOGIN SPECIFIC ────────────────────────────────────────── */
.login-bg{background:radial-gradient(ellipse at 20% 30%,#2A2145 0%,#17131F 55%,#100C18 100%);position:relative;overflow:hidden}
.login-bg::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 25% 25%,rgba(167,139,250,0.08) 0%,transparent 45%),radial-gradient(ellipse at 75% 75%,rgba(77,159,255,0.05) 0%,transparent 45%),radial-gradient(ellipse at 70% 20%,rgba(167,139,250,0.04) 0%,transparent 40%);animation:loginPulse 10s ease-in-out infinite alternate}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(167,139,250,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,0.05) 1px,transparent 1px);background-size:50px 50px;animation:gridPan 25s linear infinite}
.login-grid::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(5,8,15,0.9) 100%)}
.login-card{background:rgba(5,10,22,0.96);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(167,139,250,0.22);box-shadow:0 30px 100px rgba(0,0,0,0.9),0 0 80px rgba(167,139,250,0.07),inset 0 1px 0 rgba(167,139,250,0.08)}
.login-input{background:rgba(5,8,15,0.9);border:1px solid rgba(167,139,250,0.18);color:var(--text-primary);border-radius:var(--radius-md);padding:14px 16px;font-size:14px;width:100%;box-sizing:border-box;transition:all 250ms cubic-bezier(0.4,0,0.2,1)}
.login-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 2px rgba(167,139,250,0.2),0 0 24px rgba(167,139,250,0.12),inset 0 1px 0 rgba(167,139,250,0.05)}
.login-btn{width:100%;padding:16px 0;font-size:13px;font-weight:700;border:none;border-radius:14px;background:linear-gradient(135deg,#8B5CF6 0%,#A78BFA 100%);color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(139,92,246,0.45);transition:all 280ms cubic-bezier(0.4,0,0.2,1);font-family:'Inter',sans-serif;letter-spacing:0.04em;text-transform:none}
.login-btn:hover{box-shadow:0 10px 40px rgba(167,139,250,0.5),0 0 60px rgba(167,139,250,0.25);transform:translateY(-2px)}
.login-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 600ms ease}
.login-btn:hover::before{left:100%}
.security-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,255,163,0.07);border:1px solid rgba(0,255,163,0.2);color:#34D399;border-radius:99px;padding:5px 14px;font-size:10px;font-weight:600;letter-spacing:0.04em}

/* ── CORNER ACCENT ─────────────────────────────────────────── */
.corner-tl::before,.corner-tr::before{content:'';position:absolute;width:16px;height:16px;border-color:var(--accent-cyan);border-style:solid;pointer-events:none;z-index:10}
.corner-tl::before{top:0;left:0;border-width:2px 0 0 2px}
.corner-tr::before{top:0;right:0;border-width:2px 2px 0 0}

/* ── NEON CHECKBOX ─────────────────────────────────────────── */
input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1.5px solid rgba(167,139,250,0.3);border-radius:3px;background:var(--bg-input);cursor:pointer;transition:all 200ms ease;vertical-align:middle;position:relative;flex-shrink:0}
input[type="checkbox"]:checked{background:linear-gradient(135deg,#7C3AED,#1a7fff);border-color:#A78BFA;box-shadow:0 0 10px rgba(167,139,250,0.7)}
input[type="checkbox"]:checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:9px;font-weight:900;line-height:1}

/* ── SCROLLBAR ─────────────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:rgba(167,139,250,0.02);border-radius:8px}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(167,139,250,0.4)}

/* ── SCANLINE OVERLAY ──────────────────────────────────────── */
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.015) 2px,rgba(0,0,0,0.015) 4px);pointer-events:none;z-index:9998}

/* ── ANIMATIONS ────────────────────────────────────────────── */
@keyframes dcIn{from{opacity:0;transform:translateY(14px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
.dc-spin{display:inline-block;animation:dcSpin 0.8s linear infinite}

/* ── RESPONSIVE MOBILE-FIRST ─────────────────────────────────
   Breakpoints estándar: sm 640px · md 768px · lg 1024px      */
.dc-hamburger{display:none;background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.2);border-radius:8px;color:var(--accent-cyan);font-size:18px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0}
.dc-sidebar-backdrop{display:none}
@media(max-width:1023px){
  .dc-view{padding-bottom:24px}
}
@media(max-width:768px){
  /* Sin desbordes horizontales + altura dinámica real del móvil */
  html,body{overflow-x:hidden;width:100%}
  .dc-app-root{height:100dvh!important;width:100vw;max-width:100vw}
  main{min-width:0;max-width:100vw}
  /* Tablas: scroll horizontal interno en lugar de romper el layout */
  table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .dc-card{max-width:100%;overflow-x:auto}
  /* Tarjeta de login adaptada al ancho del teléfono */
  .login-card{padding:26px 18px!important}
  .login-wrap{width:min(420px,93vw)!important}
  /* Topbar compacto */
  .glass-topbar{gap:6px!important}
  .glass-topbar button{padding:8px 9px;font-size:11px}
  /* Tipografía y stats */
  h1,h2{font-size:18px}
  /* Sidebar off-canvas deslizable */
  .glass-nav{position:fixed!important;left:0;top:0;bottom:0;z-index:1200;width:248px!important;transform:translateX(-105%);transition:transform 240ms cubic-bezier(0.22,1,0.36,1);box-shadow:0 0 60px rgba(0,0,0,0.85)}
  .glass-nav.dc-open{transform:translateX(0)}
  .dc-sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);z-index:1199;opacity:0;pointer-events:none;transition:opacity 240ms ease}
  .dc-sidebar-backdrop.dc-open{opacity:1;pointer-events:auto}
  .dc-hamburger{display:flex;width:42px;height:42px}
  /* Grids de dos columnas → apilados */
  .dc-view[style*="grid-template-columns"]{display:block!important}
  .dc-view[style*="grid-template-columns"]>*{margin-bottom:16px}
  main>div{padding:14px 12px!important}
  .glass-topbar{padding:8px 10px!important;flex-wrap:wrap}
  table{font-size:11px}
  .dc-modal>div{max-width:96vw;max-height:92vh;overflow-y:auto}
}
@media(max-width:640px){
  .stat-card div{font-size:26px}
  body{font-size:14px}
  /* Grids internos de 2 columnas (modales, tarjetas, formularios) → 1 columna */
  .dc-modal div[style*="grid-template-columns"],.dc-card div[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  /* Paneles de estadísticas en 2 columnas fijas */
  .dc-view>div[style*="auto-fit"]{grid-template-columns:repeat(2,1fr)!important}
}
@media(max-width:768px) and (pointer:coarse){
  /* Evita el auto-zoom de iOS al enfocar campos (fuentes <16px lo disparan) */
  input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}
}
@media(max-width:768px){
  .dc-view{overflow-x:hidden}
  .dc-view *{word-break:break-word}
  .dc-view table *{word-break:normal;white-space:nowrap}
}
/* Optimización táctil (WCAG: área mínima 44×44 px en dispositivos touch) */
@media(pointer:coarse){
  button{min-height:44px}
  select,input:not([type=checkbox]):not([type=radio]){min-height:44px}
  input[type=checkbox],input[type=radio]{min-width:24px;min-height:24px}
  .dc-nav{min-height:44px}
}
@keyframes dcFadeIn{from{opacity:0}to{opacity:1}}

const {useState,useRef,useEffect,useMemo,useCallback,useReducer,createContext,useContext}=React;
/* Versión y fecha de compilación (se leen de los <meta> del head; el chequeo de actualización compara dc-version) */

const APP_BUILD_DATE=(document.querySelector('meta[name="dc-build-date"]')||{}).content||"";
const APP_BUILD_DATE_FMT=(()=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(APP_BUILD_DATE);return m?m[3]+"/"+m[2]+"/"+m[1]:APP_BUILD_DATE;})();

/* ══════════════════════════════════════════════════════════════
   UTILIDADES
   ══════════════════════════════════════════════════════════════ */
const safe=v=>String(v==null?"":v);
const normN=n=>safe(n).toLowerCase().replace(/[áä]/g,"a").replace(/[éë]/g,"e").replace(/[íï]/g,"i").replace(/[óö]/g,"o").replace(/[úü]/g,"u").replace(/ñ/g,"n").replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim();
const darkenHex=(hex,amt)=>{try{let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);return"#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");}catch(e){return"#555";}};
const compressImg=(file,maxSz,quality,cb)=>{if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const cv=document.createElement("canvas");const MAX=maxSz||500;let w=img.width,h=img.height;if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);cb(cv.toDataURL("image/jpeg",quality||0.85));};img.src=e.target.result;};reader.readAsDataURL(file);};

function lev(a,b){if(!a.length)return b.length;if(!b.length)return a.length;const r=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=i;for(let j=1;j<=b.length;j++){const v=a[i-1]===b[j-1]?r[j-1]:1+Math.min(r[j-1],r[j],p);r[j-1]=p;p=v;}r[b.length]=p;}return r[b.length];}
const simN=(a,b)=>{const na=normN(a),nb=normN(b),mx=Math.max(na.length,nb.length);return mx?Math.round((1-lev(na,nb)/mx)*100):100;};

/* ── Motor de coincidencia aproximada (Levenshtein) ─────────── */
const FUZZY_THR=70;          // umbral búsqueda global
let DUP_THR=(()=>{const v=Number(localStorage.getItem("dc_dup_thr"));return v>=50&&v<=99?v:80;})(); // umbral de fusión de talentos (configurable, default 80%)
const setDupThr=v=>{const n=Math.min(99,Math.max(50,Number(v)||80));DUP_THR=n;try{localStorage.setItem("dc_dup_thr",String(n));}catch(e){}return n;};
function fuzzyScore(query,text){
  const nq=normN(query),nt=normN(text);
  if(!nq||!nt)return 0;
  if(nt.includes(nq))return 100;                       // substring exacto
  let best=simN(nq,nt);                                // string completo
  const qToks=nq.split(" ").filter(Boolean);
  for(const tok of nt.split(" ")){                     // nombres y apellidos por separado
    if(!tok)continue;
    if(tok.startsWith(nq))best=Math.max(best,95);
    best=Math.max(best,simN(nq,tok));
    for(const qt of qToks){if(qt.length>=3)best=Math.max(best,simN(qt,tok));}
  }
  return best;
}
/* ── Reglas de negocio: cliente y DUBCARD ───────────────────── */
const isDiscovery=c=>/discovery/i.test(safe(c));
const seriesRequiresDubcard=sr=>!sr||sr.requiere_dubcard!==false; // default: true (retro-compatible)
const defaultFormatoDubcard=(cliente,requiere)=>requiere===false?"No necesita DUBCARD":(/netflix/i.test(safe(cliente))?"BACKLOT":"Excel");

const sortedTokens=s=>normN(s).split(" ").filter(Boolean).sort().join(" ");
function bestTalentMatch(name,talents,excludeId){
  // Duplicados: similitud sobre el NOMBRE COMPLETO (y con tokens ordenados para
  // detectar inversiones tipo "Lozada Alexandra"), nunca por palabra suelta —
  // así "Talento De Maria" NO coincide con "Maria Gonzalez".
  let best=null,bestScore=0;const nn=normN(name);
  for(const t of(talents||[])){
    if(!t||!t.name)continue;
    if(excludeId&&t.id===excludeId)continue;
    if(normN(t.name)===nn)continue;                    // exacto se maneja aparte
    const sc=Math.max(simN(name,t.name),simN(sortedTokens(name),sortedTokens(t.name)));
    if(sc>bestScore){bestScore=sc;best=t;}
  }
  return(best&&bestScore>=DUP_THR)?{talent:best,score:bestScore}:null;
}

/* ══════════════════════════════════════════════════════════════
   AUTENTICACIÓN MULTI-USUARIO (client-side)
   - Contraseñas: PBKDF2-SHA256 (WebCrypto) con salt aleatorio y 150.000
     iteraciones — equivalente nativo del navegador a bcrypt/Argon2.
   - Sesiones: token aleatorio de 256 bits con expiración (12 h) en
     sessionStorage.
   - Roles: admin (todo + gestión de usuarios) · editor (todo) ·
     lector (solo lectura — los cambios se bloquean en el dispatch).
   NOTA: al ser una app estática sin backend, esto protege el acceso por
   interfaz en un equipo/equipo compartido, pero NO es seguridad de
   servidor: los datos residen en el navegador. Para multiusuario real
   en red se requiere backend (p. ej. Supabase/Firebase).
   ══════════════════════════════════════════════════════════════ */
const DEMO_CREDENTIALS={user:"JOEL",pass:"SABRI2026"}; // semilla del primer admin
const USERS_KEY="dc_users_v1";const SESSION_KEY="dc_session_v1";const PBKDF2_ITER=150000;
const bufToHex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const hexToBuf=h=>new Uint8Array((h.match(/.{2}/g)||[]).map(x=>parseInt(x,16)));
const randomHex=n=>bufToHex(crypto.getRandomValues(new Uint8Array(n)).buffer);
async function hashPassword(pass,saltHex,iter){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),{name:"PBKDF2"},false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:hexToBuf(saltHex),iterations:iter||PBKDF2_ITER,hash:"SHA-256"},key,256);
  return bufToHex(bits);
}
function loadUsers(){try{const v=localStorage.getItem(USERS_KEY);const u=v?JSON.parse(v):[];return Array.isArray(u)?u.filter(x=>x&&typeof x.username==="string"):[];}catch(e){return[];}}
function saveUsers(u){try{localStorage.setItem(USERS_KEY,JSON.stringify(u));return true;}catch(e){console.warn("saveUsers",e);return false;}}
async function ensureSeedAdmin(){

    users=[{id:1,username:DEMO_CREDENTIALS.user,role:"admin",salt,iter:PBKDF2_ITER,hash,created:new Date().toISOString()}];
    saveUsers(users);
  }

}
async function authenticate(username,pass){
  const users=await ensureSeedAdmin();

  if(!u)return null;
  const h=await hashPassword(pass,u.salt,u.iter||PBKDF2_ITER);
  return h===u.hash?u:null;
}

function getSession(){try{const v=sessionStorage.getItem(SESSION_KEY);if(!v)return null;const s=JSON.parse(v);if(!s.exp||s.exp<Date.now()){sessionStorage.removeItem(SESSION_KEY);return null;}

/* ══════════════════════════════════════════════════════════════
   NUBE (Supabase · BaaS) — Persistencia y sincronización multidispositivo
   - Auth: Email/Password vía Supabase Auth (JWT gestionado por la librería).
   - Datos: tabla pública `dc_data` (1 fila por usuario: payload JSONB + rev)
     protegida con Row Level Security (cada usuario solo ve su fila).
   - Sync: push asíncrono tras cada mutación (debounce 1.5 s) + suscripción
     Realtime (WebSockets) para recibir cambios de otros dispositivos.
   - Conflictos: número de revisión `rev` monotónico; si el servidor va
     adelante al guardar, gana la escritura más reciente (last-write-wins)
     y se notifica al usuario.
   - Offline-first: localStorage sigue siendo la caché local por usuario;
     al recuperar conexión se reintenta el push pendiente.
   ══════════════════════════════════════════════════════════════ */

// Normaliza una fecha de cualquier formato común a YYYY-MM-DD
function normDate(v){
  if(v==null||v==="")return"";
  const s=String(v).trim();
  // ISO o YYYY-MM-DD (posible con hora)
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
  // DD/MM/YYYY o DD-MM-YYYY
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m)return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
  // MM/DD/YYYY (heurística: si el primero >12 ya lo cubrió arriba)
  const d=new Date(s);
  if(!isNaN(d.getTime()))return d.toISOString().slice(0,10);
  return"";
}

// Obtiene un valor de un objeto por ruta con puntos ("data.entregas")
function getByPath(obj,path){
  if(!path)return obj;
  return path.split(".").reduce((o,k)=>(o&&o[k]!==undefined)?o[k]:undefined,obj);
}

// Parsea CSV simple a array de objetos
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);if(lines.length<2)return[];
  const split=l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){q=!q;}else if(c===","&&!q){out.push(cur);cur="";}else cur+=c;}out.push(cur);return out.map(x=>x.trim().replace(/^"|"$/g,""));};
  const headers=split(lines[0]);
  return lines.slice(1).map(l=>{const cells=split(l);const o={};headers.forEach((h,i)=>o[h]=cells[i]||"");return o;});
}

// Descarga y normaliza las filas de la API externa
async function fetchExternalRows(cfg){
  const headers={};let url=cfg.url;
  if(cfg.authType==="header"&&cfg.authKey)headers[cfg.authKey]=cfg.authValue;
  if(cfg.authType==="query"&&cfg.authKey){const sep=url.includes("?")?"&":"?";url+=sep+encodeURIComponent(cfg.authKey)+"="+encodeURIComponent(cfg.authValue);}
  const res=await fetch(url,{headers,cache:"no-store"});
  if(!res.ok)throw new Error("HTTP "+res.status+" "+res.statusText);
  const ct=(res.headers.get("content-type")||"").toLowerCase();
  const text=await res.text();
  let arr;
  if(ct.includes("json")||text.trim().startsWith("{")||text.trim().startsWith("[")){
    let data=JSON.parse(text);
    data=getByPath(data,cfg.jsonPath);
    arr=Array.isArray(data)?data:(data?[data]:[]);
  }else{
    arr=parseCSV(text);
  }
  return arr.map(row=>({
    programa:String(getByPath(row,cfg.fieldProgram)??"").trim(),
    capitulo:String(getByPath(row,cfg.fieldChapter)??"").trim(),
    fecha_miami:normDate(getByPath(row,cfg.fieldMiami)),
    fecha_dubcard:normDate(getByPath(row,cfg.fieldDubcard))
  })).filter(r=>r.programa);
}

// Empareja capítulo externo con el interno (tolerante a formatos)
function chapterMatches(internalCap,externalCap){
  const a=normN(internalCap),b=normN(externalCap);
  if(!b)return false;
  if(a===b)return true;
  // Película
  if(/pelicula|movie|film|largometraje/.test(a)&&/pelicula|movie|film|largometraje/.test(b))return true;
  // Comparar por número de episodio
  // Se compara el ÚLTIMO número (en "Temporada 2 Ep 5" el episodio es 5) y, si ambos traen temporada, también la temporada
  const numsA=a.match(/\d+/g)||[],numsB=b.match(/\d+/g)||[];
  const na=numsA[numsA.length-1],nb=numsB[numsB.length-1];
  if(na&&nb&&parseInt(na,10)===parseInt(nb,10)){
    if(numsA.length>1&&numsB.length>1&&parseInt(numsA[0],10)!==parseInt(numsB[0],10))return false;
    return true;
  }
  return false;
}

// Calcula qué filas de producción se actualizarían (dry-run / preview)
function computeExternalUpdates(rows,produccion){
  const updates=[];
  (rows||[]).forEach(ext=>{
    let match=null,bestSc=0,secondSc=0;
    (produccion||[]).forEach(pr=>{if(!chapterMatches(pr.capitulo,ext.capitulo))return;const sc=fuzzyScore(ext.programa,pr.programa);if(sc>bestSc){secondSc=bestSc;bestSc=sc;match=pr;}else if(sc>secondSc)secondSc=sc;});
    if(!match||bestSc<85||(bestSc<100&&bestSc-secondSc<10))return; // sin candidato claro: no tocar fechas
    const change={};
    if(ext.fecha_miami&&ext.fecha_miami!==match.fecha_miami)change.fecha_miami=ext.fecha_miami;
    if(ext.fecha_dubcard&&ext.fecha_dubcard!==match.fecha_dubcard)change.fecha_dubcard=ext.fecha_dubcard;
    if(Object.keys(change).length)updates.push({id:match.id,programa:match.programa,capitulo:match.capitulo,...change,_prev:{fecha_miami:match.fecha_miami,fecha_dubcard:match.fecha_dubcard}});
  });
  return updates;
}

   pero se lee también de localStorage para no perder las sesiones creadas por versiones anteriores. */
const SB_SESSION_STORAGE={
  getItem:k=>{try{const v=sessionStorage.getItem(k);if(v!=null)return v;const old=localStorage.getItem(k);if(old!=null){try{sessionStorage.setItem(k,old);}catch(e){}return old;}}catch(e){}return null;},
  setItem:(k,v)=>{try{sessionStorage.setItem(k,v);}catch(e){}try{localStorage.setItem(k,v);}catch(e){}},
  removeItem:k=>{try{sessionStorage.removeItem(k);}catch(e){}try{localStorage.removeItem(k);}catch(e){}}
};
function loadSupabaseLib(){
  if(window.supabase&&window.supabase.createClient)return Promise.resolve();
  if(window.__sbLoading)return window.__sbLoading;
  window.__sbLoading=new Promise((ok,err)=>{
    const sc=document.createElement("script");
    sc.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js";sc.integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil";sc.crossOrigin="anonymous";
    sc.onload=()=>ok();sc.onerror=()=>err(new Error("No se pudo cargar la librería de Supabase (¿sin conexión?)"));
    document.head.appendChild(sc);
  });
  return window.__sbLoading;
}
async function getSb(){
  const cfg=getCloudCfg();if(!cfg)return null;
  if(!_sbClient){await loadSupabaseLib();_sbClient=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{storage:SB_SESSION_STORAGE,persistSession:true,autoRefreshToken:true}});}
  return _sbClient;
}
async function cloudSignIn(email,pass){
  const sb=await getSb();if(!sb)throw new Error("Nube no configurada");
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)throw error;return data.user;
}
async function cloudSignUp(email,pass){
  const sb=await getSb();if(!sb)throw new Error("Nube no configurada");
  const{data,error}=await sb.auth.signUp({email,password:pass});
  if(error)throw error;return data.user;
}
function cloudSessionFromUser(u){
  // El rol sólo es fiable en app_metadata (lo escribe el panel de Supabase / service role). user_metadata lo puede cambiar el propio usuario, así que nunca otorga "admin".
  const appRole=u.app_metadata&&u.app_metadata.dc_role;const userRole=u.user_metadata&&u.user_metadata.dc_role;
  const role=ROLE_LABELS[appRole]?appRole:(ROLE_LABELS[userRole]&&userRole!=="admin"?userRole:"editor");
  const sess={token:randomHex(32),userId:"sb:"+u.id,sbUid:u.id,username:u.email||"usuario",role,exp:Date.now()+12*3600*1000};
  try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(sess));}catch(e){}
  return sess;
}

/* Mensajes de error de nube en lenguaje claro */
function cloudErrMsg(e){
  const m=(e&&e.message)||String(e);
  if(/does not exist|42P01/i.test(m))return "la tabla dc_data no existe — ejecuta el script SQL en Supabase (botón ☁️ Nube → Ver script)";
  if(/JWT|not authenticated|invalid token|Auth session missing/i.test(m))return "sesión de nube expirada — cierra sesión y vuelve a entrar";
  if(/Failed to fetch|NetworkError|network/i.test(m))return "sin conexión con Supabase — revisa tu red o la URL del proyecto";
  if(/row-level security|policy/i.test(m))return "permisos RLS faltantes — vuelve a ejecutar el script SQL completo";
  return m;
}

/* Normaliza un payload externo (nube / import) a la forma de initialData: sólo claves conocidas, arrays con objetos */
function sanitizePayload(p){const h={};if(!p||typeof p!=="object")return h;Object.keys(initialData).forEach(k=>{if(Array.isArray(p[k]))h[k]=p[k].filter(x=>x!=null&&!Array.isArray(x)&&(typeof x==="object"||typeof x==="string"));});return h;} // conserva listas de texto (clienteList/directorList)

/* Combina el payload de la nube (otro dispositivo) con el local: unión por id, gana el registro local
   cuando el mismo id existe en ambos; los registros que sólo tiene la nube se conservan. Así un
   conflicto de revisión nunca hace desaparecer lo guardado en ninguno de los dos dispositivos. */
/* Quita del payload local los registros de demostración intactos (initialData): nunca deben "combinarse" en la nube de un usuario */
function stripSeed(p){
  const s=sanitizePayload(p),out={};
  Object.keys(initialData).forEach(k=>{
    const seed=new Set((initialData[k]||[]).map(x=>JSON.stringify(x)));
    out[k]=(s[k]||[]).filter(x=>!seed.has(JSON.stringify(x)));
  });
  return out;
}
function mergePayloads(remote,local){
  const r=sanitizePayload(remote),l=sanitizePayload(local),out={};
  // Lápidas: ids que aparecen en la papelera de cada lado (fueron eliminados ahí). Un registro que sólo
  // existe en un lado NO se conserva si el otro lado lo tiene en su papelera (lo borró a propósito).
  const tombs=(p,k)=>{const ids=new Set();(p.trash||[]).forEach(snap=>{const d=snap&&snap.data;if(d&&Array.isArray(d[k]))d[k].forEach(x=>{if(x&&x.id!=null)ids.add(String(x.id));});});return ids;};
  Object.keys(initialData).forEach(k=>{
    const ra=r[k]||[],la=l[k]||[];
    const hasId=x=>x&&typeof x==="object"&&x.id!==undefined&&x.id!==null;
    if(k!=="trash"&&ra.every(hasId)&&la.every(hasId)&&(ra.length||la.length)){
      const rt=tombs(r,k),lt=tombs(l,k);
      const rm=new Map();ra.forEach(x=>rm.set(String(x.id),x));
      const lm=new Map();la.forEach(x=>lm.set(String(x.id),x));
      const m=new Map();
      rm.forEach((x,id)=>{if(lm.has(id)||!lt.has(id))m.set(id,x);});   // sólo-nube: se conserva salvo que lo hayamos borrado aquí
      lm.forEach((x,id)=>{if(rm.has(id)||!rt.has(id))m.set(id,x);});   // sólo-local: se conserva salvo que se borrara en la nube; si está en ambos gana el local
      out[k]=[...m.values()];
      return;
    }
    if(!ra.length){out[k]=la;return;}
    if(!la.length){out[k]=ra;return;}
    {
      const seen=new Set(),arr=[];[...ra,...la].forEach(x=>{const key=JSON.stringify(x);if(seen.has(key))return;seen.add(key);arr.push(x);});
      out[k]=arr;
    }
  });
  return out;
}

/* Hook de sincronización: pull inicial + siembra + realtime + push con control de revisión
   Devuelve {status, pushNow, pullNow} para sincronización manual de recuperación. */
function useCloudSync(data,dispatch,showToast,session){
  const isCloud=!!(session&&session.sbUid&&getCloudCfg());
  const[cloudStatus,setCloudStatus]=useState(isCloud?"connecting":"off");
  const revRef=useRef(0);
  const inflightRev=useRef(0); // rev que estamos escribiendo ahora mismo (evita re-hidratar con nuestro propio evento Realtime)
  const skipPush=useRef(false);
  const readyRef=useRef(false);
  const dataRef=useRef(data);dataRef.current=data;
  const lastErrToast=useRef(0);
  const toastErr=useCallback((pref,e)=>{
    if(Date.now()-lastErrToast.current<25000)return; // no saturar con el mismo error
    lastErrToast.current=Date.now();
    showToast("⚠ Nube ("+pref+"): "+cloudErrMsg(e));
  },[showToast]);

  const pushNow=useCallback(async(verbose,force,_retry)=>{
    if(!isCloud)return false;
    try{
      const sb=await getSb();if(!sb)return false;
      setCloudStatus("saving");
      const{data:row,error:selErr}=await sb.from("dc_data").select("rev").eq("user_id",session.sbUid).maybeSingle();
      if(selErr)throw selErr;
      const serverRev=row?Number(row.rev)||0:0;
      let body=dataRef.current;
      if(row&&serverRev>revRef.current&&!force){
        // La nube tiene una revisión que este dispositivo no ha visto (otro dispositivo guardó, o aún no
        // se había sincronizado): combinar ambas versiones en vez de bloquear o sobrescribir.
        const{data:full,error:e1}=await sb.from("dc_data").select("payload,rev").eq("user_id",session.sbUid).maybeSingle();
        if(e1)throw e1;
        if(full&&full.payload){
          body=mergePayloads(full.payload,stripSeed(dataRef.current));
          revRef.current=Number(full.rev)||serverRev;
          skipPush.current=true;dataRef.current=body;
          dispatch({type:"HYDRATE",payload:body});
          showToast("↔ Nube: cambios de otro dispositivo combinados con los tuyos");
        }
      }
      readyRef.current=true;
      const baseRev=Math.max(serverRev,revRef.current);
      const next=baseRev+1;
      inflightRev.current=next;
      const payload={user_id:session.sbUid,payload:body,rev:next,updated_at:new Date().toISOString()};
      if(row){
        // Escritura condicional: sólo si la rev del servidor sigue siendo la que leímos (evita carreras entre dispositivos)
        const{data:upd,error}=await sb.from("dc_data").update(payload).eq("user_id",session.sbUid).eq("rev",serverRev).select("rev");
        if(error)throw error;
        if(!upd||!upd.length){
          if(force){const{error:e2}=await sb.from("dc_data").upsert(payload);if(e2)throw e2;}
          else if(!_retry){return await pushNow(verbose,false,true);} // la nube cambió mientras guardábamos: reintentar (combina de nuevo)
          else{setCloudStatus("conflict");showToast("⚠ Nube: no se pudo guardar por cambios simultáneos — vuelve a intentarlo con ⬆");return false;}
        }
      }else{
        const{error}=await sb.from("dc_data").insert(payload);
        if(error)throw error;
      }
      revRef.current=next;
      lastErrToast.current=0;
      setCloudStatus("synced");
      if(verbose)showToast("⬆ Datos subidos a la nube (rev "+next+")");
      return true;
    }catch(e){
      const off=typeof navigator!=="undefined"&&navigator.onLine===false;
      setCloudStatus(off?"offline":"error");
      if(!off)toastErr("guardar",e);
      return false;
    }
  },[isCloud,session&&session.sbUid,showToast,toastErr,dispatch]);

  const pullNow=useCallback(async(verbose)=>{
    if(!isCloud)return false;
    try{
      const sb=await getSb();if(!sb)return false;
      setCloudStatus("saving");
      const{data:row,error}=await sb.from("dc_data").select("payload,rev").eq("user_id",session.sbUid).maybeSingle();
      if(error)throw error;
      if(row&&row.payload){
        revRef.current=Number(row.rev)||1;
        skipPush.current=true;
        dispatch({type:"HYDRATE",payload:sanitizePayload(row.payload)});
        if(verbose)showToast("⬇ Datos traídos de la nube (rev "+revRef.current+")");
      }else if(verbose)showToast("ℹ La nube aún no tiene datos de esta cuenta");
      readyRef.current=true;
      setCloudStatus("synced");
      return true;
    }catch(e){
      setCloudStatus(typeof navigator!=="undefined"&&navigator.onLine===false?"offline":"error");
      toastErr("cargar",e);
      return false;
    }
  },[isCloud,session&&session.sbUid,dispatch,showToast,toastErr]);

  // Pull inicial + siembra de la nube + suscripción Realtime
  useEffect(()=>{
    if(!isCloud)return;
    let channel=null,alive=true,seedTimer=null,retryTimer=null,attempt=0;
    const init=async()=>{
      try{
        const sb=await getSb();if(!sb||!alive)return;
        // Verificar que la sesión JWT de Supabase sigue viva en este dispositivo
        const{data:auth}=await sb.auth.getSession();
        if(!auth||!auth.session){
          // Sin JWT en este dispositivo: volver al login para reautenticar (los datos locales quedan guardados)
          if(alive){setCloudStatus("error");showToast("⚠ Nube: la sesión caducó — vuelve a iniciar sesión para seguir sincronizando");setTimeout(()=>{if(window.__dcLogout)window.__dcLogout();},2500);}
          return;
        }
        const{data:row,error}=await sb.from("dc_data").select("payload,rev").eq("user_id",session.sbUid).maybeSingle();
        if(error)throw error;
        if(alive&&row&&row.payload){
          revRef.current=Number(row.rev)||1;
          // Si en este dispositivo hay registros que la nube no tiene (edición sin conexión, subida
          // fallida…), se combinan y se suben; si no, se toma la nube tal cual.
          const merged=mergePayloads(row.payload,stripSeed(dataRef.current));
          const localExtra=Object.keys(initialData).some(k=>(merged[k]||[]).length>(sanitizePayload(row.payload)[k]||[]).length);
          skipPush.current=true;
          dispatch({type:"HYDRATE",payload:localExtra?merged:sanitizePayload(row.payload)});
          if(localExtra){dataRef.current=merged;showToast("↔ Nube: se combinaron cambios locales pendientes");seedTimer=setTimeout(()=>{if(alive)pushNow(false);},1500);}
          else showToast("☁️ Datos sincronizados desde la nube (rev "+revRef.current+")");
        }
        readyRef.current=true;
        if(alive&&!row){
          // Primera vez de esta cuenta: sembrar la nube con los datos locales actuales
          seedTimer=setTimeout(()=>{if(alive)pushNow(false);},1200);
        }
        if(alive)setCloudStatus("synced");
        channel=sb.channel("dc_data_u_"+session.sbUid)
          .on("postgres_changes",{event:"*",schema:"public",table:"dc_data",filter:"user_id=eq."+session.sbUid},pl=>{
            const nrev=pl.new&&Number(pl.new.rev);
            if(nrev&&nrev>Math.max(revRef.current,inflightRev.current)&&pl.new.payload){
              revRef.current=nrev;skipPush.current=true;
              dispatch({type:"HYDRATE",payload:sanitizePayload(pl.new.payload)});
              showToast("☁️ Actualizado desde otro dispositivo (rev "+nrev+")");
            }
          }).subscribe();
      }catch(e){
        if(alive){setCloudStatus("error");toastErr("cargar",e);}
        console.warn("[nube] pull:",e&&e.message);
        if(alive&&!readyRef.current){const wait=Math.min(60000,5000*Math.pow(2,attempt++));retryTimer=setTimeout(init,wait);}
      }
    };
    init();
    return()=>{alive=false;if(seedTimer)clearTimeout(seedTimer);if(retryTimer)clearTimeout(retryTimer);if(channel){try{channel.unsubscribe();}catch(e){}}};
  },[isCloud,session&&session.sbUid]);

  // Push asíncrono tras cada mutación (debounce 1.5 s)
  useEffect(()=>{
    if(!isCloud||!readyRef.current)return;
    if(skipPush.current){skipPush.current=false;return;}
    const t=setTimeout(()=>{pushNow(false);},1500);
    return()=>clearTimeout(t);
  },[data,isCloud,pushNow]);

  // Reintento automático al recuperar conexión
  useEffect(()=>{
    if(!isCloud)return;
    const on=()=>{pushNow(false);}; // pushNow combina con la nube si ésta va por delante
    window.addEventListener("online",on);
    return()=>window.removeEventListener("online",on);
  },[isCloud,pushNow,pullNow]);

  return{status:cloudStatus,pushNow,pullNow};
}

const CLOUD_STATUS_CFG={
  off:null,
  connecting:{ic:"⏳",txt:"Conectando…",c:"var(--accent-amber)"},
  synced:{ic:"☁️",txt:"Sincronizado",c:"var(--accent-emerald)"},
  saving:{ic:"⟳",txt:"Guardando en nube…",c:"var(--accent-cyan)"},
  offline:{ic:"📴",txt:"Sin red — local",c:"var(--accent-orange)"},
  conflict:{ic:"⚠",txt:"Conflicto — usa ⬇ o ⬆",c:"var(--accent-amber)"},
  error:{ic:"⚠",txt:"Error de nube",c:"var(--accent-rose)"}
};

/* Modal de configuración de la nube (URL + anon key de Supabase) */
function CloudConfigModal({onClose,onSaved}){
  const cfg=getCloudCfg();
  const[url,setUrl]=useState(cfg?cfg.url:"");
  const[key,setKey]=useState(cfg?cfg.anonKey:"");
  const[showSql,setShowSql]=useState(false);
  const[testRes,setTestRes]=useState(null);
  const[testing,setTesting]=useState(false);
  const testConn=async()=>{
    const u=url.trim().replace(/\/+$/,"");
    if(!u||key.trim().length<30){setTestRes({ok:false,msg:"Completa URL y anon key primero"});return;}
    setTesting(true);setTestRes(null);
    try{
      await loadSupabaseLib();
      const tmp=window.supabase.createClient(u,key.trim());
      const{error}=await tmp.from("dc_data").select("user_id").limit(0);
      if(error){
        if(/does not exist|42P01/i.test(error.message))setTestRes({ok:false,msg:"❌ Conexión OK, pero falta ejecutar el script SQL (la tabla dc_data no existe)"});
        else setTestRes({ok:false,msg:"❌ "+error.message});
      }else setTestRes({ok:true,msg:"✓ Conexión correcta: proyecto accesible y tabla dc_data encontrada"});
    }catch(e){setTestRes({ok:false,msg:"❌ No se pudo conectar: "+(e.message||"revisa la URL")});}
    finally{setTesting(false);}
  };
  const save=()=>{
    const u=url.trim().replace(/\/+$/,"");
    if(!/^https:\/\/.+\.supabase\.co$/.test(u)){alert("URL inválida. Debe ser https://<proyecto>.supabase.co");return;}
    if(key.trim().length<30){alert("Anon key inválida");return;}
    saveCloudCfg({url:u,anonKey:key.trim()});
    _sbClient=null;
    onSaved&&onSaved();
    onClose();
  };
  return(
    <ModalShell title="☁️ Configurar sincronización en la nube" width={560} onClose={onClose}>
      <div style={{fontSize:11,color:"var(--text-secondary)",lineHeight:1.7,marginBottom:14}}>
        Crea un proyecto gratuito en <b style={{color:"var(--accent-cyan)"}}>supabase.com</b>, ejecuta el script SQL (botón abajo) una sola vez, y pega aquí la <b>URL del proyecto</b> y la <b>anon public key</b> (Settings → API). Con esto tendrás cuentas por email, datos en la nube y sincronización en tiempo real entre dispositivos.
      </div>
      <div style={{marginBottom:12}}><label style={SLBL}>URL del proyecto</label><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://abcdefgh.supabase.co" style={{...SIPT,fontSize:12}}/></div>
      <div style={{marginBottom:12}}><label style={SLBL}>Anon public key</label><input value={key} onChange={e=>setKey(e.target.value)} placeholder="eyJhbGciOi…" style={{...SIPT,fontSize:12}}/></div>
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <button onClick={()=>setShowSql(v=>!v)} className="dc-btn" style={btnG({flex:1,padding:"8px 0",fontSize:11})}>{showSql?"▲ Ocultar":"▼ Ver"} script SQL</button>
        <button onClick={testConn} disabled={testing} className="dc-btn" style={btnS({flex:1,padding:"8px 0",fontSize:11,opacity:testing?0.6:1})}>{testing?<span className="dc-spin">⟳</span>:"🔌 Probar conexión"}</button>
      </div>
      {testRes&&<div style={{marginBottom:10,padding:"8px 12px",borderRadius:"var(--radius-md)",fontSize:11,fontWeight:600,background:testRes.ok?"rgba(0,255,163,0.07)":"rgba(255,77,125,0.07)",border:"1px solid "+(testRes.ok?"rgba(0,255,163,0.3)":"rgba(255,77,125,0.3)"),color:testRes.ok?"var(--accent-emerald)":"var(--accent-rose)"}}>{testRes.msg}</div>}
      {showSql&&<div style={{position:"relative",marginBottom:12}}>
        <pre style={{background:"var(--bg-input)",border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",padding:"12px",fontSize:9.5,lineHeight:1.5,overflowX:"auto",color:"var(--text-secondary)",maxHeight:180}}>{CLOUD_SQL}</pre>
        <button onClick={()=>{try{navigator.clipboard.writeText(CLOUD_SQL);}catch(e){}}} className="dc-btn" style={btnS({position:"absolute",top:8,right:8,fontSize:10})}>📋 Copiar</button>
      </div>}
      <div style={{display:"flex",gap:8}}>
        {cfg&&<button onClick={()=>{if(window.confirm("¿Desconectar la nube? Volverás al modo local."))   {saveCloudCfg(null);_sbClient=null;onSaved&&onSaved();onClose();}}} className="dc-btn" style={btnD({padding:"10px 14px"})}>Desconectar</button>}
        <button onClick={onClose} className="dc-btn" style={btnG({flex:1,padding:"10px 0"})}>Cancelar</button>
        <button onClick={save} className="dc-btn" style={btnP({flex:1,padding:"10px 0"})}>Guardar configuración</button>
      </div>
    </ModalShell>
  );
}

/* ══════════════════════════════════════════════════════════════
   PERSISTENCIA
   ══════════════════════════════════════════════════════════════ */
const LS_KEY_BASE="dublajecast_v2";
/* Memoria POR USUARIO: cada cuenta guarda y carga sus datos en su propia
   sección (dublajecast_v2_u<id>). Se fija al iniciar sesión, antes de montar
   la app, de modo que la hidratación y el auto-guardado usan siempre el
   espacio del usuario activo. */
let ACTIVE_DATA_KEY=LS_KEY_BASE;
function setActiveDataKey(userId){
  ACTIVE_DATA_KEY=LS_KEY_BASE+"_u"+userId;
  // Migración única: el admin original (id 1) hereda los datos previos compartidos
  try{
    if(!localStorage.getItem(ACTIVE_DATA_KEY)){
      const legacy=localStorage.getItem(LS_KEY_BASE);
      if(legacy&&Number(userId)===1)localStorage.setItem(ACTIVE_DATA_KEY,legacy);
    }
  }catch(e){}
}
/* ── Compresión de almacenamiento local (LZString) ── */
/* LZString (compressToUTF16/decompressFromUTF16) — compresión para localStorage */
var LZString=(function(){
var f=String.fromCharCode;
var LZString={
  compressToUTF16:function(input){
    if(input==null)return"";
    return LZString._compress(input,15,function(a){return f(a+32);})+" ";
  },
  decompressFromUTF16:function(compressed){
    if(compressed==null)return"";
    if(compressed=="")return null;
    return LZString._decompress(compressed.length,16384,function(index){return compressed.charCodeAt(index)-32;});
  },
  _compress:function(uncompressed,bitsPerChar,getCharFromInt){
    if(uncompressed==null)return"";
    var i,value,context_dictionary={},context_dictionaryToCreate={},context_c="",context_wc="",context_w="",context_enlargeIn=2,context_dictSize=3,context_numBits=2,context_data=[],context_data_val=0,context_data_position=0,ii;
    for(ii=0;ii<uncompressed.length;ii+=1){
      context_c=uncompressed.charAt(ii);
      if(!Object.prototype.hasOwnProperty.call(context_dictionary,context_c)){context_dictionary[context_c]=context_dictSize++;context_dictionaryToCreate[context_c]=true;}
      context_wc=context_w+context_c;
      if(Object.prototype.hasOwnProperty.call(context_dictionary,context_wc)){context_w=context_wc;}
      else{
        if(Object.prototype.hasOwnProperty.call(context_dictionaryToCreate,context_w)){
          if(context_w.charCodeAt(0)<256){
            for(i=0;i<context_numBits;i++){context_data_val=(context_data_val<<1);if(context_data_position==bitsPerChar-1){context_data_position=0;context_data.push(getCharFromInt(context_data_val));context_data_val=0;}else{context_data_position++;}}
            value=context_w.charCodeAt(0);
            for(i=0;i<8;i++){context_data_val=(context_data_val<<1)|(value&1);if(context_data_position==bitsPerChar-1){context_data_position=0;context_data.push(getCharFromInt(context_data_val));context_data_val=0;}else{context_data_position++;}value=value>>1;}
          }else{
            value=1;

const LZ_MARK="\u0001LZ\u0001"; // prefijo que identifica datos comprimidos
function lsGet(){
  try{
    const v=localStorage.getItem(ACTIVE_DATA_KEY);
    if(!v)return null;
    if(v.indexOf(LZ_MARK)===0){
      const json=LZString.decompressFromUTF16(v.slice(LZ_MARK.length));
      return json?JSON.parse(json):null;
    }
    return JSON.parse(v); // datos antiguos sin comprimir (migración automática al próximo guardado)
  }catch(e){
    // Blob ilegible: conservar copia antes de que el auto-guardado lo sobrescriba
    try{const v=localStorage.getItem(ACTIVE_DATA_KEY);if(v)localStorage.setItem(ACTIVE_DATA_KEY+"_corrupt_"+Date.now(),v);}catch(_){}
    console.warn("lsGet: datos locales ilegibles",e);return null;
  }
}
function lsSet(data){
  const serialized=JSON.stringify(data);
  let payload,realKB;
  try{
    const comp=LZString.compressToUTF16(serialized);
    payload=LZ_MARK+comp;
    realKB=Math.round(payload.length*2/1024);
  }catch(e){
    payload=serialized;realKB=Math.round(serialized.length*2/1024);
  }
  // El umbral ahora se mide sobre el tamaño COMPRIMIDO real
  if(realKB>4900){throw new Error(`Almacenamiento casi lleno (${realKB} KB comprimidos de ~5120 KB). Usa el modo nube o limpia la papelera para continuar.`);}
  try{localStorage.setItem(ACTIVE_DATA_KEY,payload);}catch(e){throw new Error("Almacenamiento local lleno. Vacía la papelera (🗂️ Datos) o exporta los datos.");}
}
// Tamaño real ocupado en localStorage (comprimido), para el medidor
function lsRealUsageKB(data){
  try{const comp=LZString.compressToUTF16(JSON.stringify(data));return Math.round((LZ_MARK.length+comp.length)*2/1024);}catch(e){return Math.round(JSON.stringify(data).length*2/1024);}
}

/* Lee un archivo como ArrayBuffer con mensajes claros: en Windows, un Excel abierto en Excel
   (o bloqueado por OneDrive/antivirus) hace que el navegador no pueda leerlo (NotReadableError). */
async function readFileBuffer(file){
  try{
    if(!file)throw new Error("Archivo vacío");
    if(file.size===0)throw new Error("«"+file.name+"» está vacío (0 bytes)");
    return await file.arrayBuffer();
  }catch(e){
    const nm=(e&&e.name)||"";const msg=(e&&e.message)||String(e);
    if(nm==="NotReadableError"||/could not be read|permission|NotReadable/i.test(msg))
      throw new Error("No se pudo leer «"+file.name+"»: el archivo está abierto en Excel o bloqueado por Windows/OneDrive. Ciérralo y vuelve a subirlo.");
    if(nm==="NotFoundError")throw new Error("«"+file.name+"» ya no está en esa carpeta (se movió o renombró). Vuelve a seleccionarlo.");
    throw new Error("No se pudo leer «"+file.name+"»: "+msg);
  }
}
const SKIP={nombre:1,talento:1,name:1,actor:1,artista:1,casting:1,personaje:1,id:1,no:1,num:1,"#":1,si:1,total:1,fecha:1,ep:1,episodio:1};
function isRealName(v){const s=safe(v).trim();if(!s||/^\d+([.,]\d+)?$/.test(s))return false;if(SKIP[s.toLowerCase()])return false;if(!/[a-zA-ZÁÉÍÓÚÜÑáéíóúüñ]{2,}/.test(s))return false;return true;}
function pickName(row,preferred){const cols=preferred?[...preferred,...Array.from({length:10},(_,i)=>i).filter(i=>!preferred.includes(i))]:Array.from({length:10},(_,i)=>i);for(const col of cols){if(col>=row.length)continue;const v=safe(row[col]).trim();if(isRealName(v))return v;}return null;}
function extractEpNum(fn){const b=String(fn||"").replace(/\.(xlsx|xlsm|xls|csv)$/i,"");const m=b.match(/[st]\d{1,2}\s*[ex]\s*0*(\d{1,3})/i)||b.match(/(?:^|[^a-z])(?:ep|episodio|cap(?:itulo)?)[\s._-]*0*(\d{1,3})(?!\d)/i)||b.match(/(?:^|[\s._\-#(])0*(\d{1,3})(?=$|[\s._\-)])/);return m?parseInt(m[1],10):null;}

const isProperName=n=>!(!n)&&safe(n).trim().length>=2&&!/^\d+$/.test(safe(n).trim())&&/[a-zA-Z]/.test(safe(n).trim());

// Clasificación de personajes: principal vs secundario
function classifyCharacters(charRows){
  if(!charRows.length)return charRows;
  const withLines=charRows.filter(c=>c.lines>0);
  if(!withLines.length)return charRows.map(c=>({...c,tipo:"secundario"}));
  
  // Ordenar por líneas descendente
  const sorted=[...withLines].sort((a,b)=>b.lines-a.lines);
  const maxLines=sorted[0].lines;
  const avgLines=sorted.reduce((s,c)=>s+c.lines,0)/sorted.length;
  
  // Umbral para principal: al menos 30% del máximo O más del promedio×1.2
  const threshold=Math.max(maxLines*0.20,avgLines*1.2,10);
  
  return charRows.map(c=>{
    if(c.lines>=threshold)return{...c,tipo:"principal"};
    return{...c,tipo:"secundario"};
  });
}

async function parseDesglose(file){
  const buf=await readFileBuffer(file);
  await new Promise(r=>setTimeout(r,0)); // yield to event loop so progress bar renders before sync XLSX.read
  const wb=XLSX.read(buf,{type:"array",cellText:true,cellDates:false,bookVBA:false});
  const dsn=wb.SheetNames.find(n=>n.toLowerCase().includes("desglose"))||wb.SheetNames[0];const sheet=wb.Sheets[dsn];
  const drows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:false});const charRows=[];
  for(let i=16;i<drows.length;i++){
    const name=safe(drows[i][0]).trim();
    if(!isRealName(name))continue;
    const ca=XLSX.utils.encode_cell({r:i,c:44});const cell=sheet[ca];let lines=0;
    if(cell){if(typeof cell.v==="number")lines=Math.round(cell.v);else if(cell.w)lines=parseInt(safe(cell.w).replace(/[^0-9]/g,""))||0;else if(cell.v!==undefined)lines=parseInt(safe(cell.v).replace(/[^0-9]/g,""))||0;}
    charRows.push({name,timecode:safe(drows[i][1]).trim(),lines});
  }
  // Clasificar personajes
  const classified=classifyCharacters(charRows);
  
  const castingMap={};const talentNames=[];const csn=wb.SheetNames.find(n=>n.toLowerCase().includes("casting"));
  if(csn){const crows=XLSX.utils.sheet_to_json(wb.Sheets[csn],{header:1,defval:"",raw:false});for(let i=12;i<crows.length;i++){const row=crows[i];const cn=pickName(row,[0,1]);const tn=pickName(row,[3,2,4]);if(tn){talentNames.push(tn);if(cn)castingMap[cn.toLowerCase()]=tn;}}}
  return{characters:classified,castingMap,talentNames};
}

async function parseTalentsXLSX(file){
  const buf=await readFileBuffer(file);const wb=XLSX.read(buf,{type:"array",cellText:true,cellDates:false,bookVBA:false});
  const sn=wb.SheetNames.find(n=>/casting|talento|actor|base|artista/i.test(n))||wb.SheetNames[0];

  return out;
}

/* Lista maestra de talentos desde un Excel administrativo: busca en las 6 primeras filas de cada hoja una
   cabecera «Nombre Artístico» / «Talento» / «Nombre» y devuelve los nombres de esa columna (sin duplicados),
   más si están marcados como menores de edad si existe la columna. Si no hay cabecera, usa parseTalentsXLSX. */
async function parseTalentMasterXLSX(file){
  const buf=await readFileBuffer(file);const wb=XLSX.read(buf,{type:"array",cellText:true,cellDates:false,bookVBA:false});
  const N=s=>safe(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
  const prefer=wb.SheetNames.filter(nm=>/final|talento|artist|base/i.test(nm)).concat(wb.SheetNames);
  for(const sn of prefer){
    const ws=wb.Sheets[sn];if(!ws||!ws["!ref"])continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
    for(let r=0;r<Math.min(rows.length,6);r++){
      const hdr=rows[r].map(N);
      let col=hdr.findIndex(h=>/NOMBRE ART|TALENTO\s*-|ARTISTIC/.test(h));
      if(col<0)col=hdr.findIndex(h=>h==="TALENTO"||h==="TALENTOS"||h==="NOMBRE ARTISTICO");
      if(col<0)continue;
      const minorCol=hdr.findIndex(h=>/MENOR/.test(h));
      const seen=new Set(),names=[];
      for(let i=r+1;i<rows.length;i++){
        const v=safe(rows[i][col]).trim();if(!isRealName(v))continue;
        const k=normN(v);if(seen.has(k))continue;seen.add(k);
        names.push({name:v.replace(/\s+/g," "),minor:minorCol>-1&&!!safe(rows[i][minorCol]).trim()});
      }
      if(names.length)return{sheet:sn,column:XLSX.utils.encode_col(col),names};
    }
  }
  const plain=await parseTalentsXLSX(file);
  return{sheet:wb.SheetNames[0],column:"?",names:plain.map(nm=>({name:nm,minor:false}))};
}

// Firma numérica de un nombre: "Guardia 2" → "2". Personajes con números
// distintos son SIEMPRE personajes diferentes (Guardia 1 ≠ Guardia 2) y
// nunca deben fusionarse por similitud — solo por igualdad exacta.
function numSig(s){return (normN(s).match(/\d+/g)||[]).join(",");}
function findMatch(name,chars,aliases){
  const thr=75;if(!name||!chars||!chars.length)return{match:null,score:0};
  const nn=normN(name);const exact=chars.find(c=>c&&normN(c.canonical_name)===nn);if(exact)return{match:exact,score:100};
  const exAl=(aliases||[]).find(a=>a&&normN(a.alias_name)===nn);if(exAl){const ec=chars.find(c=>c&&c.id===exAl.character_id);if(ec)return{match:ec,score:100};}
  const myNum=numSig(name);
  let best=null,bs=0;
  for(const c of chars){if(!c||!c.canonical_name)continue;if(numSig(c.canonical_name)!==myNum)continue;const s=simN(name,c.canonical_name);if(s>bs){bs=s;best=c;}}
  for(const al of(aliases||[])){if(!al||!al.alias_name)continue;if(numSig(al.alias_name)!==myNum)continue;const s=simN(name,al.alias_name);if(s>bs){bs=s;best=chars.find(c=>c&&c.id===al.character_id)||best;}}
  return bs>=thr?{match:best,score:bs}:{match:null,score:bs};
}

/* ══════════════════════════════════════════════════════════════
   PEGADO DE CASTING POR PROGRAMA
   - analyzeCastingSheet: localiza la hoja con la columna «NOMBRE DEL ACTOR» (o ACTOR)
     y devuelve las filas personaje/actor.
   - writeCellsIntoXlsx: escribe valores y rellenos directamente en el XML del .xlsx/.xlsm
     (vía JSZip) para conservar formato, macros, fórmulas y hojas intactas.
   ══════════════════════════════════════════════════════════════ */
const PC_NORM=s=>safe(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const PC_COL_LETTER=n=>{let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
const PC_COL_NUM=L=>{let n=0;for(const ch of L)n=n*26+(ch.charCodeAt(0)-64);return n;};
const PC_FILL_BLUE="FF6FA8DC";   // nombre similar (verificar)
const PC_FILL_YELLOW="FFFFFF00"; // personaje sin actor en el reparto
async function analyzeCastingSheet(file){
  const buffer=await readFileBuffer(file);
  await new Promise(r=>setTimeout(r,0));
  const wb=XLSX.read(buffer,{type:"array",cellText:true,cellDates:false,bookVBA:false});
  let target=null,headerRow=-1,colChar=-1,colActor=-1,colTel=-1;
  const prefer=wb.SheetNames.filter(nm=>PC_NORM(nm).startsWith("CASTING")).concat(wb.SheetNames);
  for(const name of prefer){
    const ws=wb.Sheets[name];if(!ws||!ws["!ref"])continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
    for(let r=0;r<Math.min(rows.length,40);r++){
      const row=rows[r].map(v=>PC_NORM(v));
      const ia=row.findIndex(v=>v.includes("NOMBRE DEL ACTOR")||v==="ACTOR"||v==="TALENTO");
      if(ia>-1){
        target=name;headerRow=r;colActor=ia;
        const ic=row.findIndex(v=>v==="LOCUTOR"||v==="PERSONAJE"||v==="PERSONAJES");
        colChar=ic>-1?ic:0;
        colTel=row.findIndex(v=>v.includes("TELEFONO")||v.includes("TELÉFONO"));
        break;
      }
    }
    if(target)break;
  }
  if(!target)throw new Error("No encontré una hoja con la columna «NOMBRE DEL ACTOR». Verifica que el archivo tenga la hoja CASTING.");
  // sheet_to_json indexa desde el origen del rango usado (p. ej. A10), no desde A1: convertir a filas/columnas absolutas
  const rng=XLSX.utils.decode_range(wb.Sheets[target]["!ref"]||"A1");const rowOff=rng.s.r,colOff=rng.s.c;
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[target],{header:1,raw:false,defval:""});
  const data=[],seen=new Set();
  for(let r=headerRow+1;r<rows.length;r++){
    const ch=safe(rows[r][colChar]).trim();if(!ch)continue;
    const nc=PC_NORM(ch);if(!nc||seen.has(nc))continue;
    if(OMIT_TALENTS.includes(nc.toLowerCase()))continue;
    seen.add(nc);
    data.push({row:r+1+rowOff,char:ch,fileActor:safe(rows[r][colActor]).trim()});
  }
  colChar+=colOff;colActor+=colOff;if(colTel>-1)colTel+=colOff;
  let title="";
  try{const wd=wb.Sheets[wb.SheetNames.find(nm=>/DESGLO[CS]E/i.test(nm))||""];if(wd&&wd["H9"]&&wd["H9"].v)title=safe(wd["H9"].v);}catch(e){}
  return{buffer,sheetName:target,colChar,colActor,colTel,data,title,epNum:extractEpNum(file.name)||extractEpNum(title)};
}
async function writeCellsIntoXlsx(buffer,sheetName,edits,isXlsm){
  if(typeof JSZip==="undefined")throw new Error("No se pudo cargar JSZip (¿sin conexión?)");
  const zip=await JSZip.loadAsync(buffer);
  const parser=new DOMParser(),ser=new XMLSerializer();
  const RELNS="http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const wbXml=parser.parseFromString(await zip.file("xl/workbook.xml").async("string"),"application/xml");
  let rid=null;
  wbXml.querySelectorAll("sheet").forEach(sh=>{if(sh.getAttribute("name")===sheetName)rid=sh.getAttribute("r:id")||sh.getAttributeNS(RELNS,"id");});
  if(!rid)throw new Error("No encontré la hoja "+sheetName+" en el workbook.");
  const relsXml=parser.parseFromString(await zip.file("xl/_rels/workbook.xml.rels").async("string"),"application/xml");
  let targetPath=null;
  relsXml.querySelectorAll("Relationship").forEach(rel=>{if(rel.getAttribute("Id")===rid)targetPath=rel.getAttribute("Target");});
  if(!targetPath)throw new Error("Sin relación para la hoja.");
  targetPath=targetPath.replace(/^\//,"");if(!targetPath.startsWith("xl/"))targetPath="xl/"+targetPath;
  const colors=[...new Set(edits.filter(e=>e.fillColor).map(e=>e.fillColor))];
  let stylesDoc=null,fillIds={},xfCache={},cellXfsEl=null,SNS=null;
  if(colors.length){
    stylesDoc=parser.parseFromString(await zip.file("xl/styles.xml").async("string"),"application/xml");
    SNS=stylesDoc.documentElement.namespaceURI;
    const fillsEl=stylesDoc.getElementsByTagNameNS(SNS,"fills")[0];
    let fillCount=fillsEl.getElementsByTagNameNS(SNS,"fill").length;
    for(const color of colors){
      const fill=stylesDoc.createElementNS(SNS,"fill");
      const pf=stylesDoc.createElementNS(SNS,"patternFill");pf.setAttribute("patternType","solid");

function useDebounce(v,d){const[val,setVal]=useState(v);useEffect(()=>{const t=setTimeout(()=>setVal(v),d||300);return()=>clearTimeout(t);},[v,d]);return val;}
function useToast(){const[toast,setToast]=useState(null);const tRef=useRef(null);const showToast=useCallback(msg=>{setToast(msg);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToast(null),3200);},[]);return{toast,showToast};}
function useNotifs(){
  const[notifs,setNotifs]=useState([]);
  const addNotif=useCallback((type,msg,nav)=>{
    setNotifs(p=>[{id:uid(),type,msg,nav:nav||null,read:false,ts:new Date().toISOString()},...p].slice(0,80));
    if(typeof Notification!=="undefined"&&Notification.permission==="granted"){
      try{new Notification("DublajeCast",{body:msg,tag:type});}catch(e){}
    }
  },[]);
  const markRead=useCallback(id=>setNotifs(p=>p.map(n=>n.id===id?{...n,read:true}:n)),[]);
  const markAll=useCallback(()=>setNotifs(p=>p.map(n=>({...n,read:true}))),[]);
  const unread=useMemo(()=>notifs.filter(n=>!n.read).length,[notifs]);
  return{notifs,addNotif,markRead,markAll,unread};
}
/* ── Alertas de cronograma: DUBCARDs próximas a vencer (24 h antes) ──
   Servicio en segundo plano del lado del cliente: corre al cargar la app,
   cada 30 minutos y con un disparo puntual a las 08:00. Notifica una sola
   vez por día y por capítulo a la campana de notificaciones (+ push del navegador). */
function useDubcardAlerts(data,addNotif){
  useEffect(()=>{
    const run=()=>{
      let log={};try{log=JSON.parse(localStorage.getItem("dc_dubcard_notified")||"{}");}catch(e){}
      const today=new Date();today.setHours(0,0,0,0);
      const todayKey=today.toISOString().slice(0,10);
      let changed=false;
      (data.produccion||[]).forEach(r=>{
        if(!r.fecha_dubcard||r.fase==="completado"||r.formato_dubcard==="No necesita DUBCARD")return;
        const d=new Date(r.fecha_dubcard+"T00:00:00");if(isNaN(d.getTime()))return;
        const diff=Math.round((d-today)/86400000);
        if(diff<0||diff>1)return; // dispara 24 h antes de la fecha pactada (y el día de entrega)
        const k=r.id+":"+todayKey;
        if(log[k])return;
        log[k]=1;changed=true;
        addNotif("dubcard_due","⏰ DUBCARD "+(diff===0?"vence HOY":"vence MAÑANA")+": "+r.programa+(r.capitulo?" — "+r.capitulo:"")+" · entrega "+r.fecha_dubcard+(r.cliente?" · "+r.cliente:""),{view:"produccion"});
      });
      Object.keys(log).forEach(k=>{if(!k.endsWith(todayKey)){delete log[k];changed=true;}});
      if(changed){try{localStorage.setItem("dc_dubcard_notified",JSON.stringify(log));}catch(e){}}
    };
    run();
    const iv=setInterval(run,30*60*1000);
    const now=new Date();const next8=new Date(now);next8.setHours(8,0,0,0);if(next8<=now)next8.setDate(next8.getDate()+1);
    const t8=setTimeout(run,next8-now);
    return()=>{clearInterval(iv);clearTimeout(t8);};
  },[data.produccion,addNotif]);
}

  const appsByEp=useMemo(()=>{const m={};data.appearances.forEach(a=>{if(!m[a.episode_id])m[a.episode_id]=[];m[a.episode_id].push(a);});return m;},[data.appearances]);
  const charEpsMap=useMemo(()=>{const m={};data.appearances.forEach(a=>{if(!m[a.character_id])m[a.character_id]=new Set();m[a.character_id].add(a.episode_id);});return m;},[data.appearances]);
  return{charMap,talentMap,epMap,seriesMap,epsBySeries,castByEpChar,appsByEp,charEpsMap};
}
/* ══ FEATURE: Detección de Conflictos de Cruce de Páginas (Overlapping) ══
   Un mismo talento con 2+ personajes en el mismo episodio que coinciden
   en la(s) misma(s) página(s) del guion → Conflict_Flag = True */
const CONF_DISMISS_KEY="dc_conflict_dismissed";
const getDismissedConflicts=()=>{try{return JSON.parse(localStorage.getItem(CONF_DISMISS_KEY)||"{}");}catch(e){return{};}};
const dismissConflict=k=>{try{const d=getDismissedConflicts();d[k]=1;localStorage.setItem(CONF_DISMISS_KEY,JSON.stringify(d));}catch(e){}};

// "3, 5-7" → Set{3,5,6,7}
function parsePages(str){
  const set=new Set();
  String(str||"").split(/[,;]+/).forEach(part=>{
    const p=part.trim();if(!p)return;
    const m=p.match(/^(\d+)\s*[-–]\s*(\d+)$/);
    if(m){const a=+m[1],b=+m[2];for(let i=Math.min(a,b);i<=Math.max(a,b);i++)set.add(i);}
    else if(/^\d+$/.test(p))set.add(+p);
  });
  return set;
}

// Algoritmo: agrupar personajes por Talento_ID+episodio → intersectar páginas
function findPageConflicts(castings,appearances,epIdSet){
  const groups={};
  (castings||[]).forEach(c=>{
    if(!c.talent_id)return;
    if(epIdSet&&!epIdSet.has(c.episode_id))return;
    const k=c.episode_id+"|"+c.talent_id;
    (groups[k]=groups[k]||[]).push(c);
  });
  const appByEpChar={};
  (appearances||[]).forEach(a=>{appByEpChar[a.episode_id+"|"+a.character_id]=a;});
  const conflicts=[];
  Object.values(groups).forEach(arr=>{
    if(arr.length<2)return; // un talento debe tener 2+ personajes en el episodio
    const withPages=arr.map(c=>({c,app:appByEpChar[c.episode_id+"|"+c.character_id],pages:parsePages((appByEpChar[c.episode_id+"|"+c.character_id]||{}).pages)})).filter(x=>x.pages.size>0);
    for(let i=0;i<withPages.length;i++)for(let j=i+1;j<withPages.length;j++){
      const inter=[...withPages[i].pages].filter(pg=>withPages[j].pages.has(pg)).sort((a,b)=>a-b);
      if(inter.length){
        conflicts.push({
          key:arr[0].episode_id+"|"+arr[0].talent_id+"|"+[withPages[i].c.character_id,withPages[j].c.character_id].sort().join("-")+"|"+inter.join(","),
          episode_id:arr[0].episode_id,talent_id:arr[0].talent_id,
          charA:withPages[i].c.character_id,charB:withPages[j].c.character_id,
          pages:inter
        });
      }
    }
  });
  return conflicts;
}

/* Trigger automático: cada vez que cambian castings o páginas del desglose,
   se valida y se notifica a la campana (roles administrativos) con dedup. */
function usePageConflictAlerts(data,addNotif){
  useEffect(()=>{
    const t=setTimeout(()=>{
      try{
        const conflicts=findPageConflicts(data.castings,data.appearances,null);
        if(!conflicts.length)return;
        const notified=JSON.parse(localStorage.getItem("dc_conflict_notified")||"{}");
        const dismissed=getDismissedConflicts();
        const chM={};(data.characters||[]).forEach(c=>chM[c.id]=c);
        const tM={};(data.talents||[]).forEach(c=>tM[c.id]=c);
        const eM={};(data.episodes||[]).forEach(c=>eM[c.id]=c);
        let changed=false;
        conflicts.forEach(cf=>{
          if(notified[cf.key]||dismissed[cf.key])return;
          notified[cf.key]=1;changed=true;
          const tal=tM[cf.talent_id],a=chM[cf.charA],b=chM[cf.charB],ep=eM[cf.episode_id];
          addNotif("page_conflict","⚠️ Conflicto de Continuidad: "+(tal?tal.name:"Talento")+" está asignado a "+(a?a.canonical_name:"?")+" y "+(b?b.canonical_name:"?")+" en la página "+cf.pages.join(", ")+(ep?" (Ep. "+ep.episode_number+")":""),{view:"reparto"});
        });
        if(changed)localStorage.setItem("dc_conflict_notified",JSON.stringify(notified));
      }catch(e){}
    },800);
    return()=>clearTimeout(t);
  },[data.castings,data.appearances,addNotif]);
}

function useCasting(data,derived,dispatch,addNotif){
  const{epsBySeries,talentMap,charMap,epMap,seriesMap,charEpsMap}=derived;
  const getTalentLoad=useCallback(tid=>{const seen={};data.castings.filter(c=>c.talent_id===tid).forEach(c=>{const ep=epMap[c.episode_id];if(ep)seen[ep.series_id]=true;});return Object.keys(seen).length;},[data.castings,epMap]);
  const getPrevTalent=useCallback((charId,sid)=>{const ids=new Set((epsBySeries[sid]||[]).map(e=>e.id));const hist=data.castings.filter(c=>c.character_id===charId&&ids.has(c.episode_id));return hist.length?(talentMap[hist[hist.length-1].talent_id]||null):null;},[data.castings,epsBySeries,talentMap]);
  const isRecurring=useCallback((charId,sid,curEpId)=>{const ids=new Set((epsBySeries[sid]||[]).filter(e=>e.id!==curEpId).map(e=>e.id));const ce=charEpsMap[charId];if(!ce)return false;for(const eid of ce){if(ids.has(eid))return true;}return false;},[epsBySeries,charEpsMap]);
  const setCastingsNotif=useCallback(updater=>{
    const next=typeof updater==="function"?updater(data.castings):updater;
    next.forEach(nc=>{const old=data.castings.find(c=>c.id===nc.id);if(!old||old.talent_id===nc.talent_id)return;const ep=epMap[nc.episode_id];const sr=ep?seriesMap[ep.series_id]:null;const ch=charMap[nc.character_id];const prevT=getPrevTalent(nc.character_id,sr?sr.id:0);if(!prevT||prevT.id===nc.talent_id)return;const newTal=talentMap[nc.talent_id];addNotif("talent_change","Cambio: "+safe(ch&&ch.canonical_name)+" → "+safe(newTal&&newTal.name)+(sr?" en "+sr.name:""),{view:"casting",seriesId:sr?sr.id:null});});
    dispatch({type:"CASTINGS/SET",payload:next});
  },[data.castings,epMap,seriesMap,charMap,talentMap,getPrevTalent,addNotif,dispatch]);
  return{getTalentLoad,getPrevTalent,isRecurring,setCastingsNotif};
}

function usePersist(data,dispatch,showToast){
  const loaded=useRef(false);
  const skipNext=useRef(false);
  const[saveStatus,setSaveStatus]=useState("idle");
  useEffect(()=>{
    try{const saved=lsGet();if(saved){const h={};Object.keys(initialData).forEach(k=>{if(saved[k])h[k]=saved[k];});if(Object.keys(h).length)dispatch({type:"HYDRATE",payload:h});}}catch(e){console.warn("load error",e);}
    loaded.current=true;
    // Otra pestaña del mismo usuario guardó: recargar su estado para no pisarlo con uno viejo
    const onStorage=e=>{if(e.key===ACTIVE_DATA_KEY&&e.newValue){try{const saved=lsGet();if(saved){const h={};Object.keys(initialData).forEach(k=>{if(saved[k])h[k]=saved[k];});if(Object.keys(h).length){skipNext.current=true;dispatch({type:"HYDRATE",payload:h});}}}catch(_){}}};
    window.addEventListener("storage",onStorage);
    return()=>window.removeEventListener("storage",onStorage);
  },[]);
  useEffect(()=>{
    if(!loaded.current)return;
    if(skipNext.current){skipNext.current=false;return;} // hidratación desde otra pestaña: no re-guardar
    setSaveStatus("saving");
    const t=setTimeout(()=>{try{lsSet(data);setSaveStatus("saved");setTimeout(()=>setSaveStatus("idle"),2000);}catch(e){setSaveStatus("error");if(showToast)showToast(e.message||"Error al guardar en almacenamiento local","error");}},600);
    return()=>clearTimeout(t);
  },[data]);
  return{saveStatus};
}

function useStore(){
  const[data,dispatch]=useReducer(dataReducer,initialData,init=>({...init,talents:(init.talents||[]).map(UPT)}));

  useDubcardAlerts(data,addNotif);
  usePageConflictAlerts(data,addNotif);

  const roleGuardedDispatch=useCallback(a=>{const ss=getSession();if(ss&&ss.role==="lector")return;dispatch(a);},[dispatch]);
  useExternalDateSync(data,roleGuardedDispatch,showToast);

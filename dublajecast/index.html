  const[view,setView]=useState("dashboard");
  const[selStudio,setSelStudio]=useState(null);const[selSeriesId,setSelSeriesId]=useState(null);
  const[selEpId,setSelEpId]=useState(null);const[selTalentId,setSelTalentId]=useState(null);
  const[modal,setModal]=useState(null);const[mName,setMName]=useState("");const[mType,setMType]=useState("serie");
  const[mStudio,setMStudio]=useState(1);const[mRole,setMRole]=useState("Director");
  const[delProgId,setDelProgId]=useState(null);const[delEpId,setDelEpId]=useState(null);
  const[editProgId,setEditProgId]=useState(null);const[editEpId,setEditEpId]=useState(null);
  const[queue,setQueue]=useState([]);
  const[pendingTalents,setPendingTalents]=useState([]);
  const[fuzzyQueue,setFuzzyQueue]=useState([]);
  const[uploadProgress,setUploadProgress]=useState(null);
  const[metaGate,setMetaGate]=useState(null); // trigger on-upload: fechas obligatorias de producción
  // Menú lateral off-canvas (móvil) + gestos de deslizamiento
  const[sidebarOpen,setSidebarOpen]=useState(false);
  useEffect(()=>{setSidebarOpen(false);},[view]); // navegar cierra el menú
  useEffect(()=>{
    let startX=null,startY=null,fromEdge=false;
    const ts=e=>{const t=e.touches[0];startX=t.clientX;startY=t.clientY;fromEdge=t.clientX<28;};
    const te=e=>{
      if(startX==null)return;
      const t=e.changedTouches[0];const dx=t.clientX-startX;const dy=Math.abs(t.clientY-startY);
      if(dy<70){
        if(fromEdge&&dx>60)setSidebarOpen(true);          // swipe desde el borde izquierdo → abrir
        else if(dx<-60&&startX<300)setSidebarOpen(false); // swipe a la izquierda sobre el menú → cerrar
      }
      startX=null;
    };
    document.addEventListener("touchstart",ts,{passive:true});
    document.addEventListener("touchend",te,{passive:true});
    return()=>{document.removeEventListener("touchstart",ts);document.removeEventListener("touchend",te);};
  },[]);
  // Estado de conexión (PWA): indicador "Sin red"
  const[isOnline,setIsOnline]=useState(typeof navigator!=="undefined"?navigator.onLine!==false:true);
  useEffect(()=>{
    const on=()=>setIsOnline(true),off=()=>setIsOnline(false);
    window.addEventListener("online",on);window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);
  // Control de acceso concurrente (multi-pestaña): aviso si otra sesión está editando
  const[otherTabActive,setOtherTabActive]=useState(false);
  useEffect(()=>{
    const tabId=randomHex(8);const LOCK="dc_tab_lock";
    const beat=()=>{
      let lock=null;try{lock=JSON.parse(localStorage.getItem(LOCK)||"null");}catch(e){}
      const stale=!lock||(Date.now()-lock.ts>15000);
      if(stale||lock.id===tabId){try{localStorage.setItem(LOCK,JSON.stringify({id:tabId,ts:Date.now()}));}catch(e){}setOtherTabActive(false);}
      else setOtherTabActive(true);
    };
    beat();const iv=setInterval(beat,5000);
    const rel=()=>{try{const lock=JSON.parse(localStorage.getItem(LOCK)||"null");if(lock&&lock.id===tabId)localStorage.removeItem(LOCK);}catch(e){}};
    window.addEventListener("beforeunload",rel);
    return()=>{clearInterval(iv);window.removeEventListener("beforeunload",rel);rel();};
  },[]);
  const[theme,setTheme]=useState(()=>{const t=localStorage.getItem("dc_theme")||"dark";document.documentElement.setAttribute("data-theme",t);return t;});
  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);localStorage.setItem("dc_theme",theme);},[theme]);
  useEffect(()=>{if(typeof Notification!=="undefined"&&Notification.permission==="default")Notification.requestPermission();},[]);
  // ── Historial de navegación: botón "Atrás" en la app + botón atrás del navegador/Android ──
  const navStateRef=useRef(null);navStateRef.current={view,selSeriesId,selStudio,selEpId};
  const histRef=useRef([]);
  const navTo=useCallback(v=>{
    const cur=navStateRef.current;
    if(cur&&cur.view!==v){
      histRef.current.push({...cur});if(histRef.current.length>50)histRef.current.shift();
      try{history.pushState({dc:histRef.current.length},"");}catch(e){}
    }
    setView(v);
  },[]);
  const internalBack=useCallback(()=>{
    const prev=histRef.current.pop();
    if(prev){setSelSeriesId(prev.selSeriesId);setSelStudio(prev.selStudio);setSelEpId(prev.selEpId);setView(prev.view);return;}
    // Sin historial (p. ej. tras recargar): volver al nivel superior lógico
    const cur=navStateRef.current;
    if(cur&&["casting","reparto"].includes(cur.view)&&cur.selSeriesId)setView("series");
    else if(cur&&cur.view==="series")setView("allprograms");
    else setView("dashboard");
  },[]);
  const goBack=useCallback(()=>{
    // Si hay una entrada nuestra en el historial del navegador, retroceder por él (dispara popstate → internalBack)
    if(history.state&&history.state.dc>0){try{history.back();return;}catch(e){}}
    internalBack();
  },[internalBack]);
  useEffect(()=>{
    try{if(!history.state||typeof history.state.dc!=="number")history.replaceState({dc:0},"");}catch(e){}
    const onPop=()=>{if(navStateRef.current&&navStateRef.current.view!=="dashboard")internalBack();};
    window.addEventListener("popstate",onPop);
    return()=>window.removeEventListener("popstate",onPop);
  },[internalBack]);
  const canGoBack=view!=="dashboard";
  const curSeries=useMemo(()=>derived.seriesMap[selSeriesId]||null,[derived.seriesMap,selSeriesId]);
  const serEps=useMemo(()=>derived.epsBySeries[selSeriesId]||[],[derived.epsBySeries,selSeriesId]);
  return{data,dispatch,derived,casting,toast,showToast,notifs,addNotif,markRead,markAll,unread,saveStatus,view,navTo,goBack,canGoBack,selStudio,setSelStudio,selSeriesId,setSelSeriesId,selEpId,setSelEpId,selTalentId,setSelTalentId,modal,setModal,mName,setMName,mType,setMType,mStudio,setMStudio,mRole,setMRole,delProgId,setDelProgId,delEpId,setDelEpId,editProgId,setEditProgId,editEpId,setEditEpId,queue,setQueue,pendingTalents,setPendingTalents,fuzzyQueue,setFuzzyQueue,uploadProgress,setUploadProgress,metaGate,setMetaGate,otherTabActive,sidebarOpen,setSidebarOpen,isOnline,curSeries,serEps,theme,setTheme};
}

/* ── Botón interno de instalación PWA ───────────────────────── */
function useInstallPrompt(){
  const[canInstall,setCanInstall]=useState(!!window.__dcInstallPrompt);
  const[installed,setInstalled]=useState(typeof window!=="undefined"&&window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);
  useEffect(()=>{
    const on=()=>setCanInstall(true);
    const done=()=>{setCanInstall(false);setInstalled(true);};
    window.addEventListener("dc-installable",on);
    window.addEventListener("dc-installed",done);
    return()=>{window.removeEventListener("dc-installable",on);window.removeEventListener("dc-installed",done);};
  },[]);
  const install=useCallback(async()=>{
    const p=window.__dcInstallPrompt;
    if(p){try{p.prompt();const{outcome}=await p.userChoice;if(outcome==="accepted"){window.__dcInstallPrompt=null;setCanInstall(false);}}catch(e){}}
    else{
      const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
      alert(isIOS
        ?"En iPhone/iPad: toca el botón Compartir de Safari y elige \"Agregar a pantalla de inicio\"."
        :"Para instalar: abre el sitio en Chrome bajo HTTPS, espera unos segundos y usa el menú ⋮ → \"Instalar app\". Si no aparece, verifica que subiste la CARPETA completa (manifest.webmanifest, sw.js e icons) y no solo el index.html.");
    }
  },[]);
  return{canInstall,installed,install};
}
function InstallButton({style,compact}){
  const{canInstall,installed,install}=useInstallPrompt();
  if(installed)return null;
  return(
    <button onClick={install} className="dc-nav" style={{width:"100%",background:canInstall?"linear-gradient(135deg,rgba(0,255,163,0.12),rgba(167,139,250,0.10))":"rgba(0,255,163,0.04)",border:"1px solid rgba(0,255,163,0.28)",borderRadius:8,padding:"9px 0",cursor:"pointer",color:"var(--accent-emerald)",fontSize:11,fontWeight:700,letterSpacing:"0.04em",marginBottom:7,...style}}>
      📲 Instalar app{canInstall?"":" (ayuda)"}
    </button>
  );
}

/* Hook: sincroniza fechas externas automáticamente en el intervalo configurado */
function useExternalDateSync(data,dispatch,showToast){
  const cfgRef=useRef(getApiCfg());
  const dataRef=useRef(data);dataRef.current=data;
  const[lastSync,setLastSync]=useState(null);
  const runSync=useCallback(async(verbose)=>{
    const cfg=getApiCfg();cfgRef.current=cfg;
    if(!cfg||!cfg.enabled||!cfg.url){if(verbose)showToast("Configura primero la API externa");return{ok:false};}
    try{
      const rows=await fetchExternalRows(cfg);
      const updates=computeExternalUpdates(rows,dataRef.current.produccion);
      if(updates.length){
        dispatch({type:"PRODUCCION/APPLY_DATES",payload:updates});
        showToast("📅 "+updates.length+" fecha(s) actualizada(s) desde la API externa");
      }else if(verbose)showToast("✓ Sin cambios: las fechas ya están al día ("+rows.length+" registros leídos)");
      const cfg2={...cfg,lastSync:Date.now(),lastResult:updates.length+" actualizadas / "+rows.length+" leídas"};
      try{localStorage.setItem(API_CFG_KEY,JSON.stringify(cfg2));}catch(e){}setLastSync(Date.now());
      return{ok:true,updates:updates.length,read:rows.length};
    }catch(e){
      const em=(e&&e.message)||String(e);const msg=/Failed to fetch|NetworkError|CORS/i.test(em)?"No se pudo conectar (¿la API permite CORS? ¿URL correcta?)":em;
      if(verbose)showToast("⚠ API externa: "+msg);
      const cfg2={...cfg,lastSync:Date.now(),lastResult:"error: "+msg};try{localStorage.setItem(API_CFG_KEY,JSON.stringify(cfg2));}catch(e){}
      return{ok:false,error:msg};
    }
  },[dispatch,showToast]);
  // Exponer para botón manual
  useEffect(()=>{window.__dcSyncDates=()=>runSync(true);return()=>{window.__dcSyncDates=null;};},[runSync]);
  // Poll automático (se reinicia al guardar la configuración)
  const[cfgVer,setCfgVer]=useState(0);
  useEffect(()=>{const h=()=>setCfgVer(v=>v+1);window.addEventListener("dc-apicfg",h);return()=>window.removeEventListener("dc-apicfg",h);},[]);
  useEffect(()=>{
    const cfg=getApiCfg();
    if(!cfg||!cfg.enabled||!cfg.url)return;
    const mins=Math.max(5,Number(cfg.intervalMin)||60);
    // primer sync a los 5s de abrir, luego cada intervalo
    const t0=setTimeout(()=>runSync(false),5000);
    const iv=setInterval(()=>runSync(false),mins*60*1000);
    return()=>{clearTimeout(t0);clearInterval(iv);};
  },[runSync,cfgVer]);
  return{runSync,lastSync};
}

  const[fD,setFD]=useState(cfg.fieldDubcard||"fecha_dubcard");

        <button onClick={save} className="dc-btn" style={btnP({flex:1,padding:"10px 0"})}>Guardar</button>

function UsersAdminModal({currentUser,showToast,onClose}){
  const[users,setUsers]=useState(loadUsers());
  const[nUser,setNUser]=useState("");const[nPass,setNPass]=useState("");const[nRole,setNRole]=useState("editor");
  const[busy,setBusy]=useState(false);
  const[resetId,setResetId]=useState(null);const[resetPass,setResetPass]=useState("");
  const refresh=()=>setUsers(loadUsers());
  const addUser=async()=>{
    const un=nUser.trim();
    if(un.length<3){showToast("⚠ Usuario mínimo 3 caracteres");return;}
    if(nPass.length<6){showToast("⚠ Contraseña mínimo 6 caracteres");return;}
    if(users.some(u=>u.username.toLowerCase()===un.toLowerCase())){showToast("⚠ El usuario ya existe");return;}
    setBusy(true);
    try{
      const salt=randomHex(16);
      const hash=await hashPassword(nPass,salt,PBKDF2_ITER);
      const newId=Math.max(Date.now(),Math.max(0,...users.map(u=>Number(u.id)||0))+1);
      const next=[...users,{id:newId,username:un,role:nRole,salt,iter:PBKDF2_ITER,hash,created:new Date().toISOString()}];
      if(!saveUsers(next))throw new Error("No se pudo guardar (almacenamiento lleno)");
      refresh();setNUser("");setNPass("");setNRole("editor");
      showToast("✓ Usuario creado: "+un+" ("+(ROLE_LABELS[nRole]||nRole)+")");
    }catch(e){showToast("⚠ No se pudo crear el usuario: "+safe(e&&e.message||e));}finally{setBusy(false);}
  };
  const delUser=(u)=>{
    if(u.id===currentUser.userId){showToast("⚠ No puedes eliminar tu propia cuenta");return;}
    if(u.role==="admin"&&users.filter(x=>x.role==="admin").length<=1){showToast("⚠ Debe existir al menos un administrador");return;}
    if(!window.confirm("¿Eliminar al usuario "+u.username+"?"))return;
    saveUsers(users.filter(x=>x.id!==u.id));refresh();
    try{localStorage.removeItem(LS_KEY_BASE+"_u"+u.id);}catch(e){} // no dejar datos huérfanos que otro usuario pueda heredar
    showToast("✓ Usuario eliminado: "+u.username);
  };
  const doReset=async(u)=>{
    if(resetPass.length<6){showToast("⚠ Contraseña mínimo 6 caracteres");return;}
    setBusy(true);
    try{
      const salt=randomHex(16);
      const hash=await hashPassword(resetPass,salt,PBKDF2_ITER);
      saveUsers(users.map(x=>x.id===u.id?{...x,salt,iter:PBKDF2_ITER,hash}:x));refresh();
      setResetId(null);setResetPass("");
      showToast("✓ Contraseña actualizada: "+u.username);
    }finally{setBusy(false);}
  };
  return(
    <ModalShell title="👥 Gestión de Usuarios" width={560} onClose={onClose}>
      <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:14,lineHeight:1.6}}>Contraseñas almacenadas con hash <b style={{color:"var(--accent-cyan)"}}>PBKDF2-SHA256</b> (salt aleatorio · {PBKDF2_ITER.toLocaleString()} iteraciones). Roles: <b>Administrador</b> gestiona usuarios · <b>Editor</b> edita datos · <b>Solo lectura</b> consulta sin modificar.</div>
      <div style={{maxHeight:240,overflowY:"auto",marginBottom:16,border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)"}}>
        {users.map(u=>(
          <div key={u.id} style={{padding:"10px 14px",borderBottom:"1px solid var(--border-subtle)",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div style={{width:28,height:28,borderRadius:"50%",background:u.role==="admin"?"linear-gradient(135deg,#C4B5FD,#FF00C8)":u.role==="lector"?"rgba(255,204,0,0.25)":"linear-gradient(135deg,#8B5CF6,#4D9FFF)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,color:"#fff",flexShrink:0}}>{u.username.slice(0,1).toUpperCase()}</div>
            <div style={{flex:1,minWidth:120}}>
              <div style={{fontWeight:700,fontSize:12,color:"var(--text-primary)"}}>{u.username}{u.id===currentUser.userId&&<span style={{fontSize:9,color:"var(--accent-cyan)",marginLeft:6}}>(tú)</span>}</div>
              <div style={{fontSize:9,color:"var(--text-muted)"}}>{ROLE_LABELS[u.role]||u.role} · creado {String(u.created||"").slice(0,10)}</div>
            </div>
            {resetId===u.id
              ?<div style={{display:"flex",gap:6,alignItems:"center"}}><input type="password" autoFocus value={resetPass} onChange={e=>setResetPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doReset(u)} placeholder="Nueva contraseña" style={{...SIPT,width:150,fontSize:11,padding:"6px 10px"}}/><button onClick={()=>doReset(u)} disabled={busy} className="dc-btn" style={btnS()}>✓</button><button onClick={()=>{setResetId(null);setResetPass("");}} className="dc-btn" style={btnG({padding:"6px 10px",fontSize:11})}>✕</button></div>
              :<div style={{display:"flex",gap:6}}><button onClick={()=>{setResetId(u.id);setResetPass("");}} className="dc-btn" style={btnS()} title="Restablecer contraseña">🔑</button><button onClick={()=>delUser(u)} className="dc-btn" style={btnD()} title="Eliminar usuario">🗑</button></div>}
          </div>
        ))}
      </div>
      <div style={{fontSize:10,fontWeight:700,color:"var(--text-secondary)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>+ Nuevo usuario</div>
      <div style={{display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:120}}><label style={SLBL}>Usuario</label><input value={nUser} onChange={e=>setNUser(e.target.value)} placeholder="Nombre de usuario" style={{...SIPT,fontSize:12}}/></div>
        <div style={{flex:1,minWidth:120}}><label style={SLBL}>Contraseña</label><input type="password" value={nPass} onChange={e=>setNPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addUser()} placeholder="Mín. 6 caracteres" style={{...SIPT,fontSize:12}}/></div>
        <div style={{flex:"0 0 130px"}}><label style={SLBL}>Rol</label><select value={nRole} onChange={e=>setNRole(e.target.value)} style={{...SIPT,fontSize:12}}><option value="admin">Administrador</option><option value="editor">Editor</option><option value="lector">Solo lectura</option></select></div>
        <button onClick={addUser} disabled={busy} className="dc-btn" style={btnP({padding:"10px 18px",opacity:busy?0.6:1})}>{busy?<span className="dc-spin">⟳</span>:"Crear"}</button>
      </div>
    </ModalShell>
  );
}

/* ── Trigger on-upload: metadatos obligatorios de producción ── */
function MetadataGateModal(){
  const s=useApp();
  const rows=useMemo(()=>{
    if(!s.metaGate||!s.metaGate.length)return[];
    return(s.data.produccion||[])
      .filter(r=>s.metaGate.some(k=>normN(r.programa)===normN(k.programa)&&r.capitulo===k.capitulo))
      .map(r=>({...r,_req:r.formato_dubcard!=="No necesita DUBCARD"}))
      .filter(r=>!r.fecha_miami||(r._req&&!r.fecha_dubcard));
  },[s.metaGate,s.data.produccion,s.data.series]);
  const[drafts,setDrafts]=useState({});
  useEffect(()=>{const d={};rows.forEach(r=>{d[r.id]={fecha_miami:r.fecha_miami||"",fecha_dubcard:r.fecha_dubcard||""};});setDrafts(d);},[s.metaGate]);
  useEffect(()=>{if(s.metaGate&&s.metaGate.length&&rows.length===0)s.setMetaGate(null);},[s.metaGate,rows.length]);
  if(!s.metaGate||!rows.length)return null;
  const complete=rows.every(r=>drafts[r.id]&&drafts[r.id].fecha_miami&&(!r._req||drafts[r.id].fecha_dubcard));
  const setF=(id,k,v)=>setDrafts(p=>({...p,[id]:{...(p[id]||{}),[k]:v}}));
  const save=()=>{
    if(!complete)return;
    rows.forEach(r=>{
      const{_req,...base}=r;
      s.dispatch({type:"PRODUCCION/UPDATE",payload:{...base,fecha_miami:drafts[r.id].fecha_miami,fecha_dubcard:_req?drafts[r.id].fecha_dubcard:"",formato_dubcard:_req?base.formato_dubcard:"No necesita DUBCARD"}});
    });
    s.setMetaGate(null);
    s.showToast("✓ Fechas de producción registradas ("+rows.length+")");
  };
  const blockClose=()=>s.showToast("⚠ Define Fecha de Entrega y Fecha DUBCARD para continuar");
  return(
    <ModalShell title="📅 Metadatos de producción requeridos" width={560} onClose={blockClose}>
      <div style={{fontSize:12,lineHeight:1.6,color:"var(--text-secondary)",marginBottom:14}}>
        Se registró la carga de <b style={{color:"var(--text-primary)"}}>{rows.length}</b> proyecto{rows.length!==1?"s":""}. Antes de continuar es <b style={{color:"var(--accent-amber)"}}>obligatorio</b> definir la <b>Fecha de Entrega (Miami)</b>{rows.some(r=>r._req)?<span> y la <b>Fecha DUBCARD</b></span>:null} de cada uno; quedarán vinculadas automáticamente al registro de Producción. Los proyectos exentos de DUBCARD solo requieren fecha de entrega.
      </div>
      <div style={{maxHeight:320,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
        {rows.map(r=>{const d=drafts[r.id]||{fecha_miami:"",fecha_dubcard:""};const ok=d.fecha_miami&&(!r._req||d.fecha_dubcard);return(
          <div key={r.id} style={{...CARD_S,padding:"12px 14px",border:"1px solid "+(ok?"rgba(52,211,153,0.35)":"rgba(251,191,36,0.35)")}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{fontSize:13}}>{ok?"✅":"⏳"}</span>
              <span style={{fontWeight:700,fontSize:12,color:"var(--text-primary)"}}>{r.programa}</span>
              <Pill c="var(--accent-indigo)" txt={r.capitulo||"—"}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><label style={SLBL}>Fecha de Entrega (Miami) *</label><input type="date" value={d.fecha_miami} onChange={e=>setF(r.id,"fecha_miami",e.target.value)} style={{...SIPT,fontSize:12,borderColor:d.fecha_miami?"var(--border-default)":"rgba(251,191,36,0.5)"}}/></div>
              {r._req
                ?<div><label style={SLBL}>Fecha DUBCARD *</label><input type="date" value={d.fecha_dubcard} onChange={e=>setF(r.id,"fecha_dubcard",e.target.value)} style={{...SIPT,fontSize:12,borderColor:d.fecha_dubcard?"var(--border-default)":"rgba(251,191,36,0.5)"}}/></div>
                :<div><label style={SLBL}>Fecha DUBCARD</label><div style={{...SIPT,fontSize:11,display:"flex",alignItems:"center",gap:6,background:"rgba(255,140,66,0.06)",border:"1px dashed rgba(255,140,66,0.4)",color:"var(--accent-orange)",fontWeight:600}}>⛔ Exento de DUBCARD</div></div>}
            </div>
          </div>
        );})}
      </div>
      <button onClick={save} disabled={!complete} className="dc-btn" style={btnP({width:"100%",padding:"12px 0",opacity:complete?1:0.45,cursor:complete?"pointer":"not-allowed",background:complete?"linear-gradient(135deg,#059669,#34d399)":undefined})}>
        {complete?"✓ Guardar y continuar":"Completa todas las fechas para continuar"}
      </button>
    </ModalShell>
  );
}

/* ── EDITABLE CELL (post-load inline editing) ──────────────── */
function EditableCell({value,onSave,type,minW}){
  const[editing,setEditing]=useState(false);
  const[val,setVal]=useState(value);
  const done=useRef(false); // evita que el blur posterior a Enter/Escape guarde o duplique
  useEffect(()=>{if(!editing)setVal(value);},[value,editing]);
  if(!editing)return(
    <div onDoubleClick={()=>{done.current=false;setEditing(true);setVal(value);}} title="Doble clic para editar"
      style={{cursor:"text",minWidth:minW||"auto",color:"inherit",lineHeight:1.4}}>
      {value!==null&&value!==undefined&&value!==""?value:<span style={{color:"var(--text-muted)",fontSize:10}}>—</span>}
    </div>
  );
  const finish=(save)=>{if(done.current)return;done.current=true;if(save)onSave(val);setEditing(false);};
  return(
    <input autoFocus type={type||"text"} value={val}
      onChange={e=>setVal(e.target.value)}
      onBlur={()=>finish(true)}
      onKeyDown={e=>{if(e.key==="Enter")finish(true);if(e.key==="Escape"){setVal(value);finish(false);}}}
      style={{padding:"3px 8px",border:"1px solid var(--accent-indigo)",borderRadius:6,fontSize:11,width:type==="number"?60:150,background:"var(--bg-input)",color:"var(--text-primary)",outline:"none"}}
    />
  );
}

/* ── TALENT CELL (inline casting selector) ─────────────────── */
function TalentCell({charId,epId,cast,talents,dispatch,setCastingsNotif,showToast}){
  const[query,setQuery]=useState("");const[open,setOpen]=useState(false);
  const tid=cast?cast.talent_id:null;
  const current=useMemo(()=>tid?talents.find(t=>t.id===tid):null,[tid,talents]);
  const sorted=useMemo(()=>talents.slice().sort((a,b)=>a.name.localeCompare(b.name)),[talents]);
  const filtered=useMemo(()=>query.trim()?sorted.filter(t=>normN(t.name).includes(normN(query))):sorted,[query,sorted]);
  const exact=useMemo(()=>query.trim()?filtered.find(t=>normN(t.name)===normN(query.trim())):null,[query,filtered]);
  const updateCast=useCallback(newTid=>{if(cast){if(newTid>0)setCastingsNotif(p=>p.map(c=>c.id===cast.id?{...c,talent_id:newTid}:c));else setCastingsNotif(p=>p.filter(c=>c.id!==cast.id));}else if(newTid>0){setCastingsNotif(p=>p.concat([{id:uid(),character_id:charId,talent_id:newTid,episode_id:epId}]));}setOpen(false);setQuery("");},[cast,charId,epId,setCastingsNotif]);
  const isNewName=!!(query.trim()&&!exact);
  const addNew=useCallback(()=>{const nm=query.trim();if(!nm)return;const ex=talents.find(t=>normN(t.name)===normN(nm));if(ex){updateCast(ex.id);return;}if(!window.confirm('"'+nm+'" no está registrado en la base de datos.\n¿Agregar como nuevo talento?'))return;const nid=uid();dispatch({type:"TALENTS/ADD",payload:{id:nid,name:nm,genero:"",edad_aparente:"",tono_de_voz:""}});updateCast(nid);showToast("✓ Talento agregado: "+nm);},[query,talents,updateCast,dispatch,showToast]);
  const displayVal=open?query:(current?current.name:"");
  return(
    <div style={{position:"relative"}}>
      <input value={displayVal} onChange={e=>{setQuery(e.target.value);setOpen(true);}} onFocus={()=>{setQuery("");setOpen(true);}} onBlur={()=>setTimeout(()=>setOpen(false),180)} onKeyDown={e=>{if(e.key==="Enter")addNew();if(e.key==="Escape")setOpen(false);}} placeholder="Asignar..."
        style={{padding:"5px 10px",border:"1px solid "+(isNewName?"rgba(251,191,36,0.6)":tid?"rgba(129,140,248,0.4)":"var(--border-default)"),borderRadius:8,fontSize:11,width:170,background:isNewName?"rgba(251,191,36,0.06)":tid?"rgba(129,140,248,0.08)":"var(--bg-input)",color:"var(--text-primary)",outline:"none"}}/>
      {open&&(
        <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,zIndex:300,background:"var(--bg-elevated)",border:"1px solid var(--border-default)",borderRadius:"var(--radius-md)",boxShadow:"var(--shadow-lg)",minWidth:200,maxHeight:220,overflowY:"auto"}}>
          {tid&&<div onMouseDown={()=>updateCast(0)} style={{padding:"8px 12px",cursor:"pointer",fontSize:11,color:"#f87171",borderBottom:"1px solid var(--border-subtle)",fontWeight:600}}>× Quitar talento</div>}
          {filtered.map(t=><div key={t.id} onMouseDown={()=>updateCast(t.id)} className="dc-row" style={{padding:"8px 12px",cursor:"pointer",fontSize:11,background:t.id===tid?"rgba(129,140,248,0.1)":"transparent",fontWeight:t.id===tid?600:400,color:"var(--text-primary)"}}>{t.name}{t.genero&&<span style={{marginLeft:6,fontSize:9,color:"var(--text-muted)"}}>{t.genero==="masculino"?"♂":t.genero==="femenino"?"♀":"⚧"}</span>}</div>)}
          {query.trim()&&!exact&&<div onMouseDown={addNew} style={{padding:"8px 12px",cursor:"pointer",fontSize:11,color:"var(--accent-amber)",fontWeight:600,borderTop:"1px solid var(--border-subtle)",background:"rgba(251,191,36,0.04)"}}>+ Agregar "{query.trim()}" <span style={{fontSize:9,opacity:0.7}}>(nuevo — requiere confirmación)</span></div>}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   DASHBOARD SEARCH
   ══════════════════════════════════════════════════════════════ */
function DashboardSearch({data,derived,navTo,setSelSeriesId,setSelStudio,setSelTalentId}){
  const[query,setQuery]=useState("");const[open,setOpen]=useState(false);const ref=useRef(null);
  const dq=useDebounce(query,200);
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
  const results=useMemo(()=>{
    const qRaw=dq.trim();const q=normN(qRaw);if(!q||q.length<2)return{series:[],episodes:[],studios:[],talents:[]};
    // Búsqueda con coincidencia aproximada (Levenshtein): tolera errores tipográficos ("Joel" ≈ "Jhoel")
    const rank=(list,fields)=>list.map(item=>{let sc=0;for(const f of fields){const v=f(item);if(!v)continue;sc=Math.max(sc,fuzzyScore(qRaw,safe(v)));if(sc===100)break;}return{item,sc};}).filter(r=>r.sc>=FUZZY_THR).sort((a,b)=>b.sc-a.sc);
    const series=rank(data.series,[x=>x.name,x=>x.type]).slice(0,5).map(r=>r.item);
    const episodes=rank(data.episodes,[ep=>ep.title,ep=>safe(ep.episode_number),ep=>{const sr=derived.seriesMap[ep.series_id];return sr?sr.name:"";}]).slice(0,5).map(r=>r.item);
    const studios=rank(STUDIOS,[st=>st.name]).slice(0,4).map(r=>r.item);
    const talents=rank(data.talents,[t=>t.name]).slice(0,5).map(r=>r.item);
    return{series,episodes,studios,talents};
  },[dq,data,derived]);
  const total=results.series.length+results.episodes.length+results.studios.length+results.talents.length;
  const highlight=(text,q)=>{text=safe(text);if(!q)return text;const idx=text.toLowerCase().indexOf(q.toLowerCase());if(idx<0)return text;return <span>{text.slice(0,idx)}<mark style={{background:"rgba(251,191,36,0.3)",borderRadius:2,padding:"0 1px",color:"var(--text-primary)"}}>{text.slice(idx,idx+q.length)}</mark>{text.slice(idx+q.length)}</span>;};
  return(
    <div ref={ref} style={{position:"relative",marginBottom:22}}>
      <div style={{position:"relative"}}>
        <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"var(--text-muted)",pointerEvents:"none"}}>🔍</span>
        <input value={query} onChange={e=>{setQuery(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)} placeholder="Buscar programas, episodios, estudios, talentos… (tolera errores de escritura)" style={{...SIPT,paddingLeft:42,paddingRight:36,fontSize:13,borderRadius:"var(--radius-md)",border:"1.5px solid var(--border-default)",background:"var(--bg-card)"}}/>
        {query&&<button onClick={()=>{setQuery("");setOpen(false);}} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--text-muted)",fontSize:16,lineHeight:1}}>×</button>}
      </div>
      {open&&query.trim().length>=2&&(
        <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,background:"var(--bg-elevated)",border:"1px solid var(--border-default)",borderRadius:"var(--radius-lg)",boxShadow:"var(--shadow-lg)",zIndex:400,overflow:"hidden",maxHeight:420,overflowY:"auto"}}>
          {total===0&&<div style={{padding:"22px",textAlign:"center",color:"var(--text-muted)",fontSize:12}}>Sin resultados para "{query}"</div>}
          {results.series.length>0&&(<div><div style={{padding:"8px 14px 4px",fontSize:9,fontWeight:700,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.08em",background:"var(--bg-card)",borderBottom:"1px solid var(--border-subtle)"}}>Programas</div>{results.series.map(sr=>{const sc=STATUS_CFG[sr.status]||STATUS_CFG.en_curso;const eps=(derived.epsBySeries[sr.id]||[]).length;return(<div key={sr.id} onClick={()=>{setSelSeriesId(sr.id);navTo("series");setOpen(false);setQuery("");}} className="dc-row" style={{padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid var(--border-subtle)"}}><div style={{width:30,height:30,borderRadius:8,background:"rgba(129,140,248,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>📺</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:12,color:"var(--text-primary)"}}>{highlight(sr.name,query.trim())}</div><div style={{fontSize:10,color:"var(--text-muted)",marginTop:1}}>{sr.type} · {eps} ep.</div></div><Bdg bg={sc.bg} color={sc.color} txt={sc.label}/></div>);})}</div>)}
          {results.episodes.length>0&&(<div><div style={{padding:"8px 14px 4px",fontSize:9,fontWeight:700,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.08em",background:"var(--bg-card)",borderBottom:"1px solid var(--border-subtle)"}}>Episodios</div>{results.episodes.map(ep=>{const sr=derived.seriesMap[ep.series_id];const st=STUDIOS.find(x=>x.id===ep.studio_id);const col=st?SCOLS[(ep.studio_id-1)||0]:"var(--text-muted)";return(<div key={ep.id} onClick={()=>{setSelSeriesId(ep.series_id);navTo("series");setOpen(false);setQuery("");}} className="dc-row" style={{padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid var(--border-subtle)"}}><div style={{width:30,height:30,borderRadius:8,background:col+"18",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:10,color:col,flexShrink:0}}>E{ep.episode_number}</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:12,color:"var(--text-primary)"}}>{highlight(ep.title,query.trim())}</div><div style={{fontSize:10,color:"var(--text-muted)",marginTop:1}}>{sr?sr.name:""}{st?" · "+st.name:""}</div></div><Pill c={col} txt={"Ep."+ep.episode_number}/></div>);})}</div>)}
          {results.studios.length>0&&(<div><div style={{padding:"8px 14px 4px",fontSize:9,fontWeight:700,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.08em",background:"var(--bg-card)",borderBottom:"1px solid var(--border-subtle)"}}>Estudios</div>{results.studios.map((st,i)=>{const stEps=data.episodes.filter(e=>e.studio_id===st.id).length;const col=SCOLS[i];return(<div key={st.id} onClick={()=>{setSelStudio(st.id);navTo("studio");setOpen(false);setQuery("");}} className="dc-row" style={{padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid var(--border-subtle)"}}><div style={{width:30,height:30,borderRadius:8,background:col+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>🏢</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:12,color:"var(--text-primary)"}}>{highlight(st.name,query.trim())}</div><div style={{fontSize:10,color:"var(--text-muted)",marginTop:1}}>{stEps} episodios asignados</div></div><Pill c={col} txt={st.name}/></div>);})}</div>)}
          {results.talents.length>0&&(<div><div style={{padding:"8px 14px 4px",fontSize:9,fontWeight:700,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.08em",background:"var(--bg-card)",borderBottom:"1px solid var(--border-subtle)"}}>Talentos</div>{results.talents.map(t=>{const genIcon=t.genero==="masculino"?"♂":t.genero==="femenino"?"♀":t.genero==="no_binario"?"⚧":"🎤";return(<div key={t.id} onClick={()=>{setSelTalentId(t.id);navTo("talent");setOpen(false);setQuery("");}} className="dc-row" style={{padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid var(--border-subtle)"}}><div style={{width:30,height:30,borderRadius:8,background:"rgba(192,192,192,0.12)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{genIcon}</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:12,color:"var(--text-primary)"}}>{highlight(t.name,query.trim())}</div><div style={{fontSize:10,color:"var(--text-muted)",marginTop:1}}>{[t.genero,t.edad_aparente,t.tono_de_voz].filter(Boolean).join(" · ")||"Sin datos"}</div></div>{t.tipo&&<Pill c="var(--accent-silver)" txt={t.tipo}/>}</div>);})}</div>)}
          {total>0&&<div style={{padding:"8px 14px",background:"var(--bg-card)",fontSize:10,color:"var(--text-muted)",textAlign:"center",borderTop:"1px solid var(--border-subtle)"}}>{total} resultado{total!==1?"s":""}</div>}
        </div>
      )}
    </div>
  );
}

DC_KW.push("GRUPO","MIXTO","AMBIENTE","MULTITUD","VOCES","GRÁFICA","GRAFICA","GRÁFICAS","GRAFICAS","INSERTO","INSERTOS","LETRERO","LETREROS","CARTEL","RÓTULO","ROTULO","TÍTULO","TITULO","TEXTO","TEXTOS");
const DC_KW_RE=new RegExp("(^|\\s)("+DC_KW.join("|")+")(\\s|\\d|$)","i");
/* Valores de la columna de actor que NO son un talento (se muestran, pero no cuentan para Netflix ni para alertas) */
const DC_PSEUDO=new Set(["edicion","edición","original","todos","todas","none","walla","x","n/a","na","sin asignar","-","—","por definir","tbd"]);
const dcIsPseudo=t=>DC_PSEUDO.has(dcNorm(t));
const dcIsAdic=n=>{
  const t=(n||"").trim();
  if(!t)return true;
  if(DC_KW_RE.test(t.toUpperCase()))return true;
  if(/\d/.test(t))return true;
  if(/'S\s/i.test(t))return true;
  if(/\b(IN TV|ON TV|ON PHONE|IN CROWD|ON SCREEN|ON RADIO)\b/i.test(t))return true;
  return false;
};
const dcTc=s=>(s||"").toLowerCase().replace(/(^|[^\p{L}\p{N}])(\p{L})/gu,(m,p,c)=>p+c.toUpperCase()); // mayúscula inicial también tras acentos (Garzón, no GarzóN)
const dcEpNum=cap=>{const m=(cap||"").match(/\d{2,3}/g);return m?parseInt(m[m.length-1],10):0;};
const dcFmtEp=cap=>{const m=(cap||"").match(/\d{2,3}/g);return m?m[m.length-1]:cap;};
const dcSplitRows=data=>{
  const princ=data.filter(r=>r.tipo==="Principal").sort((a,b)=>a.personaje.localeCompare(b.personaje));
  const tm=new Set(princ.filter(r=>!r.pseudo).map(r=>r.talentoKey).filter(Boolean));
  const adicNorm=[],adicComp=[];
  data.filter(r=>r.tipo==="Adicional").sort((a,b)=>a.talento.localeCompare(b.talento))
    .forEach(r=>(r.talentoKey&&tm.has(r.talentoKey)?adicComp:adicNorm).push(r));
  return{princ,adicNorm,adicComp};
};
const dcMk=(bg,fg,bold)=>({fill:{patternType:"solid",fgColor:{rgb:bg},bgColor:{indexed:64}},font:{color:{rgb:fg},bold:!!bold,sz:10},alignment:{vertical:"center"},border:{top:{style:"thin",color:{rgb:"FFCBD5E1"}},bottom:{style:"thin",color:{rgb:"FFCBD5E1"}},left:{style:"thin",color:{rgb:"FFCBD5E1"}},right:{style:"thin",color:{rgb:"FFCBD5E1"}}}});
const dcSetCell=(ws,r,c,val,style,cw)=>{
  const addr=XLSX.utils.encode_cell({r,c});
  ws[addr]={v:String(val??""),t:"s",s:style};
  if(cw)cw[c]=Math.max(cw[c]||4,String(val??"").length+3);
};
const dcBuildCrewSheet=()=>{
  const ws={};const cw=[4,30,30];let row=0;
  for(let c=0;c<3;c++)dcSetCell(ws,row,c,c===0?"🎬 Equipo de Producción":"",dcMk("FF1F3864","FFFFFFFF",true),cw);
  row++;
  ["#","Rol","Nombre"].forEach((h,c)=>dcSetCell(ws,row,c,h,dcMk("FF1E3A5F","FFFFFFFF",true),cw));
  row++;
  const st=dcMk("FFD9E2F3","FF000000");
  DC_CREW.forEach((cr,i)=>{[i+1,cr.rol,cr.nombre].forEach((v,c)=>dcSetCell(ws,row,c,v,st,cw));row++;});
  ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:row-1,c:2}});
  ws["!cols"]=cw.map(w=>({wch:Math.min(w,40)}));
  return ws;
};
/* ── Planificador: plan de copiado para la herramienta Dub Talent List de Netflix ── */
const dcNorm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
const dcCastMap=en=>{const m=new Map();en.data.filter(r=>r.tipo==="Principal").forEach(r=>m.set(dcNorm(r.personaje),r));return m;};
const dcAdicSet=en=>{const m=new Map();en.data.filter(r=>r.tipo==="Adicional"&&r.talento&&!r.pseudo).forEach(r=>{const k=dcNorm(r.talento);if(!m.has(k))m.set(k,r.talento);});return m;};
// Diferencia src → tgt. Costo: crear=2, eliminar=1, reasignar=1
const dcDiff=(src,tgt)=>{
  const sC=dcCastMap(src),tC=dcCastMap(tgt);const keep=[],reassign=[],del=[],add=[];
  tC.forEach((r,k)=>{if(sC.has(k)){const s0=sC.get(k);if(dcNorm(s0.talento)===dcNorm(r.talento))keep.push(r);else reassign.push({personaje:r.personaje,antes:s0.talento||"Sin asignar",ahora:r.talento||"Sin asignar"});}else add.push(r);});
  sC.forEach((r,k)=>{if(!tC.has(k))del.push(r);});
  const sA=dcAdicSet(src),tA=dcAdicSet(tgt);const aKeep=[],aDel=[],aAdd=[];
  tA.forEach((v,k)=>(sA.has(k)?aKeep:aAdd).push(v));sA.forEach((v,k)=>{if(!tA.has(k))aDel.push(v);});
  const cost=del.length+reassign.length+add.length*2+aDel.length+aAdd.length*2;
  return{keep,reassign,del,add,aKeep,aDel,aAdd,cost};
};
// Para cada episodio (salvo el primero) elige el episodio previo que minimiza ediciones
const dcBuildPlans=sorted=>{sorted.forEach((en,i)=>{if(i===0){en.plan=null;return;}let best=null;for(let j=0;j<i;j++){const d=dcDiff(sorted[j],en);if(!best||d.cost<best.cost)best={...d,srcCap:sorted[j].cap};}en.plan=best;});};
// Alertas: mismo talento escrito distinto o nombres muy parecidos (evita duplicados en Netflix)
const dcWarnings=sorted=>{
  const variants=new Map();
  sorted.forEach(en=>en.data.forEach(r=>{if(!r.talento||r.pseudo)return;const k=dcNorm(r.talento);if(!variants.has(k))variants.set(k,new Set());variants.get(k).add(r.talento);}));
  const warns=[];variants.forEach(set=>{if(set.size>1)warns.push("✏️ Mismo talento escrito distinto: "+[...set].join("  ↔  "));});
  const keys=[...variants.keys()];
  for(let i=0;i<keys.length;i++)for(let j=i+1;j<keys.length;j++){const a=keys[i],b=keys[j];if(a.length>=6&&b.length>=6&&Math.abs(a.length-b.length)<=2&&lev(a,b)<=2)warns.push('🔍 Nombres muy parecidos (¿posible duplicado en Netflix?): "'+[...variants.get(a)][0]+'" ↔ "'+[...variants.get(b)][0]+'"');}
  return warns;
};
// Filas de la matriz Personaje × Episodio (celda = talento; cambio de talento marcado)
const dcMatrixRows=eps=>{
  const rows=new Map();
  eps.forEach((en,ei)=>{en.data.filter(r=>r.tipo==="Principal").forEach(r=>{const k=dcNorm(r.personaje);if(!rows.has(k))rows.set(k,{name:r.personaje,byEp:{}});rows.get(k).byEp[ei]=r.talento||"—";});});
  return[...rows.values()].sort((a,b)=>Object.keys(b.byEp).length-Object.keys(a.byEp).length||a.name.localeCompare(b.name)).map(r=>{const base=Object.values(r.byEp).find(t=>t&&t!=="—")||"";return{...r,base,changed:eps.map((_,ei)=>{const v=r.byEp[ei];return!!(v&&v!=="—"&&dcNorm(v)!==dcNorm(base));})};});
};
// Bloque "Plan de copiado" dentro de la hoja de cada capítulo
const dcWritePlanBlock=(ws,en,row,cw)=>{
  const band=(txt,bg,fg)=>{for(let c=0;c<5;c++)dcSetCell(ws,row,c,c===0?txt:"",dcMk(bg,fg||"FFFFFFFF",true),cw);row++;};
  band("📋 PLAN DE COPIADO — Netflix Dub Talent List","FF1F3864");
  if(!en.plan){const nP=dcCastMap(en).size,nA=dcAdicSet(en).size;dcSetCell(ws,row,0,"🆕 Primer episodio: crear todo ("+nP+" principales + "+nA+" adicionales + crew). Luego usa COPY de este episodio para los siguientes.",dcMk("FFFFEB9C","FF000000",true),cw);row+=2;return row;}
  const pl=en.plan;
  dcSetCell(ws,row,0,"1️⃣ COPY desde episodio:",dcMk("FFFFFFFF","FF000000",true),cw);dcSetCell(ws,row,1,pl.srcCap,dcMk("FFD9E2F3","FF1F3864",true),cw);row++;
  dcSetCell(ws,row,0,"✅ Se mantienen: "+pl.keep.length+" personajes (no tocar)",dcMk("FF92D050","FF000000"),cw);row++;
  if(pl.reassign.length){band("⚠️ 2️⃣ REASIGNAR TALENTO ("+pl.reassign.length+")","FFED7D31");["Personaje","Talento en fuente","Talento correcto"].forEach((hd,c)=>dcSetCell(ws,row,c,hd,dcMk("FFF1F5F9","FF475569",true),cw));row++;pl.reassign.forEach(r=>{[r.personaje,r.antes,r.ahora].forEach((v,c)=>dcSetCell(ws,row,c,v,dcMk("FFFFE4CC","FF000000"),cw));row++;});}
  if(pl.del.length){band("🗑️ 3️⃣ ELIMINAR del pegado ("+pl.del.length+")","FFC00000");pl.del.forEach(r=>{dcSetCell(ws,row,0,r.personaje,dcMk("FFFFC7CE","FF000000"),cw);row++;});}
  if(pl.add.length){band("➕ 4️⃣ CREAR nuevos ("+pl.add.length+")","FF10B981");["Personaje","Talento"].forEach((hd,c)=>dcSetCell(ws,row,c,hd,dcMk("FFF1F5F9","FF475569",true),cw));row++;pl.add.forEach(r=>{[r.personaje,r.talento||"Sin asignar"].forEach((v,c)=>dcSetCell(ws,row,c,v,dcMk("FFD1FAE5","FF000000"),cw));row++;});}
  dcSetCell(ws,row,0,"👥 Additional Cast → quitar "+pl.aDel.length+" · agregar "+pl.aAdd.length,dcMk("FFB8CCE4","FF000000",true),cw);row++;
  pl.aDel.forEach(t=>{dcSetCell(ws,row,0,"🗑️ "+t,dcMk("FFFFC7CE","FF000000"),cw);row++;});
  pl.aAdd.forEach(t=>{dcSetCell(ws,row,0,"➕ "+t,dcMk("FFD1FAE5","FF000000"),cw);row++;});
  row++;return row;
};
// Hoja: Matriz Personaje × Episodio
const dcBuildMatrixSheet=eps=>{
  const ws={};const cw=[30,...eps.map(()=>22)];let row=0;
  for(let c=0;c<=eps.length;c++)dcSetCell(ws,row,c,c===0?"🧩 Matriz de Recurrencia":"",dcMk("FF1F3864","FFFFFFFF",true),cw);row++;
  ["Personaje",...eps.map(e=>"EP "+dcFmtEp(e.cap))].forEach((hd,c)=>dcSetCell(ws,row,c,hd,dcMk("FF1E3A5F","FFFFFFFF",true),cw));row++;
  dcMatrixRows(eps).forEach(r=>{dcSetCell(ws,row,0,r.name,dcMk("FFD9E2F3","FF000000",true),cw);eps.forEach((_,ei)=>{const v=r.byEp[ei]??"";dcSetCell(ws,row,ei+1,v,r.changed[ei]?dcMk("FFFFE4CC","FF9A3412",true):dcMk("FFFFFFFF","FF000000"),cw);});row++;});
  ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(row-1,1),c:eps.length}});ws["!cols"]=cw.map(w=>({wch:Math.min(w,30)}));return ws;
};
// Hoja: Alertas + checklist antes de Submit en Netflix
const DC_CHECKLIST=["☐ Nombre del estudio ingresado en la pestaña de temporada","☐ Logo del partner en PNG con altura mínima de 400px","☐ Al menos 1 registro en Cast con nombre localizado por episodio","☐ Sin círculos blancos vacíos (campos requeridos faltantes) en ningún episodio","☐ Orden de los registros verificado (el orden de la herramienta = orden en créditos)","☐ Additional Cast: solo nombres de talento (sin personajes)","⚠️ RECUERDA: después de Submit los campos NO son editables"];
const dcBuildAlertSheet=warnings=>{
  const ws={};const cw=[90];let row=0;
  dcSetCell(ws,row,0,"⚠️ ALERTAS — Nombres de talento",dcMk("FFED7D31","FFFFFFFF",true),cw);row++;
  if(warnings.length)warnings.forEach(w=>{dcSetCell(ws,row,0,w,dcMk("FFFFF3CD","FF92400E"),cw);row++;});
  else{dcSetCell(ws,row,0,"✅ Sin alertas: todos los nombres de talento son consistentes",dcMk("FFD1FAE5","FF166534"),cw);row++;}
  row++;dcSetCell(ws,row,0,"📌 CHECKLIST antes de Submit en Netflix",dcMk("FF1F3864","FFFFFFFF",true),cw);row++;
  DC_CHECKLIST.forEach(t=>{dcSetCell(ws,row,0,t,dcMk("FFD9E2F3","FF000000"),cw);row++;});
  ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:row-1,c:0}});ws["!cols"]=[{wch:90}];return ws;
};
const dcBuildSheet=(en,opts)=>{
  const withPlan=!opts||opts.plan!==false;
  const{princ,adicNorm,adicComp}=dcSplitRows(en.data);
  const ws={};const cw=[4,30,30,12,25];let row=0;
  const HDR=["#","Personaje","Talento","Tipo","Nota"];
  const writeHeader=label=>{
    for(let c=0;c<5;c++)dcSetCell(ws,row,c,c===0?label:"",dcMk("FF1F3864","FFFFFFFF",true),cw);
    row++;
    HDR.forEach((h,c)=>dcSetCell(ws,row,c,h,dcMk("FF1E3A5F","FFFFFFFF",true),cw));
    row++;
  };
  const writeRows=(rows,fn)=>{rows.forEach((r,i)=>{const{cells,style}=fn(r,i);cells.forEach((v,c)=>dcSetCell(ws,row,c,v,style,cw));row++;});row++;};
  if(withPlan)row=dcWritePlanBlock(ws,en,row,cw); // plan de copiado dentro de la misma hoja del capítulo
  writeHeader("📽️ "+en.cap);
  writeRows(princ,(r,i)=>{
    const rec=r.prevEps&&r.prevEps.length?"🔁 EP "+r.prevEps.map(dcFmtEp).join(", EP "):"";
    return{cells:[i+1,r.personaje,r.talento||"Sin asignar","Principal",rec],style:r.talento?dcMk("FF92D050","FF000000"):dcMk("FFFFC7CE","FF000000")};
  });
  writeHeader("👥 Adicionales");
  writeRows(adicNorm,(r,i)=>({cells:[i+1,r.personaje,r.talento||"Sin asignar","Adicional",""],style:r.talento?dcMk("FFFFEB9C","FF000000"):dcMk("FFFFC7CE","FF000000")}));
  writeHeader("⚠️ Adicionales compartidos");
  writeRows(adicComp,(r,i)=>({cells:[i+1,r.personaje,r.talento||"Sin asignar","Adicional","⚠️ Compartido"],style:dcMk("FFB8CCE4","FF000000")}));
  ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:row-1,c:4}});
  ws["!cols"]=cw.map(w=>({wch:Math.min(w,40)}));
  return ws;
};

function decodeB64UTF8(b64){
  try{
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }catch(e){return "<h1 style='color:#fff;font-family:sans-serif;padding:40px'>Error al cargar la herramienta</h1>";}
}

SI ES UNA PELÍCULA
PASO 2. CONTENIDO OBLIGATORIO
________________________________________
1. RESUMEN DE LA PELÍCULA
•	Redacta un resumen extenso y detallado de la película completa.
•	Debe incluir:
o	Trama general
o	Desarrollo narrativo
o	Evolución de personajes principales
•	No dividir por actos ni episodios.
•	No incluir criterios de casting ni dirección.
Si el show guide aporta intención temática o conceptual:
[SHOW GUIDE]
Contexto narrativo o conceptual de la película.

________________________________________
2. PERSONAJES (CRITERIO SELECTIVO)
Incluye únicamente personajes que:
•	Presenten un cambio narrativo, emocional o funcional, o
•	Sean críticos o determinantes dentro del episodio.
•	Que se encuentre en la tabla de personajes de Show Guide
Para cada personaje incluido, especifica obligatoriamente:
•	Quién es: cómo se presenta en este episodio.
•	Qué rol cumple: función dramática concreta.
•	Aspecto relevante: cambio, revelación o rasgo que deba tenerse en cuenta.
Si el show guide amplía o resignifica al personaje:
[SHOW GUIDE]
Función real en la serie, arco narrativo o subtexto que aún no es evidente.
Personajes sin cambios relevantes
Si existen personajes que continúan sin cambios:
•	No los describas individualmente.
•	Incluye una lista titulada:
Personajes de continuidad (sin cambios relevantes)
Indicando:
•	Nombre del personaje.
•	Rol ultra breve (máximo una línea).

________________________________________
REGLAS GENERALES
•	El libreto en español es la fuente principal y manda.
•	El show guide solo aporta contexto narrativo, nunca corrige al libreto.
•	Toda información del show guide debe estar claramente marcada con:
[SHOW GUIDE]
•	Usar lenguaje:
o	Técnico
o	Claro
o	Orientado a producción
•	No realizar:
o	Análisis actorales
o	Interpretaciones subjetivas
o	Opiniones personales
•	Mantener:
o	Formato limpio
o	Estructura jerárquica
o	Consistencia terminológica
________________________________________
REGLAS ADICIONALES OBLIGATORIAS
•	NO inventes ni propongas pronunciaciones de personajes ni de nombres propios. No incluyas guías fonéticas ni transcripciones. Escribe cada nombre exactamente como aparece en el libreto.
•	No inventes hechos, personajes ni datos que no estén en el libreto o en el show guide.
•	Si no se adjuntó show guide, no incluyas secciones [SHOW GUIDE].
•	FORMATO DE SALIDA (obligatorio, estructura jerárquica con esta sintaxis exacta):
o	Primera línea: "# BREAKDOWN_(NOMBRE)_(EPISODIO)".
o	Secciones con "## " y numeradas en orden de aparición: "## 1. RESUMEN GENERAL DE LA SERIE" (sólo si los DATOS DE ENTRADA lo piden), "## 2. RESUMEN DEL EPISODIO" (o "RESUMEN DE LA PELÍCULA"), "## 3. PERSONAJES", "## 4. PERSONAJES DE CONTINUIDAD (SIN CAMBIOS RELEVANTES)".
o	Dentro de PERSONAJES, cada personaje es un subtítulo "### NOMBRE DEL PERSONAJE" seguido de tres líneas: "**Quién es:** …", "**Qué rol cumple:** …", "**Aspecto relevante:** …".
o	Los aportes del show guide van en una línea propia que empieza por "[SHOW GUIDE] ".
o	Los personajes de continuidad van como lista: "- NOMBRE — rol ultra breve".
o	No uses tablas ni otros símbolos de Markdown distintos de los indicados.
•	LOS RESÚMENES (serie, episodio o película) SE REDACTAN SIEMPRE EN PROSA: uno o varios párrafos corridos, con oraciones completas y conectadas. Está PROHIBIDO usar viñetas, guiones, listas o enumeraciones dentro de los resúmenes.
•	Redacta en español latino neutro.
•	RESUMEN GENERAL DE LA SERIE (sólo si los DATOS DE ENTRADA lo piden): es una excepción explícita a la regla "no redactes un resumen general de la serie". Inclúyelo como sección aparte, titulada exactamente "RESUMEN GENERAL DE LA SERIE", inmediatamente después del título y antes del resumen del episodio. Extensión: 5 a 8 líneas con premisa, protagonistas y situación general hasta este episodio. Fuentes, en este orden: show guide (etiquetar [SHOW GUIDE]), breakdowns anteriores de la misma serie adjuntos como contexto, y lo que el libreto establece. Si no hay show guide ni breakdowns anteriores, indícalo en una línea y limítate a lo que el libreto deja claro. No adelantes nada que estas fuentes no revelen.`;

/* pdf.js cargado bajo demanda; el worker se sirve como blob (los workers deben ser del mismo origen) */
async function bdLoadPdfJs(){
  if(window.__pdfjs)return window.__pdfjs;
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/";
  const mod=await import(base+"pdf.min.mjs");
  const src=await fetch(base+"pdf.worker.min.mjs").then(r=>{if(!r.ok)throw new Error("No se pudo cargar el lector de PDF");return r.text();});
  mod.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([src],{type:"text/javascript"}));
  window.__pdfjs=mod;return mod;
}
/* Texto de un libreto: .txt/.md, .docx (Word) o .pdf */
async function bdExtractText(file){
  const name=safe(file.name).toLowerCase();const buf=await readFileBuffer(file);
  if(/\.(txt|md|text)$/.test(name))return bdDecode(buf);
  if(/\.docx$/.test(name)){
    if(typeof JSZip==="undefined")throw new Error("No se pudo cargar el lector de Word (JSZip)");
    const zip=await JSZip.loadAsync(buf);const f=zip.file("word/document.xml");if(!f)throw new Error("El .docx no contiene word/document.xml");
    const xml=new DOMParser().parseFromString(await f.async("string"),"application/xml");
    const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
    const out=[];const paras=xml.getElementsByTagNameNS(W,"p");
    for(const p of paras){let t="";const walk=nd=>{for(const c of nd.childNodes){if(c.nodeType!==1)continue;const ln=c.localName;if(ln==="t")t+=c.textContent;else if(ln==="tab")t+="\t";else if(ln==="br"||ln==="cr")t+="\n";else walk(c);}};walk(p);out.push(t);}
    return out.join("\n");
  }
  if(/\.pdf$/.test(name)){
    const pdfjs=await bdLoadPdfJs();const doc=await pdfjs.getDocument({data:buf}).promise;let text="";
    for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const c=await page.getTextContent();let line="";c.items.forEach(it=>{if(!it.str&&!it.hasEOL)return;line+=it.str;if(it.hasEOL){text+=line+"\n";line="";}else line+=" ";});if(line.trim())text+=line+"\n";text+="\n";}
    return text;
  }
  if(/\.doc$/.test(name))throw new Error("Formato .doc antiguo no soportado: guárdalo como .docx o .pdf");
  throw new Error("Formato no soportado: usa .docx, .pdf o .txt");
}

/* Llamada con streaming (SSE). Devuelve {text,stop,model,usage}. Soporta Anthropic y APIs compatibles con OpenAI. */
async function bdGenerate({cfg,system,user,onDelta,signal}){
  const pr=BD_PROVIDERS[cfg.provider]||BD_PROVIDERS.custom;
  const model=cfg.model||pr.defaultModel;
  const isAnthropic=pr.kind==="anthropic";
  let url,headers,body;
  if(isAnthropic){
    url=bdEndpoint(cfg,"/v1/messages");
    body={model,max_tokens:32000,stream:true,system,messages:[{role:"user",content:user}]};
    headers={"Content-Type":"application/json","x-api-key":cfg.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
    if(/^claude-(opus|sonnet)-5-5/.test(model)){body.output_config={effort:cfg.effort||"high"};body.fallbacks="default";headers["anthropic-beta"]="server-side-fallback-2026-07-01";}
  }else{
    if(cfg.provider==="custom"&&!cfg.baseUrl)throw new Error("Configura la URL base del endpoint");
    url=bdEndpoint(cfg,"/chat/completions");
    body={model,stream:true,temperature:Number(cfg.temperature)||0.3,max_tokens:8192,messages:[{role:"system",content:system},{role:"user",content:user}]};
    headers={"Content-Type":"application/json","Authorization":"Bearer "+cfg.apiKey,"Accept":"text/event-stream"};
    if(cfg.provider==="openrouter"){headers["HTTP-Referer"]=location.origin;headers["X-Title"]="DublajeCast";}
  }
  const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),signal});
  if(!res.ok){
    let msg="HTTP "+res.status;try{const j=await res.json();msg=(j.error&&(j.error.message||(typeof j.error==="string"?j.error:null)))||j.detail||j.message||msg;}catch(e){}
    if(typeof msg!=="string")msg=JSON.stringify(msg);
    if(res.status===401||res.status===403)msg="Clave de API inválida, revocada o sin permiso ("+msg+")";
    else if(res.status===429)msg="Límite de uso alcanzado — espera un momento y vuelve a intentar ("+msg+")";
    else if(res.status===404&&!isAnthropic)msg="Modelo o ruta no encontrados: revisa el nombre del modelo ("+msg+")";
    else if(res.status===413)msg="El libreto es demasiado grande para el proveedor ("+msg+")";
    throw new Error(msg);
  }
  const ctype=res.headers.get("content-type")||"";
  if(!/event-stream/.test(ctype)){
    // Respuesta sin streaming (algunos endpoints): leer el JSON completo
    const j=await res.json();
    if(isAnthropic){const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");if(onDelta)onDelta(text);return{text,stop:j.stop_reason,model:j.model||model,usage:j.usage||null};}
    const ch=(j.choices&&j.choices[0])||{};const text=(ch.message&&ch.message.content)||"";if(onDelta)onDelta(text);return{text,stop:ch.finish_reason,model:j.model||model,usage:j.usage||null};
  }
  const reader=res.body.getReader();const dec=new TextDecoder();let buf="",text="",stop=null,served=model,usage=null;
  const handle=ev=>{
    if(isAnthropic){
      if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.type==="text_delta"){text+=ev.delta.text;if(onDelta)onDelta(text);}
      else if(ev.type==="message_start"&&ev.message&&ev.message.model)served=ev.message.model;
      else if(ev.type==="message_delta"){if(ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason;if(ev.usage)usage=ev.usage;}
      else if(ev.type==="error")throw new Error((ev.error&&ev.error.message)||"Error de la API");
    }else{
      if(ev.error)throw new Error(ev.error.message||JSON.stringify(ev.error));
      if(ev.model)served=ev.model;if(ev.usage)usage=ev.usage;
      const ch=ev.choices&&ev.choices[0];if(!ch)return;
      const piece=(ch.delta&&ch.delta.content)||(ch.message&&ch.message.content)||"";
      if(piece){text+=piece;if(onDelta)onDelta(text);}
      if(ch.finish_reason)stop=ch.finish_reason;
    }
  };
  while(true){
    const{value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let idx;
    while((idx=buf.indexOf("\n\n"))>=0){
      const chunk=buf.slice(0,idx);buf=buf.slice(idx+2);
      for(const line of chunk.split("\n")){
        if(!line.startsWith("data:"))continue;const data=line.slice(5).trim();if(!data||data==="[DONE]")continue;
        let ev;try{ev=JSON.parse(data);}catch(e){continue;}
        handle(ev);
      }
    }
  }
  if(buf.trim()){for(const line of buf.split("\n")){if(!line.startsWith("data:"))continue;const data=line.slice(5).trim();if(!data||data==="[DONE]")continue;try{handle(JSON.parse(data));}catch(e){}}}
  // Modelos "razonadores" pueden envolver su pensamiento en <think>…</think>: se descarta
  text=text.replace(/<think>[\s\S]*?<\/think>\s*/g,"").trim();
  if(stop==="length")stop="max_tokens";
  if(stop==="content_filter")stop="refusal";
  return{text,stop,model:served,usage};
}

/* ── Estructura del breakdown ──
   bdParse convierte el texto generado en bloques: h1/h2/h3, párrafos, viñetas, campos "**Etiqueta:** valor" y
   notas [SHOW GUIDE]. Tolera salidas sin "#" (encabezados en MAYÚSCULAS). */
function bdParse(text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");const blocks=[];let para=[];
  const flush=()=>{if(para.length){blocks.push({t:"p",x:para.join(" ")});para=[];}};
  const caps=s=>s.length<=90&&s===s.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]{3}/.test(s);
  for(const raw of lines){
    const s=raw.trim();if(!s){flush();continue;}let m;
    if((m=s.match(/^(#{1,3})\s+(.*)$/))){flush();blocks.push({t:"h"+m[1].length,x:m[2].replace(/\*\*/g,"").trim()});continue;}
    if(/^BREAKDOWN_/.test(s)){flush();blocks.push({t:"h1",x:s.replace(/\*\*/g,"")});continue;}
    if((m=s.match(/^\[SHOW GUIDE\]\s*:?\s*(.*)$/i))){flush();blocks.push({t:"guide",x:m[1]});continue;}
    if((m=s.match(/^\*\*([^*]{2,40}?)\s*:?\*\*\s*:?\s*(.*)$/))||(m=s.match(/^(Quién es|Qué rol cumple|Aspecto relevante|Rol)\s*:\s*(.*)$/i))){flush();blocks.push({t:"field",k:m[1].trim(),x:m[2].trim()});continue;}
    if((m=s.match(/^[•\-*]\s+(.*)$/))){flush();blocks.push({t:"li",x:m[1]});continue;}
    if(caps(s)){flush();blocks.push({t:/^\d+\.\s/.test(s)||/^(RESUMEN|PERSONAJES|FICHA)/.test(s)?"h2":"h3",x:s});continue;}
    para.push(s);
  }
  flush();
  for(let i=0;i<blocks.length-1;i++){if(blocks[i].t==="guide"&&!blocks[i].x&&blocks[i+1].t==="p"){blocks[i].x=blocks[i+1].x;blocks.splice(i+1,1);}}
  return blocks;
}
/* Los resúmenes deben ir en prosa: si el modelo devolvió viñetas dentro de un resumen, se unen en un párrafo */
function bdNormalize(text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");const out=[];let inSum=false,buf=[];
  const isHead=s=>/^#{1,3}\s/.test(s)||(s.length<=90&&s===s.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]{3}/.test(s)&&!/^[•\-*]/.test(s));
  const flush=()=>{if(buf.length){out.push(buf.map(x=>{x=x.trim();return/[.!?…]$/.test(x)?x:x+".";}).join(" "));buf=[];}};
  for(const raw of lines){
    const s=raw.trim();
    if(isHead(s)){flush();inSum=/RESUMEN (GENERAL DE LA SERIE|DEL EPISODIO|DE LA PEL[ÍI]CULA)/i.test(s);out.push(raw);continue;}
    if(inSum&&/^[•\-*]\s+/.test(s)){buf.push(s.replace(/^[•\-*]\s+/,"").replace(/\*\*/g,""));continue;}
    if(inSum&&/^\d+[.)]\s+/.test(s)){buf.push(s.replace(/^\d+[.)]\s+/,""));continue;}
    flush();out.push(raw);
  }
  flush();return out.join("\n");
}

function bdPrint(rec){
  const html=bdPrintHtml(rec);
  const fr=document.createElement("iframe");fr.setAttribute("aria-hidden","true");fr.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
  document.body.appendChild(fr);
  const done=()=>{setTimeout(()=>{try{fr.remove();}catch(e){}},1500);};
  fr.onload=()=>{try{const w=fr.contentWindow;w.addEventListener("afterprint",done);w.focus();w.print();setTimeout(done,60000);}catch(e){done();}};
  fr.srcdoc=html;
}

function BdDoc({text}){
  const blocks=useMemo(()=>bdParse(text),[text]);
  const inline=s=>String(s).split(/(\*\*[^*]+\*\*)/).filter(Boolean).map((p,i)=>{const m=p.match(/^\*\*([^*]+)\*\*$/);return m?<b key={i}>{m[1]}</b>:<React.Fragment key={i}>{p}</React.Fragment>;});
  const out=[];let ul=[];const flushUl=()=>{if(ul.length){out.push(<ul key={"ul"+out.length} style={{margin:"0 0 8px 18px",padding:0}}>{ul}</ul>);ul=[];}};
  blocks.forEach((b,i)=>{
    if(b.t==="li"){ul.push(<li key={i} style={{fontSize:12.5,lineHeight:1.55,color:"var(--text-primary)"}}>{inline(b.x)}</li>);return;}
    flushUl();

    else if(b.t==="field")out.push(<div key={i} style={{fontSize:12.5,lineHeight:1.55,color:"var(--text-primary)",margin:"0 0 2px"}}><b style={{color:"var(--text-secondary)"}}>{b.k}:</b> {inline(b.x)}</div>);
    else if(b.t==="guide")out.push(<div key={i} style={{background:"rgba(129,140,248,0.08)",borderLeft:"3px solid var(--accent-indigo)",borderRadius:6,padding:"6px 10px",margin:"4px 0 8px",fontSize:12,color:"var(--text-secondary)",fontStyle:"italic"}}><b style={{color:"var(--accent-indigo)",fontStyle:"normal",fontSize:9.5,letterSpacing:"0.05em",marginRight:6}}>SHOW GUIDE</b>{inline(b.x)}</div>);
    else out.push(<p key={i} style={{fontSize:12.5,lineHeight:1.6,color:"var(--text-primary)",margin:"0 0 8px"}}>{inline(b.x)}</p>);
  });
  flushUl();
  return <div style={{maxHeight:"60vh",overflowY:"auto",paddingRight:6}}>{out}</div>;
}

}

const DC_CLIENT_KEY="dc_dubcard_client_v1";
/* Pregunta para qué cliente es la DUBCARD. Netflix = formato completo; otra casa = sin las 3 hojas iniciales ni el plan de Netflix */

      <div className="glass-card" style={{...CARD_S,width:"min(480px,100%)",boxShadow:"var(--shadow-lg),var(--shadow-glow)"}}>
        <div style={{padding:"18px 22px 12px",borderBottom:"1px solid var(--border-subtle)",fontWeight:700,fontSize:15,color:"var(--text-primary)"}}>¿Para qué cliente es esta DUBCARD?</div>
        <div style={{padding:"16px 22px 6px"}}>
          <Opt k="netflix" title="Netflix" desc="Formato completo: hojas Producción, Matriz y Alertas Netflix, y plan de copiado para la Dub Talent List en cada episodio."/>
          <Opt k="otro" title="Otra casa / cliente" desc="Sólo las hojas de cada episodio con Principales, Adicionales y Adicionales compartidos, sin las 3 hojas iniciales ni el plan de Netflix."/>
          {kind==="otro"&&<input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="Nombre del cliente (p. ej. Disney, Amazon, Max…)" style={{...SIPT,fontSize:12,marginBottom:8}}/>}

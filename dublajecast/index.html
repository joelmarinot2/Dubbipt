function DubcardsView(){
  const s=useApp();
  const[entries,setEntries]=useState([]);
  const[client,setClient]=useState(null); // {kind:"netflix"|"otro",name}
  const[askClient,setAskClient]=useState(false);
  const isNetflix=!client||client.kind==="netflix";
  const[processed,setProcessed]=useState([]);
  const[warnings,setWarnings]=useState([]);
  const[logs,setLogs]=useState([]);
  const[busy,setBusy]=useState(false);
  const fileInputRef=useRef(null);
  const addLog=(msg,cls)=>setLogs(l=>[...l,{msg,cls}]);

  const handleFiles=files=>{
    const arr=Array.from(files).filter(f=>/\.(xlsm|xlsx|xls)$/i.test(f.name));
    setEntries(prev=>{
      const next=[...prev];
      arr.forEach(f=>{if(!next.find(e=>e.name===f.name))next.push({file:f,name:f.name,cap:f.name.replace(/\.[^.]+$/,""),data:[]});});
      return next;
    });
  };

  const readAsArray=async file=>new Uint8Array(await readFileBuffer(file));

  const parseFile=async en=>{
    addLog("📂 "+en.name);
    try{
      const bytes=await readAsArray(en.file);
      const wb=XLSX.read(bytes,{type:"array",bookVBA:true});
      addLog("  Hojas: "+wb.SheetNames.join(", "));
      const dsName=wb.SheetNames.find(x=>x.trim().toUpperCase().includes("DESGLO"));
      const csName=wb.SheetNames.find(x=>x.trim().toUpperCase().includes("CASTING"));
      if(!dsName){addLog("  ❌ No encontré hoja DESGLOCE","err");return null;}
      if(!csName){addLog("  ❌ No encontré hoja CASTING","err");return null;}
      const opts={header:1,defval:""};
      const dr=XLSX.utils.sheet_to_json(wb.Sheets[dsName],opts)||[];
      const cr=XLSX.utils.sheet_to_json(wb.Sheets[csName],opts)||[];
      // sheet_to_json indexa desde el origen del rango usado: convertir a filas/columnas absolutas
      const dOff=XLSX.utils.decode_range(wb.Sheets[dsName]["!ref"]||"A1").s,cOff=XLSX.utils.decode_range(wb.Sheets[csName]["!ref"]||"A1").s;
      const dcell=(r,c)=>{const row=dr[r-dOff.r];return row&&row[c-dOff.c]!=null?row[c-dOff.c].toString().trim():"";};
      const ccell=(r,c)=>{const row=cr[r-cOff.r];return row&&row[c-cOff.c]!=null?row[c-cOff.c].toString().trim():"";};
      const titulo=dcell(8,7)||en.cap; // H9
      addLog('  📋 "'+titulo+'"',"ok");
      // Personajes: DESGLOCE columna A desde la fila 17 (filas vacías = continuación del anterior)
      const personajes=[];for(let r=16;r<dr.length+dOff.r;r++){const v=dcell(r,0);if(v)personajes.push(v);}
      // Hoja CASTING: cabecera «NOMBRE DEL ACTOR» (talento) y «LOCUTOR»/«PERSONAJE» (personaje)
      let talentCol=-1,charCol=0,hdrRow=11;
      for(let r=cOff.r;r<Math.min(cOff.r+15,cr.length+cOff.r)&&talentCol<0;r++){
        const row=cr[r-cOff.r]||[];
        for(let ci=0;ci<row.length;ci++){const v=(row[ci]||"").toString().toUpperCase();if(v.includes("NOMBRE DEL ACTOR")){talentCol=ci+cOff.c;hdrRow=r;const ic=row.findIndex(x=>/^(LOCUTOR|PERSONAJE)/i.test((x||"").toString().trim()));charCol=ic>=0?ic+cOff.c:0;break;}}
      }
      if(talentCol<0){addLog("  ⚠️ Sin columna NOMBRE DEL ACTOR — uso columna D y personaje en A","err");talentCol=3;}
      else addLog("  🔎 CASTING: personaje en "+XLSX.utils.encode_col(charCol)+", talento en "+XLSX.utils.encode_col(talentCol),"ok");
      // Mapa personaje → talento tomado de la MISMA fila de CASTING (no por posición)
      const castMap=new Map(),castList=[];
      for(let r=hdrRow+1;r<cr.length+cOff.r;r++){const ch=ccell(r,charCol),t=ccell(r,talentCol);if(!ch)continue;castList.push({ch,t});const k=dcNorm(ch);if(!castMap.has(k)||(t&&!castMap.get(k)))castMap.set(k,t);}
      const keys=[...castMap.keys()];
      const lookup=p=>{const k=dcNorm(p);if(castMap.has(k))return{t:castMap.get(k),how:"exacto"};let best=null,bs=0;keys.forEach(kk=>{const sc=simN(p,kk);if(sc>bs){bs=sc;best=kk;}});return best&&bs>=85?{t:castMap.get(best),how:"similar"}:{t:"",how:"sin fila"};};
      const base=personajes.length?personajes:castList.map(x=>x.ch);
      if(!personajes.length)addLog("  ⚠️ DESGLOCE sin personajes desde la fila 17: uso la lista de CASTING","err");
      let nExact=0,nSim=0,nMiss=0;
      const data=base.map(p=>{
        const{t,how}=lookup(p);if(how==="exacto")nExact++;else if(how==="similar")nSim++;else nMiss++;
        const pseudo=!!t&&dcIsPseudo(t);
        return{personaje:dcTc(p),talento:dcTc(t),talentoKey:pseudo?"":dcNorm(t),pseudo,tipo:dcIsAdic(p)?"Adicional":"Principal"};
      });
      addLog("  👤 "+base.length+" personajes | 🎭 "+data.filter(r=>r.talento&&!r.pseudo).length+" talentos | "+nExact+" exactos"+(nSim?" · "+nSim+" por similitud":"")+(nMiss?" · "+nMiss+" sin talento en CASTING":""),nMiss?"err":"ok");
      castList.filter(x=>!base.some(p=>dcNorm(p)===dcNorm(x.ch))).slice(0,8).forEach(x=>addLog("  ℹ️ En CASTING pero no en DESGLOCE: "+x.ch+(x.t?" → "+x.t:""),""));
      addLog("  ✅ "+data.length+" procesados","ok");
      return{cap:titulo,data};
    }catch(e){addLog("  ❌ "+e.message,"err");return null;}
  };

  const lastClient=()=>{try{return JSON.parse(localStorage.getItem(DC_CLIENT_KEY)||"null");}catch(e){return null;}};
  const pendingRef=useRef(null);
  const onClientChosen=c=>{setAskClient(false);const then=pendingRef.current;pendingRef.current=null;if(!c)return;setClient(c);try{localStorage.setItem(DC_CLIENT_KEY,JSON.stringify(c));}catch(e){}if(then==="process")processAll();};
  const requestProcess=()=>{if(busy)return;pendingRef.current="process";setAskClient(true);};
  const processAll=async()=>{
    if(busy)return;
    setBusy(true);setLogs([]);setProcessed([]);setWarnings([]);
    try{
      const results=await Promise.all(entries.map(async en=>{
        const parsed=await parseFile(en);
        return parsed?{...en,...parsed}:null;
      }));
      const sorted=results.filter(Boolean).sort((a,b)=>dcEpNum(a.cap)-dcEpNum(b.cap));
      // Recurrencia de personajes principales entre episodios
      const seen={};
      sorted.forEach(en=>{
        const princ=en.data.filter(r=>r.tipo==="Principal");
        princ.forEach(r=>{r.prevEps=(seen[r.personaje.toLowerCase()]||[]).slice();});
        princ.forEach(r=>{const k=r.personaje.toLowerCase();if(!seen[k])seen[k]=[];seen[k].push(en.cap);});
      });
      // Plan de copiado Netflix (episodio fuente que minimiza ediciones) + alertas de nombres
      dcBuildPlans(sorted);
      setWarnings(dcWarnings(sorted));
      setProcessed(sorted);
      addLog(sorted.length?"✔ Procesamiento completado":"Sin archivos válidos",sorted.length?"ok":"err");
    }finally{setBusy(false);}
  };

  const download=()=>{
    if(!processed.length){s.showToast("Primero procesa los archivos");return;}
    try{
      const wb2=XLSX.utils.book_new();
      const usedNames=[];
      if(isNetflix){
        XLSX.utils.book_append_sheet(wb2,dcBuildCrewSheet(),"Producción");
        if(processed.length>1)XLSX.utils.book_append_sheet(wb2,dcBuildMatrixSheet(processed),"Matriz");
        XLSX.utils.book_append_sheet(wb2,dcBuildAlertSheet(warnings),"Alertas Netflix");
      }
      processed.forEach(en=>{
        const ws=dcBuildSheet(en,{plan:isNetflix});
        let sn=en.cap.replace(/[:\\\/?*\[\]]/g,"").slice(0,28);
        let fn=sn,k=1;
        while(usedNames.includes(fn))fn=sn.slice(0,24)+"_"+k++;
        usedNames.push(fn);
        XLSX.utils.book_append_sheet(wb2,ws,fn);
      });
      const out=XLSX.write(wb2,{bookType:"xlsx",type:"array",cellStyles:true});
      const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const url=URL.createObjectURL(blob);
      const caps=processed.map(en=>en.cap);
      const nums=processed.map(en=>dcFmtEp(en.cap)).filter(x=>x&&/^\d+$/.test(x));
      const names=caps.map(c=>c.replace(/[\s_\-]*\d{2,4}\s*$/,"").trim()).filter(Boolean);
      let prog=names[0]||"PROGRAMA";names.forEach(nm=>{let i=0;while(i<prog.length&&i<nm.length&&prog[i].toUpperCase()===nm[i].toUpperCase())i++;prog=prog.slice(0,i);});
      prog=(prog.replace(/[\s_\-]+$/,"").trim()||names[0]||"PROGRAMA").toUpperCase();
      const fname=("DUBCARD_"+prog+"_"+(nums.length?nums.join("-"):new Date().toISOString().slice(0,10))).replace(/[\\/:*?"<>|]+/g,"")+".xlsx";
      const a=Object.assign(document.createElement("a"),{href:url,download:fname});
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);
      s.showToast("⬇ "+fname);
    }catch(e){s.showToast("Error: "+e.message);}
  };

  const Section=({label,rows,headers,rowFn})=>(
    <div style={{marginBottom:14}}>
      <div style={{color:"var(--accent-cyan)",fontWeight:700,fontSize:11,margin:"10px 0 5px",textTransform:"uppercase",letterSpacing:"0.5px"}}>{label} ({rows.length})</div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11.5,borderRadius:8,overflow:"hidden"}}>
          <thead><tr>{["#",...headers.slice(1)].map((h,i)=><th key={i} style={{background:"var(--bg-card)",color:"var(--text-secondary)",padding:"7px 10px",textAlign:"left",fontWeight:600,fontSize:10,textTransform:"uppercase"}}>{h}</th>)}</tr></thead>
          <tbody>
            {rows.map((r,i)=>{
              const{cells,bg}=rowFn(r);
              return(<tr key={i} style={{background:bg,color:"#111"}}>{[i+1,...cells].map((v,c)=><td key={c} style={{padding:"6px 10px",borderBottom:"1px solid rgba(0,0,0,0.08)"}}>{v??""}</td>)}</tr>);
            })}
          </tbody>
        </table>
      </div>
    </div>
  );

  const Chip=({cls,children})=>{const c={add:["rgba(52,211,153,0.15)","var(--accent-emerald)"],del:["rgba(251,113,133,0.15)","var(--accent-rose)"],re:["rgba(251,146,60,0.18)","var(--accent-orange)"],ok:["rgba(52,211,153,0.1)","var(--accent-emerald)"]}[cls]||["var(--bg-card)","var(--text-secondary)"];return <span style={{display:"inline-block",background:c[0],color:c[1],borderRadius:99,padding:"3px 10px",margin:"2px 4px 2px 0",fontSize:11}}>{children}</span>;};
  const Sub=({children})=><div style={{fontWeight:700,fontSize:10.5,textTransform:"uppercase",letterSpacing:"0.04em",margin:"10px 0 4px",color:"var(--text-muted)"}}>{children}</div>;
  const Plan=({en})=>{
    const pl=en.plan;
    return(
      <div style={{background:"var(--bg-card)",border:"1px solid rgba(129,140,248,0.35)",borderRadius:12,padding:"12px 14px",marginBottom:14,fontSize:12}}>
        <div style={{fontWeight:700,color:"var(--accent-indigo)",fontSize:12.5,marginBottom:8}}>📋 Plan de Copiado — Netflix Dub Talent List</div>
        {!pl?<div style={{color:"var(--text-secondary)",lineHeight:1.5}}>🆕 <b>Primer episodio:</b> créalo completo en la herramienta ({dcCastMap(en).size} principales + {dcAdicSet(en).size} talentos adicionales + crew). Luego usa el botón <b>Copy</b> de Netflix a nivel de episodio para los siguientes.</div>:
        <React.Fragment>
          <div style={{background:"rgba(129,140,248,0.12)",borderRadius:8,padding:"8px 12px",marginBottom:6,color:"var(--text-primary)",fontWeight:600}}>1️⃣ En Netflix: pulsa COPY en «{pl.srcCap}» y PASTE en este episodio</div>
          <Sub>✅ Se mantienen sin cambios ({pl.keep.length}) — no toques nada</Sub>
          {pl.reassign.length>0&&<React.Fragment><Sub>⚠️ 2️⃣ Reasignar talento ({pl.reassign.length}) — mismo personaje, otro actor</Sub><div>{pl.reassign.map((r,i)=><Chip key={i} cls="re">{r.personaje}: {r.antes} → {r.ahora}</Chip>)}</div></React.Fragment>}
          {pl.del.length>0&&<React.Fragment><Sub>🗑️ 3️⃣ Eliminar del pegado ({pl.del.length})</Sub><div>{pl.del.map((r,i)=><Chip key={i} cls="del">{r.personaje}</Chip>)}</div></React.Fragment>}
          {pl.add.length>0&&<React.Fragment><Sub>➕ 4️⃣ Crear nuevos ({pl.add.length})</Sub><div>{pl.add.map((r,i)=><Chip key={i} cls="add">{r.personaje} — {r.talento||"Sin asignar"}</Chip>)}</div></React.Fragment>}
          {(pl.aDel.length||pl.aAdd.length)?<React.Fragment><Sub>👥 Additional Cast (solo talentos): quitar {pl.aDel.length} · agregar {pl.aAdd.length}</Sub><div>{pl.aDel.map((t,i)=><Chip key={"d"+i} cls="del">{t}</Chip>)}{pl.aAdd.map((t,i)=><Chip key={"a"+i} cls="add">{t}</Chip>)}</div></React.Fragment>:<Sub>👥 Additional Cast: idéntico al episodio fuente ✅</Sub>}
          <div style={{marginTop:8,color:"var(--text-muted)",fontSize:11}}>Total de ediciones tras el paste: {pl.reassign.length+pl.del.length+pl.add.length+pl.aDel.length+pl.aAdd.length} (vs. crear {dcCastMap(en).size+dcAdicSet(en).size} registros desde cero)</div>
        </React.Fragment>}
      </div>
    );
  };
  const Matrix=({eps})=>{
    const rows=dcMatrixRows(eps);
    return(
      <div style={{marginBottom:22}}>
        <div style={{color:"var(--accent-cyan)",fontWeight:700,fontSize:11,margin:"10px 0 6px",textTransform:"uppercase",letterSpacing:"0.5px"}}>🧩 Matriz de Recurrencia (Personaje × Episodio)</div>
        <div style={{overflow:"auto",maxHeight:440,border:"1px solid var(--border-subtle)",borderRadius:12,background:"var(--bg-secondary)"}}>
          <table style={{borderCollapse:"collapse",fontSize:11.5,whiteSpace:"nowrap",minWidth:"100%"}}>
            <thead><tr>{["Personaje",...eps.map(e=>dcFmtEp(e.cap))].map((t,i)=><th key={i} style={{position:"sticky",top:0,left:i===0?0:"auto",zIndex:i===0?3:2,background:"var(--bg-card)",color:"var(--text-secondary)",padding:"7px 10px",textAlign:"left",fontWeight:600,fontSize:10,textTransform:"uppercase"}}>{t}</th>)}</tr></thead>
            <tbody>{rows.map((r,i)=><tr key={i}><td style={{position:"sticky",left:0,zIndex:1,background:"var(--bg-card)",fontWeight:600,padding:"6px 10px",borderBottom:"1px solid var(--border-subtle)",color:"var(--text-primary)"}}>{r.name}</td>{eps.map((_,ei)=><td key={ei} style={{padding:"6px 10px",borderBottom:"1px solid var(--border-subtle)",background:r.changed[ei]?"rgba(251,146,60,0.2)":"transparent",color:r.changed[ei]?"var(--accent-orange)":"var(--text-secondary)",fontWeight:r.changed[ei]?700:400}}>{r.byEp[ei]??""}</td>)}</tr>)}</tbody>
          </table>
        </div>
      </div>
    );
  };

  return(
    <div className="dc-view" style={{padding:"24px",maxWidth:"980px",margin:"0 auto"}}>
      <h2 style={{fontSize:"22px",fontWeight:700,marginBottom:4,color:"var(--accent-cyan)"}}>▤ Dubcards — Procesador de Casting</h2>
      <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:18}}>Sube uno o varios archivos .xlsm / .xlsx por episodio (hojas DESGLOCE + CASTING)</div>

      <div style={{background:"rgba(167,139,250,0.05)",border:"2px dashed rgba(167,139,250,0.3)",borderRadius:16,padding:32,textAlign:"center",cursor:"pointer",marginBottom:16}}
           onClick={()=>fileInputRef.current&&fileInputRef.current.click()}
           onDragOver={e=>e.preventDefault()}
           onDrop={e=>{e.preventDefault();handleFiles(e.dataTransfer.files);}}>
        <input type="file" ref={fileInputRef} multiple accept=".xlsm,.xlsx,.xls" onChange={e=>{handleFiles(e.target.files);e.target.value="";}} style={{display:"none"}}/>
        <div style={{fontSize:26,marginBottom:8}}>📁</div>
        <div style={{fontWeight:600,color:"var(--accent-cyan)"}}>Haz clic o arrastra tus archivos</div>
        <div style={{fontSize:11,color:"var(--text-muted)",marginTop:4}}>.xlsm · .xlsx · .xls · Varios a la vez</div>
      </div>

      {entries.length>0&&<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
        {entries.map((e,i)=>(
          <div key={e.name} style={{background:"var(--bg-secondary)",border:"1px solid var(--border-subtle)",borderRadius:10,padding:"9px 12px",display:"flex",alignItems:"center",gap:10,fontSize:12}}>
            <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:600}}>📄 {e.name}</span>
            <input value={e.cap} placeholder="Capítulo" onChange={ev=>{const v=ev.target.value;setEntries(en=>en.map((x,j)=>j===i?{...x,cap:v}:x));}} style={{background:"var(--bg-input)",border:"1px solid var(--border-subtle)",borderRadius:8,color:"var(--text-primary)",padding:"5px 10px",fontSize:11,width:150,outline:"none"}}/>
            <button onClick={()=>setEntries(en=>en.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:"var(--accent-rose)",cursor:"pointer",fontSize:15}}>✕</button>
          </div>
        ))}
      </div>}

      {entries.length>0&&<button onClick={requestProcess} disabled={busy} className="dc-btn" style={{width:"100%",background:"linear-gradient(135deg,#6366f1,#818cf8)",color:"#fff",padding:"13px 0",borderRadius:10,border:"none",fontWeight:700,cursor:busy?"wait":"pointer",marginBottom:14,opacity:busy?0.7:1,fontSize:13}}>
        {busy?<span><span className="dc-spin" style={{marginRight:8}}>⟳</span>Procesando…</span>:"⚙️ Procesar"}
      </button>}

      {logs.length>0&&<div style={{background:"var(--bg-input)",border:"1px solid var(--border-subtle)",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:10.5,fontFamily:"monospace",maxHeight:190,overflowY:"auto",lineHeight:1.7,whiteSpace:"pre-wrap"}}>
        {logs.map((l,i)=><div key={i} style={{color:l.cls==="ok"?"var(--accent-emerald)":l.cls==="err"?"var(--accent-rose)":"var(--text-secondary)"}}>{l.msg}</div>)}
      </div>}

      {processed.length>0&&<button onClick={download} className="dc-btn" style={{width:"100%",background:"linear-gradient(135deg,#10b981,#34d399)",color:"#fff",padding:"13px 0",borderRadius:10,border:"none",fontWeight:700,cursor:"pointer",marginBottom:20,fontSize:13}}>⬇️ Descargar Excel</button>}

      {askClient&&<DubcardClientDialog initial={client||lastClient()} onDone={onClientChosen}/>}
      {client&&processed.length>0&&<div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",background:"var(--bg-secondary)",border:"1px solid var(--border-subtle)",borderRadius:10,padding:"9px 14px",marginBottom:16,fontSize:12}}>
        <span style={{color:"var(--text-muted)"}}>Cliente:</span><b style={{color:"var(--text-primary)"}}>{isNetflix?"Netflix":client.name}</b>
        <span style={{color:"var(--text-muted)",flex:1,minWidth:200}}>{isNetflix?"formato completo con hojas Producción, Matriz, Alertas Netflix y plan de copiado":"sólo hojas de episodios (sin las 3 hojas iniciales ni el plan de Netflix)"}</span>
        <button className="dc-btn" onClick={()=>{pendingRef.current=null;setAskClient(true);}} style={btnG({padding:"5px 12px",fontSize:11})}>Cambiar</button>
      </div>}
      {isNetflix&&warnings.length>0&&<div style={{background:"rgba(251,191,36,0.1)",border:"1px solid rgba(251,191,36,0.45)",borderRadius:12,padding:"12px 16px",fontSize:12,color:"var(--accent-amber)",marginBottom:20,lineHeight:1.6}}><b>⚠️ Revisa antes de cargar en Netflix</b> (evita crear talentos duplicados):{warnings.map((w,i)=><div key={i}>{w}</div>)}</div>}
      {isNetflix&&processed.length>1&&<Matrix eps={processed}/>}

      {processed.map(en=>{
        const{princ,adicNorm,adicComp}=dcSplitRows(en.data);
        return(
          <div key={en.name} className="dc-card" style={{background:"var(--bg-secondary)",border:"1px solid var(--border-subtle)",borderRadius:14,padding:16,marginBottom:22}}>
            <div style={{background:"linear-gradient(90deg,#6366f1,#818cf8)",color:"#fff",fontWeight:700,padding:"9px 16px",borderRadius:10,marginBottom:8,fontSize:13}}>📽️ {en.cap}</div>
            {isNetflix&&<Plan en={en}/>}
            {isNetflix&&<Section label="🎬 Equipo de Producción" rows={DC_CREW} headers={["#","Rol","Nombre"]} rowFn={r=>({cells:[r.rol,r.nombre],bg:"#e0e7ff"})}/>}
            <Section label="🎭 Principales" rows={princ} headers={["#","Personaje","Talento","Nota"]} rowFn={r=>{
              const rec=r.prevEps&&r.prevEps.length?"🔁 EP "+r.prevEps.map(dcFmtEp).join(", EP "):"";
              return{cells:[r.personaje,r.talento||"Sin asignar",rec],bg:r.talento?"#bbf7d0":"#fecaca"};
            }}/>
            <Section label="👥 Adicionales" rows={adicNorm} headers={["#","Personaje","Talento","Nota"]} rowFn={r=>({cells:[r.personaje,r.talento||"Sin asignar",""],bg:r.talento?"#fef08a":"#fecaca"})}/>
            <Section label="⚠️ Adicionales compartidos" rows={adicComp} headers={["#","Personaje","Talento","Nota"]} rowFn={r=>({cells:[r.personaje,r.talento,"⚠️ Compartido"],bg:"#ddd6fe"})}/>
          </div>
        );
      })}

      {processed.length>0&&<button onClick={download} className="dc-btn" style={{width:"100%",background:"linear-gradient(135deg,#10b981,#34d399)",color:"#fff",padding:"13px 0",borderRadius:10,border:"none",fontWeight:700,cursor:"pointer",marginBottom:30,fontSize:13}}>⬇️ Descargar Excel</button>}
    </div>
  );
}


function DashboardView(){
  const s=useApp();
  const enCurso=s.data.series.filter(sr=>sr.status==="en_curso").length;
  const completo=s.data.series.filter(sr=>sr.status==="completo").length;
  const epsPendiente=useMemo(()=>s.data.episodes.filter(ep=>(ep.status||"en_curso")==="pendiente").length,[s.data.episodes]);
  const epsEnCurso=useMemo(()=>s.data.episodes.filter(ep=>(ep.status||"en_curso")==="en_curso").map(ep=>{const sr=s.derived.seriesMap[ep.series_id];const st=STUDIOS.find(x=>x.id===ep.studio_id);return{...ep,seriesName:sr?sr.name:"",studioName:st?st.name:"",col:st?SCOLS[(ep.studio_id-1)||0]:"var(--text-muted)"};}),[s.data.episodes,s.derived.seriesMap,s.data.studios]);
  
  // Información detallada por estudio para el dashboard mejorado
  const studioDetails=useMemo(()=>{
    return STUDIOS.map((st,i)=>{
      const stEps=s.data.episodes.filter(e=>e.studio_id===st.id);
      const activeEps=stEps.filter(e=>(e.status||"en_curso")==="en_curso");
      const seen={};stEps.forEach(e=>{seen[e.series_id]=true;});
      const stProgs=s.data.series.filter(p=>seen[p.id]);
      const activeProgs=stProgs.filter(p=>p.status==="en_curso");
      // Talentos activos en este estudio
      const activeEpIds=new Set(activeEps.map(e=>e.id));
      const activeTalentIds=new Set();
      s.data.castings.forEach(c=>{if(activeEpIds.has(c.episode_id))activeTalentIds.add(c.talent_id);});
      const activeTalents=[...activeTalentIds].map(tid=>s.derived.talentMap[tid]).filter(Boolean);
      const tm=s.data.team.filter(t=>t.studio_id===st.id);
      return{...st,idx:i,col:SCOLS[i],totalEps:stEps.length,activeEps,activeProgs,allProgs:stProgs,activeTalents,team:tm,isActive:activeEps.length>0};
    });
  },[s.data,s.derived]);

  return(
    <div className="dc-view">
      {/* ── HERO BANNER ── */}
      <div className="hero-banner" style={{padding:"28px 32px",marginBottom:22,position:"relative"}}>
        {/* Background grid */}
        <div style={{position:"absolute",inset:0,backgroundImage:"linear-gradient(rgba(167,139,250,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,0.03) 1px,transparent 1px)",backgroundSize:"30px 30px",borderRadius:"inherit",pointerEvents:"none"}}/>
        <div style={{position:"relative",zIndex:1}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:24}}>
            <div style={{flex:1}}>
              <div style={{fontSize:9,fontWeight:700,color:"rgba(167,139,250,0.5)",letterSpacing:"0.22em",textTransform:"uppercase",fontFamily:"'Inter',sans-serif",marginBottom:10}}>◆ Sistema Activo</div>
              <div style={{fontSize:30,fontWeight:900,letterSpacing:"-0.01em",color:"var(--text-primary)",fontFamily:"'Inter',sans-serif",lineHeight:1.05,textShadow:"0 0 30px rgba(167,139,250,0.35)",marginBottom:10}}>
                DUBLAJECAST
                <span style={{display:"block",fontSize:13,fontWeight:400,color:"var(--accent-cyan)",letterSpacing:"0.12em",textShadow:"0 0 14px rgba(167,139,250,0.6)",marginTop:4}}>CASTING MANAGEMENT SYSTEM</span>
              </div>
              <div style={{fontSize:12,color:"var(--text-secondary)",lineHeight:1.6,maxWidth:520}}>
                Gestión profesional de casting y asignación para estudios de doblaje latino.
              </div>
            </div>
            {/* Status indicators */}
            <div style={{display:"flex",flexDirection:"column",gap:8,flexShrink:0,alignItems:"flex-end"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(0,255,163,0.08)",border:"1px solid rgba(0,255,163,0.2)",borderRadius:6,padding:"6px 12px"}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:"#34D399",boxShadow:"0 0 10px rgba(0,255,163,0.9)",animation:"breathe 2s infinite"}}/>
                <span style={{fontSize:10,color:"#34D399",fontWeight:700,fontFamily:"'Inter',sans-serif",letterSpacing:"0.08em"}}>ONLINE</span>
              </div>
              <div style={{fontSize:9,color:"var(--text-muted)",fontFamily:"'Inter',sans-serif",letterSpacing:"0.06em",textAlign:"right"}}>
                {new Date().toLocaleDateString("es",{weekday:"long",day:"2-digit",month:"short",year:"numeric"}).toUpperCase()}
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* ── STATS GRID ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:22}}>
        {[
          {l:"Estudios",v:STUDIOS.length,c:"var(--accent-indigo)",bg:"rgba(77,159,255,0.06)",icon:"▣",border:"rgba(77,159,255,0.18)"},
          {l:"Programas",v:s.data.series.length,c:"var(--accent-cyan)",bg:"rgba(167,139,250,0.05)",icon:"◈",border:"rgba(167,139,250,0.18)"},
          {l:"Episodios",v:s.data.episodes.length,c:"var(--accent-emerald)",bg:"rgba(0,255,163,0.05)",icon:"◫",border:"rgba(0,255,163,0.18)"},
          {l:"Talentos",v:s.data.talents.length,c:"var(--accent-amber)",bg:"rgba(255,204,0,0.05)",icon:"◉",border:"rgba(255,204,0,0.18)"}
        ].map((st,i)=>(
          <div key={st.l} className="stat-card" style={{background:st.bg,borderColor:st.border,animation:`statCount 400ms ${i*80}ms cubic-bezier(0.34,1.56,0.64,1) both`}}>
            <div style={{position:"absolute",top:14,right:16,fontSize:22,color:st.c,opacity:0.15,fontWeight:900}}>{st.icon}</div>

            <div style={{fontSize:9,color:st.c,marginTop:8,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.14em",opacity:0.75,fontFamily:"'Inter',sans-serif"}}>{st.l}</div>
            {/* Bottom accent */}
            <div style={{position:"absolute",bottom:0,left:0,right:0,height:2,background:`linear-gradient(90deg,transparent,${st.c},transparent)`,opacity:0.4}}/>
          </div>

      </div>

      {/* ── STATUS ROW ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:22}}>
        {[
          {v:s.data.series.filter(sr=>sr.status==="en_curso").length,l:"En Curso",c:"#fbbf24",bg:"rgba(251,191,36,0.05)",border:"rgba(251,191,36,0.18)"},
          {v:s.data.series.filter(sr=>sr.status==="completo").length,l:"Completados",c:"#34d399",bg:"rgba(52,211,153,0.05)",border:"rgba(52,211,153,0.18)"},
          {v:s.data.episodes.filter(ep=>(ep.status||"en_curso")==="en_curso").length,l:"Eps. Activos",c:"#A78BFA",bg:"rgba(167,139,250,0.04)",border:"rgba(167,139,250,0.15)"}
        ].map((x,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:14,background:x.bg,border:"1px solid "+x.border,borderRadius:"var(--radius-lg)",padding:"16px 20px",position:"relative",overflow:"hidden"}}>
            <div style={{width:3,height:"70%",background:x.c,borderRadius:2,boxShadow:"0 0 10px "+x.c+"80",flexShrink:0}}/>
            <div>
              <div style={{fontWeight:900,fontSize:24,color:x.c,lineHeight:1,fontFamily:"'Inter',sans-serif",textShadow:`0 0 16px ${x.c}50`}}>{x.v}</div>
              <div style={{fontSize:10,color:x.c,fontWeight:600,marginTop:4,opacity:0.7,textTransform:"uppercase",letterSpacing:"0.08em"}}>{x.l}</div>
            </div>
          </div>
        ))}
      </div>

      {/* ── QUICK NAV ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:26}}>
        {[{l:"Programas",sub:"Series y películas",c:"var(--accent-sky)",icon:"◈",v:"allprograms"},{l:"Talentos",sub:"Directorio de actores",c:"var(--accent-amber)",icon:"◉",v:"talents"},{l:"Ocupación",sub:"Filtros avanzados",c:"var(--accent-emerald)",icon:"◫",v:"ocupacion"}].map(b=>(
          <button key={b.l} onClick={()=>s.navTo(b.v)} className="dc-btn dc-card" style={{background:"var(--bg-card)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:"var(--radius-lg)",padding:"20px",cursor:"pointer",textAlign:"left",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:b.c,boxShadow:"0 0 10px "+b.c+"80"}}/>
            <div style={{position:"absolute",top:-20,right:-20,width:80,height:80,borderRadius:"50%",background:b.c,opacity:0.04,filter:"blur(20px)"}}/>
            <div style={{fontSize:20,marginBottom:10,color:b.c,textShadow:"0 0 10px "+b.c+"60"}}>{b.icon}</div>
            <div style={{fontWeight:800,fontSize:13,color:"var(--text-primary)",marginBottom:4,fontFamily:"'Inter',sans-serif",letterSpacing:"0.04em"}}>{b.l}</div>
            <div style={{fontSize:10,color:"var(--text-muted)"}}>{b.sub}</div>
          </button>
        ))}
      </div>

      <DashboardSearch data={s.data} derived={s.derived} navTo={s.navTo} setSelSeriesId={s.setSelSeriesId} setSelStudio={s.setSelStudio} setSelTalentId={s.setSelTalentId}/>

      {/* ── STUDIO GRID ── */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <div style={{width:3,height:16,background:"var(--accent-cyan)",borderRadius:2,boxShadow:"0 0 8px rgba(167,139,250,0.6)"}}/>
        <span style={{fontWeight:800,fontSize:11,color:"var(--text-secondary)",textTransform:"uppercase",letterSpacing:"0.14em",fontFamily:"'Inter',sans-serif"}}>Estado de Estudios</span>
        <div style={{flex:1,height:1,background:"linear-gradient(90deg,rgba(167,139,250,0.15),transparent)"}}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:26}}>
        {studioDetails.map(st=>{
          const hasActivity=st.isActive;

              <div style={{height:2,background:hasActivity?`linear-gradient(90deg,transparent,${st.col},transparent)`:"rgba(255,255,255,0.04)",boxShadow:hasActivity?`0 0 8px ${st.col}60`:""}}/>
              <div style={{padding:"14px 16px"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>

                  {hasActivity&&<span style={{fontSize:7,fontWeight:800,color:"#34d399",background:"rgba(52,211,153,0.1)",padding:"2px 7px",borderRadius:4,textTransform:"uppercase",letterSpacing:"0.08em",fontFamily:"'Inter',sans-serif",border:"1px solid rgba(52,211,153,0.2)"}}>ON</span>}

                  {[{v:st.activeEps.length,l:"EPS",c:st.col},{v:st.activeProgs.length,l:"PROG",c:"var(--accent-sky)"},{v:st.activeTalents.length,l:"TAL",c:"var(--accent-amber)"}].map(x=>
                    <div key={x.l} style={{background:"rgba(255,255,255,0.03)",borderRadius:6,padding:"6px 2px",border:"1px solid rgba(255,255,255,0.03)"}}>
                      <div style={{fontWeight:900,fontSize:18,color:x.c,fontFamily:"'Inter',sans-serif",textShadow:`0 0 10px ${x.c}50`}}>{x.v}</div>
                      <div style={{fontSize:7,color:"var(--text-muted)",textTransform:"uppercase",marginTop:1,letterSpacing:"0.08em"}}>{x.l}</div>
                    </div>
                  )}
                </div>
                {st.activeProgs.slice(0,2).map(p=>(
                  <div key={p.id} style={{fontSize:9,color:"var(--text-secondary)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginBottom:2,display:"flex",alignItems:"center",gap:4}}>
                    <span style={{width:3,height:3,borderRadius:"50%",background:st.col,display:"inline-block",flexShrink:0,boxShadow:"0 0 4px "+st.col}}/>

                  </div>
                ))}
                {!hasActivity&&<div style={{fontSize:9,color:"var(--text-muted)",textAlign:"center",padding:"8px 0",letterSpacing:"0.06em"}}>Sin actividad</div>}
              </div>
            </div>
          );
        })}
      </div>

      {/* ── EPISODES IN PROGRESS ── */}
      {epsEnCurso.length>0&&(
        <div style={{marginBottom:24}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <div style={{width:3,height:16,background:"var(--accent-amber)",borderRadius:2,boxShadow:"0 0 8px rgba(255,204,0,0.6)"}}/>
            <span style={{fontWeight:800,fontSize:11,color:"var(--text-secondary)",textTransform:"uppercase",letterSpacing:"0.14em",fontFamily:"'Inter',sans-serif"}}>Episodios en curso ({epsEnCurso.length})</span>
            <div style={{flex:1,height:1,background:"linear-gradient(90deg,rgba(255,204,0,0.15),transparent)"}}/>
          </div>

            {epsEnCurso.map(ep=>(
              <div key={ep.id} className="dc-card" style={{...CARD_S,padding:"14px 16px",cursor:"pointer",borderLeft:"2px solid "+ep.col,boxShadow:"inset 4px 0 0 "+ep.col+"20"}} onClick={()=>{s.setSelSeriesId(ep.series_id);s.navTo("series");}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                  <span style={{fontWeight:800,fontSize:11,color:ep.col,fontFamily:"'Inter',sans-serif"}}>EP {ep.episode_number}</span>
                  <span style={{fontSize:10,color:"var(--text-muted)"}}>{ep.title}</span>
                </div>
                <div style={{fontSize:11,fontWeight:600,color:"var(--text-primary)",marginBottom:6,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ep.seriesName}</div>
                {ep.studioName&&<Pill c={ep.col} txt={ep.studioName}/>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   PROGRAMS VIEW
   ══════════════════════════════════════════════════════════════ */
function ProgramsView(){
  const s=useApp();const[filter,setFilter]=useState("en_curso");
  const[rawQ,setRawQ]=useState("");const q=useDebounce(rawQ,200);const searchRef=useRef(null);
  const enCurso=s.data.series.filter(sr=>sr.status==="en_curso").length;const completo=s.data.series.filter(sr=>sr.status==="completo").length;
  // Buscador: nombre, cliente o director (sin acentos ni mayúsculas); con texto se busca en todos los estados
  const filtered=useMemo(()=>{
    let list=filter==="todos"?s.data.series:s.data.series.filter(sr=>sr.status===filter);
    const nq=normN(q);
    if(nq)list=list.filter(sr=>normN(sr.name).includes(nq)||normN(sr.cliente||"").includes(nq)||normN(sr.director||"").includes(nq));
    return list;
  },[s.data.series,filter,q]);
  const matchesElsewhere=useMemo(()=>{const nq=normN(q);if(!nq||filter==="todos")return 0;return s.data.series.filter(sr=>sr.status!==filter&&(normN(sr.name).includes(nq)||normN(sr.cliente||"").includes(nq)||normN(sr.director||"").includes(nq))).length;},[s.data.series,filter,q]);
  useEffect(()=>{const h=e=>{if(e.key==="/"&&!/input|textarea|select/i.test((e.target&&e.target.tagName)||"")){e.preventDefault();searchRef.current&&searchRef.current.focus();}};document.addEventListener("keydown",h);return()=>document.removeEventListener("keydown",h);},[]);
  return(
    <div className="dc-view">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <BackBtn/>
          <div><div style={{fontWeight:800,fontSize:18,letterSpacing:"-0.02em",color:"var(--text-primary)"}}>Programas</div><div style={{fontSize:12,color:"var(--text-muted)",marginTop:2}}>{filtered.length} de {s.data.series.length}</div></div>
        </div>
        <button onClick={()=>s.setModal("program")} className="dc-btn" style={btnP()}>+ Nuevo</button>
      </div>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:18}}>
        <div style={{position:"relative",flex:"1 1 260px",maxWidth:420}}>
          <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",fontSize:13,color:"var(--text-muted)",pointerEvents:"none"}}>🔍</span>
          <input ref={searchRef} value={rawQ} onChange={e=>setRawQ(e.target.value)} placeholder="Buscar programa, cliente o director…  ( / )" style={{...SIPT,paddingLeft:32,paddingRight:rawQ?30:10,fontSize:12}}/>
          {rawQ&&<button onClick={()=>{setRawQ("");searchRef.current&&searchRef.current.focus();}} title="Limpiar" style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--text-muted)",fontSize:14,lineHeight:1}}>×</button>}
        </div>
        <FilterTabs value={filter} onChange={setFilter} options={[{k:"todos",label:"Todos",count:s.data.series.length},{k:"en_curso",label:"En curso",count:enCurso},{k:"completo",label:"Completados",count:completo}]}/>
      </div>
      {q&&!filtered.length&&<div style={{...CARD_S,padding:24,textAlign:"center",color:"var(--text-muted)",fontSize:12,marginBottom:12}}>Ningún programa coincide con «{q}»{matchesElsewhere>0?<span> en esta pestaña. Hay {matchesElsewhere} en otro estado: <button onClick={()=>setFilter("todos")} style={{background:"none",border:"none",color:"var(--accent-cyan)",cursor:"pointer",fontSize:12,fontWeight:700,padding:0}}>ver en «Todos»</button></span>:"."}</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:12}}>
        {filtered.map(sr=>{
          const eps=s.derived.epsBySeries[sr.id]||[];const stSeen={};eps.forEach(e=>{if(e.studio_id)stSeen[e.studio_id]=true;});const stIds=Object.keys(stSeen).map(Number);const isComplete=sr.status==="completo";const sc=STATUS_CFG[sr.status]||STATUS_CFG.en_curso;
          return(
            <div key={sr.id} className="dc-card" style={{...CARD_S,overflow:"hidden",opacity:isComplete?0.8:1}}>
              <div style={{height:3,background:isComplete?"var(--accent-emerald)":"linear-gradient(90deg,#8B5CF6,#4D9FFF)",boxShadow:isComplete?"0 0 6px rgba(0,255,163,0.5)":"0 0 6px rgba(167,139,250,0.4)"}}/>
              <div style={{padding:"16px 18px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div style={{flex:1,marginRight:8}}><div style={{fontWeight:700,fontSize:14,letterSpacing:"-0.01em",color:"var(--text-primary)"}}>{sr.name}</div><div style={{fontSize:10,color:"var(--text-muted)",marginTop:3}}>{sr.type}</div></div>
                  <div style={{display:"flex",gap:3,alignItems:"center"}}><button onClick={()=>s.setEditProgId(sr.id)} className="dc-btn" style={btnS({fontSize:9,padding:"3px 7px"})}>✏</button>{s.delProgId===sr.id?<div style={{display:"flex",gap:2}}><button onClick={()=>{s.dispatch({type:"SERIES/DELETE",payload:sr.id});s.setDelProgId(null);s.showToast("✓ Eliminado");}} style={btnD({padding:"3px 6px",fontSize:10})}>Sí</button><button onClick={()=>s.setDelProgId(null)} style={btnG({padding:"3px 5px",fontSize:10})}>No</button></div>:<button onClick={()=>s.setDelProgId(sr.id)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text-muted)",fontSize:16,padding:"2px 4px"}}>×</button>}</div>
                </div>
                <button onClick={e=>{e.stopPropagation();s.dispatch({type:"SERIES/UPDATE",payload:{...sr,status:sr.status==="completo"?"en_curso":"completo"}});s.showToast(sr.status==="completo"?"En curso":"Completado");}} className="dc-btn" style={{display:"inline-flex",alignItems:"center",gap:5,background:sc.bg,border:"1px solid "+sc.border,borderRadius:99,padding:"4px 12px",marginBottom:10,cursor:"pointer"}}><div style={{width:6,height:6,borderRadius:"50%",background:sc.color,flexShrink:0}}/><span style={{fontSize:10,color:sc.color,fontWeight:600}}>{sc.label}</span></button>
                {sr.director&&<div style={{fontSize:10,color:"var(--text-muted)",marginBottom:4}}>Dir: {sr.director}</div>}
                <div style={{fontSize:11,color:"var(--text-secondary)",marginBottom:8}}>{eps.length} episodios</div>
                {stIds.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:10}}>{stIds.map(sid=><span key={sid} style={{fontSize:9,background:SCOLS[(sid-1)||0]+"18",color:SCOLS[(sid-1)||0],borderRadius:99,padding:"2px 8px",fontWeight:600}}>{STUDIOS.find(st=>st.id===sid)?.name||""}</span>)}</div>}
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>{s.setSelSeriesId(sr.id);s.navTo("series");}} className="dc-btn" style={btnP({flex:1,padding:"8px 0",background:isComplete?"linear-gradient(135deg,#059669,#34D399)":"linear-gradient(135deg,#8B5CF6,#4D9FFF)"})}>Abrir</button>
                  <button onClick={e=>{e.stopPropagation();exportSeriesCastingXLSX(s,sr);}} className="dc-btn" title="Exportar casting a Excel (todos los capítulos en una hoja)" style={btnG({padding:"8px 10px",fontSize:11,whiteSpace:"nowrap"})}>⬇ Casting</button>
                </div>
              </div>
            </div>
          );
        })}
        {!filtered.length&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:"48px 0",color:"var(--text-muted)",fontSize:13}}>No hay programas.</div>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   PENDING TALENTS PANEL
   ══════════════════════════════════════════════════════════════ */
function PendingTalentsPanel({s}){
  const[mergeId,setMergeId]=useState(null);
  const[mergeTarget,setMergeTarget]=useState("");
  const[dupSuggest,setDupSuggest]=useState(null);
  // Helper: update all queue rows linked to a pending talent ID
  const resolveRows=(ptId,assignedId)=>{
    s.setQueue(q=>q.map(item=>({...item,rows:item.rows.map(r=>r.pendingTalentId===ptId?{...r,assignedTalentId:assignedId||null,talentNotFound:false,pendingTalentId:null}:r)})));
  };
  const doApprove=(pt)=>{
    s.dispatch({type:"TALENTS/ADD",payload:{id:pt.id,name:pt.name,genero:"",edad_aparente:"",tono_de_voz:""}});
    resolveRows(pt.id,pt.id);
    s.setPendingTalents(p=>p.filter(x=>x.id!==pt.id));
    s.showToast("✓ Talento aprobado: "+pt.name);
  };
  const approve=(pt)=>{
    // Coincidencia exacta (p. ej. creado por otra fila o importado entre tanto): reutilizar, no duplicar
    const exact=s.data.talents.find(t=>normN(t.name)===normN(pt.name));
    if(exact){resolveRows(pt.id,exact.id);s.setPendingTalents(p=>p.filter(x=>x.id!==pt.id));s.showToast("✓ Ya existía: "+exact.name);return;}
    // Validación en segundo plano contra la base maestra (umbral 85%)
    const cand=bestTalentMatch(pt.name,s.data.talents);
    if(cand){setDupSuggest({pt,cand:cand.talent,score:cand.score});return;}
    doApprove(pt);
  };
  const mergePending=()=>{
    if(!dupSuggest)return;
    const{pt,cand}=dupSuggest;
    resolveRows(pt.id,cand.id);
    s.setPendingTalents(p=>p.filter(x=>x.id!==pt.id));
    s.showToast("✓ Unificado con \""+cand.name+"\"");
    setDupSuggest(null);
  };
  const confirmMerge=(pt)=>{
    if(!mergeTarget)return;
    resolveRows(pt.id,mergeTarget);
    s.setPendingTalents(p=>p.filter(x=>x.id!==pt.id));
    setMergeId(null);setMergeTarget("");
    s.showToast("✓ Unificado con talento existente");
  };
  const discard=(pt)=>{
    resolveRows(pt.id,null);
    s.setPendingTalents(p=>p.filter(x=>x.id!==pt.id));
    s.showToast("Descartado: "+pt.name);
  };
  if(!s.pendingTalents.length)return null;
  const sortedTalents=[...s.data.talents].sort((a,b)=>a.name.localeCompare(b.name));
  return(
    <div style={{...CARD_S,marginBottom:14,overflow:"hidden",border:"1px solid rgba(251,191,36,0.35)"}}>
      {dupSuggest&&<DupTalentModal rawName={dupSuggest.pt.name} cand={dupSuggest.cand} score={dupSuggest.score} onMerge={mergePending} onCreate={()=>{doApprove(dupSuggest.pt);setDupSuggest(null);}} onClose={()=>setDupSuggest(null)}/>}
      <div style={{padding:"12px 16px",background:"rgba(251,191,36,0.06)",borderBottom:"1px solid rgba(251,191,36,0.18)",display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:16}}>🕐</span>
        <span style={{fontWeight:700,fontSize:13,color:"var(--accent-amber)"}}>Talentos Pendientes de Validación</span>
        <span style={{background:"rgba(251,191,36,0.2)",color:"var(--accent-amber)",fontSize:10,fontWeight:700,padding:"1px 8px",borderRadius:99,marginLeft:2}}>{s.pendingTalents.length}</span>
      </div>
      <div style={{padding:"10px 16px 14px"}}>
        <div style={{fontSize:10,color:"var(--text-muted)",marginBottom:10,lineHeight:1.5}}>
          Los siguientes nombres fueron detectados en el desglose pero no existen en la base de datos maestra.<br/>
          <b style={{color:"var(--text-secondary)"}}>Aprueba</b> para registrarlos, <b style={{color:"var(--text-secondary)"}}>Unifica</b> si es un error de escritura, o <b style={{color:"var(--text-secondary)"}}>Descarta</b> si es un error de lectura.
        </div>
        {s.pendingTalents.map(pt=>(
          <div key={pt.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 0",borderTop:"1px solid var(--border-subtle)",flexWrap:"wrap"}}>
            <div style={{minWidth:180,flex:1}}>
              <div style={{fontWeight:700,color:"var(--accent-amber)",fontSize:12}}>{pt.name}</div>
              <div style={{fontSize:9,color:"var(--text-muted)",marginTop:1}}>Detectado en: {pt.sourceFile}</div>
            </div>
            {mergeId===pt.id?(
              <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                <select value={mergeTarget} onChange={e=>setMergeTarget(e.target.value)}
                  style={{padding:"3px 8px",border:"1px solid rgba(129,140,248,0.35)",borderRadius:6,fontSize:10,background:"var(--bg-input)",color:"var(--text-primary)",maxWidth:180}}>
                  <option value="">— seleccionar talento —</option>
                  {sortedTalents.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                </select>
                <button onMouseDown={()=>confirmMerge(pt)} style={{padding:"3px 10px",fontSize:10,background:"rgba(129,140,248,0.18)",border:"1px solid rgba(129,140,248,0.35)",borderRadius:6,color:"var(--accent-indigo)",fontWeight:600,cursor:"pointer"}}>OK</button>
                <button onMouseDown={()=>{setMergeId(null);setMergeTarget("");}} style={{padding:"3px 8px",fontSize:10,background:"none",border:"1px solid var(--border-default)",borderRadius:6,color:"var(--text-muted)",cursor:"pointer"}}>✕</button>
              </div>
            ):(
              <div style={{display:"flex",gap:5,flexShrink:0}}>
                <button onClick={()=>approve(pt)} style={{padding:"4px 11px",fontSize:10,background:"rgba(52,211,153,0.15)",border:"1px solid rgba(52,211,153,0.3)",borderRadius:6,color:"var(--accent-emerald)",fontWeight:600,cursor:"pointer"}}>✓ Aprobar</button>
                <button onClick={()=>{setMergeId(pt.id);setMergeTarget("");}} style={{padding:"4px 11px",fontSize:10,background:"rgba(129,140,248,0.12)",border:"1px solid rgba(129,140,248,0.25)",borderRadius:6,color:"var(--accent-indigo)",fontWeight:600,cursor:"pointer"}}>⇄ Unificar</button>
                <button onClick={()=>discard(pt)} style={{padding:"4px 11px",fontSize:10,background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:6,color:"#ef4444",fontWeight:600,cursor:"pointer"}}>✕ Descartar</button>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   PENDING PROJECTS PANEL (auto-provisioned series)
   ══════════════════════════════════════════════════════════════ */
function PendingProjectsPanel({s}){
  const pendingProjects=useMemo(()=>s.data.series.filter(x=>x.autoCreated),[s.data.series]);
  const[renameId,setRenameId]=useState(null);
  const[renameName,setRenameName]=useState("");
  const[mergeId,setMergeId]=useState(null);
  const[mergeTarget,setMergeTarget]=useState("");
  if(!pendingProjects.length)return null;
  // Reassign episodes + queue items from one series to another
  const reassignTo=(fromId,toId)=>{
    s.data.episodes.filter(e=>e.series_id===fromId).forEach(ep=>s.dispatch({type:"EPISODES/UPDATE",payload:{...ep,series_id:toId}}));
    s.setQueue(q=>q.map(item=>item.seriesId===fromId?{...item,seriesId:toId,autoCreatedSeries:false}:item));
  };
  const confirm=(proj)=>{
    s.dispatch({type:"SERIES/UPDATE",payload:{...proj,autoCreated:false}});
    s.setQueue(q=>q.map(item=>item.seriesId===proj.id?{...item,autoCreatedSeries:false}:item));
    s.showToast("✓ Proyecto confirmado: "+proj.name);
  };
  const syncProduccionName=(oldName,newName)=>{
    if(normN(oldName)===normN(newName))return;
    (s.data.produccion||[]).filter(r=>normN(r.programa)===normN(oldName)).forEach(r=>{
      const dup=(s.data.produccion||[]).find(x=>x.id!==r.id&&normN(x.programa)===normN(newName)&&x.capitulo===r.capitulo);
      if(dup)s.dispatch({type:"PRODUCCION/DELETE",payload:r.id});else s.dispatch({type:"PRODUCCION/UPDATE",payload:{...r,programa:newName}});
    });
  };
  const confirmRename=(proj)=>{
    const nm=renameName.trim();if(!nm)return;
    syncProduccionName(proj.name,nm);
    s.dispatch({type:"SERIES/UPDATE",payload:{...proj,name:nm,autoCreated:false}});
    s.setQueue(q=>q.map(item=>item.seriesId===proj.id?{...item,autoCreatedSeries:false}:item));
    setRenameId(null);setRenameName("");
    s.showToast("✓ Proyecto guardado: "+nm);
  };
  const confirmMerge=(proj)=>{
    if(!mergeTarget)return;
    const target=s.data.series.find(x=>x.id===Number(mergeTarget));
    if(target)syncProduccionName(proj.name,target.name);
    reassignTo(proj.id,Number(mergeTarget));
    s.dispatch({type:"SERIES/DELETE",payload:proj.id});
    setMergeId(null);setMergeTarget("");
    s.showToast("✓ Fusionado con proyecto existente");
  };
  const discard=(proj)=>{
    s.setQueue(q=>q.map(item=>item.seriesId===proj.id?{...item,seriesId:null,autoCreatedSeries:false}:item));
    s.dispatch({type:"SERIES/DELETE",payload:proj.id});
    s.showToast("Descartado: "+proj.name);
  };
  const existingSeries=s.data.series.filter(x=>!x.autoCreated).sort((a,b)=>a.name.localeCompare(b.name));
  return(
    <div style={{...CARD_S,marginBottom:14,overflow:"hidden",border:"1px solid rgba(167,139,250,0.35)"}}>
      <div style={{padding:"12px 16px",background:"rgba(167,139,250,0.06)",borderBottom:"1px solid rgba(167,139,250,0.18)",display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:16}}>🆕</span>
        <span style={{fontWeight:700,fontSize:13,color:"var(--accent-violet)"}}>Proyectos Creados Automáticamente</span>
        <span style={{background:"rgba(167,139,250,0.2)",color:"var(--accent-violet)",fontSize:10,fontWeight:700,padding:"1px 8px",borderRadius:99,marginLeft:2}}>{pendingProjects.length}</span>
      </div>
      <div style={{padding:"10px 16px 14px"}}>
        <div style={{fontSize:10,color:"var(--text-muted)",marginBottom:10,lineHeight:1.5}}>
          El sistema detectó los siguientes programas en los archivos cargados y los creó automáticamente.<br/>
          <b style={{color:"var(--text-secondary)"}}>Confirma</b> el nombre · <b style={{color:"var(--text-secondary)"}}>Renombra</b> si es necesario · <b style={{color:"var(--text-secondary)"}}>Fusiona</b> con un proyecto existente si ya estaba registrado.
        </div>
        {pendingProjects.map(proj=>{
          const epCount=s.data.episodes.filter(e=>e.series_id===proj.id).length;
          const qCount=s.queue.filter(q=>q.seriesId===proj.id).length;
          return(
            <div key={proj.id} style={{padding:"10px 0",borderTop:"1px solid var(--border-subtle)"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:170}}>
                  <div style={{fontWeight:700,color:"var(--accent-violet)",fontSize:12}}>{proj.name}</div>
                  <div style={{fontSize:9,color:"var(--text-muted)",marginTop:1}}>
                    {qCount>0&&<span>{qCount} archivo(s) en cola · </span>}
                    {epCount>0&&<span>{epCount} ep(s) guardado(s) · </span>}
                    <span style={{color:"var(--accent-violet)"}}>Pendiente de confirmación</span>
                  </div>
                </div>
                {renameId===proj.id?(
                  <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                    <input autoFocus value={renameName} onChange={e=>setRenameName(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter")confirmRename(proj);if(e.key==="Escape"){setRenameId(null);setRenameName("");}}}
                      placeholder="Nombre del proyecto..."
                      style={{padding:"3px 8px",border:"1px solid rgba(167,139,250,0.4)",borderRadius:6,fontSize:10,background:"rgba(167,139,250,0.05)",color:"var(--text-primary)",width:170,outline:"none"}}/>
                    <button onMouseDown={()=>confirmRename(proj)} style={{padding:"3px 10px",fontSize:10,background:"rgba(167,139,250,0.18)",border:"1px solid rgba(167,139,250,0.35)",borderRadius:6,color:"var(--accent-violet)",fontWeight:600,cursor:"pointer"}}>OK</button>
                    <button onMouseDown={()=>{setRenameId(null);setRenameName("");}} style={{padding:"3px 8px",fontSize:10,background:"none",border:"1px solid var(--border-default)",borderRadius:6,color:"var(--text-muted)",cursor:"pointer"}}>✕</button>
                  </div>
                ):mergeId===proj.id?(
                  <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                    <select value={mergeTarget} onChange={e=>setMergeTarget(e.target.value)}
                      style={{padding:"3px 8px",border:"1px solid rgba(167,139,250,0.35)",borderRadius:6,fontSize:10,background:"var(--bg-input)",color:"var(--text-primary)",maxWidth:180}}>
                      <option value="">— seleccionar proyecto —</option>
                      {existingSeries.map(ser=><option key={ser.id} value={ser.id}>{ser.name}</option>)}
                    </select>
                    <button onMouseDown={()=>confirmMerge(proj)} style={{padding:"3px 10px",fontSize:10,background:"rgba(167,139,250,0.18)",border:"1px solid rgba(167,139,250,0.35)",borderRadius:6,color:"var(--accent-violet)",fontWeight:600,cursor:"pointer"}}>OK</button>

/* ══════════════════════════════════════════════════════════════
   FUZZY RESOLUTION PANEL
   ══════════════════════════════════════════════════════════════ */
function FuzzyResolutionPanel({s}){
  const[correctId,setCorrectId]=useState(null);
  const[correctName,setCorrectName]=useState("");
  // Update every queue row linked to this fuzzyQueueId
  const resolveRows=(fqId,updates)=>{
    s.setQueue(q=>q.map(item=>({...item,rows:item.rows.map(r=>r.fuzzyQueueId===fqId?{...r,...updates,fuzzyPending:false,fuzzyQueueId:null}:r)})));
  };
  const acceptSame=(fq)=>{
    // Accept the fuzzy match → keep existing charId + canonicalName, just clear orange flag
    resolveRows(fq.id,{});
    s.setFuzzyQueue(q=>q.filter(x=>x.id!==fq.id));
    s.showToast("✓ Unificado: "+fq.rawName+" → "+fq.canonicalName);
  };
  const createNew=(fq)=>{
    // Treat as a brand-new independent character
    resolveRows(fq.id,{charId:null,isNew:true,canonicalName:fq.rawName});
    s.setFuzzyQueue(q=>q.filter(x=>x.id!==fq.id));
    s.showToast("✓ Nuevo personaje: "+fq.rawName);
  };
  const confirmCorrect=(fq)=>{
    const nm=correctName.trim();if(!nm)return;
    resolveRows(fq.id,{charId:null,isNew:true,canonicalName:nm,rawName:nm});
    s.setFuzzyQueue(q=>q.filter(x=>x.id!==fq.id));
    setCorrectId(null);setCorrectName("");
    s.showToast("✓ Nombre corregido: "+nm);
  };
  if(!s.fuzzyQueue.length)return null;
  return(
    <div style={{...CARD_S,marginBottom:14,overflow:"hidden",border:"1px solid rgba(251,146,60,0.35)"}}>
      <div style={{padding:"12px 16px",background:"rgba(251,146,60,0.06)",borderBottom:"1px solid rgba(251,146,60,0.18)",display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:16}}>🔀</span>
        <span style={{fontWeight:700,fontSize:13,color:"var(--accent-orange)"}}>Personajes con Similitud Detectada</span>
        <span style={{background:"rgba(251,146,60,0.2)",color:"var(--accent-orange)",fontSize:10,fontWeight:700,padding:"1px 8px",borderRadius:99,marginLeft:2}}>{s.fuzzyQueue.length}</span>
      </div>
      <div style={{padding:"10px 16px 14px"}}>
        <div style={{fontSize:10,color:"var(--text-muted)",marginBottom:10,lineHeight:1.5}}>
          Los siguientes nombres tienen alta similitud con personajes ya registrados en el proyecto.<br/>
          <b style={{color:"var(--text-secondary)"}}>Es el mismo</b> para unificar el historial · <b style={{color:"var(--text-secondary)"}}>Es nuevo</b> para crear un registro independiente · <b style={{color:"var(--text-secondary)"}}>Corregir</b> para editar el nombre antes de guardar.
        </div>
        {s.fuzzyQueue.map(fq=>(
          <div key={fq.id} style={{padding:"10px 0",borderTop:"1px solid var(--border-subtle)"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:180}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700,color:"var(--accent-orange)",fontSize:12}}>{fq.rawName}</span>
                  <span style={{fontSize:11,color:"var(--text-muted)"}}>≈</span>
                  <span style={{fontWeight:600,color:"var(--text-secondary)",fontSize:12}}>{fq.canonicalName}</span>
                  <span style={{fontSize:9,background:"rgba(251,146,60,0.15)",color:"var(--accent-orange)",padding:"1px 7px",borderRadius:99,fontWeight:700}}>{fq.matchScore}%</span>
                </div>
              </div>
              {correctId===fq.id?(
                <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                  <input autoFocus value={correctName} onChange={e=>setCorrectName(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter")confirmCorrect(fq);if(e.key==="Escape"){setCorrectId(null);setCorrectName("");}}}
                    placeholder="Nombre correcto..."
                    style={{padding:"3px 8px",border:"1px solid rgba(251,146,60,0.4)",borderRadius:6,fontSize:10,background:"rgba(251,146,60,0.05)",color:"var(--text-primary)",width:160,outline:"none"}}/>
                  <button onMouseDown={()=>confirmCorrect(fq)} style={{padding:"3px 10px",fontSize:10,background:"rgba(251,146,60,0.18)",border:"1px solid rgba(251,146,60,0.35)",borderRadius:6,color:"var(--accent-orange)",fontWeight:600,cursor:"pointer"}}>OK</button>
                  <button onMouseDown={()=>{setCorrectId(null);setCorrectName("");}} style={{padding:"3px 8px",fontSize:10,background:"none",border:"1px solid var(--border-default)",borderRadius:6,color:"var(--text-muted)",cursor:"pointer"}}>✕</button>
                </div>
              ):(
                <div style={{display:"flex",gap:5,flexShrink:0,flexWrap:"wrap"}}>
                  <button onClick={()=>acceptSame(fq)} style={{padding:"4px 10px",fontSize:10,background:"rgba(52,211,153,0.15)",border:"1px solid rgba(52,211,153,0.3)",borderRadius:6,color:"var(--accent-emerald)",fontWeight:600,cursor:"pointer"}}>= Es el mismo</button>
                  <button onClick={()=>createNew(fq)} style={{padding:"4px 10px",fontSize:10,background:"rgba(129,140,248,0.12)",border:"1px solid rgba(129,140,248,0.25)",borderRadius:6,color:"var(--accent-indigo)",fontWeight:600,cursor:"pointer"}}>+ Es nuevo</button>
                  <button onClick={()=>{setCorrectId(fq.id);setCorrectName(fq.rawName);}} style={{padding:"4px 10px",fontSize:10,background:"rgba(251,146,60,0.12)",border:"1px solid rgba(251,146,60,0.25)",borderRadius:6,color:"var(--accent-orange)",fontWeight:600,cursor:"pointer"}}>✏ Corregir</button>

  );
}

/* ── EXPORTAR CASTING (por programa): Excel de una sola hoja con todos los capítulos ──
   Columna A = Personaje · B = Talento · C = # de líneas. Cada capítulo empieza con una fila de título. */
function buildSeriesCastingRows(s,series){
  const{charMap,talentMap,epsBySeries,appsByEp,castByEpChar}=s.derived;
  const eps=(epsBySeries[series.id]||[]).slice().sort((a,b)=>a.episode_number-b.episode_number);
  const rows=[["PERSONAJE","TALENTO","# DE LÍNEAS"]];
  let totalLines=0,totalRows=0;
  eps.forEach(ep=>{
    const apps=appsByEp[ep.id]||[];
    const byChar=new Map();
    apps.forEach(a=>{const cur=byChar.get(a.character_id)||{lines:0};cur.lines+=Number(a.line_count)||0;byChar.set(a.character_id,cur);});
    // personajes con casting pero sin aparición registrada (0 líneas) también se listan
    s.data.castings.forEach(c=>{if(c.episode_id===ep.id&&!byChar.has(c.character_id))byChar.set(c.character_id,{lines:0});});
    const list=[...byChar.entries()].map(([cid,v])=>{const ch=charMap[cid];const c=castByEpChar[ep.id+":"+cid];const t=c&&c.talent_id?talentMap[c.talent_id]:null;return{name:ch?ch.canonical_name:"(personaje eliminado)",talent:t?t.name:"",lines:v.lines};})
      .sort((a,b)=>b.lines-a.lines||a.name.localeCompare(b.name));
    const title=(series.type==="pelicula"?"PELÍCULA":"EPISODIO "+ep.episode_number)+(ep.title&&!/^Episodio \d+$/i.test(ep.title)?" — "+ep.title:"");
    rows.push([title,"",""]);
    if(!list.length)rows.push(["(sin personajes)","",""]);
    list.forEach(r=>{rows.push([r.name,r.talent,r.lines]);totalLines+=r.lines;totalRows++;});
    rows.push(["","",""]);
  });
  return{rows,eps:eps.length,chars:totalRows,lines:totalLines};
}
function exportSeriesCastingXLSX(s,series){
  try{
    const{rows,eps,chars,lines}=buildSeriesCastingRows(s,series);
    if(!eps){s.showToast("⚠ "+series.name+": aún no tiene episodios");return false;}
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:34},{wch:32},{wch:12}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"CASTING");
    const fname=safe(series.name).replace(/[\\/:*?"<>|]+/g," ").trim().slice(0,60)||"programa";
    XLSX.writeFile(wb,fname+" - CASTING.xlsx");
    s.showToast("⬇ Casting exportado: "+eps+" capítulo(s) · "+chars+" personaje(s) · "+lines+" líneas");
    return true;
  }catch(e){s.showToast("✗ No se pudo exportar: "+((e&&e.message)||e));return false;}
}

/* ── PEGAR CASTING (por programa): rellena la columna del actor del desglose con el reparto vigente ── */
function PasteCastingModal({series,onClose}){
  const s=useApp();const{charMap,talentMap,epMap,castByEpChar}=s.derived;
  const[files,setFiles]=useState([]);       // {id,name,status,err,info,rows,epId,open}
  const[overwrite,setOverwrite]=useState(true);
  const[busy,setBusy]=useState(false);
  const inRef=useRef(null);
  const serEps=s.derived.epsBySeries[series.id]||[];
  // Personajes del programa (los que aparecen en alguno de sus episodios)
  const serChars=useMemo(()=>{const epIds=new Set(serEps.map(e=>e.id));const ids=new Set();s.data.appearances.forEach(a=>{if(epIds.has(a.episode_id))ids.add(a.character_id);});return s.data.characters.filter(c=>ids.has(c.id));},[serEps,s.data.appearances,s.data.characters]);
  // Reparto vigente de un personaje: casting del episodio elegido; si no, el del último episodio con casting (refleja relevos/reasignaciones)
  const pickTalent=useCallback((cid,epId)=>{
    if(epId){const c=castByEpChar[epId+":"+cid];if(c&&c.talent_id&&talentMap[c.talent_id])return{talent:talentMap[c.talent_id],from:"ep"};}
    let best=null,bn=-Infinity;
    s.data.castings.forEach(c=>{if(c.character_id!==cid||!c.talent_id)return;const ep=epMap[c.episode_id];if(!ep||ep.series_id!==series.id)return;if(ep.episode_number>bn){bn=ep.episode_number;best=c;}});
    return best&&talentMap[best.talent_id]?{talent:talentMap[best.talent_id],from:"last",epNum:bn}:null;
  },[castByEpChar,talentMap,epMap,s.data.castings,series.id]);
  // Opciones por personaje: cada episodio del programa donde tiene casting (para elegir de cuál se toma el talento)
  const charOptions=useCallback(cid=>{
    const opts=[];
    s.data.castings.forEach(c=>{if(c.character_id!==cid||!c.talent_id)return;const ep=epMap[c.episode_id];if(!ep||ep.series_id!==series.id)return;const t=talentMap[c.talent_id];if(!t)return;opts.push({epId:ep.id,epNum:ep.episode_number,label:(series.type==="pelicula"?"Película":"Ep. "+ep.episode_number),talent:t.name});});
    return opts.sort((a,b)=>a.epNum-b.epNum);
  },[s.data.castings,epMap,talentMap,series.id,series.type]);
  const buildRows=useCallback((info,epId)=>info.data.map(d=>{
    const{match,score}=findMatch(d.char,serChars,s.data.aliases);
    if(!match)return{...d,state:"nochar",app:"",actor:"",include:false,options:[]};
    const options=charOptions(match.id);
    if(!options.length)return{...d,state:"notalent",app:match.canonical_name,actor:"",include:false,options};
    const chosen=(epId&&options.find(o=>o.epId===epId))||options[options.length-1];
    return{...d,state:score>=100?"exact":"fuzzy",score,app:match.canonical_name,actor:chosen.talent,from:epId&&chosen.epId===epId?"ep":"last",fromEp:chosen.epNum,srcEpId:chosen.epId,options,include:true};
  }),[serChars,s.data.aliases,charOptions]);
  const setRowSource=(fid,row,epId)=>setFiles(p=>p.map(x=>x.id===fid?{...x,rows:x.rows.map(r=>{if(r.row!==row)return r;const o=r.options.find(o=>o.epId===epId);return o?{...r,srcEpId:o.epId,actor:o.talent,fromEp:o.epNum,from:"manual",include:true}:{...r,srcEpId:null,actor:"",include:false};})}:x));
  const addFiles=async(list)=>{
    const arr=Array.from(list||[]).filter(f=>/\.(xlsx|xlsm)$/i.test(f.name));
    if(!arr.length){s.showToast("Selecciona archivos .xlsx o .xlsm");return;}
    setBusy(true);
    for(const f of arr){
      const id=uid();
      setFiles(p=>[...p,{id,name:f.name,status:"leyendo",rows:[],open:false}]);
      try{
        const info=await analyzeCastingSheet(f);
        const ep=info.epNum!=null?serEps.find(e=>e.episode_number===info.epNum):null;
        const epId=ep?ep.id:(series.type==="pelicula"&&serEps[0]?serEps[0].id:null);
        setFiles(p=>p.map(x=>x.id===id?{...x,status:"ok",info,epId,rows:buildRows(info,epId),open:arr.length===1}:x));
      }catch(e){setFiles(p=>p.map(x=>x.id===id?{...x,status:"error",err:(e&&e.message)||String(e)}:x));}
    }
    setBusy(false);
  };
  const setEp=(fid,epId)=>setFiles(p=>p.map(x=>x.id===fid&&x.info?{...x,epId,rows:buildRows(x.info,epId)}:x));
  const toggleRow=(fid,row)=>setFiles(p=>p.map(x=>x.id===fid?{...x,rows:x.rows.map(r=>r.row===row?{...r,include:!r.include}:r)}:x));
  const download=async(f)=>{
    const edits=[];
    f.rows.forEach(r=>{
      if(!r.include||!r.actor)return;
      if(r.fileActor&&!overwrite)return;
      edits.push({row:r.row,col:PC_COL_LETTER(f.info.colActor),value:r.actor.toUpperCase()});
      if(r.state==="fuzzy")edits.push({row:r.row,col:PC_COL_LETTER(f.info.colActor),fillColor:PC_FILL_BLUE});
    });
    f.rows.forEach(r=>{if(r.state==="notalent")edits.push({row:r.row,col:PC_COL_LETTER(f.info.colActor),fillColor:PC_FILL_YELLOW});});
    if(!edits.length){s.showToast("⚠ "+f.name+": no hay actores para pegar");return 0;}
    const isXlsm=/\.xlsm$/i.test(f.name);
    const blob=await writeCellsIntoXlsx(f.info.buffer,f.info.sheetName,edits,isXlsm);
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name.replace(/\.(xlsm|xlsx)$/i,"")+"_CASTEADO."+(isXlsm?"xlsm":"xlsx");
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    return edits.filter(e=>e.value).length;

      {!serChars.length&&<div style={{...CARD_S,padding:14,marginBottom:12,fontSize:12,color:"var(--accent-amber)"}}>⚠ Este programa aún no tiene personajes cargados: sube primero sus desgloses en Episodios para que exista un reparto que pegar.</div>}

        <div style={{fontSize:11,color:"var(--text-muted)",marginTop:3}}>Se usa la hoja CASTING (columna «NOMBRE DEL ACTOR») · el episodio se detecta por el nombre del archivo</div>
        <input ref={inRef} type="file" multiple accept=".xlsx,.xlsm" style={{display:"none"}} onChange={e=>{addFiles(e.target.files);e.target.value="";}}/>
      </div>
      <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--text-secondary)",marginBottom:12,cursor:"pointer"}}><input type="checkbox" checked={overwrite} onChange={e=>setOverwrite(e.target.checked)}/> Reemplazar actores que ya estén escritos en el archivo (aplica los relevos y reasignaciones)</label>
      <div style={{display:"flex",flexDirection:"column",gap:10,maxHeight:"52vh",overflowY:"auto"}}>
        {files.map(f=>{

          return(

                    <option value="">Reparto vigente (último relevo)</option>
                    {serEps.map(e=><option key={e.id} value={e.id}>{series.type==="pelicula"?"Película":"Ep. "+e.episode_number}{e.title&&!/^Episodio \d+$/.test(e.title)?" · "+e.title:""}</option>)}

                  {cnt.fuzzy>0&&<span style={{fontSize:11,color:"#6FA8DC",fontWeight:700}}>{cnt.fuzzy} ≈</span>}
                  {cnt.notalent>0&&<span style={{fontSize:11,color:"var(--accent-amber)",fontWeight:700}}>{cnt.notalent} sin actor</span>}

                      </td>

            </div>
          );

        <button className="dc-btn" onClick={onClose} style={btnG()}>Cerrar</button>
        {okFiles.length===1&&<button className="dc-btn" disabled={busy} onClick={()=>downloadOne(okFiles[0])} style={btnP({padding:"10px 22px",fontSize:13})}>{busy?"⟳ Pegando…":"⬇ Pegar y descargar"}</button>}
        {okFiles.length>1&&<button className="dc-btn" disabled={busy} onClick={downloadAll} style={btnP({padding:"10px 22px",fontSize:13})}>{busy?"⟳ Pegando…":"⬇ Pegar y descargar todos ("+okFiles.length+")"}</button>}
      </div>

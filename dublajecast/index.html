                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                  {t.genero&&<span style={{fontSize:9,fontWeight:600,color:gc,background:gc+"15",padding:"2px 7px",borderRadius:99}}>{generoIcon(t.genero)} {t.genero}</span>}
                  {t.edad_aparente&&<span style={{fontSize:9,fontWeight:600,color:"var(--accent-teal)",background:"rgba(45,212,191,0.1)",padding:"2px 7px",borderRadius:99}}>{t.edad_aparente}</span>}
                  {t.tono_de_voz&&<span style={{fontSize:9,fontWeight:600,color:"var(--accent-orange)",background:"rgba(251,146,60,0.1)",padding:"2px 7px",borderRadius:99}}>🎵 {t.tono_de_voz}</span>}
                </div>
                
                <Bdg bg={lv.bg} color={lv.color} txt={lv.label}/>
                {serIds.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:8}}>{serIds.map(sid=>{const sr=seriesMap[sid];return <span key={sid} style={{background:"rgba(255,255,255,0.05)",color:"var(--text-secondary)",padding:"2px 7px",borderRadius:5,fontSize:9}}>{sr?sr.name:""}</span>;})}</div>}
                {load>=4&&<div style={{marginTop:8,background:"rgba(248,113,113,0.08)",border:"1px solid rgba(248,113,113,0.2)",borderRadius:6,padding:"4px 8px",fontSize:9,color:"#f87171",fontWeight:600}}>⚠ Alta carga: {load}</div>}
              </div>
            </div>
          );
        })}
        {!filteredTalents.length&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:"48px 0",color:"var(--text-muted)",fontSize:13}}>No se encontraron talentos con los filtros aplicados.</div>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   OCUPACIÓN VIEW — Enhanced with combined filters
   ══════════════════════════════════════════════════════════════ */
function OcupacionView(){
  const s=useApp();const{talentMap,charMap,epMap,seriesMap,appsByEp}=s.derived;
  const[rawSearch,setRawSearch]=useState("");const[statusFilter,setStatusFilter]=useState("en_curso");const search=useDebounce(rawSearch,300);
  // Filtros avanzados
  const[filterGenero,setFilterGenero]=useState("");const[filterEdad,setFilterEdad]=useState("");const[filterTono,setFilterTono]=useState("");

  const enCursoCount=useMemo(()=>{const epIds=new Set(s.data.episodes.filter(ep=>(ep.status||"en_curso")==="en_curso").map(ep=>ep.id));return[...new Set(s.data.castings.filter(c=>epIds.has(c.episode_id)).map(c=>c.talent_id))].length;},[s.data.episodes,s.data.castings]);
  const completoCount=useMemo(()=>{const epIds=new Set(s.data.episodes.filter(ep=>ep.status==="completo").map(ep=>ep.id));return[...new Set(s.data.castings.filter(c=>epIds.has(c.episode_id)).map(c=>c.talent_id))].length;},[s.data.episodes,s.data.castings]);

  const entries=useMemo(()=>{
    const activeEpIds=statusFilter==="todos"?null:new Set(s.data.episodes.filter(ep=>(ep.status||"en_curso")===statusFilter).map(ep=>ep.id));
    const occMap={};
    s.data.castings.forEach(c=>{const tal=talentMap[c.talent_id];if(!tal||OMIT_TALENTS.includes(normN(tal.name)))return;const ep=epMap[c.episode_id];const sr=ep?seriesMap[ep.series_id]:null;if(!ep||!sr)return;if(activeEpIds&&!activeEpIds.has(c.episode_id))return;const ch=charMap[c.character_id];const apps=appsByEp[c.episode_id]||[];const app=apps.find(a=>a.character_id===c.character_id);if(!occMap[tal.id])occMap[tal.id]={talent:tal,byProg:{},totalLines:0,totalEps:0};if(!occMap[tal.id].byProg[sr.id])occMap[tal.id].byProg[sr.id]={series:sr,byEp:{}};if(!occMap[tal.id].byProg[sr.id].byEp[ep.id])occMap[tal.id].byProg[sr.id].byEp[ep.id]={ep,chars:[],lines:0};if(ch)occMap[tal.id].byProg[sr.id].byEp[ep.id].chars.push(ch.canonical_name);const lines=app?(app.line_count||0):0;occMap[tal.id].byProg[sr.id].byEp[ep.id].lines+=lines;occMap[tal.id].totalLines+=lines;});
    Object.values(occMap).forEach(item=>{item.totalEps=Object.values(item.byProg).reduce((sum,p)=>sum+Object.keys(p.byEp).length,0);});
    let list=Object.values(occMap).sort((a,b)=>b.totalLines-a.totalLines||b.totalEps-a.totalEps);
    // Filtros combinados
    if(search.trim()){const q=normN(search);list=list.filter(e=>normN(e.talent.name).includes(q));}
    if(filterGenero)list=list.filter(e=>e.talent.genero===filterGenero);
    if(filterEdad)list=list.filter(e=>e.talent.edad_aparente===filterEdad);
    if(filterTono)list=list.filter(e=>e.talent.tono_de_voz===filterTono);
    return list;
  },[s.data.castings,s.data.episodes,talentMap,charMap,epMap,seriesMap,appsByEp,statusFilter,search,filterGenero,filterEdad,filterTono]);

  const generoIcon=g=>g==="masculino"?"♂":g==="femenino"?"♀":g==="no_binario"?"⚧":"";
  // Completar / reabrir un programa desde Ocupación (cambia el programa y todos sus episodios)
  const setProgramStatus=async(sr,status)=>{
    const nEps=s.data.episodes.filter(e=>e.series_id===sr.id).length;
    const nTal=new Set(s.data.castings.filter(c=>{const ep=epMap[c.episode_id];return ep&&ep.series_id===sr.id;}).map(c=>c.talent_id)).size;
    const done=status==="completo";
    const ok=await dcConfirm(done
      ?"¿Marcar «"+sr.name+"» como COMPLETADO?\n\nEl programa y sus "+nEps+" episodio(s) pasarán de En curso a Completado, y los "+nTal+" talento(s) asignados quedarán liberados de este programa en Ocupación."
      :"¿Reabrir «"+sr.name+"»?\n\nEl programa y sus episodios completados volverán a En curso.",
      {title:done?"Completar programa":"Reabrir programa",ok:done?"Sí, completar":"Sí, reabrir"});
    if(!ok)return;
    s.dispatch({type:"SERIES/SET_STATUS",payload:{id:sr.id,status}});
    s.showToast(done?"✓ Programa completado: "+sr.name:"↺ Programa reabierto: "+sr.name);
  };

  return(
    <div className="dc-view">
      <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:18,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:180}}><div style={{fontWeight:800,fontSize:18,letterSpacing:"-0.02em",color:"var(--text-primary)"}}>Ocupación</div><div style={{fontSize:11,color:"var(--text-muted)",marginTop:2}}>{entries.length} talentos encontrados</div></div>
      </div>

      {/* Filtros combinados */}
      <div style={{...CARD_S,padding:"14px 18px",marginBottom:18}}>
        <div style={{fontWeight:600,fontSize:11,marginBottom:10,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.08em"}}>Filtros de búsqueda</div>
        <div style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
          <div style={{flex:"1 1 180px",minWidth:140}}><label style={SLBL}>Nombre</label><input value={rawSearch} onChange={e=>setRawSearch(e.target.value)} placeholder="Buscar talento..." style={{...SIPT,fontSize:12}}/></div>
          <div style={{flex:"0 1 130px"}}><label style={SLBL}>Género</label><select value={filterGenero} onChange={e=>setFilterGenero(e.target.value)} style={SIPT}>{GENERO_OPTS.map(o=><option key={o.k} value={o.k}>{o.l}</option>)}</select></div>
          <div style={{flex:"0 1 130px"}}><label style={SLBL}>Edad</label><select value={filterEdad} onChange={e=>setFilterEdad(e.target.value)} style={SIPT}>{EDAD_OPTS.map(o=><option key={o.k} value={o.k}>{o.l}</option>)}</select></div>
          <div style={{flex:"0 1 130px"}}><label style={SLBL}>Tono</label><select value={filterTono} onChange={e=>setFilterTono(e.target.value)} style={SIPT}>{TONO_OPTS.map(o=><option key={o.k} value={o.k}>{o.l}</option>)}</select></div>
          {(filterGenero||filterEdad||filterTono||rawSearch)&&<button onClick={()=>{setFilterGenero("");setFilterEdad("");setFilterTono("");setRawSearch("");}} style={{...btnS(),whiteSpace:"nowrap",marginBottom:1}}>✕ Limpiar</button>}
        </div>
      </div>

      <div style={{marginBottom:16}}><FilterTabs value={statusFilter} onChange={setStatusFilter} options={[{k:"en_curso",label:"Ep. en curso",count:enCursoCount},{k:"completo",label:"Ep. completados",count:completoCount},{k:"todos",label:"Todos"}]}/></div>
      {!entries.length&&<div style={{textAlign:"center",padding:40,color:"var(--text-muted)",background:"var(--bg-card)",borderRadius:"var(--radius-lg)",border:"1px solid var(--border-subtle)"}}>No hay talentos con los filtros aplicados.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>{entries.map((item,idx)=>{
        const progs=Object.values(item.byProg);const lv=loadLv(progs.length);const tal=item.talent;
        return(
          <div key={tal.id} className="dc-card" style={{...CARD_S,overflow:"hidden"}}>
            <div style={{padding:"14px 18px",background:"var(--bg-elevated)",borderBottom:"1px solid var(--border-subtle)",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:30,height:30,borderRadius:8,background:"rgba(129,140,248,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:12,color:"var(--accent-indigo)",flexShrink:0}}>{idx+1}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontWeight:700,fontSize:14,color:"var(--text-primary)"}}>{tal.name}</span>
                  {tal.genero&&<span style={{fontSize:11,color:tal.genero==="masculino"?"var(--accent-sky)":tal.genero==="femenino"?"var(--accent-rose)":"var(--accent-violet)"}}>{generoIcon(tal.genero)}</span>}
                </div>
                <div style={{fontSize:10,color:"var(--text-muted)",marginTop:2,display:"flex",gap:8,flexWrap:"wrap"}}>
                  <span>{progs.length} prog. · {item.totalEps} ep. · <b style={{color:"var(--text-secondary)"}}>{item.totalLines}</b> lins.</span>
                  {tal.edad_aparente&&<span style={{color:"var(--accent-teal)",fontWeight:600}}>{tal.edad_aparente}</span>}
                  {tal.tono_de_voz&&<span style={{color:"var(--accent-orange)",fontWeight:600}}>🎵 {tal.tono_de_voz}</span>}
                </div>
              </div>
              <Bdg bg={lv.bg} color={lv.color} txt={lv.label}/>
            </div>
            <div style={{padding:"12px 18px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:8}}>{progs.map((prog,pi)=>{
              const epList=Object.values(prog.byEp).sort((a,b)=>a.ep.episode_number-b.ep.episode_number);const progLines=epList.reduce((sum,e)=>sum+e.lines,0);const sc=STATUS_CFG[prog.series.status]||STATUS_CFG.en_curso;
              return(
                <div key={pi} style={{border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",overflow:"hidden"}}>
                  <div style={{padding:"8px 12px",background:"var(--bg-elevated)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:6,borderBottom:"1px solid var(--border-subtle)"}}><span style={{fontWeight:600,fontSize:11,color:"var(--text-primary)",minWidth:0,overflow:"hidden",textOverflow:"ellipsis"}}>{prog.series.name}</span><div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}><div style={{width:5,height:5,borderRadius:"50%",background:sc.color}}/><span style={{fontSize:9,color:sc.color,fontWeight:600}}>{sc.label}</span><span style={{fontSize:10,fontWeight:600,color:"var(--accent-indigo)",marginLeft:4}}>{progLines} lin.</span>
                    {prog.series.status==="completo"
                      ?<button className="dc-btn dc-subtle" onClick={()=>setProgramStatus(prog.series,"en_curso")} title="Reabrir programa (volver a En curso)" aria-label="Reabrir programa" style={{background:"transparent",border:"1px solid var(--border-subtle)",borderRadius:5,padding:"1px 6px",marginLeft:4,fontSize:10,lineHeight:1.4,color:"var(--text-muted)",cursor:"pointer",opacity:0.65}}>↺</button>
                      :<button className="dc-btn dc-subtle" onClick={()=>setProgramStatus(prog.series,"completo")} title="Marcar programa como completado" aria-label="Completar programa" style={{background:"transparent",border:"1px solid var(--border-subtle)",borderRadius:5,padding:"1px 6px",marginLeft:4,fontSize:10,lineHeight:1.4,color:"var(--text-muted)",cursor:"pointer",opacity:0.65}}>✓</button>}
                  </div></div>
                  {epList.map((entry,ei)=>{const epSt=STUDIOS.find(st=>st.id===entry.ep.studio_id);const col=epSt?SCOLS[(entry.ep.studio_id-1)||0]:"var(--text-muted)";const epSc=STATUS_CFG[entry.ep.status||"en_curso"]||STATUS_CFG.en_curso;return(
                    <div key={ei} className="dc-row" style={{padding:"6px 12px",display:"flex",alignItems:"center",gap:5,background:ei%2===0?"transparent":"rgba(255,255,255,0.015)"}}>
                      <Pill c={col} txt={"Ep."+entry.ep.episode_number}/><div style={{width:4,height:4,borderRadius:"50%",background:epSc.color,flexShrink:0}}/>
                      <span style={{fontSize:10,color:"var(--text-secondary)",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{entry.chars.join(", ")}</span>
                      <span style={{fontSize:10,fontWeight:600,color:"var(--text-secondary)",flexShrink:0}}>{entry.lines>0?entry.lines+" lin.":""}</span>
                    </div>
                  );})}
                </div>
              );
            })}</div>
          </div>
        );
      })}</div>
    </div>
  );

/* ══════════════════════════════════════════════════════════════
   SIDEBAR
   ══════════════════════════════════════════════════════════════ */
function Sidebar(){
  const s=useApp();const enCurso=s.data.series.filter(sr=>sr.status==="en_curso").length;
  const[studioModal,setStudioModal]=useState(false);
  const addStudio=(vals)=>{
    const list=s.data.studios&&s.data.studios.length?s.data.studios:STUDIOS;
    if(list.some(st=>normN(st.name)===normN(vals.name))){s.showToast("⚠ Ya existe un estudio con ese nombre");return;}
    const nid=Math.max(8,...list.map(x=>Number(x.id)||0))+1;
    s.dispatch({type:"STUDIOS/ADD",payload:{id:nid,...vals}});

function Topbar(){
  const s=useApp();

  const importJsonRef=useRef(null);
  useEffect(()=>{
    const h=e=>{
      if(notifRef.current&&notifRef.current.contains(e.target))return;
      if(e.target.closest("[data-notif-panel]"))return;
      setNotifOpen(false);
    };
    document.addEventListener("mousedown",h);

  const handleExport=useCallback(()=>{
    const exportData={_version:"dublajecast_v2",_exportedAt:new Date().toISOString(),...s.data};
    const blob=new Blob([JSON.stringify(exportData,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="dublajecast_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);
    s.showToast("✓ Datos exportados correctamente");
  },[s.data,s.showToast]);

  const handleImport=useCallback(async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    try{
      const text=await file.text();const parsed=JSON.parse(text);
      // Migrar campos de backups anteriores antes de validar
      if(!Array.isArray(parsed.trailers))parsed.trailers=[];
      if(!Array.isArray(parsed.produccion))parsed.produccion=[];
      if(!Array.isArray(parsed.clienteList))parsed.clienteList=[];
      if(!Array.isArray(parsed.directorList))parsed.directorList=[];
      if(parsed.talents){parsed.talents=parsed.talents.map(t=>({genero:"",edad_aparente:"",tono_de_voz:"",...t}));}
      const keys=Object.keys(initialData);const valid=keys.every(k=>Array.isArray(parsed[k]));
      if(!valid){s.showToast("Archivo JSON inválido o incompatible");return;}
      if(!window.confirm("¿Reemplazar todos los datos actuales con los del archivo?\nEsta acción no se puede deshacer."))return;
      const h={};keys.forEach(k=>{h[k]=(parsed[k]||[]).filter(x=>x&&typeof x==="object"&&!Array.isArray(x));});
      h.episodes=h.episodes.map(e=>({title:"",status:"pendiente",...e,episode_number:Number(e.episode_number)||0}));
      h.talents=h.talents.map(t=>({...t,name:safe(t.name)}));
      h.series=h.series.map(x=>({...x,name:safe(x.name)}));
      h.characters=h.characters.map(c=>({...c,canonical_name:safe(c.canonical_name)}));
      s.dispatch({type:"HYDRATE",payload:h});
      s.showToast("✓ Datos importados correctamente");
    }catch(err){s.showToast("✗ Error al importar: "+safe(err.message));}
    e.target.value="";
  },[s]);

  const statusColor={idle:"var(--text-muted)",saving:"var(--accent-amber)",saved:"var(--accent-emerald)",error:"#ef4444"}[s.saveStatus||"idle"];
  const statusLabel={idle:"",saving:"Guardando…",saved:"Guardado ✓",error:"Error"}[s.saveStatus||"idle"];
  const VL={dashboard:"Dashboard",studio:"Estudio",allprograms:"Programas",series:"Episodios",casting:"Casting",reparto:"Reparto",talents:"Talentos",talent:"Talento",ocupacion:"Ocupación",trailers:"Tráilers",produccion:"Producción Casting",breakdowns:"Breakdowns"};
  return(
    <div className="glass-topbar" style={{padding:"10px 20px",borderBottom:"1px solid rgba(167,139,250,0.07)",display:"flex",alignItems:"center",gap:10,flexShrink:0,position:"relative"}}>

      <div title={"Versión "+APP_VERSION+(APP_BUILD_DATE_FMT?" · compilada el "+APP_BUILD_DATE_FMT:"")} style={{display:"flex",alignItems:"center",gap:5,fontSize:9,fontWeight:700,color:"var(--accent-cyan)",background:"rgba(167,139,250,0.06)",padding:"4px 9px",borderRadius:6,border:"1px solid rgba(167,139,250,0.15)",flexShrink:0,whiteSpace:"nowrap"}}>

        <span style={{color:s.isOnline?"var(--accent-emerald)":"var(--accent-orange)"}}>{s.isOnline?"●":"📴"}</span>
      </div>
      {/* Bottom glow line */}
      <div style={{position:"absolute",bottom:0,left:0,right:0,height:1,background:"linear-gradient(90deg,transparent,rgba(167,139,250,0.25),transparent)"}}/>

      {/* Breadcrumb */}
      <div style={{flex:1,display:"flex",alignItems:"center",gap:6,minWidth:0}}>
        <BackBtn compact label="" style={{marginRight:4,padding:"6px 9px"}}/>
        <div style={{width:6,height:6,borderRadius:1,background:"var(--accent-cyan)",transform:"rotate(45deg)",boxShadow:"0 0 8px rgba(167,139,250,0.8)",flexShrink:0}}/>
        {s.view!=="dashboard"&&<span style={{display:"flex",alignItems:"center",gap:4}}>
          <button onClick={()=>s.navTo("dashboard")} style={{background:"none",border:"none",cursor:"pointer",color:"rgba(167,139,250,0.6)",fontSize:12,fontWeight:500,padding:0,letterSpacing:"0.04em",fontFamily:"'Inter',sans-serif"}}>HOME</button>
          <span style={{color:"var(--text-muted)",fontSize:12,margin:"0 2px"}}>›</span>
        </span>}
        {s.view==="talent"&&<span style={{display:"flex",alignItems:"center",gap:4}}>

/* ── PÁGINA DE TALENTO: desglose por programa (episodios, personajes, líneas) ── */
const fmtEpList=nums=>{const a=[...new Set(nums)].sort((x,y)=>x-y);const parts=[];let i=0;while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;parts.push(j>i+1?a[i]+"–"+a[j]:(j===i?String(a[i]):a[i]+", "+a[j]));i=j+1;}return parts.join(", ");};
function TalentDetailView(){
  const s=useApp();const{talentMap,charMap,epMap,seriesMap}=s.derived;const t=talentMap[s.selTalentId]||null;
  const[edit,setEdit]=useState(false);
  const linesByKey=useMemo(()=>{const m={};s.data.appearances.forEach(a=>{const k=a.episode_id+":"+a.character_id;m[k]=(m[k]||0)+(Number(a.line_count)||0);});return m;},[s.data.appearances]);
  const breakdown=useMemo(()=>{
    if(!t)return[];const bySer={};
    s.data.castings.filter(c=>c.talent_id===t.id).forEach(c=>{
      const ep=epMap[c.episode_id];if(!ep)return;const sr=seriesMap[ep.series_id];if(!sr)return;
      const b=bySer[sr.id]||(bySer[sr.id]={sr,eps:new Map(),chars:new Map(),lines:0});
      b.eps.set(ep.id,ep);
      const ch=charMap[c.character_id];const key=c.character_id;
      if(!b.chars.has(key))b.chars.set(key,{name:ch?ch.canonical_name:"(personaje eliminado)",tipo:ch?ch.tipo:"",eps:[],lines:0});
      const ce=b.chars.get(key);ce.eps.push(ep.episode_number);
      const ln=linesByKey[ep.id+":"+c.character_id]||0;ce.lines+=ln;b.lines+=ln;
    });
    return Object.values(bySer).map(b=>({...b,eps:[...b.eps.values()].sort((a,c)=>a.episode_number-c.episode_number),chars:[...b.chars.values()].sort((a,c)=>c.lines-a.lines||a.name.localeCompare(c.name))})).sort((a,c)=>c.lines-a.lines||a.sr.name.localeCompare(c.sr.name));
  },[t,s.data.castings,epMap,seriesMap,charMap,linesByKey]);
  if(!t)return(<div className="dc-view"><BackBtn/><div style={{...CARD_S,padding:28,marginTop:14,textAlign:"center",color:"var(--text-muted)",fontSize:12}}>Talento no encontrado (puede haber sido eliminado).</div></div>);

  const lv=loadLv(tot.series);
  const generoIcon=g=>g==="masculino"?"♂":g==="femenino"?"♀":g==="no_binario"?"⚧":"";
  const del=async()=>{const tc=s.data.castings.filter(c=>c.talent_id===t.id).length;const ok=await dcConfirm("¿Eliminar a "+t.name+(tc?" y sus "+tc+" asignación(es) de casting":"")+"?\n\nQuedará en la papelera (🗂️ Datos) y podrás restaurarlo.",{title:"Eliminar talento",ok:"Sí, eliminar",danger:true});if(!ok){s.showToast("Eliminación cancelada");return;}s.dispatch({type:"TALENTS/DELETE",payload:t.id});s.showToast("✓ Eliminado: "+t.name);s.setSelTalentId(null);s.navTo("talents");};
  const Tile=({v,l,c})=><div style={{...CARD_S,padding:"14px 16px",borderLeft:"3px solid "+c}}><div style={{fontSize:22,fontWeight:800,color:c,lineHeight:1}}>{v}</div><div style={{fontSize:9,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.08em",marginTop:6}}>{l}</div></div>;
  return(
    <div className="dc-view">
      {edit&&<TalentModal mode="edit" initial={{id:t.id,name:t.name,genero:t.genero||"",edad_aparente:t.edad_aparente||"",tono_de_voz:t.tono_de_voz||""}} onSave={vals=>{s.dispatch({type:"TALENTS/UPDATE",payload:{...t,...vals,id:t.id}});setEdit(false);s.showToast("✓ Actualizado");}} onClose={()=>setEdit(false)}/>}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <BackBtn/>
        <div style={{flex:1,minWidth:200}}>
          <div style={{fontWeight:800,fontSize:20,letterSpacing:"-0.02em",color:"var(--text-primary)"}}>{t.name}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:6,alignItems:"center"}}>
            {t.genero&&<span style={{fontSize:10,fontWeight:600,color:t.genero==="masculino"?"var(--accent-sky)":t.genero==="femenino"?"var(--accent-rose)":"var(--accent-violet)",background:"rgba(167,139,250,0.1)",padding:"3px 8px",borderRadius:99}}>{generoIcon(t.genero)} {t.genero}</span>}
            {t.edad_aparente&&<span style={{fontSize:10,fontWeight:600,color:"var(--accent-teal)",background:"rgba(45,212,191,0.1)",padding:"3px 8px",borderRadius:99}}>{t.edad_aparente}</span>}
            {t.tono_de_voz&&<span style={{fontSize:10,fontWeight:600,color:"var(--accent-orange)",background:"rgba(251,146,60,0.1)",padding:"3px 8px",borderRadius:99}}>🎵 {t.tono_de_voz}</span>}
            <Bdg bg={lv.bg} color={lv.color} txt={lv.label}/>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="dc-btn" onClick={()=>setEdit(true)} style={btnS()}>✏ Editar</button>
          <button className="dc-btn" onClick={del} style={btnD()}>× Eliminar</button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
        <Tile v={tot.series} l="Programas" c="var(--accent-cyan)"/>
        <Tile v={tot.eps} l="Episodios" c="var(--accent-emerald)"/>
        <Tile v={tot.chars} l="Personajes" c="var(--accent-amber)"/>
        <Tile v={tot.lines} l="Líneas" c="var(--accent-pink)"/>
      </div>
      <div style={{fontWeight:700,fontSize:11,marginBottom:10,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.08em"}}>Desglose por programa</div>
      {!breakdown.length&&<div style={{...CARD_S,padding:24,textAlign:"center",color:"var(--text-muted)",fontSize:12}}>Este talento aún no tiene asignaciones de casting.</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:12}}>
        {breakdown.map(b=>{const st=STUDIOS.find(x=>x.id===(b.eps[0]&&b.eps[0].studio_id));const col=SCOLS[((b.eps[0]&&b.eps[0].studio_id)||1)-1];const stc=STATUS_CFG[b.sr.status]||STATUS_CFG.en_curso;return(
          <div key={b.sr.id} className="dc-card" style={{...CARD_S,overflow:"hidden"}}>
            <div style={{height:3,background:col}}/>
            <div style={{padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <button onClick={()=>{s.setSelSeriesId(b.sr.id);s.navTo("series");}} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontWeight:800,fontSize:14,color:"var(--text-primary)",textAlign:"left",flex:1}} title="Abrir programa">{b.sr.name}</button>
                <span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:99,background:stc.bg,color:stc.color,border:"1px solid "+stc.border}}>{stc.label}</span>
              </div>
              <div style={{fontSize:10,color:"var(--text-muted)",marginBottom:10}}>{b.sr.type||"serie"}{st?" · "+st.name:""}{b.sr.cliente?" · "+b.sr.cliente:""} · <b style={{color:"var(--text-secondary)"}}>{b.eps.length}</b> ep. · <b style={{color:"var(--text-secondary)"}}>{b.chars.length}</b> personaje(s) · <b style={{color:"var(--text-secondary)"}}>{b.lines}</b> líneas</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:10}}>{b.eps.map(ep=><span key={ep.id} onClick={()=>{s.setSelSeriesId(b.sr.id);s.setSelEpId(ep.id);s.navTo("casting");}} title={ep.title||""} style={{fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:4,background:"rgba(129,140,248,0.12)",color:"var(--accent-indigo)",cursor:"pointer"}}>{b.sr.type==="pelicula"?"Película":"Ep."+ep.episode_number}</span>)}</div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {b.chars.map((c,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:11,background:"var(--bg-secondary)",borderRadius:6,padding:"6px 9px"}}>
                  <span style={{fontWeight:700,color:"var(--text-primary)",flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}{c.tipo==="principal"&&<span style={{fontSize:8,color:"var(--accent-amber)",marginLeft:5}}>★</span>}</span>
                  <span style={{fontSize:10,color:"var(--text-muted)",whiteSpace:"nowrap"}}>{b.sr.type==="pelicula"?"":"Ep. "+fmtEpList(c.eps)}</span>
                  <span style={{fontSize:10,fontWeight:700,color:"var(--accent-pink)",whiteSpace:"nowrap"}}>{c.lines} lín.</span>
                </div>)}
              </div>
            </div>
          </div>);})}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   TRÁILERS & TEASERS VIEW

function TrailersView(){
  const s=useApp();
  const todayMs=(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();})();
  const EMPTY={type:"trailer",etapa:"",title:"",series_id:null,studio_id:s.selStudio||1,received_at:"",deadline:"",status:"pendiente"};
  const[form,setForm]=useState(null);
  const[filterStatus,setFilterStatus]=useState("");
  const[filterType,setFilterType]=useState("");
  const[filterEtapa,setFilterEtapa]=useState("");

  const sla=(deadline,status)=>{
    if(status==="completo")return{label:"Completado",color:"var(--accent-emerald)",bg:"rgba(52,211,153,0.1)",dot:"var(--accent-emerald)"};
    if(!deadline)return{label:"Sin fecha",color:"var(--text-muted)",bg:"rgba(255,255,255,0.04)",dot:"var(--text-muted)"};
    const days=Math.round((parseLocalDate(deadline).setHours(0,0,0,0)-todayMs)/864e5);
    if(days<0)return{label:"Vencido",color:"#ef4444",bg:"rgba(239,68,68,0.1)",dot:"#ef4444",days};
    if(days===0)return{label:"Hoy",color:"#ef4444",bg:"rgba(239,68,68,0.1)",dot:"#ef4444",days};
    if(days===1)return{label:"Mañana",color:"#ef4444",bg:"rgba(239,68,68,0.1)",dot:"#ef4444",days};
    if(days<=2)return{label:days+" días",color:"#ef4444",bg:"rgba(239,68,68,0.1)",dot:"#ef4444",days};
    if(days<=5)return{label:days+" días",color:"#f97316",bg:"rgba(249,115,22,0.1)",dot:"#f97316",days};
    return{label:days+" días",color:"var(--accent-emerald)",bg:"rgba(52,211,153,0.1)",dot:"var(--accent-emerald)",days};
  };

  const trailers=s.data.trailers||[];
  const filtered=useMemo(()=>{
    let list=[...trailers];
    if(filterStatus)list=list.filter(t=>t.status===filterStatus);
    if(filterType)list=list.filter(t=>t.type===filterType);
    if(filterEtapa)list=list.filter(t=>t.etapa===filterEtapa);
    return list.sort((a,b)=>{
      const cmpStatus=(a.status==="completo"?1:0)-(b.status==="completo"?1:0);
      if(cmpStatus!==0)return cmpStatus;
      if(!a.deadline&&!b.deadline)return 0;
      if(!a.deadline)return 1;if(!b.deadline)return -1;
      return new Date(a.deadline)-new Date(b.deadline);
    });
  },[trailers,filterStatus,filterType,filterEtapa]);

  const stats=useMemo(()=>{
    const critical=trailers.filter(t=>t.status!=="completo"&&t.deadline&&Math.round((parseLocalDate(t.deadline).setHours(0,0,0,0)-todayMs)/864e5)<=2).length;
    const pending=trailers.filter(t=>t.status!=="completo").length;
    const done=trailers.filter(t=>t.status==="completo").length;
    return{critical,pending,done,total:trailers.length};
  },[trailers,todayMs]);

  const saveForm=useCallback(()=>{
    const f=form;if(!f)return;
    if(!f.type){s.showToast("Selecciona tipo de material");return;}
    if(f.id){s.dispatch({type:"TRAILERS/UPDATE",payload:f});}
    else{s.dispatch({type:"TRAILERS/ADD",payload:{...f,id:uid()}});}
    s.showToast(f.id?"✓ Actualizado":"✓ Material agregado");
    setForm(null);
  },[form,s]);

  const cycleStatus=(item)=>{
    const next=item.status==="pendiente"?"en_curso":item.status==="en_curso"?"completo":"pendiente";
    s.dispatch({type:"TRAILERS/UPDATE",payload:{...item,status:next}});
  };

  const TYPE_LABELS={trailer:"Tráiler",teaser:"Teaser"};

  return(
    <div className="dc-view">
      {/* Modal form */}
      {form&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>{if(e.target===e.currentTarget)setForm(null);}}>
          <div style={{...CARD_S,padding:24,width:"100%",maxWidth:480,display:"flex",flexDirection:"column",gap:14}}>
            <div style={{fontWeight:700,fontSize:15,color:"var(--text-primary)",marginBottom:4}}>{form.id?"Editar material":"Nuevo material"}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
              <div><label style={SLBL}>Tipo *</label>
                <select value={form.type||""} onChange={e=>setForm(f=>({...f,type:e.target.value}))} style={SIPT}>
                  <option value="">— Seleccionar —</option>
                  <option value="trailer">Tráiler</option>
                  <option value="teaser">Teaser</option>
                </select>
              </div>
              <div><label style={SLBL}>Etapa</label>
                <select value={form.etapa||""} onChange={e=>setForm(f=>({...f,etapa:e.target.value}))} style={SIPT}>
                  <option value="">— Sin definir —</option>
                  <option value="grabacion">🎙 Grabación</option>
                  <option value="edicion">✂ Edición</option>
                </select>
              </div>
              <div><label style={SLBL}>Estado</label>
                <select value={form.status||"pendiente"} onChange={e=>setForm(f=>({...f,status:e.target.value}))} style={SIPT}>
                  <option value="pendiente">Pend. revisión</option>
                  <option value="en_curso">En curso</option>
                  <option value="completo">Completado</option>
                </select>
              </div>
            </div>
            <div><label style={SLBL}>Título / descripción</label>
              <input value={form.title||""} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Ej: Tráiler oficial T2..." style={SIPT}/>
            </div>
            <div><label style={SLBL}>Serie / Programa</label>
              <select value={form.series_id||""} onChange={e=>setForm(f=>({...f,series_id:e.target.value?Number(e.target.value):null}))} style={SIPT}>
                <option value="">— Sin asociar —</option>
                {s.data.series.filter(sr=>!sr.autoCreated).map(sr=><option key={sr.id} value={sr.id}>{sr.name}</option>)}
              </select>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div><label style={SLBL}>Fecha de llegada</label>
                <input type="date" value={form.received_at||""} onChange={e=>setForm(f=>({...f,received_at:e.target.value}))} style={SIPT}/>
              </div>
              <div><label style={SLBL}>Fecha límite entrega</label>
                <input type="date" value={form.deadline||""} onChange={e=>setForm(f=>({...f,deadline:e.target.value}))} style={SIPT}/>
              </div>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
              <button onClick={()=>setForm(null)} className="dc-btn" style={btnG()}>Cancelar</button>
              <button onClick={saveForm} className="dc-btn" style={btnP()}>Guardar</button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18,flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontWeight:800,fontSize:18,letterSpacing:"-0.02em",color:"var(--text-primary)"}}>Tráilers & Teasers</div>
          <div style={{fontSize:12,color:"var(--text-muted)",marginTop:2}}>{stats.total} materiales · {stats.pending} pendientes{stats.critical>0&&<span style={{color:"#ef4444",fontWeight:700,marginLeft:6}}>· {stats.critical} crítico(s)</span>}</div>
        </div>
        <button onClick={()=>setForm({...EMPTY})} className="dc-btn" style={btnP()}>+ Agregar</button>
      </div>

      {/* Stats cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:18}}>
        {[
          {label:"Total",value:stats.total,color:"var(--accent-indigo)",bg:"rgba(99,102,241,0.08)"},
          {label:"Pendientes",value:stats.pending,color:"#fbbf24",bg:"rgba(251,191,36,0.08)"},
          {label:"Completados",value:stats.done,color:"var(--accent-emerald)",bg:"rgba(52,211,153,0.08)"},
          ...(stats.critical>0?[{label:"Críticos ⚠",value:stats.critical,color:"#ef4444",bg:"rgba(239,68,68,0.08)"}]:[])
        ].map((c,i)=>(
          <div key={i} style={{...CARD_S,padding:"14px 18px",background:c.bg,borderColor:c.color+"30"}}>
            <div style={{fontSize:22,fontWeight:800,color:c.color,lineHeight:1}}>{c.value}</div>
            <div style={{fontSize:10,color:"var(--text-muted)",marginTop:4,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>{c.label}</div>
          </div>
        ))}
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{...SIPT,width:"auto",fontSize:11,padding:"7px 10px"}}>
          <option value="">Todos los estados</option>
          <option value="pendiente">Pend. revisión</option>
          <option value="en_curso">En curso</option>
          <option value="completo">Completado</option>
        </select>
        <select value={filterType} onChange={e=>setFilterType(e.target.value)} style={{...SIPT,width:"auto",fontSize:11,padding:"7px 10px"}}>
          <option value="">Todos los tipos</option>
          <option value="trailer">Tráiler</option>
          <option value="teaser">Teaser</option>
        </select>
        <select value={filterEtapa} onChange={e=>setFilterEtapa(e.target.value)} style={{...SIPT,width:"auto",fontSize:11,padding:"7px 10px"}}>
          <option value="">Todas las etapas</option>
          <option value="grabacion">🎙 Grabación</option>
          <option value="edicion">✂ Edición</option>
        </select>
        {(filterStatus||filterType||filterEtapa)&&<button onClick={()=>{setFilterStatus("");setFilterType("");setFilterEtapa("");}} style={{...btnS(),fontSize:10}}>× Limpiar</button>}
      </div>

      {/* Table */}
      {!filtered.length?(
        <div style={{...CARD_S,textAlign:"center",padding:"48px 0",color:"var(--text-muted)",fontSize:13}}>
          {trailers.length?'Sin resultados con los filtros aplicados.':'No hay materiales registrados. Haz clic en "+ Agregar" para empezar.'}
        </div>
      ):(
        <div style={{...CARD_S,overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"var(--bg-elevated)"}}>
              {["Tipo","Etapa","Título / Serie","Llegada","Fecha límite","SLA","Estado",""].map(h=>(
                <th key={h} style={{padding:"9px 14px",textAlign:"left",color:"var(--text-muted)",fontWeight:600,fontSize:9,textTransform:"uppercase",letterSpacing:"0.05em",borderBottom:"1px solid var(--border-subtle)",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>{filtered.map(item=>{
              const sc=STATUS_CFG[item.status]||STATUS_CFG.pendiente;
              const sl=sla(item.deadline,item.status);
              const relSeries=item.series_id?s.data.series.find(sr=>sr.id===item.series_id):null;
              return(
                <tr key={item.id} className="dc-row" style={{borderBottom:"1px solid var(--border-subtle)"}}>

const PC_DUBCARD_OPTS=["BACKLOT","Plataforma Padlot","Excel","PNG","No necesita DUBCARD"];
const PC_FASE_LABELS={"pre_produccion":"Pre-producción","produccion_activa":"En Producción","completado":"Finalizado"};

/* "YYYY-MM-DD" se interpreta como fecha LOCAL (new Date("YYYY-MM-DD") es UTC y en América cae en el día anterior) */
function parseLocalDate(s){const m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(s||"").trim());if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return d;}
function calcMiamiAlert(fecha,fase){
  // Miami delivery is considered done when production is active — no alert needed
  if(!fecha||fase==="produccion_activa"||fase==="completado")return null;
  const today=new Date();today.setHours(0,0,0,0);
  const d=parseLocalDate(fecha);if(isNaN(d))return null;d.setHours(0,0,0,0);
  const diff=Math.round((d-today)/86400000);
  if(diff<0)return{color:"#FB7185",bg:"rgba(255,77,125,0.15)",glow:"0 0 8px rgba(255,77,125,0.5)",label:`Vencida ${Math.abs(diff)}d`};
  if(diff<=3)return{color:"#FB923C",bg:"rgba(255,140,66,0.15)",glow:"0 0 8px rgba(255,140,66,0.5)",label:diff===0?"Hoy":diff+"d"};
  return null;
}
function calcDubcardAlert(fecha,formato,fase){
  if(!fecha||formato==="No necesita DUBCARD"||fase==="completado")return null;
  const today=new Date();today.setHours(0,0,0,0);
  const d=parseLocalDate(fecha);if(isNaN(d))return null;d.setHours(0,0,0,0);
  const diff=Math.round((d-today)/86400000);
  if(diff<0)return{color:"#FBBF24",bg:"rgba(255,204,0,0.12)",glow:"0 0 8px rgba(255,204,0,0.5)",label:`Vencida ${Math.abs(diff)}d`};
  if(diff<=3)return{color:"#C4B5FD",bg:"rgba(180,91,255,0.15)",glow:"0 0 8px rgba(180,91,255,0.5)",label:diff===0?"Hoy":diff+"d"};
  return null;
}

function parseExcelDate(val){
  if(!val)return"";
  if(val instanceof Date){if(isNaN(val))return"";return val.getFullYear()+"-"+String(val.getMonth()+1).padStart(2,"0")+"-"+String(val.getDate()).padStart(2,"0");}
  if(typeof val==="number"){if(!isFinite(val)||val<1||val>2958465)return"";try{const utcDays=Math.floor(val-25569);return new Date(utcDays*86400000).toISOString().slice(0,10);}catch(e){return"";}}
  const s=String(val).trim();
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  return"";
}
function parseBool(val){
  if(typeof val==="boolean")return val;
  if(typeof val==="number")return val!==0;
  return["true","sí","si","yes","1","x","✓"].includes(String(val).trim().toLowerCase());
}

// In-place editable text cell — MUST be at module level (not inside any render) to prevent focus loss
function PCEditCell({value,onSave,placeholder,bold}){
  const[editing,setEditing]=useState(false);
  const[local,setLocal]=useState(value||"");
  useEffect(()=>{if(!editing)setLocal(value||"");},[value,editing]);
  const commit=()=>{onSave(local.trim());setEditing(false);};
  if(!editing)return(
    <span onClick={()=>setEditing(true)} title="Click para editar"
      style={{cursor:"text",color:local?"var(--text-primary)":"var(--text-muted)",fontStyle:local?"normal":"italic",fontSize:11,fontWeight:bold?700:400,display:"block",minWidth:30,padding:"1px 0",lineHeight:1.4}}>
      {local||<span style={{opacity:0.45}}>{placeholder||"—"}</span>}
    </span>
  );
  return(
    <input autoFocus value={local} onChange={e=>setLocal(e.target.value)}
      onBlur={commit} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setLocal(value||"");setEditing(false);}}}
      style={{background:"transparent",border:"none",borderBottom:"1.5px solid #A78BFA",color:"var(--text-primary)",fontSize:11,fontWeight:bold?700:400,outline:"none",width:"100%",padding:"1px 2px",minWidth:50,boxShadow:"0 1px 0 rgba(167,139,250,0.3)"}}/>
  );
}

    if(sortBy){r.sort((a,b)=>{let va=a[sortBy]??"",vb=b[sortBy]??"";if(typeof va==="boolean"){va=va?1:0;vb=vb?1:0;}const cmp=typeof va==="number"?va-vb:String(va).localeCompare(String(vb),"es",{sensitivity:"base"});return sortDir==="asc"?cmp:-cmp;});}

const VIEWS={dashboard:DashboardView,allprograms:ProgramsView,studio:StudioView,series:SeriesView,casting:CastingView,reparto:RepartoView,talents:TalentsView,talent:TalentDetailView,ocupacion:OcupacionView,trailers:TrailersView,produccion:ProduccionCastingView,dubcards:DubcardsView,pegado:PegadoCastingView,breakdowns:BreakdownsView};

function AppShell({onLogout,session}){
  const store=useStore();
  const cloud=useCloudSync(store.data,store.dispatch,store.showToast,session);
  const cloudStatus=cloud.status;
  useEffect(()=>{window.__dcLogout=onLogout;},[onLogout]);
  useEffect(()=>{window.__dcBusySaving=()=>store.saveStatus==="saving"||cloudStatus==="saving";return()=>{window.__dcBusySaving=null;};},[store.saveStatus,cloudStatus]);
  // Autorización: rol "lector" bloquea toda mutación de datos en un único punto (dispatch)
  const blockedAt=useRef(0);
  const guardedDispatch=useCallback(action=>{
    if(session&&session.role==="lector"){blockedAt.current=Date.now();store.showToast("🔒 Tu rol es de solo lectura — cambios deshabilitados");return;}
    store.dispatch(action);
  },[session,store.dispatch,store.showToast]);
  const guardedCasting=useMemo(()=>({...store.casting,setCastingsNotif:(...a)=>{
    if(session&&session.role==="lector"){blockedAt.current=Date.now();store.showToast("🔒 Tu rol es de solo lectura — cambios deshabilitados");return;}
    store.casting.setCastingsNotif(...a);
  }}),[store.casting,session,store.showToast]);
  // Evita que el toast de éxito del componente pise el aviso de bloqueo tras una mutación rechazada
  const guardedShowToast=useCallback(msg=>{
    if(Date.now()-blockedAt.current<700&&typeof msg==="string"&&msg.startsWith("✓")){store.showToast("🔒 Tu rol es de solo lectura — cambios deshabilitados");return;}
    store.showToast(msg);
  },[store.showToast]);
  const ctxValue=useMemo(()=>({...store,dispatch:guardedDispatch,casting:guardedCasting,showToast:guardedShowToast,currentUser:session||null,cloudStatus,cloudPush:cloud.pushNow,cloudPull:cloud.pullNow}),[store,guardedDispatch,guardedCasting,guardedShowToast,session,cloudStatus,cloud.pushNow,cloud.pullNow]);
  const ActiveView=VIEWS[store.view]||DashboardView;
  return(
    <AppCtx.Provider value={ctxValue}>
      {store.otherTabActive&&<div style={{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",zIndex:9998,background:"rgba(251,191,36,0.95)",color:"#1a1200",padding:"5px 18px",borderRadius:"0 0 10px 10px",fontSize:11,fontWeight:700,boxShadow:"var(--shadow-md)"}}>⚠ Otra pestaña/sesión está editando este aplicativo — evita ediciones simultáneas</div>}
      <div className={"dc-sidebar-backdrop"+(store.sidebarOpen?" dc-open":"")} onClick={()=>store.setSidebarOpen(false)}/>
      {!store.isOnline&&<div style={{position:"fixed",bottom:14,right:14,zIndex:9998,background:"rgba(255,140,66,0.95)",color:"#1a0e00",padding:"8px 16px",borderRadius:99,fontSize:11,fontWeight:800,boxShadow:"var(--shadow-md)",display:"flex",alignItems:"center",gap:7}}><span className="dc-spin" style={{fontSize:12}}>⟳</span>📴 Sin red — trabajando localmente</div>}
      <ConfirmDialog/>
      <UsersAdminGate/>
      <CloudConfigGate/>
      <DataManagerGate/>
      <ApiConfigGate/>
      <AppModal/>
      <MetadataGateModal/>
      {store.editProgId&&store.derived.seriesMap[store.editProgId]&&<ProgramEditModal prog={store.derived.seriesMap[store.editProgId]} onSave={u=>{store.dispatch({type:"SERIES/UPDATE",payload:u});store.setEditProgId(null);store.showToast("✓ Actualizado");}} onClose={()=>store.setEditProgId(null)}/>}
      {store.editEpId&&store.derived.epMap[store.editEpId]&&<EpisodeEditModal ep={store.derived.epMap[store.editEpId]} onSave={u=>{store.dispatch({type:"EPISODES/UPDATE",payload:u});store.setEditEpId(null);store.showToast("✓ Actualizado");}} onClose={()=>store.setEditEpId(null)}/>}
      {store.toast&&<div className="glass" style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"rgba(8,16,30,0.95)",color:"var(--text-primary)",padding:"12px 24px",borderRadius:"var(--radius-md)",fontSize:12,fontWeight:600,zIndex:9999,boxShadow:"var(--shadow-lg),0 0 20px rgba(167,139,250,0.2)",whiteSpace:"nowrap",border:"1px solid rgba(167,139,250,0.2)",animation:"slideUp 280ms cubic-bezier(0.34,1.56,0.64,1)"}}>{store.toast}</div>}
      <div className="dc-app-root" style={{display:"flex",height:"100vh",overflow:"hidden"}}>
        <Sidebar/>
        <main style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0,background:"var(--bg-primary)"}}>
          <Topbar/>
          <div style={{flex:1,overflowY:"auto",padding:"22px 24px"}}><ActiveView/></div>
        </main>

      </div>
    </AppCtx.Provider>
  );
}

  const[showPwd,setShowPwd]=useState(false);
  const[verifying,setVerifying]=useState(false);
  const[cloudCfgOpen,setCloudCfgOpen]=useState(false);
  const[hasCloud,setHasCloud]=useState(!!getCloudCfg());
  const[mode,setMode]=useState(()=>getCloudCfg()?"cloud":"local"); // ☁️ Nube · 💻 Local
  useEffect(()=>{
    ensureSeedAdmin();
    // ── Verificación de versión SEGURA (sin bucles de recarga) ──
    const localVer=(document.querySelector('meta[name="dc-version"]')||{}).content||"0";
    window.__dcVersion=localVer;
    const checkVersion=async()=>{
      try{
        const r=await fetch(window.location.pathname+"?_v="+Date.now(),{cache:"no-store"});
        const html=await r.text();
        const m=html.match(/name="dc-version" content="([^"]+)"/);
        if(!m)return; // el servidor no tiene meta de versión: no hacer nada
        const remoteVer=m[1];
        if(remoteVer===localVer)return; // ya estamos al día
        const guard=sessionStorage.getItem("dc_reloaded_for");
        if(guard===remoteVer)return; // ya recargamos para esta versión: evita bucle infinito
        sessionStorage.setItem("dc_reloaded_for",remoteVer);
        try{
          /* Dubbipt: aquí ni service workers ni cachés; las del sitio son de Dubbipt. Solo se recarga. */
        }catch(e){}
        // Esperar a que no haya guardados en curso (local o nube) antes de recargar
        const waitIdle=(n)=>{const busy=window.__dcBusySaving&&window.__dcBusySaving();if(busy&&n<20)setTimeout(()=>waitIdle(n+1),500);else window.location.reload();};
        setTimeout(()=>waitIdle(0),600);
      }catch(e){/* sin conexión: ignorar */}
    };
    setTimeout(checkVersion,4000);
    const timer=setInterval(checkVersion,60000);
    const onFocus=()=>checkVersion();
    window.addEventListener("focus",onFocus);
    return()=>{clearInterval(timer);window.removeEventListener("focus",onFocus);};
  },[]);

  // Fijar el espacio de datos del usuario activo ANTES de que AppShell hidrate
  if(session)setActiveDataKey(session.sbUid?("sb_"+session.sbUid):session.userId);

  const doLogin=async()=>{
    if(verifying)return;
    setVerifying(true);setErr("");setInfo("");
    try{
      if(mode==="cloud"&&hasCloud){
        // Autenticación en la nube (Supabase Auth · JWT por sesión)
        const u=await cloudSignIn(uIn.trim(),pIn);
        setActiveDataKey("sb_"+u.id);
        setSession(cloudSessionFromUser(u));
        setUIn("");setPIn("");
      }else{
        const u=await authenticate(uIn,pIn);
        if(u){setActiveDataKey(u.id);setSession(createSession(u));setUIn("");setPIn("");}
        else setErr("Credenciales inválidas. Contacte al administrador del sistema.");
      }
    }catch(e){setErr(mode==="cloud"?("Nube: "+(e.message||"error de autenticación")):("Error de autenticación: "+(e.message||"desconocido")));}
    finally{setVerifying(false);}
  };

  const doSignUp=async()=>{
    if(verifying)return;
    if(!uIn.trim()||pIn.length<6){setErr("Ingresa un email válido y contraseña de mínimo 6 caracteres");return;}
    setVerifying(true);setErr("");setInfo("");
    try{
      const u=await cloudSignUp(uIn.trim(),pIn);
      if(u&&u.confirmed_at){const su=await cloudSignIn(uIn.trim(),pIn);setActiveDataKey("sb_"+su.id);setSession(cloudSessionFromUser(su));}
      else setInfo("✓ Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.");
    }catch(e){setErr("Nube: "+(e.message||"no se pudo crear la cuenta"));}
    finally{setVerifying(false);}
  };
  
  if(!loggedIn)return(
    <div className="login-bg" style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",position:"relative"}}>
      {cloudCfgOpen&&<CloudConfigModal onClose={()=>setCloudCfgOpen(false)} onSaved={()=>{const c=!!getCloudCfg();setHasCloud(c);setMode(c?"cloud":"local");}}/>}
      <div className="login-grid"/>

      {/* Large ambient glows */}
      <div style={{position:"absolute",top:"10%",left:"5%",width:500,height:500,borderRadius:"50%",background:"radial-gradient(circle,rgba(167,139,250,0.07) 0%,transparent 65%)",filter:"blur(60px)",pointerEvents:"none"}}/>
      <div style={{position:"absolute",bottom:"5%",right:"5%",width:600,height:600,borderRadius:"50%",background:"radial-gradient(circle,rgba(77,159,255,0.05) 0%,transparent 65%)",filter:"blur(80px)",pointerEvents:"none"}}/>
      <div style={{position:"absolute",top:"50%",right:"20%",width:300,height:300,borderRadius:"50%",background:"radial-gradient(circle,rgba(0,100,255,0.06) 0%,transparent 70%)",filter:"blur(50px)",pointerEvents:"none"}}/>

      {/* Floating corner brackets */}
      {[{t:"8%",l:"8%"},{t:"8%",r:"8%"},{b:"8%",l:"8%"},{b:"8%",r:"8%"}].map((pos,i)=>(
        <div key={i} style={{position:"absolute",...pos,width:40,height:40,borderColor:"rgba(167,139,250,0.2)",borderStyle:"solid",borderWidth:i===0?"2px 0 0 2px":i===1?"2px 2px 0 0":i===2?"0 0 2px 2px":"0 2px 2px 0",pointerEvents:"none"}}/>
      ))}

      <div style={{position:"relative",zIndex:2,width:"100%",maxWidth:440,padding:"0 20px"}}>
        {/* Title above card */}
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:10,color:"rgba(167,139,250,0.5)",letterSpacing:"0.3em",textTransform:"uppercase",fontFamily:"'Inter',sans-serif",marginBottom:8}}>— Sistema de Casting —</div>
          <div style={{fontSize:36,fontWeight:900,letterSpacing:"0.08em",color:"#fff",fontFamily:"'Inter',sans-serif",textShadow:"0 0 30px rgba(167,139,250,0.5),0 0 60px rgba(167,139,250,0.2)",animation:"heroGlow 4s ease-in-out infinite",lineHeight:1}}>CAST</div>
        </div>

        <div className="login-card" style={{borderRadius:"var(--radius-xl)",padding:"40px 38px",position:"relative",overflow:"hidden"}}>
          {/* Top accent line */}
          <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,transparent,#A78BFA 30%,#4D9FFF 70%,transparent)",boxShadow:"0 0 14px rgba(167,139,250,0.7)"}}/>
          {/* Corner accents */}
          <div style={{position:"absolute",top:0,left:0,width:20,height:20,borderTop:"1.5px solid rgba(167,139,250,0.6)",borderLeft:"1.5px solid rgba(167,139,250,0.6)"}}/>
          <div style={{position:"absolute",top:0,right:0,width:20,height:20,borderTop:"1.5px solid rgba(167,139,250,0.6)",borderRight:"1.5px solid rgba(167,139,250,0.6)"}}/>
          <div style={{position:"absolute",bottom:0,left:0,width:20,height:20,borderBottom:"1.5px solid rgba(167,139,250,0.3)",borderLeft:"1.5px solid rgba(167,139,250,0.3)"}}/>
          <div style={{position:"absolute",bottom:0,right:0,width:20,height:20,borderBottom:"1.5px solid rgba(167,139,250,0.3)",borderRight:"1.5px solid rgba(167,139,250,0.3)"}}/>

          {/* Logo area */}
          <div style={{textAlign:"center",marginBottom:32}}>
            <div style={{width:64,height:64,background:"linear-gradient(135deg,#3B1878 0%,#005f7a 40%,#1a7fff 100%)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:24,fontWeight:900,color:"#fff",boxShadow:"0 8px 30px rgba(139,92,246,0.5),0 0 50px rgba(167,139,250,0.25)",position:"relative",animation:"neonPulse 4s ease-in-out infinite",fontFamily:"'Inter',sans-serif",border:"1px solid rgba(167,139,250,0.25)"}}>
              D
            </div>
            <div style={{fontSize:12,color:"var(--text-muted)",letterSpacing:"0.16em",textTransform:"uppercase",marginBottom:14,fontFamily:"'Inter',sans-serif"}}>DublajeCast Studio</div>
            <div className="security-badge">
              ◈ Acceso seguro · Sesión protegida
            </div>
          </div>

          {/* Selector de modo de acceso */}
          {hasCloud&&<div style={{display:"flex",gap:6,marginBottom:18,background:"rgba(0,0,0,0.3)",borderRadius:10,padding:4,border:"1px solid rgba(167,139,250,0.1)"}}>
            {[{k:"cloud",l:"☁️ Nube"},{k:"local",l:"💻 Local"}].map(m=>(
              <button key={m.k} onClick={()=>{setMode(m.k);setErr("");setInfo("");}} style={{flex:1,padding:"9px 0",borderRadius:7,border:"none",cursor:"pointer",fontSize:12,fontWeight:mode===m.k?800:500,background:mode===m.k?"rgba(167,139,250,0.12)":"transparent",color:mode===m.k?"var(--accent-cyan)":"rgba(255,255,255,0.4)"}}>{m.l}</button>
            ))}
          </div>}
          {/* Form */}
          <div style={{marginBottom:16}}>
            <label style={{fontSize:9,fontWeight:700,color:"rgba(167,139,250,0.5)",display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.14em",fontFamily:"'Inter',sans-serif"}}>
              {mode==="cloud"&&hasCloud?"Email":"Usuario"}
            </label>
            <div style={{position:"relative"}}>
              <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:13,color:"rgba(167,139,250,0.3)"}}>◉</span>
              <input
                autoFocus value={uIn} onChange={e=>setUIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()}
                placeholder={mode==="cloud"&&hasCloud?"correo@ejemplo.com":"Identificación de acceso"}
                className="login-input" style={{paddingLeft:42,letterSpacing:"0.04em"}}
              />
            </div>
          </div>

          <div style={{marginBottom:28}}>
            <label style={{fontSize:9,fontWeight:700,color:"rgba(167,139,250,0.5)",display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.14em",fontFamily:"'Inter',sans-serif"}}>
              Contraseña
            </label>
            <div style={{position:"relative"}}>
              <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:13,color:"rgba(167,139,250,0.3)"}}>◆</span>
              <input
                type={showPwd?"text":"password"} value={pIn} onChange={e=>setPIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()}
                placeholder="••••••••••••"
                className="login-input" style={{paddingLeft:42,paddingRight:45,letterSpacing:"0.08em"}}
              />
              <button onClick={()=>setShowPwd(!showPwd)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:12,color:"rgba(167,139,250,0.4)",padding:"2px"}}>
                {showPwd?"◎":"◉"}
              </button>
            </div>
          </div>
          
          {err&&(
            <div style={{color:"#f87171",fontSize:12,marginBottom:16,textAlign:"center",background:"rgba(239,68,68,0.08)",padding:"10px 14px",borderRadius:"var(--radius-md)",border:"1px solid rgba(239,68,68,0.2)",display:"flex",alignItems:"center",gap:8,justifyContent:"center"}}>
              <span>⚠</span>{err}
            </div>
          )}
          
          <button onClick={doLogin} disabled={verifying} className="login-btn" style={{opacity:verifying?0.7:1,cursor:verifying?"wait":"pointer"}}>
            {verifying?<span><span className="dc-spin" style={{marginRight:8}}>⟳</span>Verificando…</span>:"Iniciar sesión"}
          </button>
          {mode==="cloud"&&hasCloud&&<button onClick={doSignUp} disabled={verifying} style={{width:"100%",marginTop:10,background:"rgba(167,139,250,0.05)",border:"1px solid rgba(167,139,250,0.2)",borderRadius:10,padding:"11px 0",cursor:"pointer",color:"var(--accent-cyan)",fontSize:12,fontWeight:700}}>＋ Crear cuenta nueva</button>}
          {info&&<div style={{marginTop:10,fontSize:11,color:"var(--accent-emerald)",textAlign:"center"}}>{info}</div>}
          
          {/* Footer info */}
          <div style={{textAlign:"center",marginTop:24,display:"flex",flexDirection:"column",gap:6}}>
            <div style={{fontSize:10,color:"var(--text-muted)",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              <span style={{width:4,height:4,borderRadius:"50%",background:"#34d399",display:"inline-block",boxShadow:"0 0 4px rgba(52,211,153,0.5)"}}/>
              Sistema operativo · Todos los derechos reservados
            </div>
            <InstallButton style={{maxWidth:260,margin:"0 auto"}}/>
            {/* Configuración de nube solo para admin */}
            <div style={{fontSize:9,color:"var(--text-muted)",opacity:0.5}}>v{APP_VERSION}{APP_BUILD_DATE_FMT?" · "+APP_BUILD_DATE_FMT:""} · PWA · Multi-usuario {hasCloud?"· Nube":"· Local"}</div>
          </div>
        </div>
      </div>
    </div>
  );
  return <AppShell key={"u"+session.userId} session={session} onLogout={()=>{if(session.sbUid){getSb().then(sb=>sb&&sb.auth.signOut()).catch(()=>{});}clearSession();setSession(null);setShowPwd(false);setUIn("");setPIn("");}}/>; 
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script src="./puente.js"></script>
</body>
</html>

}

function SeriesView(){
  const s=useApp();const{appsByEp,charMap,talentMap}=s.derived;const isMovie=s.curSeries&&s.curSeries.type==="pelicula";
  const upRef=useRef(null);const folderRef=useRef(null);
  const[pasteOpen,setPasteOpen]=useState(false);
  const[savingQueue,setSavingQueue]=useState(false);
  // Recursive entry traversal for folder drop
  const collectEntries=useCallback(async(entry,acc=[])=>{
    if(entry.isFile){
      const f=await new Promise((ok,err)=>entry.file(ok,err));
      if(/\.(xlsx|xls|xlsm)$/i.test(f.name))acc.push(f);
    }else if(entry.isDirectory){
      const reader=entry.createReader();
      let batch;
      do{batch=await new Promise((ok,err)=>reader.readEntries(ok,err));for(const e of batch)await collectEntries(e,acc);}while(batch.length>0);
    }
    return acc;
  },[]);
  const handleDrop=useCallback(async e=>{
    e.preventDefault();
    const items=e.dataTransfer.items;if(!items||!items.length)return;
    const files=[];
    for(let i=0;i<items.length;i++){
      const entry=items[i].webkitGetAsEntry?.();
      if(entry){await collectEntries(entry,files);}
      else{const f=items[i].getAsFile?.();if(f&&/\.(xlsx|xls|xlsm)$/i.test(f.name))files.push(f);}
    }
    if(files.length)handleUpload(files,s);
  },[collectEntries,s]);
  // Group queue by series for grouped preview
  const queueGroups=useMemo(()=>{
    const g={};
    s.queue.forEach(item=>{const sid=item.seriesId!=null?String(item.seriesId):"__none__";if(!g[sid])g[sid]=[];g[sid].push(item);});
    return Object.entries(g);
  },[s.queue]);
  const multiSeries=queueGroups.length>1;
  const hasUnassigned=s.queue.some(item=>item.seriesId==null);
  const readableQueueCount=s.queue.filter(item=>!!(item.seriesId||s.selSeriesId)).length;
  return(
    <div className="dc-view" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,flexWrap:"wrap"}}>
          <BackBtn label="Atrás" compact/>
          <div style={{fontWeight:700,fontSize:13,color:"var(--text-secondary)",textTransform:"uppercase",letterSpacing:"0.08em"}}>Episodios ({s.serEps.length})</div>
          <button className="dc-btn" onClick={()=>exportSeriesCastingXLSX(s,s.curSeries)} title="Descargar Excel con todos los capítulos: Personaje · Talento · # de líneas" style={btnG({marginLeft:"auto",padding:"6px 12px",fontSize:11})}>⬇ Exportar casting</button>
          <button className="dc-btn" onClick={()=>setPasteOpen(true)} title="Rellenar la columna del actor de un desglose con el reparto vigente de este programa" style={btnP({padding:"6px 12px",fontSize:11})}>📋 Pegar casting</button>
        </div>
        {pasteOpen&&s.curSeries&&ReactDOM.createPortal(<PasteCastingModal series={s.curSeries} onClose={()=>setPasteOpen(false)}/>,document.body)}
        {window.DubbiptBarra&&s.curSeries&&React.createElement(window.DubbiptBarra,{serie:s.curSeries,episodios:s.serEps})}
        {!s.serEps.length&&<div style={{...CARD_S,padding:28,textAlign:"center",color:"var(--text-muted)",fontSize:12}}>Sube un desglose para crear el primer episodio.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>{s.serEps.map(ep=><EpisodeRow key={ep.id} ep={ep} isMovie={isMovie} s={s} appsByEp={appsByEp} charMap={charMap} talentMap={talentMap}/>)}</div>
      </div>
      <div>
        {/* Hidden file inputs */}
        <input ref={upRef} type="file" accept=".xlsx,.xls,.xlsm" multiple style={{display:"none"}} onChange={e=>{if(e.target.files&&e.target.files.length){handleUpload(e.target.files,s);e.target.value="";}}}/>
        <input ref={folderRef} type="file" accept=".xlsx,.xls,.xlsm" multiple webkitdirectory="" style={{display:"none"}} onChange={e=>{if(e.target.files&&e.target.files.length){handleUpload(e.target.files,s);e.target.value="";}}}/>
        {/* Upload card */}
        <div style={{...CARD_S,padding:18,marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:14,color:"var(--text-primary)"}}>Subir desgloses</div>
            <button onClick={()=>folderRef.current&&folderRef.current.click()} className="dc-btn" style={btnG({fontSize:10,padding:"5px 12px"})}>📁 Carpeta</button>
          </div>
          <div onDragOver={e=>e.preventDefault()} onDrop={handleDrop} onClick={()=>upRef.current&&upRef.current.click()} style={{border:"2px dashed rgba(129,140,248,0.3)",borderRadius:"var(--radius-lg)",padding:"24px",textAlign:"center",cursor:"pointer",background:"rgba(129,140,248,0.04)",transition:"all 200ms ease",marginBottom:8}}>
            <div style={{fontSize:26,color:"var(--accent-indigo)",marginBottom:6}}>📄</div>
            <div style={{fontSize:13,fontWeight:600,color:"var(--accent-indigo)"}}>Clic · arrastra archivos o carpetas</div>
            <div style={{fontSize:10,color:"var(--text-muted)",marginTop:4}}>xlsx, xls, xlsm · soporte recursivo de subcarpetas</div>
          </div>
          {s.queue.length>0&&<div style={{fontSize:11,color:"var(--accent-indigo)",fontWeight:600}}>{s.queue.length} en cola · <span style={{color:"var(--text-muted)",fontWeight:400}}>{queueGroups.length} programa(s)</span></div>}
        </div>
        {/* Progress */}
        {s.uploadProgress&&<UploadProgressCard prog={s.uploadProgress} onDismiss={()=>s.setUploadProgress(null)}/>}
        {/* Validation panels — in priority order */}
        <PendingProjectsPanel s={s}/>
        <FuzzyResolutionPanel s={s}/>
        <PendingTalentsPanel s={s}/>
        {/* Queue grouped by series */}
        {queueGroups.map(([sid,items])=>{
          const ser=sid!=="__none__"?s.data.series.find(x=>x.id===Number(sid)):null;
          return(
            <div key={sid}>
              {multiSeries&&(
                <div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",marginBottom:6,borderBottom:"1px solid var(--border-subtle)"}}>
                  <div style={{width:3,height:14,borderRadius:2,background:ser?"var(--accent-indigo)":"var(--text-muted)",flexShrink:0}}/>
                  <span style={{fontWeight:700,fontSize:11,color:ser?"var(--accent-indigo)":"var(--text-muted)"}}>{ser?ser.name:"— Sin programa asignado —"}</span>
                  <span style={{fontSize:10,color:"var(--text-muted)"}}>({items.length} archivo{items.length>1?"s":""})</span>
                </div>
              )}
              {items.map(item=>{
                const iSer=sid!=="__none__"?s.data.series.find(x=>x.id===Number(sid)):s.curSeries;
                return<QueueItem key={item.id} item={item} s={s} isMovie={!!(iSer&&iSer.type==="pelicula")}/>;
              })}
            </div>
          );
        })}
        {/* Unassigned warning */}
        {hasUnassigned&&s.queue.length>0&&(
          <div style={{padding:"7px 12px",background:"rgba(251,191,36,0.06)",border:"1px solid rgba(251,191,36,0.2)",borderRadius:"var(--radius-md)",marginBottom:8,fontSize:10,color:"var(--accent-amber)"}}>⚠ Algunos archivos no tienen programa asignado. Asígnalos antes de guardar.</div>
        )}
        {/* Save actions */}
        {s.queue.length>0&&<div style={{position:"sticky",bottom:0,background:"var(--bg-primary)",paddingTop:10,paddingBottom:4}}>
          <button disabled={savingQueue} onClick={async()=>{setSavingQueue(true);try{await saveQueue(s);}finally{setSavingQueue(false);}}} className="dc-btn" style={btnP({width:"100%",padding:"14px 0",background:"linear-gradient(135deg,#059669,#34d399)",fontSize:14,borderRadius:"var(--radius-md)",opacity:savingQueue?0.7:1,cursor:savingQueue?"wait":"pointer"})}>{savingQueue?<span><span className="dc-spin" style={{marginRight:8}}>⟳</span>Guardando…</span>:`💾 Guardar ${readableQueueCount} episodio${readableQueueCount!==1?"s":""}`}</button>
          <button onClick={()=>{s.setQueue([]);s.setUploadProgress(null);}} style={{width:"100%",background:"none",border:"none",color:"var(--text-muted)",fontSize:11,cursor:"pointer",marginTop:6,padding:"4px 0"}}>limpiar cola</button>
        </div>}
      </div>
    </div>
  );
}

function EpisodeRow({ep,isMovie,s,appsByEp,charMap,talentMap}){
  const apps=appsByEp[ep.id]||[];const cont=apps.filter(a=>s.casting.isRecurring(a.character_id,s.selSeriesId||0,ep.id)).length;
  const epSt=STUDIOS.find(st=>st.id===ep.studio_id);const epCol=epSt?SCOLS[(ep.studio_id-1)||0]:"var(--text-muted)";
  const conflicts=s.data.castings.filter(c=>c.episode_id===ep.id).filter(c=>{const ch2=charMap[c.character_id];if(!ch2||ch2.tipo!=="principal")return false;const prevT=s.casting.getPrevTalent(c.character_id,s.selSeriesId||0);return prevT&&prevT.id!==c.talent_id&&s.casting.isRecurring(c.character_id,s.selSeriesId||0,ep.id);});
  const epStatus=ep.status||"en_curso";const sc=STATUS_CFG[epStatus]||STATUS_CFG.en_curso;const isComplete=epStatus==="completo";const isPendiente=epStatus==="pendiente";
  const nextEpStatus=isPendiente?"en_curso":isComplete?"en_curso":"completo";
  return(
    <div className="dc-card" style={{...CARD_S,borderLeft:"3px solid "+epCol,overflow:"hidden",opacity:isComplete?0.75:1}}>
      <div style={{padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:5}}>
            <span style={{fontWeight:800,color:epCol,fontSize:13}}>{isMovie?"Película":"Ep. "+ep.episode_number}</span>
            {!isMovie&&<span style={{fontSize:12,color:"var(--text-secondary)",fontWeight:500}}>{ep.title}</span>}
            {epSt&&<Pill c={epCol} txt={epSt.name}/>}
            <button onClick={()=>s.dispatch({type:"EPISODES/UPDATE",payload:{...ep,status:nextEpStatus}})} title={isPendiente?"Confirmar revisión":"Cambiar estado"} style={{display:"inline-flex",alignItems:"center",gap:3,background:sc.bg,border:"1px solid "+sc.border,borderRadius:99,padding:"2px 8px",cursor:"pointer"}}><div style={{width:5,height:5,borderRadius:"50%",background:sc.color,flexShrink:0}}/><span style={{fontSize:9,color:sc.color,fontWeight:600}}>{sc.label}</span></button>
          </div>
          <div style={{display:"flex",gap:10,fontSize:10,color:"var(--text-muted)"}}><span><b style={{color:"var(--text-secondary)"}}>{apps.length}</b> pers.</span><span><b style={{color:"var(--accent-emerald)"}}>{cont}</b> rec.</span><span><b style={{color:"var(--accent-sky)"}}>{apps.length-cont}</b> nuevos</span>{conflicts.length>0&&<span style={{color:"#ef4444",fontWeight:600}}>⚠ {conflicts.length} cambio(s)</span>}</div>
        </div>
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          <button onClick={()=>{s.setSelEpId(ep.id);s.navTo("casting");}} className="dc-btn" style={btnP({background:"linear-gradient(135deg,"+epCol+","+epCol+"cc)",padding:"6px 12px",fontSize:10})}>Casting</button>
          <button onClick={()=>s.setEditEpId(ep.id)} className="dc-btn" style={btnS({padding:"4px 8px",fontSize:9})}>✏</button>
          {s.delEpId===ep.id?<div style={{display:"flex",gap:3}}><button onClick={()=>{s.dispatch({type:"EPISODES/DELETE",payload:ep.id});s.setDelEpId(null);s.showToast("✓ Eliminado");}} style={btnD({padding:"4px 7px",fontSize:9})}>Sí</button><button onClick={()=>s.setDelEpId(null)} style={btnG({padding:"4px 6px",fontSize:9})}>No</button></div>:<button onClick={()=>s.setDelEpId(ep.id)} style={btnD({padding:"4px 7px",fontSize:9})}>×</button>}
        </div>
      </div>
      {conflicts.length>0&&<div style={{padding:"7px 16px",background:"rgba(239,68,68,0.05)",borderTop:"1px solid rgba(239,68,68,0.15)"}}>{conflicts.map((c,ci)=>{const ch=charMap[c.character_id];const newT=talentMap[c.talent_id];const prevT=s.casting.getPrevTalent(c.character_id,s.selSeriesId||0);return<div key={ci} style={{fontSize:10,color:"#ef4444"}}><b>{ch?ch.canonical_name:""}</b>: {prevT?prevT.name:""} → {newT?newT.name:""}</div>;})}</div>}
    </div>
  );
}

/* ── QUEUE ITEMS ───────────────────────────────────────────── */
function QueueItem({item,s,isMovie}){
  const conf=item.rows.filter(r=>r.talentConflict).length;const notFound=item.rows.filter(r=>r.talentNotFound).length;const stCol=SCOLS[(item.studio-1)||0];
  const principals=item.rows.filter(r=>r.tipo==="principal").length;
  return(
    <div className="dc-card" style={{...CARD_S,marginBottom:12,overflow:"hidden"}}>

/* ── SERIES AUTO-DETECTION ────────────────────────────────── */
function extractSeriesName(filename){
  let n=filename.replace(/\.(xlsx|xls|xlsm)$/i,'');
  // Remove season/episode markers in various formats
  n=n.replace(/[\s_\-]*\b(s\d{1,2}[ex]\d{1,2}|ep(?:isodio)?[\s_]*\d+|cap(?:ítulo|itulo)?[\s_\.]*\d+|temporada[\s_]*\d+|t\d{1,2}e\d{1,2}|e\d{2,3}|#\s*\d+|\d{3,})\b/gi,'');
  // Clean separators  n=n.replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
  // Title case
  n=n.split(' ').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
  return n||filename.replace(/\.(xlsx|xls|xlsm)$/i,'');
}

function autoDetectSeries(filename,seriesList){
  const fn=filename.toLowerCase().replace(/[_\-\.]/g,' ');
  for(const ser of seriesList){
    const sn=ser.name.toLowerCase().replace(/[_\-\.]/g,' ');
    if(fn.includes(sn))return ser;
    const words=sn.split(/\s+/).filter(w=>w.length>=3);
    if(words.length>0&&words.every(w=>fn.includes(w)))return ser;
  }
  // Fallback: best partial word-overlap
  let best=null,bestScore=0;
  for(const ser of seriesList){
    const sn=ser.name.toLowerCase().replace(/[_\-\.]/g,' ');
    const words=sn.split(/\s+/).filter(w=>w.length>=3);
    if(!words.length)continue;
    const hits=words.filter(w=>fn.includes(w)).length;
    const score=hits/words.length;
    if(score>bestScore&&score>=0.5){best=ser;bestScore=score;}
  }
  return best;
}

function UploadProgressCard({prog,onDismiss}){
  const pct=prog.total?Math.round(prog.done/prog.total*100):0;
  const done=prog.done>=prog.total&&!prog.current;
  const hasErr=prog.errors&&prog.errors.length>0;
  const accentColor=done?(hasErr?"#ef4444":"var(--accent-emerald)"):"var(--accent-indigo)";
  const borderColor=done?(hasErr?"rgba(239,68,68,0.3)":"rgba(52,211,153,0.3)"):"rgba(129,140,248,0.25)";
  const bgColor=done?(hasErr?"rgba(239,68,68,0.04)":"rgba(52,211,153,0.04)"):"rgba(129,140,248,0.04)";
  return(
    <div style={{...CARD_S,marginBottom:14,overflow:"hidden",border:"1px solid "+borderColor}}>
      <div style={{padding:"10px 16px",background:bgColor,display:"flex",alignItems:"center",gap:8}}>

          <div style={{fontWeight:600,fontSize:12,color:accentColor}}>
            {done?(hasErr?prog.errors.length+" error(es) — "+prog.done+" archivo(s) procesados":prog.done+" archivo(s) procesados"):("Procesando... "+prog.done+"/"+prog.total)}
          </div>

      </div>
      <div style={{height:3,background:"var(--bg-elevated)"}}>
        <div style={{height:"100%",background:done?(hasErr?"#ef4444":"#34d399"):"linear-gradient(90deg,var(--accent-indigo),var(--accent-violet))",width:pct+"%",transition:"width 200ms ease"}}/>
      </div>

          {prog.errors.map((e,i)=><div key={i} style={{fontSize:9,color:"#ef4444"}}>✗ {e}</div>)}
        </div>
      )}
    </div>
  );
}

/* ── UPLOAD & SAVE QUEUE ──────────────────────────────────── */
let _uploadBusy=false;
async function handleUpload(files,s){
  const arr=Array.from(files);if(!arr.length)return;
  if(s.currentUser&&s.currentUser.role==="lector"){s.showToast("🔒 Tu rol es de solo lectura — no puedes cargar desgloses");return;}
  if(_uploadBusy){s.showToast("⏳ Espera a que termine la carga anterior");return;}
  _uploadBusy=true;
  try{await _handleUpload(arr,s);}finally{_uploadBusy=false;}
}
async function _handleUpload(arr,s){
  // Initialise progress tracker
  s.setUploadProgress({total:arr.length,done:0,current:null,errors:[]});
  let liveTalents=[...s.data.talents];const newItems=[];
  // ── Pending talents (unrecognised talent names from Excel) ──
  const freshPending={};
  const existingPendingByName={};
  s.pendingTalents.forEach(pt=>{existingPendingByName[normN(pt.name)]=pt;});
  // ── Fuzzy queue (partial character name matches) ──
  const freshFuzzy={};
  const existFuzzyByKey={};
  s.fuzzyQueue.forEach(fq=>{existFuzzyByKey[normN(fq.rawName)+":"+fq.charId]=fq;});
  // ── Auto-provisioned series (zero-setup) ──
  const freshPendingSeries={};  // key = normN(extractedName) → series object
  const existPendingSerByNorm={};
  s.data.series.filter(x=>x.autoCreated).forEach(ps=>{existPendingSerByNorm[normN(ps.name)]=ps;});
  for(const file of arr){
    s.setUploadProgress(p=>({...p,current:file.name}));
    try{
      const{characters:charRows,castingMap:cMap,talentNames}=await parseDesglose(file);
      if(!charRows.length){s.setUploadProgress(p=>({...p,done:p.done+1,current:null,errors:[...p.errors,file.name+": sin personajes"]}));continue;}
      // Auto-detect series from filename; provision new one if no match found
      const detectedSer=autoDetectSeries(file.name,s.data.series.filter(x=>!x.autoCreated));
      let seriesId=s.selSeriesId||(detectedSer?detectedSer.id:null);
      let autoCreatedSeries=false;
      if(!seriesId){
        const extractedName=extractSeriesName(file.name);
        const enk=normN(extractedName);
        if(existPendingSerByNorm[enk]){seriesId=existPendingSerByNorm[enk].id;}
        else if(freshPendingSeries[enk]){seriesId=freshPendingSeries[enk].id;}
        else{const nid=uid();freshPendingSeries[enk]={id:nid,name:extractedName,type:"serie",status:"en_curso",director:"",tecnico:"",cliente:"",requiere_dubcard:true,studio_id:s.selStudio||1,autoCreated:true};seriesId=nid;}
        autoCreatedSeries=true;
      }
      const guessedEp=extractEpNum(file.name);
      // Ep num unique within same series
      const usedNums=newItems.filter(q=>q.seriesId===seriesId).map(q=>q.epNum);
      let epNum=guessedEp||1;while(usedNums.includes(epNum))epNum++;
      // Detect if this episode already exists (duplicate warning)
      const existingEp=s.data.episodes.find(e=>e.series_id===seriesId&&e.episode_number===epNum)||null;
      const processed=charRows.map(row=>{
        if(!row||!row.name)return null;
        const mr=findMatch(row.name,s.data.characters,s.data.aliases);const match=mr.match;const score=mr.score;
        const sid=seriesId||0;
        const rec=match?s.casting.isRecurring(match.id,sid,null):false;
        let atName=cMap[row.name.toLowerCase()]||null;if(!atName){const key=Object.keys(cMap).find(k=>simN(row.name,k)>=85);if(key)atName=cMap[key];}
        const excelTalent=atName?liveTalents.find(t=>normN(t.name)===normN(atName))||null:null;
        const prevT=match?s.casting.getPrevTalent(match.id,sid):null;
        const conflict=!!(match&&prevT&&excelTalent&&prevT.id!==excelTalent.id);
        const isNotFound=!!(atName&&!excelTalent);
        // Inherit talent from previous episode for recurring characters when Excel has no assignment
        const inheritedTalent=(!excelTalent&&rec&&prevT)?prevT:null;
        // Pre-register as pending talent (sandbox)
        let pendingTalentId=null;
        if(isNotFound){
          const nk=normN(atName);
          if(existingPendingByName[nk]){pendingTalentId=existingPendingByName[nk].id;}
          else if(freshPending[nk]){pendingTalentId=freshPending[nk].id;}
          else{const pid=uid();freshPending[nk]={id:pid,name:atName,sourceFile:file.name,status:"pending"};pendingTalentId=pid;}
        }
        // Register fuzzy character match for manual resolution
        const isFuzzyRow=!!(match&&score>0&&score<100);
        let fuzzyQueueId=null;
        if(isFuzzyRow){
          const fKey=normN(row.name)+":"+match.id;
          if(existFuzzyByKey[fKey]){fuzzyQueueId=existFuzzyByKey[fKey].id;}
          else if(freshFuzzy[fKey]){fuzzyQueueId=freshFuzzy[fKey].id;}
          else{const fqId=uid();freshFuzzy[fKey]={id:fqId,rawName:row.name,canonicalName:match.canonical_name,charId:match.id,matchScore:score,status:"pending",correctedName:""};fuzzyQueueId=fqId;}
        }
        const assignedTalentId=excelTalent?excelTalent.id:(inheritedTalent?inheritedTalent.id:null);
        return{_k:uid(),rawName:row.name,timecode:row.timecode,lines:row.lines,tipo:row.tipo||"secundario",isNew:!match,matchScore:score,canonicalName:match?match.canonical_name:row.name,charId:match?match.id:null,assignedTalentId,talentInherited:!!(inheritedTalent&&!excelTalent),recurring:rec,talentConflict:conflict,prevTalentName:prevT?prevT.name:null,talentNotFound:isNotFound,pendingTalentId,fuzzyPending:isFuzzyRow,fuzzyQueueId};
      }).filter(Boolean);
      newItems.push({id:uid(),filename:file.name,epNum,studio:s.selStudio||1,rows:processed,done:true,seriesId,autoCreatedSeries,epExists:!!existingEp,director:"",cliente:"",requiere_dubcard:true,fecha_miami:"",fecha_dubcard:"",fase:"pre_produccion"});
      s.setUploadProgress(p=>({...p,done:p.done+1,current:null}));
    }catch(err){
      const em=(err&&err.message)||String(err);const friendly=/No se pudo leer|está vacío|ya no está/.test(em)?em:(/password|encrypt|cfb|zip|corrupt|Unsupported/i.test(em)?"«"+file.name+"» no se pudo abrir: puede estar protegido con contraseña, dañado o no ser un Excel válido ("+em+")":file.name+": "+em);
      console.warn("[desglose]",file.name,err);
      s.setUploadProgress(p=>({...p,done:p.done+1,current:null,errors:[...p.errors,friendly]}));
      s.showToast("✗ "+friendly);
    }
  }
  // Dispatch auto-provisioned series before queue so saveQueue can find them
  const freshSeriesList=Object.values(freshPendingSeries);
  freshSeriesList.forEach(ser=>s.dispatch({type:"SERIES/ADD",payload:ser}));
  const pendingList=Object.values(freshPending);
  if(pendingList.length)s.setPendingTalents(p=>[...p,...pendingList]);
  const fuzzyList=Object.values(freshFuzzy);
  if(fuzzyList.length)s.setFuzzyQueue(fq=>[...fq,...fuzzyList]);
  if(newItems.length)s.setQueue(q=>[...q,...newItems]);
}

async function saveQueue(s){
  if(!s.queue.length)return;
  if(s.currentUser&&s.currentUser.role==="lector"){s.showToast("🔒 Tu rol es de solo lectura — cambios deshabilitados");return;}
  // Sólo se guardan los items con programa asignado explícitamente (nunca "a la serie que esté abierta")
  const valid=s.queue.filter(item=>item.seriesId!=null);
  if(!valid.length){s.showToast("⚠ No hay episodios con programa asignado");return;}
  if(valid.length<s.queue.length)s.showToast("⚠ "+(s.queue.length-valid.length)+" archivo(s) sin programa asignado se quedan en la cola");
  const createdEps=new Map();      // sid:epNum → episodio creado en esta pasada (s.data es un snapshot)
  const newCharByName=new Map();   // nombre normalizado → personaje creado en esta pasada
  const addedAliasKeys=new Set();
  await new Promise(r=>setTimeout(r,60)); // yield: permite renderizar el spinner del botón
  const sorted=[...valid].sort((a,b)=>{if(a.seriesId!==b.seriesId)return(a.seriesId||0)-(b.seriesId||0);return a.epNum-b.epNum;});
  let saved=0;const gateKeys=[];
  for(const item of sorted){
    const sid=item.seriesId;
    const ser=s.data.series.find(x=>x.id===sid);
    const isMovie=ser&&ser.type==="pelicula";
    // Metadatos POR CAPÍTULO capturados en la tarjeta de carga (no se escriben en el programa)
    const _dir=(item.director||"").trim();const _cli=(item.cliente||"").trim();
    const _req=isDiscovery(_cli)?false:(item.requiere_dubcard!==false);
    const epNum=isMovie?1:item.epNum;
    const capLabel=isMovie?"Película":"Episodio "+epNum;
    let ep=s.data.episodes.find(e=>e.series_id===sid&&e.episode_number===epNum)||createdEps.get(sid+":"+epNum);
    if(!ep){
      ep={id:uid(),series_id:sid,episode_number:epNum,title:capLabel,studio_id:item.studio,status:"pendiente",director:_dir,cliente:_cli,requiere_dubcard:_req,fecha_miami:item.fecha_miami||"",fecha_dubcard:item.fecha_dubcard||"",fase:item.fase||"pre_produccion"};
      createdEps.set(sid+":"+epNum,ep);
      s.dispatch({type:"EPISODES/ADD",payload:ep});
      // El gate solo aparece si quedaron fechas sin definir en la tarjeta
      if(!item.fecha_miami||(_req&&!item.fecha_dubcard))gateKeys.push({programa:ser?ser.name:"",capitulo:capLabel});
    }else{
      // "Sobrescribir": limpiar apariciones/castings previos del episodio para no duplicarlos
      s.dispatch({type:"EPISODE/CLEAR_CONTENT",payload:ep.id});
      s.dispatch({type:"EPISODES/UPDATE",payload:{...ep,studio_id:item.studio,director:_dir||ep.director||"",cliente:_cli||ep.cliente||"",requiere_dubcard:_req,fecha_miami:item.fecha_miami||ep.fecha_miami||"",fecha_dubcard:item.fecha_dubcard||ep.fecha_dubcard||"",fase:item.fase||ep.fase||"pre_produccion"}});
      // Sincronizar la fila de producción existente de este capítulo (fechas + fase + cliente/director)
      const prodRow=(s.data.produccion||[]).find(r=>normN(r.programa)===normN(ser?ser.name:"")&&r.capitulo===capLabel);
      if(prodRow){
        let fmt=prodRow.formato_dubcard;
        if(!_req)fmt="No necesita DUBCARD";
        else if(fmt==="No necesita DUBCARD")fmt=defaultFormatoDubcard(_cli||prodRow.cliente,true);
        const effMiami=item.fecha_miami||prodRow.fecha_miami||"";
        const effDub=_req?(item.fecha_dubcard||prodRow.fecha_dubcard||""):"";
        s.dispatch({type:"PRODUCCION/UPDATE",payload:{...prodRow,cliente:_cli||prodRow.cliente,director:_dir||prodRow.director,formato_dubcard:fmt,fecha_miami:effMiami,fecha_dubcard:effDub,fase:item.fase||prodRow.fase||"pre_produccion"}});
        if(!effMiami||(_req&&!effDub))gateKeys.push({programa:ser?ser.name:"",capitulo:capLabel});
      }
    }
    const nc=[],na=[],nap=[],nca=[];
    item.rows.forEach(row=>{let cid=row.charId;if(row.isNew){const key=normN(row.canonicalName);const ex=s.data.characters.find(c=>normN(c.canonical_name)===key)||newCharByName.get(key);if(ex){cid=ex.id;}else{cid=uid();const ch={id:cid,canonical_name:row.canonicalName,tipo:row.tipo||"secundario"};newCharByName.set(key,ch);nc.push(ch);}}else if(normN(row.rawName)!==normN(row.canonicalName)){const ak=cid+":"+normN(row.rawName);if(!addedAliasKeys.has(ak)&&!s.data.aliases.some(a=>a.character_id===cid&&normN(a.alias_name)===normN(row.rawName))){addedAliasKeys.add(ak);na.push({id:uid(),character_id:cid,alias_name:row.rawName});}}nap.push({id:uid(),character_id:cid,episode_id:ep.id,line_count:row.lines,first_timecode:row.timecode});const tid=Number(row.assignedTalentId);if(tid>0)nca.push({id:uid(),character_id:cid,talent_id:tid,episode_id:ep.id});});
    if(nc.length)s.dispatch({type:"CHARS/ADD_MANY",payload:nc});if(na.length)s.dispatch({type:"ALIASES/ADD_MANY",payload:na});if(nap.length)s.dispatch({type:"APPS/ADD_MANY",payload:nap});if(nca.length)s.dispatch({type:"CASTINGS/ADD_MANY",payload:nca});
    saved++;
  }
  s.setQueue([]);s.showToast("✓ "+saved+" episodio(s) guardados");
  // Trigger on-upload: exigir fecha de entrega y fecha DUBCARD de los proyectos recién creados
  if(gateKeys.length&&s.setMetaGate)s.setMetaGate(gateKeys);
}

    else if(sortCast==="principal")out.sort((a,b)=>{const ta=a.ch?.tipo==="principal"?0:1,tb=b.ch?.tipo==="principal"?0:1;return ta-tb||a.ep.episode_number-b.ep.episode_number;});

  const conflictCount=rows.filter(r=>r.conflict).length;

    const out=[];

      const sorted=entries.sort((a,b)=>a.ep.episode_number-b.ep.episode_number);
      const segs=[];let cur=null;
      sorted.forEach(({ep,talent})=>{const tid=talent?talent.id:null;if(!cur||(cur.talent?cur.talent.id:null)!==tid){if(cur)segs.push(cur);cur={talent,eps:[ep.episode_number]};}else{cur.eps.push(ep.episode_number);}});
      if(cur)segs.push(cur);
      if(segs.length>1)out.push({ch,segs});

  return(

              const{ep,app,ch,tal,cast,cont,col,epSt,conflict,prevT}=row;const load=tal?s.casting.getTalentLoad(tal.id):0;const lv=loadLv(load);
              const tipo=ch?.tipo||"secundario";const tipoCol=tipo==="principal"?"var(--accent-indigo)":"var(--text-muted)";

                      style={{background:"none",border:"none",cursor:"pointer",fontSize:10,fontWeight:700,color:tipoCol,padding:2,borderRadius:4}}>
                      {tipo==="principal"?"★":"○"}

                  </td>
                  <td style={{padding:"8px 12px"}}>{cont?<Pill c="var(--accent-emerald)" txt="sí"/>:<Pill c="var(--text-muted)" txt="no"/>}</td>

            })}</tbody>

        </div>
      </div>

      {/* ── Historial de Cambios de Talento ────────────────────── */}
      {relevodData.length>0&&(
        <div style={{...CARD_S,overflow:"hidden"}}>
          <div style={{padding:"12px 18px",borderBottom:"1px solid var(--border-subtle)",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontWeight:700,fontSize:13,color:"var(--text-primary)"}}>📋 Historial de Cambios de Talento</span>

                  {segs.map((seg,si)=>{

                    return(
                      <React.Fragment key={si}>
                        {si>0&&<span style={{color:"#ef4444",fontWeight:800,fontSize:12}}>→</span>}
                        <div style={{background:si>0?"rgba(239,68,68,0.06)":"rgba(129,140,248,0.06)",border:"1px solid "+(si>0?"rgba(239,68,68,0.2)":"rgba(129,140,248,0.2)"),borderRadius:8,padding:"4px 10px"}}>
                          <div style={{fontSize:9,color:si>0?"#ef4444":"var(--accent-indigo)",fontWeight:700}}>{epLabel}</div>
                          <div style={{fontSize:11,fontWeight:600,color:"var(--text-primary)",marginTop:1}}>{talName}</div>
                          {si>0&&<div style={{fontSize:9,color:"var(--text-muted)",marginTop:1}}>↑ Punto de corte: Ep.{epMin}</div>}
                        </div>
                      </React.Fragment>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══ FEATURE: Sustitución Dinámica de Talentos en el Reparto ══ */
function ReassignTalentModal({charId,charName,currentTalent,onClose}){
  const s=useApp();
  const{talentMap,epMap}=s.derived;
  const[query,setQuery]=useState("");
  const[newId,setNewId]=useState(0);
  const[scope,setScope]=useState("program"); // "program" | "episode"
  const epIdsOfChar=useMemo(()=>{
    const setEp=new Set(s.serEps.map(e=>e.id));
    return [...new Set(s.data.castings.filter(c=>c.character_id===charId&&setEp.has(c.episode_id)).map(c=>c.episode_id))];
  },[s.data.castings,s.serEps,charId]);
  const[scopeEp,setScopeEp]=useState(epIdsOfChar[0]||0);
  const candidates=useMemo(()=>{
    let list=s.data.talents.filter(t=>!currentTalent||t.id!==currentTalent.id);
    if(query.trim())list=list.filter(t=>fuzzyScore(query,t.name)>=FUZZY_THR).sort((a,b)=>fuzzyScore(query,b.name)-fuzzyScore(query,a.name));
    else list=[...list].sort((a,b)=>a.name.localeCompare(b.name));
    return list.slice(0,8);
  },[s.data.talents,query,currentTalent]);
  const apply=()=>{
    if(!newId){s.showToast("Selecciona el talento nuevo");return;}
    const target=s.data.talents.find(t=>t.id===newId);if(!target)return;
    const epSet=scope==="program"?new Set(epIdsOfChar):new Set([Number(scopeEp)]);
    // Lógica de intercambio: desvincular Talento_A y vincular Talento_B al MISMO personaje, exclusivo del programa
    const next=s.data.castings.map(c=>c.character_id===charId&&epSet.has(c.episode_id)&&(!currentTalent||c.talent_id===currentTalent.id)?{...c,talent_id:target.id}:c);
    if(s.casting&&s.casting.setCastingsNotif)s.casting.setCastingsNotif(next);else s.dispatch({type:"CASTINGS/SET",payload:next});
    s.showToast("⇄ "+charName+": "+(currentTalent?currentTalent.name:"Sin asignar")+" → "+target.name);
    onClose();
  };
  return(
    <ModalShell title={"⇄ Reasignar Talento — "+charName} width={480} onClose={onClose}>
      <div style={{fontSize:11,color:"var(--text-secondary)",marginBottom:12}}>Talento actual: <b style={{color:"var(--text-primary)"}}>{currentTalent?currentTalent.name:"Sin asignar"}</b></div>
      <label style={SLBL}>Buscar talento nuevo</label>
      <input autoFocus value={query} onChange={e=>{setQuery(e.target.value);setNewId(0);}} placeholder="Escribe el nombre…" style={{...SIPT,marginBottom:8}}/>
      <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:14,maxHeight:180,overflowY:"auto"}}>
        {candidates.map(t=>(
          <div key={t.id} onClick={()=>setNewId(t.id)} style={{padding:"8px 12px",borderRadius:8,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",gap:8,background:newId===t.id?"rgba(167,139,250,0.12)":"var(--bg-input)",border:"1px solid "+(newId===t.id?"var(--accent-cyan)":"var(--border-subtle)")}}>
            <span style={{flex:1,fontWeight:600}}>{t.name}</span>
            {newId===t.id&&<span style={{color:"var(--accent-cyan)"}}>✓</span>}
          </div>
        ))}
        {!candidates.length&&<div style={{fontSize:11,color:"var(--text-muted)",padding:8}}>Sin coincidencias</div>}
      </div>
      <label style={SLBL}>Alcance del cambio</label>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16}}>
        <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,cursor:"pointer"}}>
          <input type="radio" checked={scope==="program"} onChange={()=>setScope("program")}/>
          Todo el programa ({epIdsOfChar.length} episodio{epIdsOfChar.length!==1?"s":""}) — se propaga a todos los llamados y desgloses
        </label>
        <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,cursor:"pointer"}}>
          <input type="radio" checked={scope==="episode"} onChange={()=>setScope("episode")}/>
          Solo un episodio:
          <select disabled={scope!=="episode"} value={scopeEp} onChange={e=>setScopeEp(e.target.value)} style={{...SIPT,width:"auto",padding:"4px 8px",fontSize:11}}>
            {epIdsOfChar.map(id=>{const ep=epMap[id];return <option key={id} value={id}>Ep. {ep?ep.episode_number:id}</option>;})}
          </select>
        </label>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={onClose} className="dc-btn" style={btnG({flex:1,padding:"10px 0"})}>Cancelar</button>
        <button onClick={apply} className="dc-btn" style={btnP({flex:1,padding:"10px 0"})}>⇄ Reasignar</button>
      </div>
    </ModalShell>
  );
}

function RepartoView(){
  const s=useApp();const{charMap,talentMap,epMap,seriesMap,appsByEp,castByEpChar}=s.derived;
  const epIdSet=useMemo(()=>new Set(s.serEps.map(e=>e.id)),[s.serEps]);
  const[repartoSearch,setRepartoSearch]=useState("");const dRepartoSearch=useDebounce(repartoSearch,300);
  const[filterGenero,setFilterGenero]=useState("");
  const[sortBy,setSortBy]=useState("volume");
  const[viewMode,setViewMode]=useState("talent"); // "talent" | "character"
  const[reassign,setReassign]=useState(null); // {charId,charName,currentTalent}
  const[dismissTick,setDismissTick]=useState(0);
  // Conflictos de cruce de páginas (del programa actual, excluyendo descartados)
  const pageConflicts=useMemo(()=>{
    const all=findPageConflicts(s.data.castings,s.data.appearances,epIdSet);
    const dismissed=getDismissedConflicts();
    return all.filter(c=>!dismissed[c.key]);
  },[s.data.castings,s.data.appearances,epIdSet,dismissTick]);
  const setPagesFor=(charId,epId,v)=>{
    const apps=appsByEp[epId]||[];
    const app=apps.find(a=>a.character_id===charId);
    if(app){if((app.pages||"")!==v)s.dispatch({type:"APPS/UPDATE",payload:{...app,pages:v}});}
    else if(v.trim())s.dispatch({type:"APPS/ADD_MANY",payload:[{id:uid(),character_id:charId,episode_id:epId,line_count:0,first_timecode:"",pages:v}]});
  };

  /* ── Modo Por Talento ─────────────────────────────── */
  const allTalMap=useMemo(()=>{const talMap={};s.data.castings.filter(c=>epIdSet.has(c.episode_id)).forEach(c=>{const tal=talentMap[c.talent_id];const ch=charMap[c.character_id];if(!tal||!ch)return;if(!talMap[tal.id])talMap[tal.id]={talent:tal,charsSeen:{},castings:[],totalLines:0,hasMainChar:false};talMap[tal.id].charsSeen[ch.canonical_name]=true;if(ch.tipo==="principal")talMap[tal.id].hasMainChar=true;talMap[tal.id].castings.push(c);const apps=appsByEp[c.episode_id]||[];const app=apps.find(a=>a.character_id===c.character_id);talMap[tal.id].totalLines+=app?(app.line_count||0):0;});return Object.values(talMap);},[s.data.castings,epIdSet,talentMap,charMap,appsByEp]);
  const{mainSorted,voicesSorted}=useMemo(()=>{
    let list=allTalMap;
    if(dRepartoSearch.trim()){const q=normN(dRepartoSearch);list=list.filter(item=>normN(item.talent.name).includes(q)||Object.keys(item.charsSeen).some(cn=>normN(cn).includes(q)));}
    if(filterGenero)list=list.filter(e=>e.talent.genero===filterGenero);
    const sorter=sortBy==="alpha"?(a,b)=>a.talent.name.localeCompare(b.talent.name):(a,b)=>b.totalLines-a.totalLines||b.castings.length-a.castings.length;
    const main=list.filter(item=>item.hasMainChar).sort(sorter);
    const voices=list.filter(item=>!item.hasMainChar).sort(sorter);
    return{mainSorted:main,voicesSorted:voices};
  },[allTalMap,dRepartoSearch,filterGenero,sortBy]);

  /* ── Modo Por Personaje ───────────────────────────── */
  const charCentricList=useMemo(()=>{
    const chMap={};
    s.data.appearances.filter(a=>epIdSet.has(a.episode_id)).forEach(a=>{
      const ch=charMap[a.character_id];const ep=epMap[a.episode_id];if(!ch||!ep)return;
      const cast=castByEpChar[ep.id+":"+a.character_id];const tal=cast?talentMap[cast.talent_id]:null;
      if(!chMap[a.character_id])chMap[a.character_id]={char:ch,episodes:[],totalLines:0};
      chMap[a.character_id].episodes.push({ep,talent:tal,lines:a.line_count||0});
      chMap[a.character_id].totalLines+=a.line_count||0;
    });
    let list=Object.values(chMap).map(item=>{
      const eps=item.episodes.sort((a,b)=>a.ep.episode_number-b.ep.episode_number);
      // Detectar relevos
      const relevos=[];let prevTal=null;
      eps.forEach(({ep,talent})=>{if(prevTal&&talent&&prevTal.id!==talent.id)relevos.push({ep,prevTalent:prevTal,newTalent:talent});prevTal=talent||prevTal;});
      const currentTalent=eps.length?eps[eps.length-1].talent:null;
      return{...item,episodes:eps,relevos,currentTalent};
    });
    if(dRepartoSearch.trim()){const q=normN(dRepartoSearch);list=list.filter(item=>normN(item.char.canonical_name).includes(q)||item.episodes.some(e=>e.talent&&normN(e.talent.name).includes(q)));}
    const sorter=sortBy==="alpha"?(a,b)=>a.char.canonical_name.localeCompare(b.char.canonical_name):(a,b)=>b.totalLines-a.totalLines;
    const main=list.filter(item=>item.char.tipo==="principal").sort(sorter);
    const voices=list.filter(item=>item.char.tipo!=="principal").sort(sorter);
    return{main,voices};
  },[s.data.appearances,epIdSet,charMap,epMap,castByEpChar,talentMap,dRepartoSearch,sortBy]);

  if(!allTalMap.length&&!s.data.appearances.filter(a=>epIdSet.has(a.episode_id)).length)
    return <div style={{textAlign:"center",padding:60,color:"var(--text-muted)"}}>Sin castings asignados.</div>;

  /* ── TalentCard (modo Por Talento) ────────────────── */
  const TalentCard=({item,idx})=>{
    const charList=Object.keys(item.charsSeen);const lv=loadLv(charList.length);
    return(
      <div className="dc-card" style={{...CARD_S,overflow:"hidden"}}>
        <div style={{padding:"14px 18px",background:"var(--bg-elevated)",borderBottom:"1px solid var(--border-subtle)",display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:28,height:28,borderRadius:8,background:"rgba(129,140,248,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:12,color:"var(--accent-indigo)",flexShrink:0}}>{idx+1}</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14,color:"var(--text-primary)"}}>{item.talent.name}{item.talent.genero&&<span style={{marginLeft:7,fontSize:11,color:item.talent.genero==="masculino"?"var(--accent-sky)":"var(--accent-rose)"}}>{item.talent.genero==="masculino"?"♂":"♀"}</span>}</div><div style={{fontSize:10,color:"var(--text-muted)",marginTop:1}}>{charList.length} pers. · {item.castings.length} apars. · <b style={{color:"var(--text-secondary)"}}>{item.totalLines}</b> lins.</div></div>
          <Bdg bg={lv.bg} color={lv.color} txt={lv.label}/>
        </div>
        <div style={{padding:"12px 18px",display:"flex",flexDirection:"column",gap:2}}>{charList.map((chName,ci)=>{
          const epNums=[];item.castings.forEach(c=>{const ch2=charMap[c.character_id];if(ch2&&ch2.canonical_name===chName){const ep2=epMap[c.episode_id];if(ep2)epNums.push(ep2.episode_number);}});
          const uniqEps=[...new Set(epNums)].sort((a,b)=>a-b);
          const charLines=item.castings.filter(c=>{const ch2=charMap[c.character_id];return ch2&&ch2.canonical_name===chName;}).reduce((sum,c)=>{const apps=appsByEp[c.episode_id]||[];const app=apps.find(a=>a.character_id===c.character_id);return sum+(app?(app.line_count||0):0);},0);
          const chId=(item.castings.find(c=>{const ch2=charMap[c.character_id];return ch2&&ch2.canonical_name===chName;})||{}).character_id;
          // Episodios donde ESTE talento tiene 2+ personajes (riesgo de cruce) e incluyen a este personaje
          const multiEps=[...new Set(item.castings.filter(c=>c.character_id===chId).map(c=>c.episode_id))].filter(epId=>item.castings.filter(c=>c.episode_id===epId).length>=2);
          return(<div key={ci} className="dc-row" style={{display:"flex",flexDirection:"column",gap:4,padding:"7px 0",borderBottom:"1px solid var(--border-subtle)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{fontWeight:600,fontSize:12,flex:1,color:"var(--text-primary)"}}>{chName}</div>
              {charLines>0&&<span style={{fontSize:10,color:"var(--accent-indigo)",fontWeight:600}}>{charLines} lin.</span>}
              <div style={{display:"flex",gap:3}}>{uniqEps.map((n,j)=><Pill key={j} c="var(--accent-sky)" txt={"Ep."+n}/>)}</div>
              <button title="Reasignar talento de este personaje" onClick={()=>setReassign({charId:chId,charName:chName,currentTalent:item.talent})} className="dc-btn" style={{background:"rgba(167,139,250,0.07)",border:"1px solid rgba(167,139,250,0.25)",borderRadius:7,color:"var(--accent-cyan)",fontSize:10,fontWeight:700,padding:"3px 9px",cursor:"pointer",flexShrink:0}}>⇄ Reasignar</button>
            </div>
            {multiEps.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",paddingLeft:2}}>
              <span style={{fontSize:9,color:"var(--text-muted)",fontWeight:600}}>📄 Págs:</span>
              {multiEps.map(epId=>{const ep3=epMap[epId];const app3=(appsByEp[epId]||[]).find(a=>a.character_id===chId);
                return(<span key={epId} style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:9.5,color:"var(--text-muted)"}}>Ep.{ep3?ep3.episode_number:epId}
                  <input defaultValue={app3&&app3.pages?app3.pages:""} placeholder="3,5-7" onBlur={e=>setPagesFor(chId,epId,e.target.value)} style={{background:"var(--bg-input)",border:"1px solid var(--border-subtle)",borderRadius:6,color:"var(--text-primary)",padding:"2px 7px",fontSize:10,width:72,outline:"none"}}/>
                </span>);})}
            </div>}
          </div>);
        })}</div>
      </div>
    );
  };

  /* ── CharCard (modo Por Personaje) ────────────────── */
  const CharCard=({item,idx})=>{
    const tipo=item.char.tipo||"secundario";const tipoC=tipo==="principal"?"var(--accent-indigo)":"var(--text-muted)";
    const hasRelevo=item.relevos.length>0;
    return(
      <div className="dc-card" style={{...CARD_S,overflow:"hidden",borderLeft:hasRelevo?"3px solid #ef4444":"3px solid var(--border-subtle)"}}>
        <div style={{padding:"12px 16px",background:"var(--bg-elevated)",borderBottom:"1px solid var(--border-subtle)",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:24,height:24,borderRadius:6,background:"rgba(129,140,248,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:10,color:"var(--accent-indigo)",flexShrink:0}}>{idx+1}</div>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontWeight:700,fontSize:13,color:"var(--text-primary)"}}>{item.char.canonical_name}</span>
              <span style={{fontSize:9,fontWeight:600,color:tipoC}}>{tipo==="principal"?"★":""}</span>
              {hasRelevo&&<span style={{fontSize:9,fontWeight:700,color:"#ef4444",background:"rgba(239,68,68,0.1)",padding:"1px 6px",borderRadius:99}}>RELEVO x{item.relevos.length}</span>}
              <button title="Reasignar talento de este personaje" onClick={()=>setReassign({charId:item.char.id,charName:item.char.canonical_name,currentTalent:item.currentTalent})} className="dc-btn" style={{background:"rgba(167,139,250,0.07)",border:"1px solid rgba(167,139,250,0.25)",borderRadius:7,color:"var(--accent-cyan)",fontSize:10,fontWeight:700,padding:"3px 9px",cursor:"pointer",flexShrink:0,marginLeft:"auto"}}>⇄</button>
            </div>
            <div style={{fontSize:10,color:"var(--text-muted)",marginTop:2,display:"flex",gap:8}}>
              <span>{item.episodes.length} eps. · {item.totalLines} lins.</span>
              {item.currentTalent&&<span>Continuidad: <b style={{color:"var(--accent-emerald)"}}>{item.currentTalent.name}</b></span>}
            </div>
          </div>
        </div>
        {/* Línea de episodios agrupados por talento */}
        <div style={{padding:"10px 16px",display:"flex",flexDirection:"column",gap:4}}>
          {(()=>{
            const segments=[];let curTal=null;let curEps=[];
            item.episodes.forEach(({ep,talent,lines},i)=>{
              const talId=talent?talent.id:null;
              if(curTal===null){curTal=talent;curEps=[{ep,lines}];}
              else if(talId===(curTal?curTal.id:null)){curEps.push({ep,lines});}
              else{segments.push({talent:curTal,eps:curEps});curTal=talent;curEps=[{ep,lines}];}
            });
            if(curEps.length)segments.push({talent:curTal,eps:curEps});
            return segments.map((seg,si)=>{
              const isChange=si>0;const talName=seg.talent?seg.talent.name:"Sin asignar";
              const epNums=seg.eps.map(e=>e.ep.episode_number);const firstEp=Math.min(...epNums);const lastEp=Math.max(...epNums);
              const epLabel=firstEp===lastEp?"Ep."+firstEp:"Ep."+firstEp+"–"+lastEp;
              const segLines=seg.eps.reduce((s,e)=>s+e.lines,0);
              return(
                <div key={si} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderTop:isChange?"1px dashed rgba(239,68,68,0.3)":"none"}}>
                  {isChange&&<span style={{fontSize:9,fontWeight:700,color:"#ef4444",background:"rgba(239,68,68,0.08)",borderRadius:4,padding:"1px 5px",flexShrink:0}}>RELEVO</span>}
                  <Pill c={isChange?"#ef4444":"var(--accent-sky)"} txt={epLabel}/>
                  <span style={{fontSize:11,fontWeight:600,color:seg.talent?"var(--text-primary)":"var(--text-muted)",flex:1}}>{talName}</span>
                  {segLines>0&&<span style={{fontSize:10,color:"var(--accent-indigo)",fontWeight:600}}>{segLines} lin.</span>}
                </div>
              );
            });
          })()}
        </div>
      </div>
    );
  };

  return(
    <div className="dc-view">
      {reassign&&<ReassignTalentModal charId={reassign.charId} charName={reassign.charName} currentTalent={reassign.currentTalent} onClose={()=>setReassign(null)}/>}
      {/* ⚠️ Banner de Conflictos de Cruce de Páginas */}
      {pageConflicts.length>0&&<div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.4)",borderRadius:12,padding:"12px 16px",marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:12,color:"#ef4444",marginBottom:8,display:"flex",alignItems:"center",gap:8}}>⚠️ Conflicto de Continuidad — Cruce de páginas detectado ({pageConflicts.length})</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {pageConflicts.map(cf=>{
            const tal=talentMap[cf.talent_id],a=charMap[cf.charA],b=charMap[cf.charB],ep=epMap[cf.episode_id];
            return(
              <div key={cf.key} style={{display:"flex",alignItems:"center",gap:10,fontSize:11.5,color:"var(--text-primary)",background:"rgba(239,68,68,0.06)",borderRadius:8,padding:"7px 10px",flexWrap:"wrap"}}>
                <span style={{flex:1,minWidth:200}}>El talento <b>{tal?tal.name:"?"}</b> está asignado a <b>{a?a.canonical_name:"?"}</b> y <b>{b?b.canonical_name:"?"}</b> en la página <b style={{color:"#ef4444"}}>{cf.pages.join(", ")}</b>{ep?" (Ep. "+ep.episode_number+")":""}</span>
                <button onClick={()=>{if(window.confirm("¿Ignorar esta advertencia? El cruce puede ser intencional (doble, efecto especial). No se volverá a mostrar."))   {dismissConflict(cf.key);setDismissTick(t=>t+1);}}} className="dc-btn" style={{background:"rgba(239,68,68,0.12)",border:"1px solid rgba(239,68,68,0.35)",borderRadius:7,color:"#ef4444",fontSize:10,fontWeight:700,padding:"4px 10px",cursor:"pointer",flexShrink:0}}>Ignorar</button>
              </div>
            );
          })}
        </div>
        <div style={{fontSize:9.5,color:"var(--text-muted)",marginTop:8}}>📣 Producción/Dirección fue notificada por la campana. Edita las páginas de cada personaje abajo (campo "Págs") para validar el cruce.</div>
      </div>}
      {/* Controles comunes — inlined to prevent focus loss caused by inner component remounting */}
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14,gap:10,flexWrap:"wrap",overflow:"hidden"}}>
        <div style={{fontWeight:800,fontSize:17,letterSpacing:"-0.02em",color:"var(--text-primary)",flexShrink:0}}>Reparto — {s.curSeries?s.curSeries.name:""}</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",minWidth:0,overflow:"hidden"}}>
          <div style={{display:"inline-flex",background:"var(--bg-secondary)",borderRadius:"var(--radius-md)",padding:3,gap:2,border:"1px solid var(--border-subtle)",flexShrink:0}}>
            {[{k:"talent",l:"👤 Por Talento"},{k:"character",l:"🎭 Por Personaje"}].map(o=>{const active=viewMode===o.k;return(<button key={o.k} onClick={()=>setViewMode(o.k)} className="dc-btn" style={{padding:"5px 12px",borderRadius:7,border:"none",fontSize:10,fontWeight:active?700:500,background:active?"var(--bg-card)":"transparent",color:active?"var(--text-primary)":"var(--text-muted)",boxShadow:active?"var(--shadow-sm)":"none"}}>{o.l}</button>);})}
          </div>
          <div style={{position:"relative",flex:"1 1 160px",minWidth:0,maxWidth:260,overflow:"hidden"}}>
            <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",fontSize:11,color:"var(--text-muted)",pointerEvents:"none",zIndex:1}}>🔍</span>
            <input value={repartoSearch} onChange={e=>setRepartoSearch(e.target.value)} placeholder="Buscar..." style={{...SIPT,paddingLeft:"27px",paddingRight:"24px",fontSize:11,width:"100%",minWidth:0}}/>
            {repartoSearch&&<button onClick={()=>setRepartoSearch("")} style={{position:"absolute",right:7,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--text-muted)",fontSize:13,lineHeight:1}}>×</button>}
          </div>
          {viewMode==="talent"&&<select value={filterGenero} onChange={e=>setFilterGenero(e.target.value)} style={{...SIPT,width:"auto",fontSize:11,padding:"7px 10px"}}><option value="">— Todos —</option><option value="masculino">♂ Masculino</option><option value="femenino">♀ Femenino</option></select>}
          <div style={{display:"inline-flex",background:"var(--bg-secondary)",borderRadius:"var(--radius-md)",padding:3,gap:2,border:"1px solid var(--border-subtle)"}}>
            {[{k:"volume",l:"Por líneas"},{k:"alpha",l:"A→Z"}].map(o=>{const active=sortBy===o.k;return(<button key={o.k} onClick={()=>setSortBy(o.k)} className="dc-btn" style={{padding:"4px 10px",borderRadius:6,border:"none",fontSize:10,fontWeight:active?700:500,background:active?"var(--bg-card)":"transparent",color:active?"var(--text-primary)":"var(--text-muted)",boxShadow:active?"var(--shadow-sm)":"none"}}>{o.l}</button>);})}
          </div>
          {(filterGenero||repartoSearch)&&<button onClick={()=>{setFilterGenero("");setRepartoSearch("");}} style={{...btnS(),fontSize:10}}>× Limpiar</button>}
        </div>
      </div>
      {viewMode==="talent"?(
        <>
          {mainSorted.length===0&&voicesSorted.length===0&&allTalMap.length>0&&<div style={{textAlign:"center",padding:28,color:"var(--text-muted)",fontSize:12}}>Sin resultados.</div>}

/* ── SINCRONIZAR TALENTOS CON EXCEL: deja la base igual a la lista maestra (añade, renombra similares, elimina) ── */
function SyncTalentsModal({onClose}){
  const s=useApp();
  const[plan,setPlan]=useState(null);const[busy,setBusy]=useState(false);const[fileName,setFileName]=useState("");
  const inRef=useRef(null);
  const assignCount=useMemo(()=>{const m={};s.data.castings.forEach(c=>{m[c.talent_id]=(m[c.talent_id]||0)+1;});return m;},[s.data.castings]);
  const build=(names)=>{
    const talents=s.data.talents;const byNorm=new Map();talents.forEach(t=>byNorm.set(normN(t.name),t));
    const matched=new Set();const add=[],rename=[];
    names.forEach(x=>{
      const k=normN(x.name);const ex=byNorm.get(k);
      if(ex&&!matched.has(ex.id)){matched.add(ex.id);return;}
      // Similar (acentos, apellido abreviado, error de tecleo): renombrar en vez de borrar+crear (conserva castings)
      let best=null,bs=0;talents.forEach(t=>{if(matched.has(t.id))return;const sc=simN(x.name,t.name);if(sc>bs){bs=sc;best=t;}});
      if(best&&bs>=85){matched.add(best.id);rename.push({id:best.id,from:best.name,to:x.name,score:bs,on:true});return;}
      add.push({name:x.name,minor:x.minor,on:true});
    });
    const remove=talents.filter(t=>!matched.has(t.id)).map(t=>({id:t.id,name:t.name,uses:assignCount[t.id]||0,on:true}));
    return{add,rename,remove,keep:matched.size-rename.length,total:names.length};
  };
  const onFile=async(f)=>{
    if(!f)return;setBusy(true);setPlan(null);
    try{const r=await parseTalentMasterXLSX(f);if(!r.names.length)throw new Error("No encontré nombres de talentos en el archivo");setFileName(f.name+" · hoja "+r.sheet+" · col. "+r.column+" · "+r.names.length+" nombres");setPlan(build(r.names));}
    catch(e){s.showToast("✗ "+((e&&e.message)||e));}
    finally{setBusy(false);}
  };
  const toggle=(list,i)=>setPlan(p=>({...p,[list]:p[list].map((x,j)=>j===i?{...x,on:!x.on}:x)}));
  const setAll=(list,on)=>setPlan(p=>({...p,[list]:p[list].map(x=>({...x,on}))}));
  const apply=async()=>{
    if(!plan)return;
    const adds=plan.add.filter(x=>x.on),rens=plan.rename.filter(x=>x.on),rems=plan.remove.filter(x=>x.on);
    const usesLost=rems.reduce((a,x)=>a+x.uses,0);
    if(!(await dcConfirm("Se aplicará:\n• "+adds.length+" talento(s) nuevos\n• "+rens.length+" renombrado(s)\n• "+rems.length+" eliminado(s)"+(usesLost?" (se quitan "+usesLost+" asignaciones de casting; todo queda en la papelera)":"")+"\n\n¿Continuar?",{title:"Sincronizar talentos",ok:"Aplicar"})))return;
    if(rems.length)s.dispatch({type:"TALENTS/DELETE_MANY",payload:rems.map(x=>x.id)});
    rens.forEach(x=>{const t=s.data.talents.find(t=>t.id===x.id);if(t)s.dispatch({type:"TALENTS/UPDATE",payload:{...t,name:x.to}});});
    if(adds.length)s.dispatch({type:"TALENTS/ADD_MANY",payload:adds.map(x=>({id:uid(),name:x.name,genero:"",edad_aparente:x.minor?"niño":"",tono_de_voz:""}))});
    s.showToast("✓ Talentos sincronizados: +"+adds.length+" · ✎"+rens.length+" · −"+rems.length);
    onClose(true);
  };
  const Sec=({title,color,list,lk,render})=>(
    <div style={{...CARD_S,padding:"10px 12px",marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <span style={{fontWeight:800,fontSize:12,color}}>{title} ({list.filter(x=>x.on).length}/{list.length})</span>
        {list.length>0&&<span style={{marginLeft:"auto",display:"flex",gap:6}}><button className="dc-btn" onClick={()=>setAll(lk,true)} style={btnG({padding:"2px 8px",fontSize:10})}>Todos</button><button className="dc-btn" onClick={()=>setAll(lk,false)} style={btnG({padding:"2px 8px",fontSize:10})}>Ninguno</button></span>}
      </div>
      {!list.length?<div style={{fontSize:11,color:"var(--text-muted)"}}>—</div>:
      <div style={{maxHeight:160,overflowY:"auto",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:"2px 10px"}}>
        {list.map((x,i)=><label key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,cursor:"pointer",opacity:x.on?1:0.5}}><input type="checkbox" checked={x.on} onChange={()=>toggle(lk,i)}/>{render(x)}</label>)}
      </div>}
    </div>
  );
  return(
    <ModalShell title="🔄 Sincronizar talentos con Excel" onClose={onClose} width="min(900px,100%)">
      <div style={{fontSize:12,color:"var(--text-secondary)",marginBottom:12,lineHeight:1.5}}>Sube la lista maestra (p. ej. la base de contabilidad, columna <b>Talento – Nombre Artístico</b>). La base de talentos quedará igual a esa lista: se <b style={{color:"var(--accent-emerald)"}}>añaden</b> los que faltan, se <b style={{color:"var(--accent-cyan)"}}>renombran</b> los que sólo difieren en acentos o tecleo (conservan sus castings) y se <b style={{color:"var(--accent-rose)"}}>eliminan</b> los que no están (van a la papelera y se pueden restaurar).</div>
      <div onClick={()=>inRef.current&&inRef.current.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();onFile(e.dataTransfer.files&&e.dataTransfer.files[0]);}}
        style={{border:"2px dashed var(--border-strong)",borderRadius:"var(--radius-md)",padding:"16px",textAlign:"center",cursor:"pointer",background:"rgba(167,139,250,0.04)",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--accent-cyan)"}}>{busy?"Leyendo…":"Clic · arrastra el Excel de talentos"}</div>
        <div style={{fontSize:11,color:"var(--text-muted)",marginTop:3}}>{fileName||".xlsx / .xlsm · se detecta la columna de nombre artístico automáticamente"}</div>
        <input ref={inRef} type="file" accept=".xlsx,.xlsm,.xls" style={{display:"none"}} onChange={e=>{onFile(e.target.files&&e.target.files[0]);e.target.value="";}}/>
      </div>
      {plan&&<React.Fragment>
        <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:10}}>{plan.total} nombres en el Excel · {plan.keep} ya existen sin cambios · base actual: {s.data.talents.length} talentos → quedarán {s.data.talents.length-plan.remove.filter(x=>x.on).length+plan.add.filter(x=>x.on).length}</div>
        <Sec title="➕ Añadir" color="var(--accent-emerald)" list={plan.add} lk="add" render={x=><span>{x.name}{x.minor&&<span style={{fontSize:9,color:"var(--accent-amber)",marginLeft:4}}>menor</span>}</span>}/>
        <Sec title="✎ Renombrar (similares)" color="var(--accent-cyan)" list={plan.rename} lk="rename" render={x=><span>{x.from} <span style={{color:"var(--text-muted)"}}>→</span> <b>{x.to}</b> <span style={{fontSize:9,color:"var(--text-muted)"}}>{x.score}%</span></span>}/>
        <Sec title="🗑 Eliminar (no están en el Excel)" color="var(--accent-rose)" list={plan.remove} lk="remove" render={x=><span>{x.name}{x.uses>0&&<span style={{fontSize:9,color:"var(--accent-amber)",marginLeft:4}} title="Asignaciones de casting que se quitarán">{x.uses} asig.</span>}</span>}/>
      </React.Fragment>}
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:12,paddingTop:12,borderTop:"1px solid var(--border-subtle)"}}>
        <button className="dc-btn" onClick={onClose} style={btnG()}>Cancelar</button>
        {plan&&<button className="dc-btn" disabled={busy} onClick={apply} style={btnP({padding:"10px 22px",fontSize:13})}>✓ Aplicar sincronización</button>}
      </div>
    </ModalShell>
  );
}

/* ── VINCULAR PROGRAMAS: religa a los talentos actuales las asignaciones de casting que quedaron ligadas
   a talentos anteriores (eliminados/reemplazados en una sincronización) usando la papelera y el nombre. ── */
function computeRelink(data){
  const talents=data.talents||[];const byNorm=new Map();talents.forEach(t=>byNorm.set(normN(t.name),t));
  const findNew=name=>{const ex=byNorm.get(normN(name));if(ex)return ex;let best=null,bs=0;talents.forEach(t=>{const sc=simN(name,t.name);if(sc>bs){bs=sc;best=t;}});return bs>=90?best:null;};
  const tIds=new Set(talents.map(t=>t.id));
  const epIds=new Set((data.episodes||[]).map(e=>e.id)),chIds=new Set((data.characters||[]).map(c=>c.id));
  const existing=new Set((data.castings||[]).map(c=>c.episode_id+":"+c.character_id));
  const oldNames=new Map();(data.trash||[]).forEach(snap=>{const d=snap&&snap.data;((d&&d.talents)||[]).forEach(t=>{if(t&&t.id!=null)oldNames.set(t.id,t.name);});});
  const groups=new Map();const add=(nt,oldName,item)=>{const g=groups.get(nt.id)||(groups.set(nt.id,{talent:nt,oldNames:new Set(),restore:[],remap:[]}),groups.get(nt.id));g.oldNames.add(oldName);g[item.kind].push(item.c);};
  // a) asignaciones huérfanas (el talento ya no existe) → actualizar talent_id
  (data.castings||[]).forEach(c=>{if(!c.talent_id||tIds.has(c.talent_id))return;const nm=oldNames.get(c.talent_id);if(!nm)return;const nt=findNew(nm);if(!nt)return;add(nt,nm,{kind:"remap",c:{...c,talent_id:nt.id}});});
  // b) asignaciones guardadas en la papelera junto al talento eliminado → recrear con el talento nuevo
  const seen=new Set();
  (data.trash||[]).forEach(snap=>{const d=snap&&snap.data;if(!d||!Array.isArray(d.talents)||!Array.isArray(d.castings))return;
    d.talents.forEach(old=>{if(!old)return;const nt=findNew(old.name);if(!nt||nt.id===old.id)return;
      d.castings.forEach(c=>{if(c.talent_id!==old.id)return;const k=c.episode_id+":"+c.character_id;if(existing.has(k)||seen.has(k)||!epIds.has(c.episode_id)||!chIds.has(c.character_id))return;seen.add(k);add(nt,old.name,{kind:"restore",c:{...c,id:uid(),talent_id:nt.id}});});
    });
  });
  return[...groups.values()].map(g=>({...g,oldNames:[...g.oldNames],total:g.restore.length+g.remap.length})).sort((a,b)=>b.total-a.total);
}
function RelinkModal({onClose,auto}){
  const s=useApp();const{epMap,seriesMap}=s.derived;
  const plan=useMemo(()=>computeRelink(s.data),[s.data]);
  const[off,setOff]=useState(()=>new Set());
  const progsOf=g=>{const st=new Set();[...g.restore,...g.remap].forEach(c=>{const ep=epMap[c.episode_id];const sr=ep&&seriesMap[ep.series_id];if(sr)st.add(sr.name);});return[...st];};
  const active=plan.filter(g=>!off.has(g.talent.id));
  const totals={talents:active.length,restore:active.reduce((a,g)=>a+g.restore.length,0),remap:active.reduce((a,g)=>a+g.remap.length,0)};
  const apply=()=>{
    if(!active.length)return;
    const remapMap=new Map();active.forEach(g=>g.remap.forEach(c=>remapMap.set(c.id,c)));
    const restored=active.flatMap(g=>g.restore);
    const next=[...s.data.castings.map(c=>remapMap.get(c.id)||c),...restored];
    s.dispatch({type:"CASTINGS/SET",payload:next});
    s.showToast("🔗 "+(totals.restore+totals.remap)+" asignación(es) vinculadas a "+totals.talents+" talento(s)");
    onClose();
  };
  return(
    <ModalShell title="🔗 Vincular programas con los talentos actuales" onClose={onClose} width="min(820px,100%)">
      <div style={{fontSize:12,color:"var(--text-secondary)",marginBottom:12,lineHeight:1.5}}>{auto?"La sincronización reemplazó talentos por registros nuevos. ":""}Estas asignaciones de casting de programas anteriores estaban ligadas a talentos eliminados (en la papelera) y se pueden religar por nombre al talento actual. No se toca ninguna asignación que ya tenga talento.</div>
      {!plan.length&&<div style={{...CARD_S,padding:22,textAlign:"center",color:"var(--text-muted)",fontSize:12}}>No hay asignaciones pendientes de vincular. Todos los programas ya apuntan a talentos existentes.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:"52vh",overflowY:"auto"}}>
        {plan.map(g=>{const on=!off.has(g.talent.id);const progs=progsOf(g);return(
          <label key={g.talent.id} style={{...CARD_S,padding:"10px 12px",display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",opacity:on?1:0.5}}>
            <input type="checkbox" checked={on} onChange={()=>setOff(p=>{const q=new Set(p);q.has(g.talent.id)?q.delete(g.talent.id):q.add(g.talent.id);return q;})} style={{marginTop:3}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:12,color:"var(--text-primary)"}}>{g.talent.name}{g.oldNames.some(o=>normN(o)!==normN(g.talent.name))&&<span style={{fontSize:10,color:"var(--text-muted)",marginLeft:6}}>(antes: {g.oldNames.join(", ")})</span>}</div>
              <div style={{fontSize:11,color:"var(--text-muted)",marginTop:2}}><b style={{color:"var(--accent-emerald)"}}>{g.total}</b> asignación(es) · {progs.length} programa(s): {progs.slice(0,6).join(" · ")}{progs.length>6?" · …":""}</div>
            </div>
          </label>);})}
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:8,marginTop:14,paddingTop:12,borderTop:"1px solid var(--border-subtle)"}}>
        {plan.length>0&&<span style={{fontSize:11,color:"var(--text-muted)",marginRight:"auto"}}>{totals.restore+totals.remap} asignación(es) · {totals.talents} talento(s)</span>}
        <button className="dc-btn" onClick={onClose} style={btnG()}>{plan.length?"Ahora no":"Cerrar"}</button>
        {plan.length>0&&<button className="dc-btn" disabled={!active.length} onClick={apply} style={btnP({padding:"10px 22px",fontSize:13})}>🔗 Vincular {totals.restore+totals.remap}</button>}
      </div>
    </ModalShell>
  );
}

function TalentsView(){
  const s=useApp();const{epMap,seriesMap}=s.derived;const importRef=useRef(null);const[localTalentModal,setLocalTalentModal]=useState(null);const[dupSuggest,setDupSuggest]=useState(null);const[syncOpen,setSyncOpen]=useState(false);const[relinkOpen,setRelinkOpen]=useState(false);const[relinkAuto,setRelinkAuto]=useState(false);
  const relinkCount=useMemo(()=>computeRelink(s.data).reduce((a,g)=>a+g.total,0),[s.data]);
  // Tras una sincronización, si quedaron asignaciones ligadas a talentos reemplazados, ofrecer vincularlas
  useEffect(()=>{if(relinkAuto&&!syncOpen){setRelinkAuto(false);if(relinkCount>0)setRelinkOpen(true);}},[relinkAuto,syncOpen,relinkCount]);
  const[search,setSearch]=useState("");const debouncedSearch=useDebounce(search,300);
  const[filterGenero,setFilterGenero]=useState("");const[filterEdad,setFilterEdad]=useState("");const[filterTono,setFilterTono]=useState("");
  const[filterSinCat,setFilterSinCat]=useState(false);
  const[sortTalents,setSortTalents]=useState("alpha-asc");
  const[dupThr,setLocalDupThr]=useState(DUP_THR); // umbral de fusión (configurable)

  const handleImport=useCallback(async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const names=await parseTalentsXLSX(file);const nt=[];let added=0;names.forEach(name=>{if(!s.data.talents.find(t=>normN(t.name)===normN(name))){nt.push({id:uid(),name,genero:"",edad_aparente:"",tono_de_voz:""});added++;}});if(nt.length)s.dispatch({type:"TALENTS/ADD_MANY",payload:nt});s.showToast(added?"✓ "+added+" talentos importados":"Sin nuevos");}catch(err){s.showToast("✗ Error: "+safe(err.message));}e.target.value="";},[s]);

  const saveTalent=useCallback(talentData=>{
    if(!localTalentModal)return;
    if(localTalentModal==="add"){
      if(s.data.talents.find(t=>normN(t.name)===normN(talentData.name))){s.showToast("⚠ Ya existe un talento con ese nombre exacto");return;}
      // Validación en segundo plano: detección de duplicados aproximados (≥85%)
      const cand=bestTalentMatch(talentData.name,s.data.talents);
      if(cand){setDupSuggest({rawName:talentData.name,cand:cand.talent,score:cand.score,data:talentData});return;}
      s.dispatch({type:"TALENTS/ADD",payload:{id:uid(),...talentData}});s.showToast("✓ Agregado");
    }else{
      const ex=s.data.talents.find(t=>t.id===localTalentModal.id);
      if(ex){
        const cand=normN(ex.name)!==normN(talentData.name)?bestTalentMatch(talentData.name,s.data.talents,ex.id):null;
        if(cand){setDupSuggest({rawName:talentData.name,cand:cand.talent,score:cand.score,data:talentData,editId:ex.id});return;}
        s.dispatch({type:"TALENTS/UPDATE",payload:{...ex,...talentData}});
      }
      s.showToast("✓ Actualizado");
    }
    setLocalTalentModal(null);
  },[localTalentModal,s]);

  const mergeDup=useCallback(()=>{
    if(!dupSuggest)return;
    const{cand,data,editId}=dupSuggest;
    // Unificación: el registro existente conserva su nombre y absorbe atributos faltantes
    const merged={...cand,genero:cand.genero||data.genero,edad_aparente:cand.edad_aparente||data.edad_aparente,tono_de_voz:cand.tono_de_voz||data.tono_de_voz};
    s.dispatch({type:"TALENTS/UPDATE",payload:merged});
    if(editId){
      // Reasignar castings del registro editado al unificado y eliminar el duplicado
      s.dispatch({type:"CASTINGS/SET",payload:s.data.castings.map(c=>c.talent_id===editId?{...c,talent_id:cand.id}:c)});
      s.dispatch({type:"TALENTS/DELETE",payload:editId});
    }
    s.showToast("✓ Unificado con \""+cand.name+"\"");
    setDupSuggest(null);setLocalTalentModal(null);
  },[dupSuggest,s]);

  const createAnyway=useCallback(()=>{
    if(!dupSuggest)return;
    const{data,editId}=dupSuggest;
    if(editId){const ex=s.data.talents.find(t=>t.id===editId);if(ex)s.dispatch({type:"TALENTS/UPDATE",payload:{...ex,...data}});s.showToast("✓ Actualizado");}
    else{s.dispatch({type:"TALENTS/ADD",payload:{id:uid(),...data}});s.showToast("✓ Agregado");}
    setDupSuggest(null);setLocalTalentModal(null);
  },[dupSuggest,s]);

  const filteredTalents=useMemo(()=>{
    let list=[...s.data.talents];
    if(debouncedSearch.trim()){const q=debouncedSearch.trim();list=list.map(t=>({t,_sc:fuzzyScore(q,t.name)})).filter(x=>x._sc>=FUZZY_THR).sort((a,b)=>b._sc-a._sc).map(x=>x.t);}
    if(filterGenero)list=list.filter(t=>t.genero===filterGenero);
    if(filterEdad)list=list.filter(t=>t.edad_aparente===filterEdad);
    if(filterTono)list=list.filter(t=>t.tono_de_voz===filterTono);
    if(filterSinCat)list=list.filter(t=>!t.genero&&!t.edad_aparente&&!t.tono_de_voz);
    const cc=id=>s.data.castings.filter(c=>c.talent_id===id).length;
    if(sortTalents==="alpha-asc")list.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortTalents==="alpha-desc")list.sort((a,b)=>b.name.localeCompare(a.name));
    else if(sortTalents==="freq-desc")list.sort((a,b)=>cc(b.id)-cc(a.id));
    else if(sortTalents==="freq-asc")list.sort((a,b)=>cc(a.id)-cc(b.id));
    return list;
  },[s.data.talents,s.data.castings,debouncedSearch,filterGenero,filterEdad,filterTono,filterSinCat,sortTalents]);

  const generoIcon=g=>g==="masculino"?"♂":g==="femenino"?"♀":g==="no_binario"?"⚧":"";
  const generoColor=g=>g==="masculino"?"var(--accent-sky)":g==="femenino"?"var(--accent-rose)":g==="no_binario"?"var(--accent-violet)":"var(--text-muted)";

  return(
    <div className="dc-view">

      {dupSuggest&&<DupTalentModal rawName={dupSuggest.rawName} cand={dupSuggest.cand} score={dupSuggest.score} onMerge={mergeDup} onCreate={createAnyway} onClose={()=>setDupSuggest(null)}/>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:8}}>

        <div style={{display:"flex",gap:8}}><button onClick={()=>setLocalTalentModal("add")} className="dc-btn" style={btnP({background:"linear-gradient(135deg,#059669,#34d399)"})}>+ Agregar</button><button onClick={()=>importRef.current&&importRef.current.click()} className="dc-btn" style={btnG()}>📥 Importar Excel</button><button onClick={()=>setSyncOpen(true)} className="dc-btn" title="Dejar la base igual a una lista maestra: añade, renombra y elimina" style={btnG()}>🔄 Sincronizar con Excel</button><button onClick={()=>{setRelinkOpen(true);}} className="dc-btn" title="Religar a los talentos actuales las asignaciones de programas anteriores" style={btnG(relinkCount>0?{borderColor:"rgba(52,211,153,0.5)",color:"var(--accent-emerald)"}:{})}>🔗 Vincular programas{relinkCount>0?" ("+relinkCount+")":""}</button><input ref={importRef} type="file" accept=".xlsx,.xls,.xlsm" style={{display:"none"}} onChange={handleImport}/></div>
        {syncOpen&&ReactDOM.createPortal(<SyncTalentsModal onClose={applied=>{setSyncOpen(false);if(applied)setRelinkAuto(true);}}/>,document.body)}
        {relinkOpen&&ReactDOM.createPortal(<RelinkModal auto={relinkAuto} onClose={()=>setRelinkOpen(false)}/>,document.body)}
      </div>
      
      {/* Filters */}
      <div style={{...CARD_S,padding:"14px 18px",marginBottom:18,display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap"}}>
        <div style={{flex:"1 1 180px",minWidth:140}}><label style={SLBL}>Buscar</label><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Nombre del talento..." style={{...SIPT,fontSize:12}}/></div>
        <div style={{flex:"0 1 140px"}}><label style={SLBL}>Género</label><select value={filterGenero} onChange={e=>setFilterGenero(e.target.value)} style={SIPT}>{GENERO_OPTS.map(o=><option key={o.k} value={o.k}>{o.l}</option>)}</select></div>
        <div style={{flex:"0 1 140px"}}><label style={SLBL}>Edad</label><select value={filterEdad} onChange={e=>setFilterEdad(e.target.value)} style={SIPT}>{EDAD_OPTS.map(o=><option key={o.k} value={o.k}>{o.l}</option>)}</select></div>
        <div style={{flex:"0 1 140px"}}><label style={SLBL}>Tono de voz</label><select value={filterTono} onChange={e=>setFilterTono(e.target.value)} style={SIPT}>{TONO_OPTS.map(o=><option key={o.k} value={o.k}>{o.l}</option>)}</select></div>
        <div style={{flex:"0 0 auto"}}>
          <label style={SLBL}>Ordenar</label>
          <div style={{display:"inline-flex",background:"var(--bg-secondary)",borderRadius:"var(--radius-md)",padding:3,gap:2,border:"1px solid var(--border-subtle)"}}>
            {[{k:"alpha-asc",l:"A→Z"},{k:"alpha-desc",l:"Z→A"},{k:"freq-desc",l:"Más activos"},{k:"freq-asc",l:"Menos activos"}].map(o=>{const active=sortTalents===o.k;return(<button key={o.k} onClick={()=>setSortTalents(o.k)} className="dc-btn" style={{padding:"4px 10px",borderRadius:6,border:"none",fontSize:10,fontWeight:active?700:500,background:active?"var(--bg-card)":"transparent",color:active?"var(--text-primary)":"var(--text-muted)",boxShadow:active?"var(--shadow-sm)":"none"}}>{o.l}</button>);})}
          </div>
        </div>
        <div style={{flex:"0 0 auto",display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
          <button onClick={()=>setFilterSinCat(v=>!v)} className="dc-btn" style={{padding:"7px 12px",borderRadius:"var(--radius-md)",border:"1px solid "+(filterSinCat?"rgba(251,146,60,0.5)":"var(--border-default)"),fontSize:11,fontWeight:filterSinCat?700:500,background:filterSinCat?"rgba(251,146,60,0.1)":"var(--bg-input)",color:filterSinCat?"var(--accent-orange)":"var(--text-muted)",cursor:"pointer",whiteSpace:"nowrap"}}>⚠ Sin categorizar{filterSinCat?" ✓":""}</button>
        </div>
        <div style={{flex:"0 0 auto"}}><label style={SLBL} title="Índice mínimo de similitud (Levenshtein) para sugerir fusión de talentos">Umbral fusión %</label><input type="number" min={50} max={99} value={dupThr} onChange={e=>{const n=setDupThr(e.target.value);setLocalDupThr(n);}} style={{...SIPT,width:74,fontSize:12,textAlign:"center"}}/></div>
        {(filterGenero||filterEdad||filterTono||search||filterSinCat)&&<button onClick={()=>{setFilterGenero("");setFilterEdad("");setFilterTono("");setSearch("");setFilterSinCat(false);}} style={{...btnS(),whiteSpace:"nowrap",marginBottom:1}}>✕ Limpiar filtros</button>}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:10}}>
        {filteredTalents.map(t=>{

          const serSeen={};s.data.castings.filter(c=>c.talent_id===t.id).forEach(c=>{const ep=epMap[c.episode_id];if(ep)serSeen[ep.series_id]=true;});const serIds=Object.keys(serSeen).map(Number);const isSelected=s.selTalentId===t.id;
          const gc=generoColor(t.genero);
          return(
            <div key={t.id} className="dc-card" onClick={()=>{s.setSelTalentId(t.id);s.navTo("talent");}} title="Abrir ficha del talento" style={{...CARD_S,padding:16,cursor:"pointer",position:"relative",border:isSelected?"1.5px solid rgba(167,139,250,0.4)":"1px solid var(--border-subtle)",boxShadow:isSelected?"0 0 16px rgba(167,139,250,0.12)":"none"}}>
              <div style={{position:"absolute",top:12,right:12,display:"flex",gap:3}}>
                <button onClick={e=>{e.stopPropagation();e.preventDefault();setLocalTalentModal({id:t.id,name:t.name,genero:t.genero||"",edad_aparente:t.edad_aparente||"",tono_de_voz:t.tono_de_voz||""});}} onPointerDown={e=>e.stopPropagation()} title="Editar talento" className="dc-btn" style={btnS({padding:"5px 10px",fontSize:11,borderRadius:6,lineHeight:1})}>✏</button>
                <button onClick={async e=>{e.stopPropagation();e.preventDefault();const ok=await dcConfirm("¿Eliminar a "+t.name+(tc?" y sus "+tc+" asignación(es) de casting":"")+"?\n\nQuedará en la papelera (🗂️ Datos) y podrás restaurarlo.",{title:"Eliminar talento",ok:"Sí, eliminar",danger:true});if(!ok){s.showToast("Eliminación cancelada");return;}s.dispatch({type:"TALENTS/DELETE",payload:t.id});s.showToast("✓ Eliminado: "+t.name);}} onPointerDown={e=>e.stopPropagation()} title="Eliminar talento" className="dc-btn" style={btnD({padding:"5px 11px",fontSize:13,borderRadius:6,lineHeight:1})}>×</button>
              </div>
              <div style={{paddingRight:60}}>
                <div style={{fontWeight:700,fontSize:14,marginBottom:2,color:"var(--text-primary)"}}>{t.name}</div>
                <div style={{fontSize:10,color:"var(--text-muted)",marginBottom:8}}>{tc} asignaciones</div>

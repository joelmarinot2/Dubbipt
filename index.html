<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150F30; --panel:#1E1740; --panel-2:#241C4E; --inset:#191238;
  --line:#3a2f6b; --line-soft:#2c2358;
  --ink:#EFECFB; --ink-dim:#B4ADD9; --ink-faint:#7d76a8;
  --violet:#A78BFA; --violet-2:#C4B5FD; --glow:rgba(167,139,250,.30);
  --ok:#4ADE80; --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);min-height:100dvh;
  background:radial-gradient(1100px 560px at 80% -10%,rgba(167,139,250,.13),transparent 60%),
             radial-gradient(900px 520px at -5% 105%,rgba(63,208,238,.08),transparent 55%),var(--bg);}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 70px}
header{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.mk{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--violet),#7C5CE0);color:#160f33;
  font-family:var(--disp);font-weight:700;font-size:15px;box-shadow:0 4px 18px var(--glow)}
header h1{font-family:var(--disp);font-weight:700;font-size:20px}
header p{font-size:12.5px;color:var(--ink-dim);margin-top:1px}
.who{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-faint)}
.who b{color:var(--ink-dim);display:block;font-size:12.5px}

.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.crumb a{color:var(--violet-2);cursor:pointer;font-family:var(--disp);font-weight:600}
.crumb a:hover{text-decoration:underline}
.crumb span.sep{color:var(--ink-faint)}
.crumb .now{font-family:var(--disp);font-weight:700}

.btnv{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;
  padding:9px 14px;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:13px}
.btnv:hover{border-color:var(--violet)}
.btnv.pri{background:linear-gradient(135deg,var(--violet),#7C5CE0);color:#160f33;border:0}
.bar-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.bar-actions input.search{flex:1;min-width:200px;background:var(--inset);border:1px solid var(--line-soft);
  border-radius:10px;padding:10px 14px;color:var(--ink);font-size:14px;outline:none}
.bar-actions input.search:focus{border-color:var(--violet)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:16px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-2px);border-color:var(--violet)}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc,#A78BFA)}
.tile h3{font-family:var(--disp);font-size:15.5px;color:var(--cc,#A78BFA);margin-bottom:4px}
.tile small{color:var(--ink-dim);font-size:12.5px}
.tile.add{display:grid;place-items:center;border-style:dashed;color:var(--ink-dim);min-height:92px;cursor:pointer}
.tile.add:hover{color:var(--violet-2)}
.tile .del{position:absolute;top:8px;right:10px;color:var(--ink-faint);font-size:14px;opacity:0;transition:.15s}
.tile:hover .del{opacity:1}
.tile .del:hover{color:#F472B6}

.drop{border:1.6px dashed var(--line);border-radius:var(--r);background:var(--panel);
  padding:26px 18px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s;margin:6px 0 16px}
.drop:hover,.drop.over{border-color:var(--violet);background:var(--panel-2)}
.drop .ic{font-size:28px;margin-bottom:8px}
.drop b{font-family:var(--disp);font-size:16px;display:block}
.drop small{color:var(--ink-dim);font-size:12.5px;display:block;margin-top:4px}
.drop input{display:none}

.loading{display:none;align-items:center;gap:12px;color:var(--ink-dim);font-size:14px;margin:10px 0}
.loading.show{display:flex}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--violet);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--inset);border:1px solid var(--line-soft);border-radius:10px;padding:8px 14px;font-size:12.5px;color:var(--ink-dim)}
.stat b{color:var(--ink);font-family:var(--disp);font-size:15px;margin-right:5px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px 15px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s,border-color .12s}
.ccard:hover{transform:translateY(-2px);border-color:var(--violet)}
.ccard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc,#A78BFA)}
.ccard.done{opacity:.72}
.ccard .top{display:flex;align-items:baseline;gap:8px}
.ccard h3{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--cc,#A78BFA)}
.ccard .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.ccard .tal{font-size:12.5px;color:var(--ink-dim);margin:4px 0 8px}
.ccard .tal.ng{color:var(--ink-faint);font-style:italic}
.bar{height:5px;border-radius:3px;background:var(--inset);margin-bottom:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cc,#A78BFA);border-radius:3px;transition:width .25s}
.ccard.done .bar i{background:var(--ok)}
.pgs{display:flex;flex-wrap:wrap;gap:5px}
.pg{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:7px;cursor:pointer;
  background:var(--inset);border:1px solid var(--line-soft);color:var(--ink-dim)}
.pg.rec{color:var(--ok);border-color:rgba(74,222,128,.4);text-decoration:line-through}

.empty{text-align:center;padding:50px 20px;color:var(--ink-faint)}
.empty .ic{font-size:40px;margin-bottom:10px}

.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;margin-top:16px}
.panel h2{font-family:var(--disp);font-size:16px;margin-bottom:10px}
.blk{border-bottom:1px solid var(--line-soft);padding:10px 0;display:flex;gap:12px}
.blk .meta{flex:none;width:74px;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.blk .tx{flex:1;font-size:14px;line-height:1.5}
.blk .nm{font-family:var(--disp);font-weight:600;color:var(--cc,#A78BFA);margin-right:6px}
.msg{font-size:12.5px;color:var(--ink-dim)}
.err{color:#F472B6}
</style>

<script>
/* ===== auth.js (en línea) ===== */
/* ============================================================
 *  auth.js · Módulo de Autenticación (Login + Registro + guarda de ruta)
 *  Reemplaza el ingreso por estudio/anónimo por cuentas reales.
 *
 *  Requiere:  window.SUPA (de config.js) y el SDK de Supabase ya cargado
 *             (<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>)
 *
 *  Uso en index.html (ver README):
 *      <script src="./config.js"><\/script>
 *      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
 *      <script src="./auth.js"><\/script>
 *      ...
 *      DDLAuth.onReady((user) => bootApp(user));   // arranca la app YA autenticado
 * ============================================================ */
(function () {
  'use strict';

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const MIN_PASS = 8;

  // Si el SDK de Supabase o la config no cargaron, no revientes en silencio:
  // define un DDLAuth inerte para que index.html muestre el motivo en pantalla.
  if (!window.supabase || !window.SUPA) {
    window.DDLAuth = { onReady() {}, _error: 'Falta window.supabase o window.SUPA' };
    console.error('[auth] No se puede iniciar:', window.DDLAuth._error);
    return;
  }

  // Cliente propio para el login (se expone como window.sb para el resto de la app).
  const sb = window.supabase.createClient(window.SUPA.url, window.SUPA.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  window.sb = sb;

  let readyCb = null;
  let booted = false;

  const DDLAuth = {
    client: sb,
    user: null,
    profile: null,
    onReady(cb) { readyCb = cb; return DDLAuth; },
    async signOut() {
      await sb.auth.signOut();
      location.reload();
    }
  };
  window.DDLAuth = DDLAuth;

  /* ---------- estilos mínimos (reutiliza tu paleta) ---------- */
  const css = `
  #authGate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;
    background:radial-gradient(1100px 560px at 80% -10%,rgba(167,139,250,.14),transparent 60%),#150F30}
  #authGate .card{width:100%;max-width:390px;background:#1E1740;border:1px solid #3a2f6b;
    border-radius:16px;padding:26px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  #authGate .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  #authGate .mk{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,#A78BFA,#7C5CE0);color:#160f33;font-weight:700;
    font-family:'Space Grotesk',sans-serif}
  #authGate h2{font-family:'Space Grotesk',sans-serif;font-size:18px;color:#EFECFB}
  #authGate .tabs{display:flex;gap:6px;background:#191238;border:1px solid #2c2358;border-radius:11px;
    padding:4px;margin-bottom:16px}
  #authGate .tabs button{flex:1;border:0;background:transparent;color:#B4ADD9;padding:9px;border-radius:8px;
    font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;font-size:13.5px}
  #authGate .tabs button.on{background:#2E2560;color:#EFECFB}
  #authGate label{display:block;font-size:12px;color:#B4ADD9;margin:12px 0 5px}
  #authGate input{width:100%;background:#191238;border:1px solid #2c2358;border-radius:10px;
    padding:11px 13px;color:#EFECFB;font-family:'Inter',sans-serif;font-size:14px;outline:none}
  #authGate input:focus{border-color:#A78BFA}
  #authGate .go{width:100%;margin-top:18px;border:0;border-radius:11px;padding:12px;cursor:pointer;
    background:linear-gradient(135deg,#A78BFA,#7C5CE0);color:#160f33;font-weight:700;
    font-family:'Space Grotesk',sans-serif;font-size:14px}
  #authGate .go:disabled{opacity:.6;cursor:default}
  #authGate .msg{margin-top:12px;font-size:12.5px;min-height:16px}
  #authGate .msg.err{color:#F472B6}
  #authGate .msg.ok{color:#4ADE80}
  #authGate .hint{color:#7d76a8;font-size:11.5px;margin-top:8px;line-height:1.5}
  .authOut{position:fixed;top:12px;right:12px;z-index:50;background:#1E1740;border:1px solid #3a2f6b;
    color:#B4ADD9;border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:'Space Grotesk',sans-serif}
  .authOut:hover{color:#EFECFB;border-color:#A78BFA}`;
  const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);

  /* ---------- UI del gate ---------- */
  function renderGate() {
    let g = document.getElementById('authGate');
    if (g) return g;
    g = document.createElement('div');
    g.id = 'authGate';
    g.innerHTML = `
      <div class="card">
        <div class="brand"><div class="mk">DD</div><h2>Desglose Digital</h2></div>
        <div class="tabs">
          <button id="tabLogin" class="on">Entrar</button>
          <button id="tabReg">Crear cuenta</button>
        </div>

        <div id="paneLogin">
          <label>Correo</label>
          <input id="aEmail" type="email" autocomplete="username" placeholder="tu@estudio.com">
          <label>Contraseña</label>
          <input id="aPass" type="password" autocomplete="current-password" placeholder="········">
          <button id="btnLogin" class="go">Entrar</button>
        </div>

        <div id="paneReg" style="display:none">
          <label>Nombre</label>
          <input id="rName" type="text" placeholder="Tu nombre">
          <label>Correo</label>
          <input id="rEmail" type="email" autocomplete="username" placeholder="tu@estudio.com">
          <label>Contraseña <span style="opacity:.6">(mín. ${MIN_PASS})</span></label>
          <input id="rPass" type="password" autocomplete="new-password" placeholder="········">
          <button id="btnReg" class="go">Crear cuenta</button>
          <p class="hint">Al registrarte entras como <b>miembro</b>. Un administrador puede
             elevarte a <i>casting</i> o <i>admin</i> desde Supabase.</p>
        </div>

        <div class="msg" id="aMsg"></div>
      </div>`;
    document.body.appendChild(g);

    const $ = (id) => g.querySelector('#' + id);
    const msg = (t, cls) => { const m = $('aMsg'); m.textContent = t || ''; m.className = 'msg ' + (cls || ''); };
    const show = (login) => {
      $('paneLogin').style.display = login ? '' : 'none';
      $('paneReg').style.display = login ? 'none' : '';
      $('tabLogin').classList.toggle('on', login);
      $('tabReg').classList.toggle('on', !login);
      msg('');
    };
    $('tabLogin').onclick = () => show(true);
    $('tabReg').onclick = () => show(false);

    // ---- validación de cliente ----
    function validate(email, pass, name) {
      if (name !== undefined && !name.trim()) return 'Escribe tu nombre.';
      if (!EMAIL_RE.test(email)) return 'Correo no válido.';
      if ((pass || '').length < MIN_PASS) return `La contraseña debe tener al menos ${MIN_PASS} caracteres.`;
      return null;
    }

    // ---- Login ----
    $('btnLogin').onclick = async () => {
      const email = $('aEmail').value.trim(), pass = $('aPass').value;
      const bad = validate(email, pass);
      if (bad) return msg(bad, 'err');
      const btn = $('btnLogin'); btn.disabled = true; btn.textContent = 'Entrando…';
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      btn.disabled = false; btn.textContent = 'Entrar';
      if (error) return msg(traducir(error.message), 'err');
      // el listener onAuthStateChange se encarga de arrancar la app
    };
    $('aPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnLogin').click(); });

    // ---- Registro ----
    $('btnReg').onclick = async () => {
      const name = $('rName').value, email = $('rEmail').value.trim(), pass = $('rPass').value;
      const bad = validate(email, pass, name);
      if (bad) return msg(bad, 'err');
      const btn = $('btnReg'); btn.disabled = true; btn.textContent = 'Creando…';
      const { data, error } = await sb.auth.signUp({
        email, password: pass,
        options: { data: { full_name: name.trim(), role: 'member' } }
      });
      btn.disabled = false; btn.textContent = 'Crear cuenta';
      if (error) return msg(traducir(error.message), 'err');
      if (data.session) { msg('Cuenta creada ✓', 'ok'); }      // auto-confirm activo → entra solo
      else { msg('Revisa tu correo para confirmar la cuenta.', 'ok'); } // si pides confirmación por email
    };
    return g;
  }

  function traducir(m) {
    m = (m || '').toLowerCase();
    if (m.includes('invalid login')) return 'Correo o contraseña incorrectos.';
    if (m.includes('already registered')) return 'Ese correo ya tiene cuenta. Inicia sesión.';
    if (m.includes('password should be')) return `La contraseña debe tener al menos ${MIN_PASS} caracteres.`;
    if (m.includes('email not confirmed')) return 'Confirma tu correo antes de entrar.';
    if (m.includes('rate limit')) return 'Demasiados intentos. Espera un momento.';
    return 'No se pudo completar. ' + (m || '');
  }

  function removeGate() { const g = document.getElementById('authGate'); if (g) g.remove(); }

  function addSignOut() {
    if (document.querySelector('.authOut')) return;
    const b = document.createElement('button');
    b.className = 'authOut'; b.textContent = '⏻ Salir';
    b.onclick = () => DDLAuth.signOut();
    document.body.appendChild(b);
  }

  async function loadProfile(user) {
    try {
      const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
      return data || null;
    } catch (e) { return null; }
  }

  /* ---------- guarda de ruta: nada arranca sin sesión ---------- */
  async function gate(session) {
    if (!session || !session.user) {
      booted = false;
      DDLAuth.user = null; DDLAuth.profile = null;
      const g = document.querySelector('.authOut'); if (g) g.remove();
      renderGate();
      return;
    }
    // hay sesión válida
    DDLAuth.user = session.user;
    DDLAuth.profile = await loadProfile(session.user);
    removeGate();
    addSignOut();
    if (!booted) {
      booted = true;
      if (typeof readyCb === 'function') readyCb(session.user, DDLAuth.profile);
    }
  }

  // Reacciona a login/logout/refresh de token.
  sb.auth.onAuthStateChange((_evt, session) => gate(session));

  // Estado inicial al cargar la página.
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    gate(session);
  })();
})();

</script>
<script>
/* ===== desglose-auto.js (en línea) ===== */
/* ============================================================
 *  desglose-auto.js · Motor de DESGLOSE AUTOMÁTICO de personajes
 *  Entrada:  un guion .pdf (pdf.js) o .docx (mammoth.js)
 *  Salida:   personajes + intervenciones + páginas + escenas,
 *            en una vista editable, lista para guardar en Supabase.
 *
 *  Reemplaza el flujo manual «Subir desglose (.xlsm)».
 *
 *  Requiere en index.html:
 *    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
 *    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"><\/script>
 *    <script src="./desglose-auto.js"><\/script>
 *
 *  API:
 *    const r = await DDLDesglose.fromFile(file);      // {chars, script, scenes, numPages, fullText, sourceType}
 *    DDLDesglose.renderReview(r, { mount, onSave });  // pinta la vista editable
 *    await DDLDesglose.save(episodeId, r, { scriptId });
 *
 *  Opcional (refinado con LLM): DDLDesglose.config.llmEndpoint = '/api/refinar';
 *    Si lo defines, se hace POST {full_text} y se espera JSON
 *    { characters:[{name, talent}] } para fusionar/normalizar nombres.
 *    Sin endpoint, el motor funciona 100% con reglas (sin claves ni costo).
 * ============================================================ */
(function () {
  'use strict';

  const cfg = { llmEndpoint: null };

  // ---------- utilidades ----------
  const TC_RE   = /^\s*\d{1,2}\s*[:;.]\s*\d{2}([:;.]\d{1,2}){0,2}/;      // 01:07, 01:07:15:03
  const SCENE_RE = /^\s*(?:\d+[\s.\-]*)?(INT\.?\/EXT\.?|INT\.?|EXT\.?|EST\.?|ESCENA|SCENE|SEQ(?:UENCE|UENCIA)?)\b[\s.:\-]/i;
  const PARENS  = /\s*[\(\[][^)\]]*[\)\]]\s*$/;   // "(V.O.)" "(OFF)" "[CONT'D]" al final
  const NO_REC  = new Set(['ORIGINAL', 'TODOS', 'X', 'N/A', 'NA', 'AMBIENTE', 'INSERTO']);
  const PALETTE = ['#A78BFA','#3FD0EE','#F0A35E','#F472B6','#4ADE80','#FACC15','#60A5FA','#FB7185'];

  function normChar(ch) { const d = ch.normalize('NFD'); return (d[0] || ch).toUpperCase(); }
  function norm(s) { let r = ''; for (const ch of String(s || '')) r += normChar(ch); return r.replace(/[^A-Z0-9 ]/g, '').replace(/\s+/g, ' ').trim(); }
  function charColor(name) { let h = 0; const s = String(name || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PALETTE[h % PALETTE.length]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

  // ---------- 1) EXTRACCIÓN DE TEXTO ----------
  // PDF → líneas con número de página (reagrupando fragmentos por baseline).
  async function extractPdf(buf) {
    const doc = await pdfjsLib.getDocument({
      data: buf,
      cMapUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true
    }).promise;
    const numPages = doc.numPages;
    const lines = [];      // {text, page}
    for (let p = 1; p <= numPages; p++) {
      const tc = await doc.getPage(p).then(pg => pg.getTextContent());
      const groups = new Map();
      tc.items.forEach(it => {
        const y = it.transform[5], k = Math.round(y / 3);
        let g = groups.get(k); if (!g) { g = { y, items: [] }; groups.set(k, g); }
        g.items.push(it);
      });
      [...groups.values()].sort((a, b) => b.y - a.y).forEach(g => {
        g.items.sort((a, b) => a.transform[4] - b.transform[4]);
        const text = g.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
        if (text) lines.push({ text, page: p });
      });
    }
    return { lines, numPages, fullText: lines.map(l => l.text).join('\n') };
  }

  // DOCX → párrafos. Word no tiene "páginas" reales: estimamos ~1800 chars/página.
  async function extractDocx(buf) {
    const { value: html } = await mammoth.convertToHtml({ arrayBuffer: buf });
    const div = document.createElement('div'); div.innerHTML = html;
    const lines = []; let chars = 0;
    div.querySelectorAll('p, h1, h2, h3, li').forEach(el => {
      const text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (!text) return;
      chars += text.length + 1;
      lines.push({ text, page: Math.max(1, Math.ceil(chars / 1800)) });
    });
    const numPages = lines.length ? lines[lines.length - 1].page : 1;
    return { lines, numPages, fullText: lines.map(l => l.text).join('\n') };
  }

  // ---------- 2) DETECCIÓN DE CABECERAS / ESCENAS ----------
  function boilerplate(lines) {
    // renglones cortos que se repiten en muchas páginas = encabezado/pie
    const freq = new Map(), pages = new Set();
    for (const l of lines) {
      pages.add(l.page);
      if (l.text.length > 60) continue;
      freq.set(l.text, (freq.get(l.text) || 0) + 1);
    }
    const min = Math.max(3, Math.ceil(pages.size * 0.6));
    const set = new Set();
    for (const [t, c] of freq) if (c >= min) set.add(t);
    return set;
  }

  // ¿esta línea abre el parlamento de un personaje?  → devuelve {name, dialogue} o null
  function cueOf(text) {
    if (TC_RE.test(text) || SCENE_RE.test(text)) return null;
    const colon = text.search(/[:：]/);
    let head = colon >= 0 ? text.slice(0, colon) : text;
    let dialogue = colon >= 0 ? text.slice(colon + 1).trim() : '';
    head = head.replace(PARENS, '').trim();               // quita "(V.O.)" final
    if (head.length < 2 || head.length > 48) return null;
    if (!/[A-ZÁÉÍÓÚÜÑ]/.test(head)) return null;
    // el nombre debe ir en MAYÚSCULAS (los diálogos normales, no)
    if (head !== head.toUpperCase()) return null;
    // sin dos puntos, exige que TODA la línea sea el nombre (pocas palabras),
    // así "HOLA, ¿CÓMO ESTÁS?" gritado en un diálogo no se confunde con cabecera
    if (colon < 0) {
      const words = head.split(/\s+/).filter(Boolean);
      if (words.length > 6) return null;
      if (/[.!?¡¿]/.test(head)) return null;
    }
    return { name: head.trim(), dialogue };
  }

  function sceneOf(text, counter) {
    if (!SCENE_RE.test(text)) return null;
    const label = text.replace(/\s+/g, ' ').trim().slice(0, 80);
    return { id: counter, label };
  }

  // ---------- 3) MOTOR: líneas → personajes + script ----------
  function analyze(lines, numPages) {
    const skip = boilerplate(lines);
    const scenes = [];
    let scnCounter = 0, curScene = null, cur = null;
    const script = [];                       // bloques de intervención
    const byKey = {};                        // key → personaje agregado

    for (const l of lines) {
      const t = l.text;
      if (!t || skip.has(t)) continue;

      const scn = sceneOf(t, scnCounter);
      if (scn) { scnCounter++; curScene = scn; scenes.push({ id: scn.id, label: scn.label, page: l.page }); continue; }

      const cue = cueOf(t);
      if (cue) {
        const key = norm(cue.name);
        if (!key) { if (cur) cur.lines.push(t); continue; }
        cur = { idx: script.length, key, display: cue.name.trim(), page: l.page, scene: curScene ? curScene.id : null, lines: [] };
        if (cue.dialogue) cur.lines.push(cue.dialogue);
        script.push(cur);

        const c = byKey[key] || (byKey[key] = {
          key, display: cur.display, talent: '', variants: new Set([cur.display]),
          pageMap: new Map(), scenes: new Set(), totalInts: 0
        });
        c.variants.add(cur.display);
        c.pageMap.set(l.page, (c.pageMap.get(l.page) || 0) + 1);
        if (curScene) c.scenes.add(curScene.id);
        c.totalInts++;
        continue;
      }
      if (cur) cur.lines.push(t);            // diálogo que continúa
    }

    // consolidar personajes a la forma que ya usa la app
    const chars = Object.values(byKey).map(c => {
      const pages = [...c.pageMap.entries()].sort((a, b) => a[0] - b[0]).map(([p, ints]) => ({ p, ints }));
      return {
        key: c.key,
        display: [...c.variants].sort((a, b) => a.length - b.length)[0], // variante más corta y limpia
        talent: '',
        pages,
        scenes: [...c.scenes].sort((a, b) => a - b),
        totalInts: c.totalInts,
        noRec: NO_REC.has(c.key),
        color: charColor(c.key)
      };
    }).sort((a, b) => b.totalInts - a.totalInts || a.display.localeCompare(b.display, 'es'));

    return { chars, script, scenes, numPages };
  }

  // ---------- 4) (opcional) refinado con LLM ----------
  async function refineWithLLM(result, fullText) {
    if (!cfg.llmEndpoint) return result;
    try {
      const res = await fetch(cfg.llmEndpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_text: fullText.slice(0, 60000) })
      });
      const j = await res.json();                 // { characters:[{name, talent}] }
      if (!j || !Array.isArray(j.characters)) return result;
      // el LLM solo normaliza nombres/talentos; los conteos/páginas siguen siendo del parser
      const byNorm = {}; result.chars.forEach(c => byNorm[c.key] = c);
      j.characters.forEach(ch => {
        const k = norm(ch.name); const c = byNorm[k];
        if (c) { if (ch.name) c.display = ch.name; if (ch.talent) c.talent = ch.talent; }
      });
    } catch (e) { console.warn('[desglose] LLM no disponible, se usa solo el parser:', e.message); }
    return result;
  }

  // ---------- 5) API pública ----------
  async function fromFile(file) {
    const buf = await file.arrayBuffer();
    const isDocx = /\.docx$/i.test(file.name) || file.type.includes('word');
    const src = isDocx ? await extractDocx(buf) : await extractPdf(buf.slice(0));
    let result = analyze(src.lines, src.numPages);
    result.fullText = src.fullText;
    result.sourceType = isDocx ? 'docx' : 'pdf';
    result.name = file.name;
    result = await refineWithLLM(result, src.fullText);
    return result;
  }

  // ---------- 6) VISTA EDITABLE ----------
  function renderReview(result, opts) {
    opts = opts || {};
    const mount = opts.mount || document.body;
    const rows = result.chars;

    const total = rows.reduce((s, c) => s + c.totalInts, 0);
    const wrap = document.createElement('div');
    wrap.className = 'ddlrev';
    wrap.innerHTML = `
      <style>
      .ddlrev{background:#1E1740;border:1px solid #3a2f6b;border-radius:14px;padding:16px;margin:14px 0}
      .ddlrev .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
      .ddlrev .rh h3{font-family:'Space Grotesk',sans-serif;color:#EFECFB;font-size:16px}
      .ddlrev .rh .k{color:#B4ADD9;font-size:12.5px}
      .ddlrev table{width:100%;border-collapse:collapse;font-size:13.5px}
      .ddlrev th{color:#B4ADD9;text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid #2c2358;font-size:12px}
      .ddlrev td{padding:6px 8px;border-bottom:1px solid #241C4E;color:#EFECFB;vertical-align:middle}
      .ddlrev td .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}
      .ddlrev input{background:#191238;border:1px solid #2c2358;border-radius:8px;padding:6px 9px;color:#EFECFB;
        font-family:'Inter',sans-serif;font-size:13px;width:100%;outline:none}
      .ddlrev input:focus{border-color:#A78BFA}
      .ddlrev .num{font-family:ui-monospace,monospace;color:#C4B5FD;text-align:center}
      .ddlrev .del{background:transparent;border:0;color:#7d76a8;cursor:pointer;font-size:15px}
      .ddlrev .del:hover{color:#F472B6}
      .ddlrev .actions{display:flex;gap:10px;margin-top:14px}
      .ddlrev .save{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;
        font-family:'Space Grotesk',sans-serif;background:linear-gradient(135deg,#A78BFA,#7C5CE0);color:#160f33}
      .ddlrev .msg{color:#4ADE80;font-size:12.5px;align-self:center}
      </style>
      <div class="rh">
        <h3>🎭 Desglose automático</h3>
        <span class="k">${rows.length} personajes · ${total} intervenciones · ${result.scenes.length} escenas · ${result.numPages} pág.</span>
      </div>
      <div style="overflow:auto">
      <table><thead><tr>
        <th style="width:34%">Personaje</th><th style="width:30%">Talento</th>
        <th style="width:12%">Intervenc.</th><th style="width:10%">Págs.</th><th style="width:9%">Escenas</th><th></th>
      </tr></thead><tbody id="rvBody"></tbody></table>
      </div>
      <div class="actions">
        <button class="save" id="rvSave">💾 Guardar desglose</button>
        <span class="msg" id="rvMsg"></span>
      </div>`;
    mount.innerHTML = ''; mount.appendChild(wrap);
    const body = wrap.querySelector('#rvBody');

    function draw() {
      body.innerHTML = '';
      rows.sort((a, b) => b.totalInts - a.totalInts || a.display.localeCompare(b.display, 'es'));
      rows.forEach((c, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td><span class="dot" style="background:${c.color}"></span>
             <input value="${esc(c.display)}" data-f="display" data-i="${i}" style="width:calc(100% - 20px)"></td>
           <td><input value="${esc(c.talent || '')}" placeholder="sin asignar" data-f="talent" data-i="${i}"></td>
           <td class="num">${c.totalInts}</td>
           <td class="num">${c.pages.length}</td>
           <td class="num">${c.scenes ? c.scenes.length : 0}</td>
           <td><button class="del" data-i="${i}" title="Quitar">✕</button></td>`;
        body.appendChild(tr);
      });
    }
    draw();

    // edición en vivo (renombrar a un nombre existente = fusiona al guardar)
    body.addEventListener('input', (e) => {
      const t = e.target; if (!t.dataset.f) return;
      rows[+t.dataset.i][t.dataset.f] = t.value;
    });
    body.addEventListener('click', (e) => {
      if (!e.target.classList.contains('del')) return;
      rows.splice(+e.target.dataset.i, 1); draw();
    });

    // fusiona filas con el mismo nombre normalizado (por si renombraron)
    function consolidate() {
      const map = {};
      for (const c of rows) {
        const k = norm(c.display); c.key = k;
        if (!map[k]) { map[k] = c; continue; }
        const m = map[k];
        // fusionar páginas
        const pm = new Map(m.pages.map(p => [p.p, p.ints]));
        c.pages.forEach(p => pm.set(p.p, (pm.get(p.p) || 0) + p.ints));
        m.pages = [...pm.entries()].sort((a, b) => a[0] - b[0]).map(([p, ints]) => ({ p, ints }));
        m.scenes = [...new Set([...(m.scenes || []), ...(c.scenes || [])])].sort((a, b) => a - b);
        m.totalInts += c.totalInts;
        if (!m.talent && c.talent) m.talent = c.talent;
      }
      const out = Object.values(map);
      out.forEach(c => { c.color = charColor(c.key); c.noRec = NO_REC.has(norm(c.talent)); });
      return out.sort((a, b) => b.totalInts - a.totalInts || a.display.localeCompare(b.display, 'es'));
    }

    wrap.querySelector('#rvSave').onclick = async () => {
      const msg = wrap.querySelector('#rvMsg');
      result.chars = consolidate();
      const btn = wrap.querySelector('#rvSave'); btn.disabled = true; btn.textContent = 'Guardando…';
      try {
        if (typeof opts.onSave === 'function') await opts.onSave(result);
        msg.textContent = '✓ Guardado';
      } catch (err) {
        msg.style.color = '#F472B6'; msg.textContent = 'Error: ' + (err.message || err);
      }
      btn.disabled = false; btn.textContent = '💾 Guardar desglose';
    };
    return wrap;
  }

  // ---------- 7) GUARDAR EN SUPABASE ----------
  async function save(episodeId, result, extra) {
    extra = extra || {};
    const sb = window.sb;
    if (!sb) throw new Error('No hay conexión a Supabase (window.sb).');

    // guion procesado (texto fuente) — permite re-desglosar sin re-subir
    let scriptId = extra.scriptId || null;
    if (!scriptId && result.fullText) {
      const { data, error } = await sb.from('scripts').insert({
        episode_id: episodeId, name: result.name || 'guion',
        source_type: result.sourceType || 'pdf',
        num_pages: result.numPages, full_text: result.fullText
      }).select('id').single();
      if (!error && data) scriptId = data.id;
    }

    // desglose estructurado (chars + escenas + meta) — 1 por capítulo (upsert)
    const data = {
      chars: result.chars.map(c => ({
        key: c.key, display: c.display, talent: c.talent || '',
        pages: c.pages, scenes: c.scenes || [], totalInts: c.totalInts,
        noRec: c.noRec, color: c.color
      })),
      scenes: result.scenes,
      // libreto compacto: {k:key, p:página, s:escena, t:texto} — para la vista de lectura
      script: (result.script || []).map(b => ({ k: b.key, p: b.page, s: b.scene, t: (b.lines || []).join(' ') })),
      meta: { engine: 'regex', model: cfg.llmEndpoint ? 'llm-refined' : 'rules', version: 'v11', numPages: result.numPages }
    };
    const { error } = await sb.from('breakdowns')
      .upsert({ episode_id: episodeId, script_id: scriptId, data, edited: !!extra.edited },
              { onConflict: 'episode_id' });
    if (error) throw error;
    return { scriptId };
  }

  // cargar un desglose ya guardado (para abrir el capítulo sin re-procesar)
  async function load(episodeId) {
    const sb = window.sb; if (!sb) return null;
    const { data } = await sb.from('breakdowns').select('data').eq('episode_id', episodeId).single();
    return data ? data.data : null;
  }

  window.DDLDesglose = { config: cfg, fromFile, analyze, renderReview, save, load, charColor, norm };
})();

</script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ================= estado ================= */

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(t, err){ const m=$('vmsg'); if(m){ m.textContent=t||''; m.className='msg'+(err?' err':''); } }

/* ================= diagnóstico: nunca dejar la pantalla en blanco ========= */
function fatal(msg){
  view().innerHTML = '<div style="background:#2a1030;border:1px solid #6b2f4f;border-radius:12px;'
    + 'padding:18px;color:#F472B6;font-size:14px;line-height:1.6">⚠️ '+esc(msg)
    + '<br><br><span style="color:#B4ADD9">Abre la consola (F12) para ver el detalle. '
    + 'Si acabas de subir cambios, prueba Ctrl+Shift+R.</span></div>';
}
window.addEventListener('error', ev => { if(!view().innerHTML.trim()) fatal('Error: '+ev.message); });

/* ================= arranque (ya autenticado) ================= */
(function boot(){
  if(!window.SUPA)            return fatal('No cargó config.js (window.SUPA). Verifica que el archivo esté en la raíz.');
  if(!window.supabase)       return fatal('No cargó el SDK de Supabase (¿bloqueó el CDN o no hay internet?).');
  if(!window.DDLAuth)        return fatal('No cargó auth.js. Verifica que el archivo esté junto a index.html.');
  if(!window.DDLDesglose)    return fatal('No cargó desglose-auto.js. Verifica que el archivo esté en la raíz.');
  DDLAuth.onReady((user, profile) => {
    ME = user; PROFILE = profile;
    $('who').innerHTML = '<b>'+esc(profile && profile.full_name || user.email)+'</b>'
      + esc((profile && profile.role) || 'member');
    renderShows();
  });
})();

/* ================= 1) PROGRAMAS ================= */
async function renderShows(){
  SHOW = null; EP = null; BD = null;
  view().innerHTML = `
    <div class="crumb"><span class="now">📚 Programas</span></div>
    <div class="bar-actions">
      <input class="search" id="q" placeholder="Buscar programa…">
      <button class="btnv pri" onclick="newShow()">＋ Nuevo programa</button>
    </div>
    <span class="msg" id="vmsg"></span>
    <div class="grid" id="grid"><div class="loading show"><div class="spin"></div>Cargando…</div></div>`;
  let shows = [];
  try{ const { data } = await sb.from('shows').select('*').order('created_at',{ascending:false}); shows = data||[]; }
  catch(e){ toast('No se pudieron cargar los programas: '+e.message, true); }
  const paint = (list) => {

      `<div class="tile" style="--cc:${color(s.name)}" onclick="openShow('${s.id}','${esc(s.name)}')">
         <span class="del" onclick="event.stopPropagation();delShow('${s.id}')">✕</span>
         <h3>${esc(s.name)}</h3><small>Abrir capítulos →</small></div>`

  };

  $('q').oninput = () => { const q=$('q').value.toLowerCase(); paint(shows.filter(s=>s.name.toLowerCase().includes(q))); };
}
async function newShow(){
  const name = prompt('Nombre del programa (ej. Cien Años de Soledad):'); if(!name||!name.trim()) return;
  const { error } = await sb.from('shows').insert({ name:name.trim(), studio:(PROFILE&&PROFILE.studio)||null });
  if(error) return toast('Error: '+error.message, true);

}
async function delShow(id){

}
function openShow(id, name){ SHOW={id,name}; renderEpisodes(); }

/* ================= 2) CAPÍTULOS ================= */
async function renderEpisodes(){
  EP = null; BD = null;
  view().innerHTML = `
    <div class="crumb"><a onclick="renderShows()">📚 Programas</a><span class="sep">›</span>
      <span class="now">${esc(SHOW.name)}</span></div>
    <div class="bar-actions">
      <input class="search" id="q" placeholder="Buscar capítulo…">
      <button class="btnv pri" onclick="newEp()">＋ Nuevo capítulo</button>
    </div>
    <span class="msg" id="vmsg"></span>
    <div class="grid" id="grid"><div class="loading show"><div class="spin"></div>Cargando…</div></div>`;

      `<div class="tile" style="--cc:${color(e.name)}" onclick="openEp('${e.id}')">

    ).join('') || `<div class="empty"><div class="ic">🎞️</div>Crea el primer capítulo.</div>`;
  };

/* ================= 3) CAPÍTULO: cargar guion / ver desglose ================= */
async function renderEpisode(){
  view().innerHTML = `
    <div class="crumb"><a onclick="renderShows()">📚 Programas</a><span class="sep">›</span>
      <a onclick="renderEpisodes()">${esc(SHOW.name)}</a><span class="sep">›</span>

function renderUpload(){
  $('epbody').innerHTML = `
    <label class="drop" id="drop">
      <div class="ic">📄</div>
      <b>Cargar guion (PDF o Word)</b>
      <small>El desglose de personajes se genera automáticamente · el .xlsm ya no se usa</small>
      <input type="file" id="inFile" accept="application/pdf,.pdf,.docx">
    </label>
    <div class="loading" id="load"><div class="spin"></div><span id="loadmsg">Procesando…</span></div>
    <div id="review"></div>`;
  const drop = $('drop'), input = $('inFile');
  input.onchange = () => { if(input.files[0]) onGuion(input.files[0]); };
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) onGuion(f); });
}

async function onGuion(file){
  $('load').classList.add('show'); $('loadmsg').textContent='Leyendo y desglosando «'+file.name+'»…';
  let r;
  try{ r = await DDLDesglose.fromFile(file); }
  catch(e){ $('load').classList.remove('show'); return toast('No se pudo leer el guion: '+e.message, true); }
  $('load').classList.remove('show');
  if(!r.chars.length){ toast('No se detectaron personajes. ¿El guion trae los nombres en MAYÚSCULAS?', true); }

  DDLDesglose.renderReview(r, {
    mount: $('review'),
    onSave: async (res) => {
      // subir el guion original al bucket "guiones" (opcional, no bloquea)
      try{
        const path = SHOW.id+'/'+EP.id+'/'+file.name;
        await sb.storage.from('guiones').upload(path, file, { upsert:true });
        await sb.from('episodes').update({ pdf_name:file.name, pdf_path:path }).eq('id', EP.id);
        EP.pdf_name = file.name;
      }catch(e){ console.warn('storage', e); }
      await DDLDesglose.save(EP.id, res, { edited:true });
      BD = { chars:res.chars, scenes:res.scenes,
             script:(res.script||[]).map(b=>({k:b.key,p:b.page,s:b.scene,t:(b.lines||[]).join(' ')})) };
      renderBreakdown();
    }
  });
}

/* ================= 4) VISTA DE DESGLOSE + AVANCE ================= */
function recSet(k){ return new Set(PROGRESS[k]||[]); }
function isDone(c){ const r=recSet(c.key); return c.pages.length>0 && c.pages.every(p=>r.has(p.p)); }

function renderBreakdown(){
  const chars = BD.chars.slice().sort((a,b)=> b.totalInts-a.totalInts || a.display.localeCompare(b.display,'es'));
  const totInts = chars.reduce((s,c)=>s+c.totalInts,0);
  const doneN = chars.filter(isDone).length;
  $('epbody').innerHTML = `
    <div class="stats">
      <div class="stat"><b>${chars.length}</b>personajes</div>
      <div class="stat"><b>${totInts}</b>intervenciones</div>
      <div class="stat"><b>${(BD.scenes||[]).length}</b>escenas</div>
      <div class="stat"><b>${doneN}</b>✓ terminados</div>
    </div>
    <div class="bar-actions">
      <input class="search" id="q" placeholder="Buscar personaje o talento…">
      <button class="btnv" onclick="reDesglose()">🔄 Rehacer desglose</button>
    </div>
    <div class="cards" id="cards"></div>
    <div id="detail"></div>`;
  const paint = (q) => {
    q = (q||'').toLowerCase();
    const list = chars.filter(c=> !q || c.display.toLowerCase().includes(q) || (c.talent||'').toLowerCase().includes(q));
    $('cards').innerHTML = list.map(c=>{
      const rec = recSet(c.key);
      const recN = c.pages.filter(p=>rec.has(p.p)).length;
      const pct = c.pages.length ? Math.round(100*recN/c.pages.length) : 0;
      const done = isDone(c);
      const pgs = c.pages.slice(0,14).map(p=>`<span class="pg ${rec.has(p.p)?'rec':''}" onclick="event.stopPropagation();togglePage('${c.key}',${p.p})">${p.p}</span>`).join('');
      return `<div class="ccard ${done?'done':''}" style="--cc:${c.color}" onclick="openChar('${c.key}')">
        <div class="top"><h3>${esc(c.display)}</h3><span class="n">${c.totalInts} int · ${c.pages.length} pág</span></div>
        <div class="tal ${c.talent?'':'ng'}">${c.talent?esc(c.talent):'Sin talento asignado'}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="pgs">${pgs}${c.pages.length>14?'<span class="pg">+'+(c.pages.length-14)+'</span>':''}</div>
      </div>`;
    }).join('') || `<div class="empty">Sin coincidencias.</div>`;
  };
  paint('');
  $('q').oninput = () => paint($('q').value);
}

async function togglePage(key, p){
  const arr = new Set(PROGRESS[key]||[]);
  arr.has(p) ? arr.delete(p) : arr.add(p);
  PROGRESS[key] = [...arr].sort((a,b)=>a-b);
  renderBreakdown();
  try{ await sb.from('episodes').update({ progress:PROGRESS }).eq('id', EP.id); }
  catch(e){ toast('No se pudo guardar el avance: '+e.message, true); }
}

function openChar(key){
  const c = BD.chars.find(x=>x.key===key); if(!c) return;
  const blocks = (BD.script||[]).filter(b=>b.k===key);
  const rec = recSet(key);
  $('detail').innerHTML = `
    <div class="panel">
      <h2 style="color:${c.color}">${esc(c.display)} <span style="font-size:12px;color:var(--ink-faint)">· ${c.totalInts} intervenciones</span></h2>
      ${blocks.map(b=>`
        <div class="blk" style="--cc:${c.color}">
          <div class="meta">pág ${b.p}<br>
            <span class="pg ${rec.has(b.p)?'rec':''}" onclick="togglePage('${key}',${b.p})" style="margin-top:4px;display:inline-block">${rec.has(b.p)?'✓ grabada':'grabar'}</span>
          </div>
          <div class="tx"><span class="nm">${esc(c.display)}:</span>${esc(b.t||'—')}</div>
        </div>`).join('') || '<div class="msg">Este personaje no tiene diálogos guardados en el libreto.</div>'}
      <div style="margin-top:12px"><button class="btnv" onclick="document.getElementById('detail').innerHTML=''">Cerrar</button></div>
    </div>`;
  $('detail').scrollIntoView({behavior:'smooth', block:'start'});
}

async function reDesglose(){
  if(!confirm('Esto reemplaza el desglose actual (se conserva el avance por página). ¿Continuar?')) return;
  renderUpload();
}

/* ================= util ================= */
function color(name){ return DDLDesglose.charColor(DDLDesglose.norm(name)); }

</script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desglose Digital de Libreto</title>
    <link rel="stylesheet" href="style.css">
    <!-- Dependencias externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
</head>
<body class="locked">

    <!-- Modal de Autenticación -->
    <div class="gate" id="gate">
        <form class="gcard" id="authForm" autocomplete="off">
            <div class="glogo">DD</div>
            <h2>Acceso al Sistema</h2>
            <div class="dens" id="authTabs">
                <button type="button" class="on" data-action="login">Login</button>
                <button type="button" data-action="register">Registro</button>
            </div>
            
            <label for="userEmail">Correo corporativo</label>
            <input type="email" id="userEmail" required placeholder="nombre@estudio.com">
            
            <label for="userPass">Contraseña</label>
            <input type="password" id="userPass" required minlength="6">
            
            <button class="gbtn" type="submit" id="authSubmitBtn">Entrar</button>
            <div class="gerr" id="authErr"></div>
        </form>
    </div>

    <!-- Interfaz Principal de la App -->
    <div class="app-container" id="appContainer" style="display: none;">
        <header>
            <h1>Desglose Automático</h1>
            <button id="logoutBtn">Cerrar Sesión</button>
        </header>

        <main>
            <div class="dropzone" id="dropzone">
                <input type="file" id="fileInput" accept=".pdf,.docx">
                <p>Arrastra tu libreto (.pdf, .docx) o haz clic para subir</p>
            </div>

            <div id="loading" class="hidden">
                <p id="loadMsg">Procesando libreto...</p>
            </div>

            <div id="results">
                <!-- Las tarjetas de personajes renderizadas aparecerán aquí -->
            </div>
        </main>
    </div>

    <!-- Scripts (Módulos) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
